  - {"id":"SOURCE-DARES-INFLATION-SALAIRES-2023","title":"Quel effet de l'inflation sur la progression actuelle des salaires ?","organization":"DARES","publication_date":"2023-02-02","source_type":"institutional_report","language":"fr","url":"https://dares.travail-emploi.gouv.fr/publication/quel-effet-de-linflation-sur-la-progression-actuelle-des-salaires","geographic_scope":["France"],"temporal_scope":"2021–2022 ; données de branches et de salaires selon les séries présentées","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE"],"methodology":"Analyse des revalorisations du SMIC, des salaires de base et des minima conventionnels pendant la période inflationniste.","limitations":["Les comparaisons descriptives ne permettent pas d'attribuer au SMIC les évolutions agrégées des salaires ou de l'emploi.","Les retards de minima conventionnels documentent une tension de négociation, pas un effet causal sur l'emploi."],"access_status":"open"}
  - {"id":"SOURCE-TRESOR-WAGE-TRAJECTORIES-MINIMUM-2025","title":"Wage trajectories of French minimum-wage earners","authors":["Rania Benyamina","Chloé Stutzmann"],"organization":"Direction générale du Trésor","publication_date":"2025-06-12","source_type":"institutional_research","language":"en","url":"https://www.tresor.economie.gouv.fr/Articles/2025/06/12/wage-trajectories-of-french-minimum-wage-earners","geographic_scope":["France"],"temporal_scope":"Panel Tous salariés 2013–2021 ; trajectoires principales 2013–2019 ; analyse COVID 2019–2021","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY"],"methodology":"Panel Tous salariés INSEE (environ 1/12e des salariés, hors agriculture), deux échantillons aléatoires d'environ 30 000 personnes en 2013 ; statuts annuels définis par salaire horaire brut annuel moyen en multiples du SMIC, chômage indemnisé majoritaire ou non-observation ; matrice de transition, Optimal Matching, classification hiérarchique de Ward et régression logistique multinomiale.","limitations":["Analyse descriptive de trajectoires, sans groupe témoin ni stratégie d'identification causale des revalorisations du SMIC.","Le seuil de salarié au SMIC est inférieur à 1,1 SMIC et ne correspond pas exactement au SMIC légal.","Les sorties du champ agrègent retraite, inactivité, chômage prolongé, indépendance et émigration ; le chômage est défini par l'indemnisation majoritaire.","La progression médiane de 36 % entre 2013 et 2019 est nominale, pas un gain réel.","Les groupes de trajectoires dépendent des choix de distance et de classification ; les associations logistiques ne sont pas causales."],"access_status":"open","notes":"Audit détaillé : dossiers/smic-tresor-2025-wage-trajectories-audit.md. Parmi les salariés initialement sous 1,1 SMIC, 52 % restent dans la tranche l'année suivante ; 41 % sont classés en trajectoires de mobilité ascendante ; 25 % suivent une trajectoire de proximité durable. Aucun effet causal des hausses du SMIC n'est identifié."}
