sources:
  - {"id":"SOURCE-PARCOURSUP-BILAN-2026","title":"Parcoursup 2026 : des résultats stables dans un contexte de progression historique des candidatures","organization":"Ministère de l’Enseignement supérieur, de la Recherche et de l’Espace","source_type":"institutional_report","language":"fr","url":"https://www.enseignementsup-recherche.gouv.fr/fr/parcoursup-2026-des-resultats-stables-dans-un-contexte-de-progression-historique-des-candidatures-104400","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"temporal_scope":"Campagne Parcoursup 2026","methodology":"Bilan administratif de la procédure et indicateurs agrégés publiés par le ministère.","limitations":["Les indicateurs de fonctionnement ne suffisent pas à évaluer l'équité ou les effets causaux.","Les chiffres agrégés ne décrivent pas les trajectoires individuelles ni la réussite après admission."],"access_status":"open"}
  - {"id":"SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS","title":"Parcoursup 2026 : les propositions d’admission dans l’enseignement supérieur","organization":"SIES, Ministère de l’Enseignement supérieur","source_type":"scientific_study","language":"fr","url":"https://www.enseignementsup-recherche.gouv.fr/fr/parcoursup-2026-les-propositions-d-admission-dans-l-enseignement-superieur-104448","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"temporal_scope":"Campagne Parcoursup 2026","methodology":"Note statistique administrative sur les candidats néo-bacheliers et les propositions d'admission.","limitations":["Les taux d'offre et d'acceptation ne mesurent ni la qualité de l'orientation, ni la réussite en formation.","Vérifier les dénominateurs et catégories de candidats."],"access_status":"open"}
  - {"id":"SOURCE-DEPP-ETAT-ECOLE-2025","title":"L’état de l’École 2025","organization":"DEPP, ministère de l'Éducation nationale","source_type":"institutional_report","language":"fr","url":"https://www.education.gouv.fr/depp/l-etat-de-l-ecole-2025-468872","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"temporal_scope":"Édition 2025, indicateurs de différentes années","methodology":"Publication statistique annuelle composée de fiches thématiques et de séries chronologiques.","limitations":["Les indicateurs mobilisent des années de référence et populations différentes ; chaque fiche doit être lue séparément."],"access_status":"open"}
  - {"id":"SOURCE-INSEE-INEGALITES-SCOLAIRES-2025","title":"Inégalités sociales dans l’enseignement scolaire","organization":"INSEE","source_type":"institutional_report","language":"fr","url":"https://www.insee.fr/fr/statistiques/8612522","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-ISSUE-EQUITY","TAG-METHOD-QUANTITATIVE"],"temporal_scope":"Publication 2025","methodology":"Analyse statistique de données sur les acquis scolaires selon l'origine sociale.","limitations":["Les écarts descriptifs ne permettent pas à eux seuls d'identifier les mécanismes causaux ni l'effet propre des établissements."],"access_status":"open"}
  - {"id":"SOURCE-OECD-PISA-2022-FRANCE","title":"PISA 2022 Results: Country Note — France","organization":"OCDE","source_type":"institutional_report","language":"en","url":"https://www.oecd.org/en/publications/pisa-2022-results-volume-i-and-ii-country-notes_ed6fbcc5-en/france_8008535b-en.html","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-ISSUE-EQUITY","TAG-METHOD-COMPARATIVE"],"temporal_scope":"PISA 2022","methodology":"Enquête internationale standardisée auprès des élèves de 15 ans, avec questionnaires de contexte.","limitations":["PISA mesure des compétences à 15 ans et non l'ensemble des apprentissages ou la réussite dans le supérieur.","Les associations entre statut socio-économique et résultats ne démontrent pas seules une causalité."],"access_status":"open"}
  - {"id":"SOURCE-OECD-EAG-2025-FRANCE","title":"Regards sur l’éducation 2025 — Note pays France","organization":"OCDE","source_type":"institutional_report","language":"fr","url":"https://www.oecd.org/content/dam/oecd/fr/publications/reports/2025/09/education-at-a-glance-2025-country-notes_9749f4ff/france_0639c7fb/aca6dceb-fr.pdf","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-COMPARATIVE"],"temporal_scope":"Dernières années disponibles selon indicateur","methodology":"Indicateurs comparatifs internationaux harmonisés sur les systèmes éducatifs.","limitations":["Les définitions, années de référence et périmètres varient selon les indicateurs."],"access_status":"open"}
  - {"id":"SOURCE-EU-EDUCATION-MONITOR-2025-FRANCE","title":"Education and Training Monitor 2025 — France","organization":"Commission européenne","source_type":"institutional_report","language":"en","url":"https://op.europa.eu/webpub/eac/education-and-training-monitor/en/country-reports/france.html","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-COMPARATIVE"],"temporal_scope":"Indicateurs 2023-2025 selon disponibilité","methodology":"Rapport de suivi européen combinant indicateurs harmonisés et analyse de politiques éducatives.","limitations":["Les données agrégées européennes ne remplacent pas l'analyse des contextes nationaux."],"access_status":"open"}
  - {"id":"SOURCE-DEFENSEUR-DROITS-JEUNESSES-ORIGINE-2026","title":"Jeunesses et discriminations fondées sur l’origine : répondre à l’impératif d’égalité","organization":"Défenseur des droits","source_type":"institutional_report","language":"fr","url":"https://www.defenseurdesdroits.fr/sites/default/files/2026-02/Rapport%20-%20Jeunesses%20et%20discriminations%20fond%C3%A9es%20sur%20l%27origine.pdf","domains":["DOMAIN-EDUCATION","DOMAIN-MIGRATION","DOMAIN-SECURITY"],"tags":["TAG-ISSUE-EQUITY","TAG-EVIDENCE-SECONDARY"],"temporal_scope":"Rapport 2026, données d'enquêtes de périodes diverses","methodology":"Rapport institutionnel mobilisant enquêtes, travaux existants et analyses juridiques.","limitations":["Les expériences déclarées, les mesures de discrimination et les analyses juridiques doivent être distinguées.","Les constats relatifs à Parcoursup doivent être examinés à partir des études sous-jacentes."],"access_status":"open"}
  - {"id":"SOURCE-PARCOURSUP-OPEN-DATA-2025","title":"Parcoursup 2025 — vœux de poursuite d'études et de réorientation et réponses des établissements","organization":"Ministère de l’Enseignement supérieur — SIES","source_type":"primary_data","language":"fr","url":"https://data.enseignementsup-recherche.gouv.fr/explore/dataset/fr-esr-parcoursup/?flg=fr","geographic_scope":["France","Régions","Départements","Académies","Établissements"],"temporal_scope":"Campagne du 15 janvier au 10 septembre 2025","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY"],"methodology":"Données administratives Parcoursup par formation ; documentation méthodologique officielle associée.","limitations":["Hors apprentissage.","Certains indicateurs de taux d'accès et de répartition par baccalauréat ne sont pas recalculables à partir du fichier.","L'unité d'observation est la formation, avec des agrégats de candidats et d'admis ; ne pas traiter les lignes comme des individus."],"license":"Licence Ouverte / Open Licence (Etalab)","access_status":"open","notes":"Jeu de données documenté : 115 variables, 14 252 enregistrements, 1 015 200 candidats ; sous-ensemble de 652 800 néo-bacheliers."}
  - {"id":"SOURCE-PARCOURSUP-ADMISSION-REVIEW-2026","title":"Comment les formations examinent les candidatures ?","organization":"Parcoursup / Ministère de l’Enseignement supérieur","source_type":"other","language":"fr","url":"https://www.parcoursup.gouv.fr/candidater-sur-parcoursup/comment-les-formations-examinent-les-candidatures-1357","geographic_scope":["France"],"temporal_scope":"Procédure 2026, page mise à jour le 20 octobre 2026","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-STATUS-REVISED"],"methodology":"Présentation institutionnelle du processus d'examen des candidatures par les commissions d'examen des vœux et des rapports d'analyse publiés.","limitations":["Description officielle du fonctionnement ; ne constitue pas une évaluation indépendante des pratiques effectives.","Les critères annoncés et les rapports locaux doivent être examinés formation par formation."],"access_status":"open","notes":"La page indique que près de 19 000 rapports d'analyse des candidatures de la session 2026 sont accessibles depuis les fiches de formation."}
  - {"id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","title":"Évaluation de deux peines alternatives à l’incarcération : travail d’intérêt général et détention à domicile sous surveillance électronique","organization":"Cour des comptes","source_type":"institutional_report","language":"fr","url":"https://www.ccomptes.fr/sites/default/files/2025-03/20250304-Evaluation-2-peines-alternatives-a-l-incarceration.pdf","geographic_scope":["France"],"temporal_scope":"Évaluation publiée le 4 mars 2025 ; données et cohortes selon les indicateurs, notamment cohortes pénales 2016-2017","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"methodology":"Évaluation de politique publique combinant données administratives, enquêtes auprès de magistrats, tuteurs et responsables de postes, analyses statistiques et corrections économétriques des différences observables entre populations.","limitations":["La récidive est étudiée sur des cohortes antérieures à la publication ; les résultats ne sont pas automatiquement extrapolables aux pratiques actuelles.","Les caractéristiques individuelles non observées peuvent laisser subsister un biais de sélection ; les résultats économétriques ne valent pas expérimentation randomisée.","Les indicateurs de récidive (survenue, fréquence, gravité) doivent être distingués.","Le coût unitaire publié dépend du périmètre comptable retenu et ne constitue pas à lui seul une analyse complète de coût-efficacité ou de coût social."],"access_status":"open","notes":"Source centrale du dossier : documente le recul du prononcé, les délais d'exécution, l'accompagnement, la récidive et les coûts estimés du TIG et de la DDSE."}
  - {"id":"SOURCE-MINISTERE-JUSTICE-TIG-PRONONCE-2024","title":"Un prononcé du travail d’intérêt général en baisse depuis 2015","organization":"Ministère de la Justice, SDSE","source_type":"statistical_publication","language":"fr","url":"https://www.justice.gouv.fr/documentation/etudes-et-statistiques/prononce-du-travail-dinteret-general-baisse-2015","geographic_scope":["France"],"temporal_scope":"Données de condamnations 2015-2022 ; publication 18 juillet 2024, mise à jour 8 janvier 2025","domains":["DOMAIN-SECURITY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Statistiques administratives issues des condamnations pénales et du casier judiciaire national.","limitations":["Le nombre de TIG prononcés ne se confond pas avec le nombre de mesures suivies, commencées ou achevées.","Les catégories de TIG et leurs modalités de prononcé doivent être distinguées ; les évolutions agrégées ne démontrent pas leurs causes."],"access_status":"open","notes":"Le ministère recense 16 560 TIG prononcés en 2022 pour sanctionner des délits et une baisse de 34 % du prononcé entre 2015 et 2022."}
  - {"id":"SOURCE-MINISTERE-JUSTICE-TUTEURS-TIG-2024","title":"Les tuteurs de personnes majeures condamnées à une peine de travail d’intérêt général : enquête sur leurs profils, motivations et pratiques","organization":"Ministère de la Justice, SDSE","source_type":"research_report","language":"fr","url":"https://www.justice.gouv.fr/sites/default/files/2024-07/Tuteurs_de_tigistes_2023.pdf","geographic_scope":["France"],"temporal_scope":"Enquête auprès des tuteurs en poste en 2021 ; publication 22 juillet 2024","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-SURVEY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-QUALITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Enquête par questionnaire auprès d'un échantillon représentatif des tuteurs de personnes majeures en TIG ; données administratives de cadrage sur les tuteurs et organismes.","limitations":["Les effectifs décrivent le réseau de tuteurs recensés en 2021 et non nécessairement la capacité réellement mobilisable à une date ultérieure.","L'enquête sur les tuteurs ne mesure pas à elle seule l'effet causal de l'encadrement sur la récidive.","La disponibilité et la charge de travail des tuteurs peuvent varier fortement selon les territoires et organismes."],"access_status":"open","notes":"Le ministère recense 20 419 tuteurs dans 11 872 organismes en 2021 ; les tuteurs assurent leur mission sans compensation financière."}
  - {"id":"SOURCE-SENAT-EXECUTION-PEINES-2025","title":"L’exécution à la peine — 20 propositions pour mieux exécuter et donner du sens aux sanctions pénales","organization":"Sénat, Commission des lois","source_type":"parliamentary_report","language":"fr","url":"https://www.senat.fr/rap/r25-002/r25-00212.html","geographic_scope":["France"],"temporal_scope":"Rapport d'information déposé le 1er octobre 2025 ; données d'exécution 2024 notamment","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"methodology":"Rapport parlementaire fondé sur auditions, données administratives et analyse de l'exécution des sanctions pénales.","limitations":["Les données de 2024 citées concernent des mesures exécutées en tout ou partie et ne sont pas directement comparables aux seuls prononcés.","Les constats et propositions parlementaires doivent être distingués des résultats d'évaluation causale."],"access_status":"open","notes":"Le rapport indique que 28 500 TIG ont été exécutés en tout ou partie en 2024 ; 16 % ont été interrompus prématurément et 10 % n'ont pas pu commencer en raison d'un renvoi devant la justice."}
