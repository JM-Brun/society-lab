  - {"id":"SOURCE-THOMPSON-SENGUL-2025-PLATFORMING-POINT","title":"The Platforming is the Point: News Media, ‘The Oxygen of Amplification’, and Interviewing the Far-Right","authors":["Jay Daniel Thompson","Kurt Sengul"],"organization":"Communication and the Public","publication_date":"2025-04-22","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1177/20570473251334840","geographic_scope":["Australie","États-Unis"],"temporal_scope":"Analyse critique publiée en 2025 ; deux études de cas d'interviews médiatiques","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-QUALITATIVE","TAG-EVIDENCE-SECONDARY"],"methodology":"Revue interdisciplinaire critique de la littérature et deux études de cas qualitatives d'interviews de Steve Bannon et Marjorie Taylor Greene ; formulation de recommandations journalistiques.","limitations":["Ne fournit pas d'estimation causale de l'effet d'une interview contradictoire ou de la non-plateformisation.","Deux cas nord-américains ; portée contextuelle et normative, non généralisable à tous les systèmes médiatiques.","Les recommandations doivent être distinguées des résultats expérimentaux de Bolet et Foos (2025)."],"access_status":"open"}
  - {"id":"SOURCE-HORTA-RIBEIRO-ETAL-2023-PARLER","title":"Deplatforming did not decrease Parler users’ activity on fringe social media","authors":["Manoel Horta Ribeiro","Homa Hosseinmardi","Robert West","Duncan J. Watts"],"organization":"PNAS Nexus","publication_date":"2023-03-21","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1093/pnasnexus/pgad035","geographic_scope":["États-Unis"],"temporal_scope":"Données longitudinales autour de la mise hors ligne de Parler du 11 janvier au 25 février 2021","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-SECONDARY"],"methodology":"Deux panels longitudinaux Nielsen (N=112 705) et analyse en différences-de-différences sur 996 utilisateurs actifs de Parler ; hausse de l'activité quotidienne sur d'autres plateformes marginales de 10,9 points (ordinateur) et 15,9 points (mobile), sans baisse statistiquement significative de l'activité totale sur l'ensemble des plateformes marginales.","limitations":["L'étude porte sur le retrait temporaire d'une plateforme entière, pas sur le bannissement d'un individu ou le refus d'une interview télévisée.","L'activité mesurée est la visite de sites et d'applications ; elle ne mesure pas directement la persuasion, la mobilisation hors ligne ou les dommages produits.","Résultat contextuel à l'écosystème américain de 2021 ; données de panel privées et limites de généralisation."],"access_status":"open"}
  - {"id":"SOURCE-MCCABE-ETAL-2024-DEPLATFORMING-MISINFO-NATURE","title":"Post-January 6th deplatforming reduced the reach of misinformation on Twitter","authors":["Stefan D. McCabe","Diogo Ferrari","Jon Green","David M. J. Lazer","Kevin M. Esterling"],"organization":"Nature","publication_date":"2024-06-05","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1038/s41586-024-07524-8","geographic_scope":["États-Unis"],"temporal_scope":"Intervention de déplateformisation de janvier 2021 et circulation de désinformation sur Twitter","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-CAUSAL-INFERENCE","TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-SECONDARY"],"methodology":"Panel de plus de 500 000 utilisateurs actifs de Twitter et dessins expérimentaux naturels pour étudier le retrait d'environ 70 000 comptes diffuseurs de désinformation après le 6 janvier 2021 ; baisse de la circulation de désinformation par les comptes retirés et leurs abonnés.","limitations":["Les événements concomitants au 6 janvier empêchent d'identifier précisément l'ampleur causale de l'effet.","Mesure la circulation sur Twitter, pas la consommation totale hors plateforme ni la persuasion individuelle.","Contexte exceptionnel d'une crise politique et d'une intervention de grande ampleur ; généralisation à d'autres formes de modération limitée."],"access_status":"open"}

  - {"id":"SOURCE-RICHARDS-SMITH-BARTON-2024-MEDIA-FAR-RIGHT-CRIME","title":"Holding to account or amplifying extremist hate? A mixed methods analysis of newspaper reporting on far-right crime in Australia","authors":["Imogen Richards","Cam Smith","Greg Barton"],"organization":"Critical Studies on Terrorism","publication_date":"2024-02-08","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1080/17539153.2024.2304907","geographic_scope":["Australie"],"temporal_scope":"Couverture de 2010 à 2022 ; publication 2024","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-QUALITATIVE","TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-SECONDARY"],"methodology":"Analyse mixte de 683 articles de presse portant sur 72 incidents impliquant des acteurs d'extrême droite et ayant donné lieu à une procédure juridique ; analyse des cadrages, des vocabulaires et des documents judiciaires.","limitations":["Le corpus porte sur les incidents ayant donné lieu à une interaction avec le système judiciaire ; il ne représente pas toute la couverture médiatique.","Ne mesure pas directement les effets de ces articles sur les attitudes ou comportements du public.","Les auteurs signalent que les effets des cadrages neutralisants ne sont pas uniformes dans le corpus."],"access_status":"open"}
  - {"id":"SOURCE-EKSTROM-PATRONA-THORNBORROW-2022-REPORTING-UNSAYABLE","title":"Reporting the unsayable: Scandalous talk by right-wing populist politicians and the challenge for journalism","authors":["Mats Ekström","Marianna Patrona","Joanna Thornborrow"],"organization":"Journalism","publication_date":"2021-03-12","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1177/14648849211001779","geographic_scope":["Suède","Grèce","France","Royaume-Uni"],"temporal_scope":"Cas médiatiques contemporains analysés dans l'article ; publication en ligne 2021, numéro 2022","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-QUALITATIVE","TAG-METHOD-COMPARATIVE","TAG-EVIDENCE-SECONDARY"],"methodology":"Analyse qualitative du discours et des cadrages journalistiques de propos racistes ou antidémocratiques de responsables populistes de droite dans la presse écrite, en ligne et audiovisuelle.","limitations":["Analyse de cas et des pratiques de cadrage ; ne mesure pas les effets moyens sur les attitudes du public.","La sélection des cas et les systèmes médiatiques nationaux limitent la généralisation."],"access_status":"open"}
  - {"id":"SOURCE-EKSTROM-PATRONA-THORNBORROW-2020-SWEDISH-INTERVIEWS","title":"The normalization of the populist radical right in news interviews: a study of journalistic reporting on the Swedish democrats","authors":["Mats Ekström","Marianna Patrona","Joanna Thornborrow"],"organization":"Social Semiotics","publication_date":"2020-05-26","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1080/10350330.2020.1762984","geographic_scope":["Suède"],"temporal_scope":"Entretiens d'actualité concernant les Démocrates de Suède","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-QUALITATIVE","TAG-EVIDENCE-SECONDARY"],"methodology":"Analyse discursive des interviews journalistiques et des procédés par lesquels le discours de la droite radicale est rendu ordinaire ou légitime.","limitations":["Étude qualitative centrée sur un parti et un contexte médiatique national.","Ne permet pas d'estimer un effet causal sur les attitudes ou les intentions de vote."],"access_status":"open"}
  - {"id":"SOURCE-MURPHY-DEVINE-2020-UKIP-MEDIA-COVERAGE","title":"Does Media Coverage Drive Public Support for UKIP or Does Public Support for UKIP Drive Media Coverage?","authors":["Justin Murphy","Daniel Devine"],"organization":"British Journal of Political Science","publication_date":"2020-07-31","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1017/S0007123418000145","geographic_scope":["Royaume-Uni"],"temporal_scope":"Séries mensuelles janvier 2004-avril 2017","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-EVIDENCE-SECONDARY"],"methodology":"Méthode mixte, séries temporelles agrégées et modèle vectoriel autorégressif pour étudier les relations temporelles entre volume de couverture médiatique et soutien mesuré à UKIP.","limitations":["Données agrégées : ne permettent pas d'inférer les effets individuels de l'exposition.","Une relation temporelle estimée ne supprime pas tous les risques de facteurs confondants ou de causalité réciproque.","Le résultat concerne UKIP et le système médiatique britannique de la période étudiée."],"access_status":"open"}

  - {"id":"SOURCE-HORVATH-ETAL-2024-CAMPAIGN-FACTCHECK","title":"Correcting campaign misinformation: Experimental evidence from a two-wave panel study","authors":["Laszlo Horvath","Daniel Stevens","Susan Banducci","Raluca Popp","Travis Coan"],"organization":"Harvard Kennedy School Misinformation Review","publication_date":"2024-02-05","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.37016/mr-2020-132","geographic_scope":["Royaume-Uni"],"temporal_scope":"Campagne électorale britannique de 2017 ; suivi à environ une semaine","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-EXPERIMENTAL","TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-PRIMARY"],"methodology":"Expérience de panel à deux vagues auprès de 1 841 participants, testant un fact-check cohérent sur une affirmation de campagne et variant l'attribution à une organisation indépendante, The Guardian ou The Daily Telegraph.","limitations":["La correction réduit immédiatement la croyance erronée mais l'effet ne persiste pas au suivi ; la source attribuée ne produit pas de différence statistiquement significative entre les trois traitements.","Un seul cas de désinformation politique, portant sur immigration et financement du NHS ; généralisation à des discours identitaires ou antidémocratiques à établir.","Le protocole compare des sources de fact-checking, pas une interview contradictoire à une analyse sans promoteur."],"access_status":"open"}
  - {"id":"SOURCE-ECKER-LEWANDOWSKY-CHADWICK-2020-FAMILIARITY-CORRECTION","title":"Can corrections spread misinformation to new audiences? Testing for the elusive familiarity backfire effect","authors":["Ullrich K. H. Ecker","Stephan Lewandowsky","Matthew Chadwick"],"organization":"Cognitive Research: Principles and Implications","publication_date":"2020-08-26","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1186/s41235-020-00241-6","geographic_scope":["États-Unis"],"temporal_scope":"Trois expériences, dont suivis à une semaine","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-EXPERIMENTAL","TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-PRIMARY"],"methodology":"Trois expériences (N total=1 718) testant si des fact-checks qui répètent des affirmations fausses nouvelles augmentent leur familiarité et provoquent un effet boomerang, avec conditions sans exposition, exposition à l'affirmation et exposition à la correction.","limitations":["Les affirmations sont fictives et ne représentent pas des slogans politiques complexes ni des messages portés par des personnalités connues.","L'absence d'effet boomerang moyen ne signifie pas que la répétition soit sans coût de diffusion ou sans effet sur la mémoire à long terme.","La correction étudiée est un fact-check bref, pas une analyse médiatique complète."],"access_status":"open"}
  - {"id":"SOURCE-BRASHIER-ETAL-2021-TIMING-CORRECTIONS","title":"Timing matters when correcting fake news","authors":["Nadia M. Brashier","Gordon Pennycook","Adam J. Berinsky","David G. Rand"],"organization":"Proceedings of the National Academy of Sciences","publication_date":"2021-02-02","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1073/pnas.2020043118","geographic_scope":["États-Unis"],"temporal_scope":"Deux expériences ; mesure de discernement une semaine après exposition","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-EXPERIMENTAL","TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-PRIMARY"],"methodology":"Deux expériences (N total=2 683) comparant des étiquettes de véracité avant, pendant ou après la lecture de titres vrais et faux issus des réseaux sociaux, avec groupe contrôle.","limitations":["Compare le moment de l'étiquetage de véracité, pas une interview à une analyse indépendante.","Mesure le discernement sur les mêmes titres après une semaine ; ne renseigne pas directement sur la persuasion politique durable ou la normalisation d'un acteur."],"access_status":"open"}

  - {"id":"SOURCE-GRANADOS-ALBARRACIN-2025-BYPASSING","title":"Bypassing Versus Correcting Misinformation: Efficacy and Fundamental Processes","authors":["Javier A. Granados Samayoa","Dolores Albarracín"],"organization":"Journal of Experimental Psychology: General","publication_date":"2025-01-01","source_type":"peer_reviewed_article","language":"en","url":"https://doi.org/10.1037/xge0001687","geographic_scope":["États-Unis"],"temporal_scope":"Six expériences préenregistrées publiées en 2025","domains":["DOMAIN-POLITICS"],"tags":["TAG-METHOD-EXPERIMENTAL","TAG-METHOD-QUANTITATIVE","TAG-EVIDENCE-PRIMARY"],"methodology":"Six expériences préenregistrées comparant le bypassing (renforcement de croyances alternatives aux implications évaluatives opposées) à une correction par négation après exposition à des informations trompeuses ; mesures d'attitudes et d'intentions.","limitations":["Échantillons en ligne américains et stimuli brefs fictifs de type titre de presse ; pas d'interviews réelles ni de promoteurs extrémistes.","Le bypassing testé n'est pas équivalent à une analyse journalistique indépendante sans promoteur.","L'avantage dépend du mode de traitement : lorsque les participants forment immédiatement une attitude à la réception de l'information, l'avantage disparaît probablement en raison de l'ancrage."],"access_status":"open"}