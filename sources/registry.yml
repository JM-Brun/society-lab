  - {"id":"SOURCE-INSEE-SMIC-POWER-2014-2025","title":"Salaire minimum interprofessionnel de croissance — données annuelles 1980–2026, tableau du pouvoir d'achat","organization":"INSEE (données DARES et INSEE)","source_type":"institutional_report","language":"fr","publication_date":"2026-09-09","url":"https://www.insee.fr/fr/statistiques/1375188","geographic_scope":["France hors Mayotte"],"temporal_scope":"2014–2025 pour le tableau annuel de pouvoir d'achat ; page de taux nominaux 1980–2026","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Tableau officiel des moyennes annuelles du SMIC horaire brut et des variations annuelles de pouvoir d'achat brut et net, du SHBOE et de l'indice moyen annuel des prix à la consommation.","limitations":["Le tableau de pouvoir d'achat s'arrête à 2025 ; aucune valeur annuelle 2026 n'est publiée dans cette source.","Le pouvoir d'achat annuel du SMIC horaire n'est ni le revenu annuel d'un salarié ni le revenu disponible d'un ménage.","L'indice des prix moyen annuel inclut le tabac et porte sur l'ensemble des ménages ; il ne correspond pas à l'indice légal d'indexation du SMIC."],"access_status":"open"}
  - {"id":"SOURCE-INSEE-GAUTIER-ROUX-2019","title":"Do Minimum Wages Make Wages more Rigid? Evidence from French Micro Data","organization":"INSEE — Erwan Gautier, Sébastien Roux et Milena Suarez Castillo","source_type":"working_paper","language":"en","url":"https://www.insee.fr/en/statistiques/4249078","publication_date":"2019-11-14","geographic_scope":["France"],"temporal_scope":"Données microéconomiques trimestrielles de salaires et minima conventionnels ; période d'étude antérieure à 2019","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Modèle empirique microéconomique de rigidité salariale apparié aux minima conventionnels sectoriels, complété par une simulation des effets agrégés des ajustements salariaux irréguliers.","limitations":["La simulation agrégée dépend des hypothèses du modèle et ne constitue pas une estimation causale directe de l'effet d'un coup de pouce donné sur l'emploi.","Les élasticités de salaires à l'inflation et aux minima ne sont pas des élasticités d'emploi.","Le travail porte sur la dynamique des salaires et la diffusion, pas sur le bilan complet de bien-être."],"access_status":"open","notes":"Audit détaillé : dossiers/smic-gautier-roux-suarez-castillo-2019-wage-rigidity.md. Le modèle estime des effets sur la fréquence et la taille des hausses de salaire et simule les effets agrégés ; il ne mesure pas l'emploi. Le facteur 1,7 concerne l'amplification de l'indexation des salaires à l'inflation, pas l'effet du SMIC sur l'emploi."}
  - {"id":"SOURCE-NBER-ABOWD-KRAMARZ-MARGOLIS-1999","title":"Minimum Wages and Employment in France and the United States","organization":"NBER — John M. Abowd, Francis Kramarz et David N. Margolis","source_type":"scientific_study","language":"en","url":"https://www.nber.org/papers/w6996","publication_date":"1999-03-01","geographic_scope":["France","United States"],"temporal_scope":"Enquête Emploi française 1981-1989 ; CPS américaine 1981-1987","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Appariement longitudinal annuel ; logit conditionnel des transitions emploi/non-emploi ; groupe exposé défini par un salaire réel situé entre les SMIC réels de deux années successives, comparé à un groupe juste au-dessus du nouveau minimum ; contrôles individuels et institutionnels.","limitations":["Échantillon conditionnel composé de personnes employées à un moment de la période, non représentatif de toute la population potentiellement active.","Le groupe témoin est endogène et proche du seuil ; des différences non observées peuvent affecter les transitions.","Les auteurs signalent de petites cellules et des différences parfois non significatives ; les estimations françaises sont qualifiées d'imprécises.","Pas de test de pré-tendances de type étude d'événement dans les résultats présentés ; la robustesse aux seuils alternatifs ne remplace pas ce test.","Les heures servent à construire le salaire horaire mais ne sont pas un résultat estimé ; les salaires, prix et marges ne font pas l'objet d'une évaluation causale.","Données et dispositifs français de 1981-1989, validité externe limitée pour la France actuelle."],"access_status":"open","notes":"Audit détaillé dans dossiers/smic-causal-evidence-matrix.md ; distinguer du chapitre jeunesse Abowd, Kramarz, Lemieux et Margolis (1997/2000)."}

  - {"id":"SOURCE-BAZEN-SKOURIAS-1997","title":"Is there a negative effect of minimum wages on youth employment in France?","organization":"Stephen Bazen et Nicolas Skourias — European Economic Review","source_type":"scientific_study","language":"en","url":"https://doi.org/10.1016/S0014-2921(97)00004-4","geographic_scope":["France"],"temporal_scope":"Données French Labour Force Survey 1980-1984 ; hausses du SMIC 1981-1984","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE"],"methodology":"Différence de différences sectorielle sur 32 secteurs ; exposition mesurée par la proportion de salariés dont le salaire était inférieur au SMIC de juin 1981 ; résultat portant sur la part des 15-24 ans dans l'emploi sectoriel.","limitations":["La variable de résultat est une part sectorielle conditionnelle à la croissance de l'emploi total, pas un taux d'emploi individuel ni l'emploi total des jeunes.","Neumark et Wascher (2007) critiquent le contrôle par la croissance en pourcentage de l'emploi sectoriel et la mesure d'exposition de juin 1981 appliquée aux fenêtres couvrant 1980-1984.","Les pré-tendances, erreurs-types détaillées, intervalles de confiance et tests de robustesse n'ont pas encore été vérifiés dans le texte intégral.","Ne mesure pas directement les heures travaillées ni les effets salariaux individuels."],"access_status":"abstract","notes":"Fiche d'audit dans dossiers/smic-causal-evidence-matrix.md ; le texte intégral éditeur n'a pas encore été obtenu. Résultat négatif statistiquement significatif rapporté, mais interprétation causale à tenir avec prudence."}

  - {"id":"SOURCE-NBER-ABOWD-KRAMARZ-LEMIEUX-MARGOLIS-2000","title":"Minimum Wages and Youth Employment in France and the United States","organization":"NBER — John M. Abowd, Francis Kramarz, Thomas Lemieux et David N. Margolis","source_type":"scientific_study","language":"en","url":"https://www.nber.org/books-and-chapters/youth-employment-and-joblessness-advanced-countries/minimum-wages-and-youth-employment-france-and-united-states","publication_date":"2000-01-01","geographic_scope":["France","United States"],"temporal_scope":"Enquête Emploi française 1982-1989 ; CPS américaine 1981-1987","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Deux approches : logit multinomial des transitions emploi/non-emploi sur la population plus large ; logit conditionnel de maintien en emploi chez les jeunes de 30 ans ou moins, avec exposition définie par le salaire réel situé entre deux SMIC réels annuels successifs et groupe de comparaison marginalement au-dessus du SMIC.","limitations":["Le groupe de comparaison proche du seuil n'est pas un groupe non traité et peut être affecté par les mêmes chocs ou la diffusion salariale.","Les auteurs reconnaissent ne pas contrôler complètement l'hétérogénéité individuelle non observée.","Pas d'étude d'événement ni de test de pré-tendances parallèles présenté dans les résultats consultés.","Petites cellules et résultats détaillés par âge/sexe parfois non significatifs ou difficiles à interpréter.","L'élasticité conditionnelle de -2,489 pour les jeunes hommes ne doit pas être confondue avec l'élasticité dite inconditionnelle de -0,203, calculée sous hypothèse supplémentaire.","Les heures ne sont pas un résultat estimé ; les données portent sur 1982-1989 et les dispositifs d'emploi des jeunes de l'époque."],"access_status":"open","notes":"Fiche autonome : dossiers/smic-youth-abowd-kramarz-lemieux-margolis-2000.md. Distinguer du NBER WP 6996 (1999), qui compte trois auteurs et une population/stratégie différente."}

  - {"id":"SOURCE-KRAMARZ-PHILIPPON-2001","title":"The Impact of Differential Payroll Tax Subsidies on Minimum Wage Employment","organization":"Francis Kramarz et Thomas Philippon — Journal of Public Economics","source_type":"scientific_study","language":"en","url":"https://doi.org/10.1016/S0047-2727(00)00137-7","publication_date":"2001-10-01","geographic_scope":["France"],"temporal_scope":"Enquête Emploi 1990-1998 ; variations du coût minimum employeur et exonérations 1990-1998","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Logits conditionnels sur les transitions emploi/non-emploi et différences-de-différences entre groupes de salariés dont le coût est rattrapé par le coût minimum et groupe marginal proche du seuil ; comparaison des périodes de hausse et de baisse du coût employeur total.","limitations":["Le traitement combine SMIC légal et cotisations patronales ; l'effet ne peut pas être attribué au SMIC seul.","Les réformes de cotisations, revalorisations et conditions macroéconomiques concomitantes compliquent l'identification.","Pas de test de pré-tendances de type event-study présenté.","Le groupe marginal est un contrôle proche du seuil et potentiellement exposé à des effets de diffusion/substitution.","Les résultats sur les entrées dans l'emploi et les exonérations sont faibles et non significatifs.","Les heures déclarées sont bruitées ; salaire mensuel et statut temps plein/partiel servent à construire le coût.","Les jeunes de moins de 25 ans en programmes spéciaux et le secteur public sont exclus ; validité externe limitée."],"access_status":"open","notes":"Fiche autonome : dossiers/smic-kramarz-philippon-payroll-tax-2001.md. Ne pas présenter l'élasticité différentielle d'environ -1,5 comme une élasticité pure de l'emploi au SMIC."}

  - {"id":"SOURCE-INSEE-TEF-2010-SMIC-POWER","title":"Tableaux de l’économie française 2010 — Salaire minimum et coût du travail, tableau 5.3","organization":"INSEE","publication_date":"2010-01-01","source_type":"primary_data","language":"fr","url":"https://www.insee.fr/fr/statistiques/fichier/1373375/T10F053.pdf","geographic_scope":["France métropolitaine"],"temporal_scope":"Observations annuelles 1990, 1995, 2000–2008 ; pouvoir d’achat annuel du SMIC brut et net, SHBO et inflation","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Tableau INSEE de pouvoir d’achat en moyenne annuelle ; taux horaire brut moyen annuel, évolutions publiées du pouvoir d’achat brut et net, du SHBO et indice moyen annuel des prix.","limitations":["Le millésime 2010 doit être conservé ; ne pas mélanger silencieusement avec les révisions ultérieures.","Le net est publié avant déduction de la CSG et de la CRDS ; l’indice des prix inclut le tabac.","SHBO est une mesure du salaire horaire de base des ouvriers ; elle ne doit pas être assimilée au SHBOE postérieur à 2013."],"access_status":"open","notes":"TEF édition 2010, p. 62, source indiquée : INSEE."}

  - {"id":"SOURCE-CREPON-DESPLATZ-2001","title":"Une nouvelle évaluation des effets des allégements de charges sociales sur les bas salaires","organization":"Bruno Crépon et Rozenn Desplatz — INSEE, Économie et Statistique n° 348","source_type":"scientific_study","language":"fr","url":"https://www.insee.fr/fr/statistiques/1376044?sommaire=1376054","publication_date":"2002-03-01","geographic_scope":["France"],"temporal_scope":"Extensions d'allègements 1995-1996 ; résultats d'entreprise 1994-1997","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Évaluation ex post sur traitement continu : réduction ex ante du coût moyen du travail calculée à partir de la distribution salariale de 1994 et de la législation de 1997 ; comparaison des évolutions 1994-1997 des entreprises selon leur exposition ; régressions paramétriques et estimateur semi-paramétrique par séries, avec score synthétique de contrôle.","limitations":["L'instrument est une extension d'allègements de cotisations patronales et non une hausse du SMIC légal.","Hypothèse d'indépendance conditionnelle aux caractéristiques observables ; la structure salariale initiale et l'exposition ne sont pas aléatoires.","Panel cylindré : entreprises présentes sur la période ; créations et destructions d'entreprises exclues.","Échantillon final de 87 720 entreprises, environ 30 % des 295 118 initiales ; divergences sectorielles avec la comptabilité nationale.","Chiffrage de 460 000 emplois issu de l'estimateur semi-paramétrique moins précis (255 000-670 000) ; estimation paramétrique environ 290 000.","Pas d'event-study ou de test de pré-tendances parallèles présenté.","Heures et emploi en équivalent temps plein non directement mesurés ; critique de l'effet du temps partiel.","Effets de concurrence, spillovers et financement des allègements non complètement pris en compte dans le passage au niveau agrégé.","Prix et volumes au niveau de chaque entreprise non directement observés ; leur mécanisme est en partie inféré."],"access_status":"open","notes":"Fiche autonome : dossiers/smic-crepon-desplatz-2001.md. Lire aussi les commentaires de Yannick L'Horty et Guy Lacroix dans le même numéro et la critique OFCE de Henri Sterdyniak (2002). Ne pas utiliser comme preuve directe d'un effet causal du SMIC."}

  - {"id":"SOURCE-DARES-SMIC-POWER-DECOMPOSITION-1971-2001","title":"La modération salariale en France depuis le début des années 1980 — tableau DARES de décomposition des hausses du pouvoir d’achat du SMIC","organization":"DARES ; Desplatz, Jamet, Passeron et Romans, Économie et Statistique n° 367","publication_date":"2003-01-01","source_type":"primary_data","language":"fr","url":"https://www.insee.fr/fr/statistiques/fichier/1375888/es367b.pdf","geographic_scope":["France"],"temporal_scope":"1971–2001 ; contributions annuelles publiées","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Transcription du tableau V : moitié du gain réel du SHBO et coup de pouce nominal, exprimés en évolution annuelle moyenne.","limitations":["Composantes de décomposition, pas une série autonome des variations observées du pouvoir d’achat ; ne pas les additionner sans validation de l’identité comptable.","Depuis 1999, les chiffres incluent les revalorisations des GMR.","Ne se raccorde pas directement aux moyennes annuelles INSEE 2014–2025 ni aux glissements juillet-juillet DARES 1996–2008."],"access_status":"open","notes":"Tableau V, p. 50 ; source indiquée : DARES."}
  - {"id":"SOURCE-BUNEL-GILLES-LHORTY-2009","title":"Les effets des allégements de cotisations sociales sur l’emploi et les salaires : une évaluation de la réforme de 2003","organization":"Matthieu Bunel, Fabrice Gilles et Yannick L’Horty — Économie et Statistique n°429-430 ; EPEE document 09-12","source_type":"scientific_study","language":"fr","url":"https://www.insee.fr/fr/statistiques/1377396?sommaire=1377406","publication_date":"2009-08-01","geographic_scope":["France"],"temporal_scope":"Panel d’entreprises 2002-2005 ; réforme Fillon et convergence SMIC-GMR 2003-2005","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Panel cylindré d’environ 92 939 entreprises privées non agricoles de plus de cinq salariés, appariement ACOSS (AROME, ORME, SEQUOIA), DADS et SUSE. Traitement continu calculé à structure salariale 2002 constante à partir des exonérations effectivement perçues et des hausses différenciées du SMIC/GMR. MCO, régressions quantiles et appariement sur score de propension (plus proche voisin et noyau). Résultats séparés entre entreprises à 35 h et 39 h.","limitations":["Le traitement combine réforme des exonérations, hausse du SMIC et convergence des GMR ; l’effet du SMIC seul n’est pas identifié.","Exposition non aléatoire ; l’hypothèse d’indépendance conditionnelle ne neutralise pas toute hétérogénéité non observée.","Panel cylindré : créations et disparitions d’entreprises exclues ; champ limité aux entreprises de plus de cinq salariés et à certains bénéficiaires continus.","Les entreprises à 35 h et 39 h diffèrent en taille, secteur, structure de main-d’œuvre et organisation.","Pas de test événementiel moderne de pré-tendances parallèles établi dans l’audit.","Absence de bouclage macroéconomique, d’effets de volume et de substitutions intersectorielles ; extrapolations nationales indicatives.","Les effets sur qualifications et salaires détaillés restent partiellement ouverts."],"access_status":"open","notes":"Fiche autonome : dossiers/smic-fillon-reform-2003-audit.md. Résultat central : redistribution des effets entre entreprises 35 h et 39 h ; bilan agrégé faible voire légèrement négatif. Ne pas interpréter comme effet causal d’une hausse isolée du SMIC."}
  - {"id":"SOURCE-SIMONNET-TERRACOL-2009","title":"Coût du travail et flux d’emploi : l’impact de la réforme de 2003","organization":"Véronique Simonnet et Antoine Terracol — Économie et Statistique n°429-430","source_type":"scientific_study","language":"fr","url":"https://www.insee.fr/fr/statistiques/1377398?sommaire=1377406","publication_date":"2009-08-01","geographic_scope":["France"],"temporal_scope":"Enquête Emploi 2001-2007 ; réforme Fillon et convergence SMIC-GMR 2003-2005","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Appariement de l’Enquête Emploi 2001-2007 et des fichiers CERFA ; comparaison des transitions chômage-vers-emploi selon que l’entrée s’effectue dans une entreprise signataire ou non d’un accord de réduction du temps de travail à 35 heures avant 2003.","limitations":["Le traitement combine évolution du SMIC/GMR et changement des exonérations ; il ne mesure pas une hausse isolée du SMIC.","Les coefficients, erreurs-types, intervalles de confiance, tests placebo et contrôles détaillés n’ont pas encore été vérifiés dans le texte intégral.","Le résumé éditeur rapporte un ralentissement des sorties du chômage vers les entreprises à 35 h et pour les moins diplômés ; la force causale doit être évaluée après audit des tableaux et de l’identification.","Comparaison entre catégories d’entreprises potentiellement différentes avant la réforme."],"access_status":"open","notes":"Fiche de synthèse dans dossiers/smic-fillon-reform-2003-audit.md ; audit quantitatif du texte intégral à poursuivre. Ne pas interpréter comme effet causal d’une hausse isolée du SMIC."}
  - {"id":"SOURCE-JAMET-2005-DARES-103","title":"Allègements généraux de cotisations sociales et emploi peu qualifié : de l’impact sectoriel à l’effet macro-économique","organization":"Stéphanie Jamet — DARES, Document d’études n°103 ; Revue française d’économie 19(3)","source_type":"scientific_study","language":"fr","url":"https://dares.travail-emploi.gouv.fr/sites/default/files/pdf/de_103.pdf","publication_date":"2005-08-01","geographic_scope":["France"],"temporal_scope":"Allègements RBS 1993–1997 ; données sectorielles et Enquête Emploi 1983–1997","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Modèle structurel sectoriel et agrégation macroéconomique des demandes de travail peu qualifié, des substitutions entre qualifications et des interactions entre secteurs ; calculs à partir de l’Enquête Emploi, barèmes légaux et comptes annuels.","limitations":["Estimation structurelle et scénarios paramétrés, non expérience naturelle ; résultats sensibles aux élasticités retenues.","Le capital est absent du modèle central ; la variante avec capital est jugée approximative.","Le financement budgétaire des allègements n’est pas intégré.","L’absence de négociation salariale des travailleurs peu qualifiés peut surestimer l’effet emploi.","Le résultat privilégié concerne l’emploi peu qualifié en ETP, pas le solde net de l’emploi total."],"access_status":"open","notes":"Fiche détaillée dans dossiers/smic-sectoral-effects-exemptions-1993-1997.md. Scénarios d’environ 50 000 à 190 000 emplois peu qualifiés ; scénario privilégié proche de 165 000 ETP."}
  - {"id":"SOURCE-GAFSI-LHORTY-MIHOUBI-2004-03R","title":"Allègement du coût du travail et emploi peu qualifié : une réévaluation","organization":"Islem Gafsi, Yannick L’Horty et Ferhat Mihoubi — EPEE, Document de recherche 04-03R","source_type":"working_paper","language":"fr","url":"https://www.univ-evry.fr/fileadmin/mediatheque/ueve-institutionnel/03_Recherche/laboratoires/Epee/wp/04-03R.pdf","publication_date":"2004-01-01","geographic_scope":["France"],"temporal_scope":"Panel sectoriel 16 secteurs, 1982–2002 ; simulation des allègements 1992–1997","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Système de demandes de facteurs (travail qualifié, peu qualifié, capital), formation des salaires et des prix sur panel sectoriel ; Enquêtes Emploi, barèmes légaux et comptes nationaux ; estimations en taux de croissance et en niveau avec tests de cointégration de Pedroni.","limitations":["Modèle structurel sectoriel, non expérience naturelle ; les résultats dépendent des fonctions de demande, de la mesure du capital et des hypothèses de formation des salaires/prix.","La longueur temporelle empêche un modèle de cointégration en panel plus complet ; les tests de Pedroni sont une approximation.","Certaines tables détaillées ne sont pas reproduites dans le document consulté.","Le traitement étudié est la baisse de cotisations sur bas salaires, non une hausse isolée du SMIC.","Les résultats portent sur 1997 et ne doivent pas être interprétés comme créations nettes observées directement."],"access_status":"open","notes":"Document de travail EPEE, fiche détaillée dans dossiers/smic-sectoral-effects-exemptions-1993-1997.md. Résultat central : 118–140k emplois peu qualifiés, −41–76k qualifiés, solde net 60–80k."}
  - {"id":"SOURCE-HENNION-LOISY-2006","title":"L’impact des exonérations de cotisations patronales de Sécurité sociale sur l’emploi : une nouvelle évaluation","organization":"Marie Hennion et Christian Loisy — DREES, Dossiers Solidarité et Santé n°2","source_type":"scientific_study","language":"fr","url":"https://drees.solidarites-sante.gouv.fr/sites/default/files/2020-10/dss02-2006.pdf","publication_date":"2006-06-01","geographic_scope":["France"],"temporal_scope":"Comptes trimestriels 1985T1–2003T3 ; simulation de l’effet de la baisse du taux apparent 1990–2003","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"],"methodology":"Équation agrégée d’emploi en équivalent temps plein sur le secteur marchand non agricole, modèle à correction d’erreur reliant emploi, PIB, coût réel du travail et tendance ; taux apparent de cotisations calculé comme cotisations patronales versées rapportées à la masse salariale.","limitations":["Le taux apparent agrège plusieurs cotisations et exonérations ; l’effet propre des exonérations ciblées sur les bas salaires n’est pas isolé.","La RTT à partir de 1998 et les baisses de cotisations sont colinéaires ; une variable muette frustre est utilisée.","Les salaires sont supposés exogènes ; les substitutions entre emploi qualifié et peu qualifié ne sont pas identifiables avec les données agrégées.","Le financement macroéconomique des exonérations n’est pas pris en compte.","Le chiffrage de 250 000 ETP est une simulation toutes choses égales par ailleurs, pas un décompte causal observé.","L’étude ne mesure pas l’effet d’une hausse isolée du SMIC."],"access_status":"open","notes":"Fiche détaillée : dossiers/smic-hennion-loisy-2006-macro-audit.md. Élasticité long terme emploi/coût −0,9 ; estimation 250 000 ETP pour la baisse du taux apparent entre 1990 et 2003."}
  - {"id":"SOURCE-OURLIAC-NOUVEAU-2012-DARES-169","title":"Les allègements de cotisations sociales patronales sur les bas salaires en France de 1993 à 2009","organization":"Benoît Ourliac (DG Trésor) et Cyril Nouveau (DARES) — DARES Document d’études n°169","source_type":"institutional_report","language":"fr","url":"https://dares.travail-emploi.gouv.fr/sites/default/files/pdf/DE2012-_no169.pdf","publication_date":"2012-02-01","geographic_scope":["France"],"temporal_scope":"Synthèse des allègements 1993–2009 ; première vague 1993–1997 ; RTT/Aubry et Fillon 1998–2005","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Revue critique et harmonisation des évaluations ex ante, sectorielles, microéconomiques et macroéconomiques des allègements ; actualisation des coûts par emploi en euros 2009 ; synthèse de trois rapports sur la réforme Fillon et des travaux sur les trajectoires salariales.","limitations":["Il s’agit d’une synthèse de travaux antérieurs, pas d’une nouvelle estimation causale indépendante.","La fourchette 200 000–400 000 pour 1993–1997 agrège des méthodes et des estimands hétérogènes.","Les extrapolations de suppression totale (550 000–1,1 million ; scénario prudent 400 000–800 000) reposent sur des hypothèses de rendements constants ou divisés par deux, explicitement fragiles.","Le coût net par emploi suppose une économie forfaitaire d’environ 12 000 € par emploi et des hypothèses simplificatrices de prestations évitées.","Les études de la réforme Fillon ne séparent pas l’effet de l’unification des allègements de la convergence des minima et de la RTT.","Les résultats sur les trappes à bas salaires sont contradictoires et ne couvrent pas les salaires à l’embauche ni la formation professionnelle.","Le document DARES est un document de travail qui n’engage pas la position de l’institution."],"access_status":"open","notes":"Fiche détaillée : dossiers/smic-ourliac-nouveau-2012-synthesis-audit.md. Réconcilie les chiffres de Crépon & Desplatz, Jamet, Gafsi et les rapports Fillon ; identifie le rapport GRECSTA comme prochaine étude primaire à auditer."}
  - {"id":"SOURCE-GRECSTA-CAHUC-ET-AL-2009-ACCESS-NOTE","title":"Évaluation des baisses de cotisations sociales sur les bas salaires dans le cadre du dispositif Fillon 2003 — note d'accès documentaire","authors":["Pierre Cahuc","Bruno Crépon","Francis Kramarz","Stéphane Quantin","Natalia Radtchenko"],"organization":"GRECSTA / CREST-INSEE ; commande DARES","source_type":"other","language":"fr","url":"https://dares.travail-emploi.gouv.fr/appels-projets-recherche/2006-evaluation-des-baisses-de-cotisations-sociales-sur-les-bas-salaires-dans","publication_date":"2009-01-01","geographic_scope":["France"],"temporal_scope":"Réforme Fillon 2003–2005","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE"],"methodology":"Note de traçabilité à partir de la page officielle de l'appel à projets DARES et d'une synthèse de la Cour des comptes ; le rapport primaire GRECSTA n'a pas été retrouvé et n'a donc pas été audité.","limitations":["La note ne donne pas accès aux données, à l'échantillon, à la stratégie d'identification ni aux résultats chiffrés détaillés du rapport primaire.","Les conclusions générales rapportées par la Cour des comptes ne peuvent remplacer une lecture du rapport original.","Ne pas confondre ce rapport avec le rapport CEE Bunel et al. ni avec l'étude CES Simonnet et Terracol."],"access_status":"unavailable","notes":"Fiche de traçabilité : dossiers/smic-grecsta-fillon-2009-source-access-note.md. Demander le rapport à la DARES, au CREST/INSEE ou aux auteurs."}
  - {"id":"SOURCE-BARLET-BLANCHET-LE-BARBANCHON-2010","title":"Microsimulation et modèles d’agents : une approche alternative pour l’évaluation des politiques d’emploi","authors":["Muriel Barlet","Didier Blanchet","Thomas Le Barbanchon"],"organization":"INSEE","source_type":"academic_article","language":"fr","url":"https://www.persee.fr/doc/estat_0336-1454_2009_num_429_1_8063","doi":"10.3406/estat.2009.8063","publication_date":"2010-08-26","geographic_scope":["France"],"temporal_scope":"Modèle calibré sur le marché du travail français ; simulations de chocs de salaire minimum et d'allègements","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-MODELLED","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Modèle dynamique de microsimulation et d'agents (ACE), calibré sur des caractéristiques stylisées du chômage et de l'emploi salarié privé ; simulation des créations/destructions d'emplois, appariements, négociations salariales, profitabilité et demande agrégée.","limitations":["Prototype de modèle et non évaluation ex post identifiée par groupe traité et témoin.","Résultats conditionnels au calibrage, aux règles comportementales et aux hypothèses de négociation salariale.","Rigidité nominale à la baisse des salaires importante pour les effets de court terme.","Le rendement divisé par deux entre les deux vagues est une simulation, pas un décompte causal d'emplois observés.","Ne mesure pas l'effet causal d'une hausse isolée du SMIC."],"access_status":"open","notes":"Audit : dossiers/smic-barlet-blanchet-le-barbanchon-2010-microsimulation.md. Version de travail INSEE G2008/13 (2008) : https://www.insee.fr/fr/statistiques/1380764."}
  - {"id":"SOURCE-LHOMMEAU-REMY-2010-MOBILITE-SALARIALE","title":"Les politiques d’allégements ont-elles un effet sur la mobilité salariale des travailleurs à bas salaires ?","authors":["Bertrand Lhommeau","Véronique Rémy"],"organization":"DARES / INSEE","source_type":"academic_article","language":"fr","url":"https://www.insee.fr/fr/statistiques/fichier/1377392/ES429B%20.pdf","doi":"10.3406/estat.2009.8062","publication_date":"2010-08-20","geographic_scope":["France"],"temporal_scope":"Panel DADS 1984–2003 ; dispositifs d’allègements 1993–2005","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"methodology":"Modèle théorique d’appariement et estimation de panel à effets individuels de type Mundlak sur données DADS 1984–2003 regroupées en cellules d’entreprises ; résultats sur croissance salariale réelle et sortie du bas salaire pour salariés restés dans la même entreprise entre t et t+2.","limitations":["Échantillon conditionné au maintien dans la même entreprise : ne mesure pas les trajectoires des personnes changeant d'employeur ou sortant de l'emploi.","Regroupement en cellules : hétérogénéité individuelle résiduelle et unité estimée différente de l'individu.","Intensité et progressivité des allègements potentiellement endogènes aux décisions et à la composition des entreprises ; pas d'assignation exogène.","Période marquée par la RTT, les GMR et la convergence des minima ; séparation parfaite difficile.","Le papier porte sur les allègements et la mobilité salariale, pas sur l'effet causal d'une hausse isolée du SMIC ni sur l'emploi net."],"access_status":"open","notes":"Audit détaillé : dossiers/smic-lhommeau-remy-2010-mobilite-salariale.md. Les coefficients du tableau 3 ne sont pas des élasticités directement interprétables."}
  - {"id":"SOURCE-AEBERHARDT-SRAER-2010-DYNAMIQUE-SALARIALE","title":"Allègements de cotisations patronales et dynamique salariale","authors":["Romain Aeberhardt","David Sraer"],"organization":"INSEE","source_type":"academic_article","language":"fr","url":"https://www.bnsp.insee.fr/ark:/12148/bc6p070n3rp.pdf","doi":"10.3406/estat.2009.8068","publication_date":"2010-08-20","geographic_scope":["France"],"temporal_scope":"Première vague d'allègements 1994–1997 ; DADS exhaustives","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE"],"methodology":"Deux stratégies : différence de différences entre salariés 1,2–1,33 SMIC et 1,33–1,5 SMIC sur DADS exhaustives 1994–1997 ; régression sur discontinuité autour du seuil de 1,33 SMIC avec fenêtres de 0,06 à 0,30 SMIC et contrôles individuels, sectoriels et effets fixes d'entreprise.","limitations":["DiD dépend de tendances parallèles et d'un groupe témoin potentiellement affecté par des effets indirects des allègements.","Diffusion des hausses du SMIC vers les groupes comparés corrigée par approximation ; les effets de diffusion peuvent différer.","RDD locale au seuil de 1,33 SMIC ; résultat non extrapolable aux salaires éloignés du seuil.","Dans la RDD, l'effet simple diminue avec la fenêtre et n'est plus significatif après contrôles supplémentaires.","Échantillon exclut temps partiel et mobilités entre entreprises ; résultats conditionnels au maintien dans le même établissement.","Résultat porte sur le salaire brut individuel, non sur emploi net, heures ou revenu disponible.","Étude limitée à la première vague 1994–1997, non directement transposable aux dispositifs ultérieurs ni à une hausse isolée du SMIC."],"access_status":"open","notes":"Audit : dossiers/smic-aeberhardt-sraer-2010-dynamique-salariale.md. Version de travail INSEE G2007/01 : https://www.insee.fr/fr/statistiques/1380699."}
  - {"id":"SOURCE-AUDENIS-LAIB-ROUX-2002-ACCESS-AUDIT","title":"L’évolution de l’emploi faiblement rémunéré au cours des dix dernières années","authors":["C. Audenis","N. Laïb","S. Roux"],"organization":"INSEE","source_type":"book","language":"fr","url":"https://www.label-emmaus.co/fr/9782253905905-leconomie-francaise-edition-2002-2003/","geographic_scope":["France"],"temporal_scope":"Évolution des emplois et salaires faiblement rémunérés au cours des années 1990 jusqu'en 2001","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-LEVEL-NATIONAL","TAG-METHOD-QUANTITATIVE"],"methodology":"Chapitre primaire non consulté intégralement. Résultats rapportés par le CAE (2008), le COE (2006) et le Sénat ; éclairage complémentaire vérifié dans l'étude Insee-Dares de Lhommeau (2005) sur panel DADS 1984–2001, sans assimiler les deux travaux.","limitations":["Texte primaire et tableaux originaux non retrouvés ; coefficients, erreurs-types, spécifications et tests de robustesse non vérifiables.","Les reprises secondaires ne permettent pas de reconstruire précisément les définitions et l'horizon de la décote salariale d'Audenis et al.","Les hausses du SMIC et les allégements se développent simultanément ; les sources secondaires indiquent que les hausses du SMIC peuvent masquer un effet de trappe.","Les résultats ne constituent pas une estimation causale de l'effet d'une hausse isolée du SMIC sur l'emploi, les heures ou le revenu disponible."],"access_status":"unavailable","notes":"Audit et plan d'accès : dossiers/smic-audenis-laib-roux-2002-source-access-audit.md. Reprises : CAE 2008 https://www.vie-publique.fr/files/rapport/pdf/084000688.pdf ; COE 2006 https://www.strategie.gouv.fr/files/files/Publications/Rapport/coe-aides-publiques-fevrier-2006.pdf ; prolongement distinct Lhommeau 2005 https://www.insee.fr/fr/statistiques/fichier/1371797/salfra05e.pdf."}
  - {"id":"SOURCE-KOUBI-LHOMMEAU-2007-DIFFUSION-GRILLES","title":"Les effets de diffusion de court terme des hausses du Smic dans les grilles salariales des entreprises de dix salariés ou plus sur la période 2000-2005","authors":["Malik Koubi","Bertrand Lhommeau"],"organization":"DARES / INSEE","source_type":"book","language":"fr","url":"https://www.insee.fr/fr/statistiques/1373191","geographic_scope":["France"],"temporal_scope":"Enquête Acemo trimestrielle 2000–2005 ; diffusion immédiate et à un an","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"methodology":"Modèle de variation du salaire de base de postes représentatifs de grilles Acemo, avec effets temporels, tranche salariale relative au SMIC/GMR, caractéristiques ou effets fixes d'entreprise, catégorie socioprofessionnelle et contrôles de passage à la RTT ; 1 973 738 observations et 151 590 postes après filtres.","limitations":["Champ limité aux entreprises de 10 salariés ou plus ; les auteurs indiquent que 41 % des salariés au SMIC travaillent dans les entreprises plus petites.","Postes représentatifs et non trajectoires individuelles ; salaire brut de base hors primes et compléments.","Période 2000–2005 confondue avec la convergence des GMR et du SMIC après le passage aux 35 heures ; minimum explicatif pondéré entre SMIC et GMR.","Base de suivi RTT incomplète pour certains établissements ; variables et dates parfois imparfaitement renseignées.","Identification non expérimentale fondée sur variation temporelle et tranches salariales ; simultanéité potentielle entre SHBO et formule d'indexation du SMIC.","Estimations annuelles sur cinq points seulement et sensibles aux effets fixes d'entreprise ; coefficients supérieurs à l'unité à lire comme proches de l'unité selon les auteurs.","Aucun résultat sur emploi, heures réellement travaillées, rémunération totale, prix ou marges."],"access_status":"open","notes":"Audit détaillé : dossiers/smic-koubi-lhommeau-2007-diffusion-grilles-salariales.md. PDF source : https://www.bnsp.insee.fr/ark:/12148/bc6p07d21j6.pdf."}
  - {"id":"SOURCE-CETTE-CHOUARD-VERDUGO-2011-DIFFUSION-MOYEN","title":"Les effets des hausses du Smic sur le salaire moyen","authors":["Gilbert Cette","Valérie Chouard","Grégory Verdugo"],"organization":"INSEE / Banque de France","source_type":"academic_article","language":"fr","url":"https://www.insee.fr/fr/statistiques/fichier/1377686/ES448A.pdf","doi":"10.3406/estat.2011.9746","publication_date":"2011-10-25","geographic_scope":["France métropolitaine"],"temporal_scope":"Séries trimestrielles 1971–2009 ; reconstitutions des revalorisations depuis 1970","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"methodology":"Équations macroéconomiques trimestrielles estimées par MCO sur 156 observations, SHBO et SMPT, retards jusqu'à trois trimestres, contrôles prix, chômage, productivité, durée du travail et saisonnalité ; décomposition des hausses du SMIC entre prix, indexation SHBO et coups de pouce.","limitations":["Séries agrégées et nombre limité de 156 trimestres ; pas de groupe témoin ni de choc exogène isolé.","Les auteurs reconnaissent l'endogénéité possible des salaires, prix et chômage et ne mettent pas en œuvre un modèle simultané complet.","Rupture d'indexation en 1982 susceptible de recouvrir plusieurs changements concomitants.","Les revalorisations 2003–2005 liées à la convergence des minima sont ventilées par convention en composantes fictives, le surplus étant classé en coups de pouce.","Aucune estimation directe sur emploi, heures, marges, prix de vente ou revenu disponible ; résultats d'élasticités agrégées non transposables mécaniquement à un épisode individuel."],"access_status":"open","notes":"Audit détaillé : dossiers/smic-cette-chouard-verdugo-2011-diffusion-salaire-moyen.md. Version Banque de France WP 366 (février 2012) : https://publications.banque-france.fr/sites/default/files/medias/documents/working-paper_366_2012.pdf."}
  - {"id":"SOURCE-INSEE-IPC-BASE-1980","title":"Indice des prix à la consommation — série mensuelle base 1980, idBank 000008964","organization":"INSEE — Banque de données macroéconomiques","source_type":"primary_data","language":"fr","url":"https://www.insee.fr/fr/statistiques/serie/000008964","geographic_scope":["France"],"temporal_scope":"Série mensuelle ; extraction utilisée de 1970-01 à 1992-12, avec recouvrement 1990-01 à 1992-12 pour raccordement à la base 2015","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Observations mensuelles de l'IPC général, base 1980 ; les valeurs antérieures à 1990 sont raccordées à la série base 2015 par la moyenne géométrique des rapports mensuels sur 1990–1992, selon la documentation du jeu de données IPC data.gouv.fr.","limitations":["Série ancienne en base 1980 ; raccordement nécessaire pour comparaison avec les observations postérieures.","Champ et population de référence historiques susceptibles de différer des séries plus récentes.","IPC d'ensemble, non l'indice du premier quintile hors tabac utilisé pour l'indexation légale du SMIC depuis 2013."],"access_status":"open","notes":"Utilisée avec la série INSEE 001759970 dans la reconstruction mensuelle 1970–2025 ; facteur de raccordement observé dans l'extraction du 15 novembre 2026 : 0,366648982859."}
  - {"id":"SOURCE-INSEE-IPC-BASE-2015","title":"Indice des prix à la consommation — série mensuelle base 2015, idBank 001759970","organization":"INSEE — Banque de données macroéconomiques","source_type":"primary_data","language":"fr","url":"https://www.insee.fr/fr/statistiques/serie/001759970","geographic_scope":["France"],"temporal_scope":"Série mensuelle ; extraction utilisée de 1990-01 à 2025-12","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Observations mensuelles de l'IPC général, base 2015 ; utilisée directement à partir de janvier 1990 et comme échelle de référence pour raccorder la série base 1980.","limitations":["Série arrêtée à la fin de 2025 dans l'extraction utilisée ; elle n'inclut pas les observations de la nouvelle base 2025 publiées en 2026.","IPC d'ensemble, non l'indice du premier quintile hors tabac utilisé pour l'indexation légale du SMIC depuis 2013."],"access_status":"open","notes":"Utilisée avec la série INSEE 000008964 dans la reconstruction mensuelle 1970–2025 ; la description du raccordement 1990–1992 est publiée sur data.gouv.fr."}
  - {"id":"SOURCE-GOARANT-MULLER-2011-SMIC-DIFFUSION-ACEMO","title":"Les effets des hausses du Smic sur les salaires mensuels dans les entreprises de 10 salariés ou plus de 2006 à 2009","authors":["Claire Goarant","Lara Muller"],"organization":"DARES — INSEE Références, Emploi et salaires 2011","source_type":"institutional_research","language":"fr","url":"https://www.insee.fr/fr/statistiques/fichier/1373824/empsal11f.pdf","geographic_scope":["France métropolitaine"],"temporal_scope":"Enquête ACEMO trimestrielle T3 1999–T2 2009 ; analyse principale 2006–2009, comparaison 1999–2005","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Modèle de croissance trimestrielle du salaire mensuel brut de base par poste et établissement, avec interactions entre la variation du SMIC moyen et les tranches de salaire initiales ; effets temporels, contrôles RTT, taille, convention collective et catégorie socioprofessionnelle ; variantes par déciles et effets fixes d'établissement.","limitations":["Champ limité aux établissements d'au moins 10 salariés et à la France métropolitaine ; les TPE sont exclues.","L'unité est un poste représentatif, pas un salarié suivi individuellement ; les créations et destructions d'emplois ne sont pas mesurées.","Le salaire mensuel brut de base ne correspond pas exactement à l'assiette légale de vérification du SMIC.","Avant juillet 2005, la variable de hausse du minimum est une moyenne pondérée du SMIC et des GMR, non le seul SMIC légal.","Modèle économétrique non expérimental ; pas de test de pré-tendances de type event-study."],"access_status":"open","notes":"Audit détaillé : dossiers/smic-goarant-muller-2011-diffusion-acemo.md. Effet immédiat différentiel de 0,38 point pour les postes 1–1,1 SMIC par hausse de 1 % du minimum ; effet annuel résiduel de 0,16 point seulement pour cette tranche."}

