  - {"id":"SOURCE-ABOWD-KRAMARZ-MARGOLIS-NBER-1999","title":"Minimum Wages and Employment in France and the United States","organization":"John M. Abowd, Francis Kramarz et David N. Margolis","publication_date":"1999-03-01","source_type":"working_paper","language":"en","url":"https://www.nber.org/papers/w6996","geographic_scope":["France","United States"],"temporal_scope":"Données longitudinales historiques ; périodes propres à l'étude","domains":["DOMAIN-ECONOMY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS"],"methodology":"Analyse longitudinale comparative des trajectoires d'emploi des travailleurs rémunérés au salaire minimum en France et aux États-Unis.","limitations":["Les élasticités rapportées sont propres au dispositif, à la période et aux populations étudiées.","Les données historiques ne sont pas directement transposables au marché du travail actuel.","L'identification et la sélection dans l'emploi doivent être auditées dans le texte intégral."],"access_status":"abstract"}
