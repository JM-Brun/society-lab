description: "sources register — Society Lab"
sources:
  - {"id":"SOURCE-PARCOURSUP-BILAN-2026","title":"Parcoursup 2026 : des résultats stables dans un contexte de progression historique des candidatures","organization":"Ministère de l’Enseignement supérieur, de la Recherche et de l’Espace","source_type":"institutional_report","language":"fr","url":"https://www.enseignementsup-recherche.gouv.fr/fr/parcoursup-2026-des-resultats-stables-dans-un-contexte-de-progression-historique-des-candidatures-104400","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"temporal_scope":"Campagne Parcoursup 2026","methodology":"Bilan administratif de la procédure et indicateurs agrégés publiés par le ministère.","limitations":["Les indicateurs de fonctionnement ne suffisent pas à évaluer l'équité ou les effets causaux.","Les chiffres agrégés ne décrivent pas les trajectoires individuelles ni la réussite après admission."],"access_status":"open"}
  - {"id":"SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS","title":"Parcoursup 2026 : les propositions d’admission dans l’enseignement supérieur","organization":"SIES, Ministère de l’Enseignement supérieur","source_type":"scientific_study","language":"fr","url":"https://www.enseignementsup-recherche.gouv.fr/fr/parcoursup-2026-les-propositions-d-admission-dans-l-enseignement-superieur-104448","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"temporal_scope":"Campagne Parcoursup 2026","methodology":"Note statistique administrative sur les candidats néo-bacheliers et les propositions d'admission.","limitations":["Les taux d'offre et d'acceptation ne mesurent ni la qualité de l'orientation, ni la réussite en formation.","Vérifier les dénominateurs et catégories de candidats."],"access_status":"open"}
  - {"id":"SOURCE-DEPP-ETAT-ECOLE-2025","title":"L’état de l’École 2025","organization":"DEPP, ministère de l'Éducation nationale","source_type":"institutional_report","language":"fr","url":"https://www.education.gouv.fr/depp/l-etat-de-l-ecole-2025-468872","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"temporal_scope":"Édition 2025, indicateurs de différentes années","methodology":"Publication statistique annuelle composée de fiches thématiques et de séries chronologiques.","limitations":["Les indicateurs mobilisent des années de référence et populations différentes ; chaque fiche doit être lue séparément."],"access_status":"open"}
  - {"id":"SOURCE-INSEE-INEGALITES-SCOLAIRES-2025","title":"Inégalités sociales dans l’enseignement scolaire","organization":"INSEE","source_type":"institutional_report","language":"fr","url":"https://www.insee.fr/fr/statistiques/8612522","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-ISSUE-EQUITY","TAG-METHOD-QUANTITATIVE"],"temporal_scope":"Publication 2025","methodology":"Analyse statistique de données sur les acquis scolaires selon l'origine sociale.","limitations":["Les écarts descriptifs ne permettent pas à eux seuls d'identifier les mécanismes causaux ni l'effet propre des établissements."],"access_status":"open"}
  - {"id":"SOURCE-OECD-PISA-2022-FRANCE","title":"PISA 2022 Results: Country Note — France","organization":"OCDE","source_type":"institutional_report","language":"en","url":"https://www.oecd.org/en/publications/pisa-2022-results-volume-i-and-ii-country-notes_ed6fbcc5-en/france_8008535b-en.html","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-ISSUE-EQUITY","TAG-METHOD-COMPARATIVE"],"temporal_scope":"PISA 2022","methodology":"Enquête internationale standardisée auprès des élèves de 15 ans, avec questionnaires de contexte.","limitations":["PISA mesure des compétences à 15 ans et non l'ensemble des apprentissages ou la réussite dans le supérieur.","Les associations entre statut socio-économique et résultats ne démontrent pas seules une causalité."],"access_status":"open"}
  - {"id":"SOURCE-OECD-EAG-2025-FRANCE","title":"Regards sur l’éducation 2025 — Note pays France","organization":"OCDE","source_type":"institutional_report","language":"fr","url":"https://www.oecd.org/content/dam/oecd/fr/publications/reports/2025/09/education-at-a-glance-2025-country-notes_9749f4ff/france_0639c7fb/aca6dceb-fr.pdf","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-COMPARATIVE"],"temporal_scope":"Dernières années disponibles selon indicateur","methodology":"Indicateurs comparatifs internationaux harmonisés sur les systèmes éducatifs.","limitations":["Les définitions, années de référence et périmètres varient selon les indicateurs."],"access_status":"open"}
  - {"id":"SOURCE-EU-EDUCATION-MONITOR-2025-FRANCE","title":"Education and Training Monitor 2025 — France","organization":"Commission européenne","source_type":"institutional_report","language":"en","url":"https://op.europa.eu/webpub/eac/education-and-training-monitor/en/country-reports/france.html","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-COMPARATIVE"],"temporal_scope":"Indicateurs 2023-2025 selon disponibilité","methodology":"Rapport de suivi européen combinant indicateurs harmonisés et analyse de politiques éducatives.","limitations":["Les données agrégées européennes ne remplacent pas l'analyse des contextes nationaux."],"access_status":"open"}
  - {"id":"SOURCE-DEFENSEUR-DROITS-JEUNESSES-ORIGINE-2026","title":"Jeunesses et discriminations fondées sur l’origine : répondre à l’impératif d’égalité","organization":"Défenseur des droits","source_type":"institutional_report","language":"fr","url":"https://www.defenseurdesdroits.fr/sites/default/files/2026-02/Rapport%20-%20Jeunesses%20et%20discriminations%20fond%C3%A9es%20sur%20l%27origine.pdf","domains":["DOMAIN-EDUCATION","DOMAIN-MIGRATION","DOMAIN-SECURITY"],"tags":["TAG-ISSUE-EQUITY","TAG-EVIDENCE-SECONDARY"],"temporal_scope":"Rapport 2026, données d'enquêtes de périodes diverses","methodology":"Rapport institutionnel mobilisant enquêtes, travaux existants et analyses juridiques.","limitations":["Les expériences déclarées, les mesures de discrimination et les analyses juridiques doivent être distinguées.","Les constats relatifs à Parcoursup doivent être examinés à partir des études sous-jacentes."],"access_status":"open"}
  - {"id":"SOURCE-PARCOURSUP-OPEN-DATA-2025","title":"Parcoursup 2025 — vœux de poursuite d'études et de réorientation et réponses des établissements","organization":"Ministère de l’Enseignement supérieur — SIES","source_type":"primary_data","language":"fr","url":"https://data.enseignementsup-recherche.gouv.fr/explore/dataset/fr-esr-parcoursup/?flg=fr","geographic_scope":["France","Régions","Départements","Académies","Établissements"],"temporal_scope":"Campagne du 15 janvier au 10 septembre 2025","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY"],"methodology":"Données administratives Parcoursup par formation ; documentation méthodologique officielle associée.","limitations":["Hors apprentissage.","Certains indicateurs de taux d'accès et de répartition par baccalauréat ne sont pas recalculables à partir du fichier.","L'unité d'observation est la formation, avec des agrégats de candidats et d'admis ; ne pas traiter les lignes comme des individus."],"license":"Licence Ouverte / Open Licence (Etalab)","access_status":"open","notes":"Jeu de données documenté : 115 variables, 14 252 enregistrements, 1 015 200 candidats ; sous-ensemble de 652 800 néo-bacheliers."}
  - {"id":"SOURCE-PARCOURSUP-ADMISSION-REVIEW-2026","title":"Comment les formations examinent les candidatures ?","organization":"Parcoursup / Ministère de l’Enseignement supérieur","source_type":"other","language":"fr","url":"https://www.parcoursup.gouv.fr/candidater-sur-parcoursup/comment-les-formations-examinent-les-candidatures-1357","geographic_scope":["France"],"temporal_scope":"Procédure 2026, page mise à jour le 20 octobre 2026","domains":["DOMAIN-EDUCATION"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-STATUS-REVISED"],"methodology":"Présentation institutionnelle du processus d'examen des candidatures par les commissions d'examen des vœux et des rapports d'analyse publiés.","limitations":["Description officielle du fonctionnement ; ne constitue pas une évaluation indépendante des pratiques effectives.","Les critères annoncés et les rapports locaux doivent être examinés formation par formation."],"access_status":"open","notes":"La page indique que près de 19 000 rapports d'analyse des candidatures de la session 2026 sont accessibles depuis les fiches de formation."}
  - {"id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","title":"Évaluation de deux peines alternatives à l’incarcération : travail d’intérêt général et détention à domicile sous surveillance électronique","organization":"Cour des comptes","source_type":"institutional_report","language":"fr","url":"https://www.ccomptes.fr/sites/default/files/2025-03/20250304-Evaluation-2-peines-alternatives-a-l-incarceration.pdf","geographic_scope":["France"],"temporal_scope":"Évaluation publiée le 4 mars 2025 ; données et cohortes selon les indicateurs, notamment cohortes pénales 2016-2017","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"methodology":"Évaluation de politique publique combinant données administratives, enquêtes auprès de magistrats, tuteurs et responsables de postes, analyses statistiques et corrections économétriques des différences observables entre populations.","limitations":["La récidive est étudiée sur des cohortes antérieures à la publication ; les résultats ne sont pas automatiquement extrapolables aux pratiques actuelles.","Les caractéristiques individuelles non observées peuvent laisser subsister un biais de sélection ; les résultats économétriques ne valent pas expérimentation randomisée.","Les indicateurs de récidive (survenue, fréquence, gravité) doivent être distingués.","Le coût unitaire publié dépend du périmètre comptable retenu et ne constitue pas à lui seul une analyse complète de coût-efficacité ou de coût social.","L'annexe 7 exclut les coûts des juridictions, de nombreux partenaires et des structures d'accueil ; elle indique que les dépenses d'accueil sont partiellement compensées par le travail fourni.","Le flux TIG 2022 utilisé au dénominateur inclut les TNR ; le coût moyen de 1 862 € n'isole donc pas parfaitement le TIG autonome.","La comparaison territoriale plus complète porte sur deux SPIP seulement et ne permet pas de généraliser les écarts."],"access_status":"open","notes":"Source centrale du dossier : documente le recul du prononcé, les délais d'exécution, l'accompagnement, la récidive et les coûts estimés du TIG et de la DDSE. Revue P1 : contrôle détaillé de l'annexe 7, des coûts non intégrés, du temps de tutorat et des limites de comparaison des unités."}
  - {"id":"SOURCE-MINISTERE-JUSTICE-TIG-PRONONCE-2024","title":"Un prononcé du travail d’intérêt général en baisse depuis 2015","organization":"Ministère de la Justice, SDSE","source_type":"institutional_report","language":"fr","url":"https://www.justice.gouv.fr/documentation/etudes-et-statistiques/prononce-du-travail-dinteret-general-baisse-2015","geographic_scope":["France"],"temporal_scope":"Données de condamnations 2015-2022 ; publication 18 juillet 2024, mise à jour 8 janvier 2025","domains":["DOMAIN-SECURITY"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Statistiques administratives issues des condamnations pénales et du casier judiciaire national.","limitations":["Le nombre de TIG prononcés ne se confond pas avec le nombre de mesures suivies, commencées ou achevées.","Les catégories de TIG et leurs modalités de prononcé doivent être distinguées ; les évolutions agrégées ne démontrent pas leurs causes."],"access_status":"open","notes":"Le ministère recense 16 560 TIG prononcés en 2022 pour sanctionner des délits et une baisse de 34 % du prononcé entre 2015 et 2022."}
  - {"id":"SOURCE-MINISTERE-JUSTICE-TUTEURS-TIG-2024","title":"Les tuteurs de personnes majeures condamnées à une peine de travail d’intérêt général : enquête sur leurs profils, motivations et pratiques","organization":"Ministère de la Justice, SDSE","source_type":"institutional_report","language":"fr","url":"https://www.justice.gouv.fr/sites/default/files/2024-07/Tuteurs_de_tigistes_2023.pdf","geographic_scope":["France"],"temporal_scope":"Enquête auprès des tuteurs en poste en 2021 ; publication 22 juillet 2024","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-SURVEY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-QUALITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Enquête par questionnaire auprès d'un échantillon représentatif des tuteurs de personnes majeures en TIG ; données administratives de cadrage sur les tuteurs et organismes.","limitations":["Les effectifs décrivent le réseau de tuteurs recensés en 2021 et non nécessairement la capacité réellement mobilisable à une date ultérieure.","L'enquête sur les tuteurs ne mesure pas à elle seule l'effet causal de l'encadrement sur la récidive.","La disponibilité et la charge de travail des tuteurs peuvent varier fortement selon les territoires et organismes."],"access_status":"open","notes":"Le ministère recense 20 419 tuteurs dans 11 872 organismes en 2021 ; les tuteurs assurent leur mission sans compensation financière."}
  - {"id":"SOURCE-SENAT-EXECUTION-PEINES-2025","title":"L’exécution à la peine — 20 propositions pour mieux exécuter et donner du sens aux sanctions pénales","organization":"Sénat, Commission des lois","source_type":"institutional_report","language":"fr","url":"https://www.senat.fr/rap/r25-002/r25-00212.html","geographic_scope":["France"],"temporal_scope":"Rapport d'information déposé le 1er octobre 2025 ; données d'exécution 2024 notamment","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"methodology":"Rapport parlementaire fondé sur auditions, données administratives et analyse de l'exécution des sanctions pénales.","limitations":["Les données de 2024 citées concernent des mesures exécutées en tout ou partie et ne sont pas directement comparables aux seuls prononcés.","Les constats et propositions parlementaires doivent être distingués des résultats d'évaluation causale."],"access_status":"open","notes":"Le rapport indique que 28 500 TIG ont été exécutés en tout ou partie en 2024 ; 16 % ont été interrompus prématurément et 10 % n'ont pas pu commencer en raison d'un renvoi devant la justice."}
  - {"id":"SOURCE-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025","title":"Non-custodial sanctions and measures in the member states of the European Union: A comparative study","organization":"Penal Reform International; University of Coimbra; Hungarian Helsinki Committee","source_type":"institutional_report","language":"en","url":"https://www.penalreform.org/resource/non-custodial-sanctions-and-measures-eu-comparative-study/","geographic_scope":["European Union"],"temporal_scope":"Comparative study covering 22 EU Member States; national reports and practices as documented for the project","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Comparative synthesis based on country reports prepared by national experts in 22 EU Member States.","limitations":["Legal categories, sentencing stages and probation populations differ across countries; headline comparisons require harmonised denominators.","The study identifies implementation barriers but does not provide a single causal estimate of the effect of community service.","The report's policy orientation should be distinguished from its empirical country descriptions."],"access_status":"open","notes":"Identifies recurring implementation constraints: shortages of placements, probation capacity, waiting lists, limited awareness and net-widening risks."}
  - {"id":"SOURCE-WERMINK-COMMUNITY-SERVICE-RETRIBUTION-2023","title":"The price of retribution: evidence from the willingness to pay for short-term prison sentences compared to community service orders","organization":"Wermink, Been, Schuyt, van Wijck and Blokland; Journal of Experimental Criminology","source_type":"scientific_study","language":"en","url":"https://link.springer.com/article/10.1007/s11292-023-09583-9","geographic_scope":["Netherlands"],"temporal_scope":"All Dutch sentences in 2012; recidivism follow-up 2012-2018; published 2023, journal volume 2025","domains":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY"],"methodology":"Administrative sentencing and recidivism data; instrumental-variable approach exploiting variation associated with judicial assignment to estimate effects of short-term imprisonment versus community service.","limitations":["Instrumental-variable estimates are local to cases whose sentence is affected by the instrument and should not be generalised mechanically to all offenders or countries.","The study concerns Dutch short-term imprisonment and Dutch community service orders in a specific cohort, not the French autonomous TIG system.","Its cost comparison depends on Dutch accounting and institutional arrangements.","The result does not isolate general deterrence or public perceptions of punishment."],"access_status":"open","notes":"Finds short-term prison sentences increase recidivism relative to community service in the study's IV framework and are at least three times as costly per day from verdict onward."}
  - {"id":"SOURCE-HMI-PROBATION-UNPAID-WORK-EVIDENCE","title":"Unpaid work — evidence base for probation service delivery","organization":"HM Inspectorate of Probation","source_type":"institutional_report","language":"en","url":"https://hmiprobation.justiceinspectorates.gov.uk/our-research/evidence-base-probation-service/specific-types-of-delivery/unpaid-work/","geographic_scope":["England and Wales","Scotland","Northern Ireland"],"temporal_scope":"Evidence review updated 17 May 2021; cited studies mainly 2014-2019","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-ISSUE-EFFICIENCY"],"methodology":"Evidence synthesis of UK research, evaluations and probation inspection findings on unpaid work requirements.","limitations":["The inspectorate reports a lack of robust evidence demonstrating the impact of unpaid work on breach or reoffending.","Evidence on self-reported benefits, compliance and implementation quality is not equivalent to causal recidivism evidence.","The evidence base is dated and the UK institutional model differs from France."],"access_status":"open","notes":"Highlights prompt commencement, regular attendance, useful/rewarding work, tailoring, pro-social supervision and clear rules as implementation factors."}
  - {"id":"SOURCE-COMPARATIVE-SENTENCING-RATES-EUROPE-2025","title":"Comparative Studies of Sentencing: The First Four Decades","organization":"Journal of Law and Economics","source_type":"scientific_study","language":"en","url":"https://www.journals.uchicago.edu/doi/10.1086/739848","geographic_scope":["Europe"],"temporal_scope":"Comparative probation data 2018-2022 as reported in the article","domains":["DOMAIN-SECURITY"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE"],"methodology":"Comparative presentation of European sentencing and probation indicators, including community-service shares among probationers; table reports data attributed to Aebi et al. 2023.","limitations":["Denominator is probationers, not all convicted persons or all sanctions imposed.","Country legal categories and probation systems differ; values are not direct measures of TIG sentencing propensity or effectiveness.","The table's underlying source and definitions should be checked before any causal or policy ranking."],"access_status":"open","notes":"Reports 2022 shares of probationers serving community service: Netherlands 56.2%, Spain 60.7%, France 15.3%, Finland 33.5%, Norway 40.7%, Scotland 27.1%, England and Wales 9.0%."}
  - {"id":"SOURCE-ATIGIP-ANNUAIRE-REFERENTS-TIG-2026","title":"Annuaire des référents territoriaux TIG — mise à jour 16 septembre 2026","organization":"ATIGIP, ministère de la Justice","source_type":"primary_data","language":"fr","url":"https://atigip.justice.gouv.fr/wp-content/uploads/2026/02/annuaire-RT.pdf","geographic_scope":["France","Pays de la Loire","Loire-Atlantique"],"temporal_scope":"Annuaire diffusé en 2026, mise à jour indiquée au 16 septembre 2026","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-DEPARTMENTAL"],"methodology":"Annuaire administratif des référents territoriaux et de leurs départements de compétence.","limitations":["Document de contact, non mesure de capacité ou d'activité locale.","Coordonnées susceptibles d'évoluer."],"access_status":"open","notes":"Identifie Jeanne-Marie Jobert comme référente territoriale TIG pour la Loire-Atlantique, au SPIP à Saint-Herblain."}
  - {"id":"SOURCE-IGJ-ETATS-GENERAUX-INSERTION-PROBATION-2026","title":"Conclusions des États généraux de l'insertion et de la probation","organization":"Inspection générale de la justice; ministère de la Justice","source_type":"institutional_report","language":"fr","url":"https://www.justice.gouv.fr/sites/default/files/2026-02/rapport_conclusions_etats_generaux_insertion_probation.pdf","geographic_scope":["France"],"temporal_scope":"Rapport publié en janvier 2026","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-LEVEL-NATIONAL"],"methodology":"Travaux institutionnels et consultations de professionnels de l'insertion et de la probation.","limitations":["Diagnostic et propositions, pas évaluation causale.","Les chiffres nationaux ne renseignent pas la disponibilité locale."],"access_status":"open","notes":"L'offre nationale recensée est passée de 18 000 à 30 000 postes entre 2018 et 2025 ; répartition territoriale et adaptabilité restent à améliorer."}
  - {"id":"SOURCE-ATIGIP-TIG360-PLATFORM","title":"TIG 360° : plateforme numérique de gestion et de suivi du TIG","organization":"ATIGIP, ministère de la Justice","source_type":"other","language":"fr","url":"https://atigip.justice.gouv.fr/tig/tig-360/","geographic_scope":["France","Loire-Atlantique"],"temporal_scope":"Plateforme développée depuis 2019 ; page consultée en novembre 2026","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"methodology":"Description institutionnelle des fonctionnalités de la plateforme.","limitations":["Données locales détaillées non librement accessibles.","Un poste recensé n'est pas nécessairement vacant, adapté ou mobilisable rapidement."],"access_status":"open","notes":"Recense structures, postes et places, permet pré-réservation et suivi par les acteurs autorisés."}
  - {"id":"SOURCE-ATIGIP-SAINT-HERBLAIN-TIG-PARTNERSHIP","title":"La Ville de Saint-Herblain participe à la justice de proximité par l'accueil de TIG","organization":"Ville de Saint-Herblain; ATIGIP","source_type":"institutional_report","language":"fr","url":"https://www.saint-herblain.fr/actualites/la-ville-participe-a-la-justice-de-proximite/","geographic_scope":["France","Pays de la Loire","Loire-Atlantique","Saint-Herblain"],"temporal_scope":"Retour d'expérience publié vers 2023 ; données 2022","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-MUNICIPAL"],"methodology":"Retour d'expérience municipal sur l'accueil de personnes condamnées à un TIG.","limitations":["Cas isolé et données anciennes.","Ne fournit ni résultats de récidive ni coût complet."],"access_status":"open","notes":"La Ville rapporte 200 heures de TIG accueillies en 2022 et décrit missions, tutorat et bilan."}
  - {"id":"SOURCE-CAPATLANTIQUE-CISPD-2024-2028","title":"Stratégie territoriale CISPD 2024-2028","organization":"CapAtlantique La Baule-Guérande Agglo","source_type":"law_or_policy","language":"fr","url":"https://www.cap-atlantique.fr/fileadmin/Cap_Atlantique/Actualites/CISPD/strat%C3%A9gie_territoriale_cispd-2024-2028.pdf","geographic_scope":["France","Pays de la Loire","Loire-Atlantique","CapAtlantique La Baule-Guérande Agglo"],"temporal_scope":"Stratégie 2024-2028 ; action TIG annoncée 2026-2027","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-LOCAL"],"methodology":"Document de stratégie territoriale et plan d'action du CISPD.","limitations":["Engagement programmatique, pas preuve de réalisation.","Ne représente qu'une partie du département."],"access_status":"open","notes":"Prévoit d'identifier postes et tuteurs, consolider les places existantes et en ouvrir de nouvelles."}
  - {"id":"SOURCE-MINJUSTICE-TIG-47000-PLACES-2026","title":"Développement des partenariats pour accueillir des personnes condamnées à un TIG — 47 000 places","organization":"Ministère de la Justice","source_type":"institutional_report","language":"fr","url":"https://www.justice.gouv.fr/actualites/espace-presse/travail-dinteret-general-ladministration-penitentiaire-signe-convention-faciliter-son","geographic_scope":["France"],"temporal_scope":"Publication 2026","domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"methodology":"Communication ministérielle sur le stock national et la répartition des places.","limitations":["Places recensées non assimilables aux places libres et mobilisables.","Donnée agrégée masquant les écarts territoriaux."],"access_status":"open","notes":"Annonce 47 000 places nationales, dont 65 % portées par les collectivités territoriales."}
  - {"id":"SOURCE-INSEE-SMIC-SERIES-2026","title":"Salaire minimum interprofessionnel de croissance — données annuelles 1980-2026","organization":"INSEE","publication_date":"2026-09-09","source_type":"primary_data","language":"fr","url":"https://www.insee.fr/fr/statistiques/1375188","geographic_scope":["France hors Mayotte"],"temporal_scope":"1980-2026 ; montants et pouvoir d'achat selon disponibilité","domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"methodology":"Série statistique officielle compilant les montants légaux du SMIC et les indicateurs de pouvoir d'achat issus notamment des enquêtes Dares/Acemo et de l'INSEE.","limitations":["Les séries de montants, pouvoir d'achat et bénéficiaires ont des unités et champs distincts.","Les moyennes annuelles ne décrivent pas les effets individuels ou les revenus disponibles des ménages."],"access_status":"open","notes":"Source de référence pour les montants et séries longues ; vérifier la note méthodologique de chaque indicateur."}
