version: 1
description: "hypotheses register — Society Lab"
hypotheses:
  - {"id":"HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","statement":"Les écarts d'accès et de réussite dans l'enseignement supérieur résultent en partie de mécanismes cumulatifs qui se forment en amont de Parcoursup.","domain_ids":["DOMAIN-EDUCATION"],"mechanism":"Les différences précoces d'acquis et de ressources influencent les choix de filières, les spécialités, les dossiers, les stratégies de vœux et les conditions de réussite.","supporting_study_ids":["STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","STUDY-OECD-PISA-2022-FRANCE"],"challenging_study_ids":[],"alternative_explanations":["Différences de préférences et aspirations non réductibles aux ressources sociales.","Effets des capacités d'accueil, de la géographie de l'offre et des choix individuels."],"status":"under_examination","confidence_rationale":"Hypothèse cohérente avec des écarts descriptifs, mais chaîne causale complète non établie."}
  - {"id":"HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","statement":"Des taux élevés de propositions d'admission peuvent coexister avec des inégalités d'accès aux formations les plus demandées, de qualité de l'appariement et de trajectoires après admission.","domain_ids":["DOMAIN-EDUCATION"],"mechanism":"Les indicateurs globaux agrègent des formations aux sélectivités, capacités, localisations et débouchés différents.","supporting_study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"challenging_study_ids":[],"alternative_explanations":["Une offre de places suffisante peut réduire certaines inégalités d'accès.","Les écarts peuvent provenir des stratégies de vœux ou de la préparation plutôt que de l'affectation seule."],"status":"under_examination","confidence_rationale":"À tester par formation, origine sociale, type de bac, territoire, rang de proposition et inscription effective."}
  - {"id":"HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS","statement":"La réception et l'acceptation d'une proposition Parcoursup ne constituent pas des mesures suffisantes de la réussite dans l'enseignement supérieur.","domain_ids":["DOMAIN-EDUCATION"],"mechanism":"La réussite dépend aussi de l'adéquation formation-projet, des conditions matérielles, de la préparation académique, de l'accompagnement et des possibilités de réorientation.","supporting_study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"challenging_study_ids":[],"alternative_explanations":["Les taux d'admission restent des indicateurs pertinents du fonctionnement de la procédure, sans mesurer la réussite finale."],"status":"under_examination","confidence_rationale":"Distinction conceptuelle forte ; quantification à réaliser avec les données de suivi des cohortes."}
  - {"id":"HYPOTHESIS-TIG-LOCAL-CAPACITY-BOTTLENECK","statement":"Le sous-recours au TIG est en partie produit par une contrainte d'offre et de coordination locale : les juridictions ne peuvent prononcer massivement une peine dont les postes, tuteurs, horaires, lieux et modalités de suivi ne sont pas immédiatement disponibles.","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"mechanism":"L'offre de postes dépend d'organismes publics et associatifs, du temps d'encadrement, de l'adéquation entre tâches et profils, de la mobilité des condamnés et de la coordination avec les SPIP. Une offre insuffisante ou mal distribuée réduit la possibilité de prononcer une peine exécutable rapidement.","supporting_study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"challenging_study_ids":[],"alternative_explanations":["Le recul peut aussi résulter d'une évolution des pratiques de poursuite, de la composition des condamnés et de la concurrence d'autres peines ou mesures.","Une offre de postes plus abondante ne garantit pas que les magistrats jugent le TIG adapté à chaque situation."],"status":"under_examination","confidence_rationale":"Hypothèse cohérente avec les constats de délais et de dépendance aux organismes d'accueil ; la contribution causale de chaque contrainte reste à quantifier."}
  - {"id":"HYPOTHESIS-TIG-DELAY-WEAKENS-SANCTION","statement":"Le délai important entre le jugement et l'exécution du TIG réduit sa lisibilité, sa crédibilité et potentiellement son effet dissuasif et responsabilisant.","domain_ids":["DOMAIN-SECURITY"],"mechanism":"La distance temporelle entre l'infraction et la sanction peut affaiblir le lien perçu entre comportement et conséquence, réduire la saillance de la sanction et rendre l'expérience moins intelligible pour la personne condamnée et la victime.","supporting_study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"challenging_study_ids":[],"alternative_explanations":["La dissuasion dépend aussi de la certitude de détection et d'exécution, de la perception de la sanction et des caractéristiques de la personne ; le délai seul n'explique pas le comportement.","Le rapport documente les délais mais ne mesure pas directement leur effet causal sur la récidive."],"status":"under_examination","confidence_rationale":"Mécanisme plausible et cohérent avec l'exigence de célérité de la réponse pénale ; effet propre non identifié dans les données consultées."}
  - {"id":"HYPOTHESIS-TIG-REINSERTION-UNDERDELIVERED","statement":"Le TIG français est insuffisamment articulé à un accompagnement individualisé pour transformer systématiquement la peine en parcours de responsabilisation et de réinsertion.","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"mechanism":"Une mission de travail ponctuelle, sans diagnostic ni orientation vers les services d'insertion, peut remplir une fonction de sanction et de réparation collective sans agir sur les facteurs criminogènes ou les difficultés sociales qui contribuent à la récidive.","supporting_study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"challenging_study_ids":[],"alternative_explanations":["Le TIG peut avoir une fonction punitive, réparatrice ou de responsabilisation sans devoir devenir un programme complet de réinsertion.","L'intensité d'accompagnement utile dépend du profil et du risque de récidive ; un accompagnement uniforme peut être coûteux et inadapté."],"status":"under_examination","confidence_rationale":"La faiblesse des orientations vers les acteurs de l'insertion est documentée ; le lien causal entre intensité d'accompagnement et récidive doit être évalué."}
  - {"id":"HYPOTHESIS-TIG-COST-ADVANTAGE-CONDITIONAL","statement":"Le TIG peut constituer une alternative économiquement avantageuse à la détention pour certains profils et infractions, mais son avantage réel dépend de l'addition des coûts d'organisation, d'encadrement et de suivi et des coûts de détention effectivement évités.","domain_ids":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"mechanism":"Un coût administratif direct inférieur ne devient un gain net pour les finances publiques et la société que si le TIG remplace effectivement une incarcération ou une autre mesure coûteuse, sans transférer des charges excessives aux collectivités, associations, victimes ou proches.","supporting_study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"challenging_study_ids":[],"alternative_explanations":["Le TIG peut remplacer une peine qui n'aurait pas été exécutée en prison, auquel cas il ne génère pas nécessairement d'économie de détention.","La DDSE, le sursis probatoire, l'amende ou les alternatives aux poursuites peuvent être des comparateurs plus pertinents que la prison selon le cas."],"status":"under_examination","confidence_rationale":"Le coût unitaire publié est inférieur à celui de la DDSE, mais les coûts complets et le scénario contrefactuel doivent être établis."}
  - {"id":"HYPOTHESIS-TIG-NATIONAL-STOCK-MASKS-LOCAL-AVAILABILITY","statement":"La hausse du nombre national de postes TIG recensés peut coexister avec une capacité locale insuffisante : un stock agrégé ne garantit ni disponibilité immédiate, ni proximité, ni compatibilité avec les profils.","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"mechanism":"La capacité dépend de la distribution géographique, des créneaux, du tutorat, des tâches accessibles, de la mobilité et de la coordination SPIP.","supporting_study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"challenging_study_ids":[],"alternative_explanations":["Les pratiques de prononcé, le consentement et les choix judiciaires peuvent davantage contraindre le recours.","Les délais peuvent relever des procédures plutôt que du manque de places."],"status":"under_examination","confidence_rationale":"Le rapport IGJ signale les enjeux de répartition et d'adaptabilité ; à vérifier avec les données TIG 360° départementales."}
  - {"id":"HYPOTHESIS-TIG-LOCAL-PARTNERSHIP-LOW-COST-EXPANSION","statement":"Des partenariats ciblés avec collectivités et structures d'insertion pourraient augmenter les postes TIG utiles, à condition de reconnaître le tutorat et de ne pas remplacer des emplois rémunérés.","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"mechanism":"Les collectivités et structures ESS ont des missions d'entretien, réemploi, logistique et solidarité pouvant être découpées en tâches supervisables ; le coût réel inclut encadrement, équipements, assurances, déplacements et sécurité.","supporting_study_ids":["STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE","STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"challenging_study_ids":[],"alternative_explanations":["Les structures d'insertion peuvent manquer de capacité d'encadrement.","Les missions peuvent être trop éloignées ou incompatibles avec horaires et profils."],"status":"under_examination","confidence_rationale":"Des précédents montrent la faisabilité, mais aucun calcul local de coût marginal ou d'impact n'est disponible."}
  - {"id":"HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","statement":"Les effets d'une hausse du SMIC sur l'emploi sont hétérogènes et dépendent davantage de l'exposition sectorielle, de la productivité, des marges et des conditions locales que d'une élasticité unique applicable à toute l'économie.","domain_ids":["DOMAIN-ECONOMY"],"mechanism":"Les entreprises ajustent par des combinaisons variables de prix, marges, heures, embauches, organisation, investissement et productivité ; ces marges diffèrent selon les secteurs, la concurrence et les territoires.","supporting_study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","STUDY-COTTET-PAYROLL-TAX-2024","STUDY-ALBERTINI-POIRIER-TERRIAU-2025"],"challenging_study_ids":[],"alternative_explanations":["Les effets agrégés peuvent être faibles même si certains groupes subissent des effets négatifs concentrés.","La conjoncture et les autres politiques de l'emploi peuvent masquer ou amplifier les effets observés."],"status":"under_examination","confidence_rationale":"Mécanismes économiques plausibles et hétérogénéité documentée ; la contribution causale propre d'une hausse donnée doit être estimée avec des stratégies d'identification adaptées."}
  - {"id":"HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","statement":"Une progression rapide du SMIC peut comprimer les écarts entre niveaux de qualification et ralentir la progression des grilles salariales si les minima conventionnels et les rémunérations intermédiaires ne sont pas réajustés.","domain_ids":["DOMAIN-ECONOMY"],"mechanism":"Le relèvement du plancher rapproche les rémunérations proches du minimum ; les entreprises et branches peuvent réviser les grilles, les primes ou les classifications avec des délais et des coûts variables.","supporting_study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","STUDY-INSEE-SMIC-MEAN-WAGE-2012","STUDY-INSEE-MINIMUM-WAGE-RIGIDITY-2019"],"challenging_study_ids":[],"alternative_explanations":["La compression peut être temporaire si les négociations salariales rétablissent les écarts.","Les progressions de carrière dépendent aussi des compétences, de la formation, des mobilités et de la structure des emplois."],"status":"under_examination","confidence_rationale":"La compression de la distribution salariale est décrite par l'OCDE ; ses effets sur les trajectoires individuelles et la mobilité doivent être mesurés séparément."}
  - {"id":"HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY","statement":"Une hausse du SMIC améliore le pouvoir d'achat horaire des salariés concernés à emploi et durée du travail constants, mais son effet sur la pauvreté et le niveau de vie des ménages est plus limité et hétérogène.","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"mechanism":"Le revenu disponible dépend du nombre d'heures, de la composition du ménage, des autres revenus, des prestations, de la fiscalité et du coût du logement et des transports.","supporting_study_ids":[],"challenging_study_ids":[],"alternative_explanations":["Une hausse peut bénéficier à des salariés de ménages non pauvres et laisser sans effet direct les ménages modestes sans salarié au SMIC.","Une réduction d'heures ou une hausse de prix peut atténuer le gain réel."],"status":"under_examination","confidence_rationale":"La distinction entre salaire horaire et niveau de vie est conceptuellement robuste ; l'ampleur distributive nette exige une microsimulation et des données de ménages."}
  - {"id":"HYPOTHESIS-SMIC-RELIEF-LOW-WAGE-TRAP","statement":"Le profil des allègements patronaux concentrés sur les bas salaires peut soutenir l'emploi au niveau du SMIC tout en créant des désincitations à la progression salariale au-delà de certains seuils.","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"mechanism":"La diminution rapide des allègements à mesure que le salaire augmente peut accroître le coût marginal d'une augmentation salariale et réduire le gain net pour l'employeur ; les taux marginaux et les comportements doivent être observés.","supporting_study_ids":["STUDY-EXPERTS-SMIC-2024-RELIEFS","STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024"],"challenging_study_ids":[],"alternative_explanations":["Les travaux empiriques ne trouvent pas tous une concentration généralisée au voisinage des seuils.","Les contraintes de compétences, de productivité et de négociation peuvent expliquer les faibles progressions salariales indépendamment des allègements."],"status":"under_examination","confidence_rationale":"Risque identifié dans les rapports institutionnels, mais ampleur et généralisation empiriques nuancées ; à tester sur trajectoires salariales individuelles."}
