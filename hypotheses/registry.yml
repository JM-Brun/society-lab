description: "hypotheses register — Society Lab"
hypotheses:
  - {"id":"HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","statement":"Les écarts d'accès et de réussite dans l'enseignement supérieur résultent en partie de mécanismes cumulatifs qui se forment en amont de Parcoursup.","domain_ids":["DOMAIN-EDUCATION"],"mechanism":"Les différences précoces d'acquis et de ressources influencent les choix de filières, les spécialités, les dossiers, les stratégies de vœux et les conditions de réussite.","supporting_study_ids":["STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","STUDY-OECD-PISA-2022-FRANCE"],"challenging_study_ids":[],"alternative_explanations":["Différences de préférences et aspirations non réductibles aux ressources sociales.","Effets des capacités d'accueil, de la géographie de l'offre et des choix individuels."],"status":"under_examination","confidence_rationale":"Hypothèse cohérente avec des écarts descriptifs, mais chaîne causale complète non établie."}
  - {"id":"HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","statement":"Des taux élevés de propositions d'admission peuvent coexister avec des inégalités d'accès aux formations les plus demandées, de qualité de l'appariement et de trajectoires après admission.","domain_ids":["DOMAIN-EDUCATION"],"mechanism":"Les indicateurs globaux agrègent des formations aux sélectivités, capacités, localisations et débouchés différents.","supporting_study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"challenging_study_ids":[],"alternative_explanations":["Une offre de places suffisante peut réduire certaines inégalités d'accès.","Les écarts peuvent provenir des stratégies de vœux ou de la préparation plutôt que de l'affectation seule."],"status":"under_examination","confidence_rationale":"À tester par formation, origine sociale, type de bac, territoire, rang de proposition et inscription effective."}
  - {"id":"HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS","statement":"La réception et l'acceptation d'une proposition Parcoursup ne constituent pas des mesures suffisantes de la réussite dans l'enseignement supérieur.","domain_ids":["DOMAIN-EDUCATION"],"mechanism":"La réussite dépend aussi de l'adéquation formation-projet, des conditions matérielles, de la préparation académique, de l'accompagnement et des possibilités de réorientation.","supporting_study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"challenging_study_ids":[],"alternative_explanations":["Les taux d'admission restent des indicateurs pertinents du fonctionnement de la procédure, sans mesurer la réussite finale."],"status":"under_examination","confidence_rationale":"Distinction conceptuelle forte ; quantification à réaliser avec les données de suivi des cohortes."}
