  - {"id":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","title":"Parcoursup et l'égalité des chances dans le système éducatif français","summary":"Étude de la chaîne reliant les acquis scolaires, l'orientation, l'accès au supérieur et la réussite étudiante. Parcoursup est le premier terrain d'observation, sans être assimilé à l'ensemble du système éducatif.","status":"researching","domain_ids":["DOMAIN-EDUCATION"],"question":"Dans quelle mesure le système éducatif français permet-il une égalité réelle des chances, de la formation des acquis jusqu'à l'accès à l'enseignement supérieur et à la réussite dans les études ?","geographic_scope":["France"],"temporal_scope":"Priorité aux données 2015-2026, avec comparaisons européennes/internationales lorsque les définitions sont compatibles.","claim_ids":["CLAIM-PARCOURSUP-2026-APPLICANTS","CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","CLAIM-PISA-2022-SOCIOECONOMIC-GAP","CLAIM-INSEE-EARLY-SOCIAL-GAPS","CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","CLAIM-PARCOURSUP-CEV-LOCAL-CRITERIA","CLAIM-PARCOURSUP-CEV-REPORTS-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026","STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","STUDY-OECD-PISA-2022-FRANCE","STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","STUDY-PARCOURSUP-FORMATION-OPEN-DATA-2025"],"hypothesis_ids":["HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
  - {"id":"DOSSIER-TIG-EFFECTIVENESS-AND-UNDERUSE","title":"Travaux d’intérêt général : efficacité pénale, coûts et freins au déploiement en France","summary":"Évalue pourquoi le TIG demeure peu mobilisé malgré son coût direct relativement faible et son potentiel de sanction en milieu ouvert. Distingue récidive, fréquence et gravité des réitérations, dissuasion, réparation, insertion, capacité opérationnelle, délais, coûts complets et effets sur l'incarcération.","status":"researching","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"question":"Pourquoi les travaux d'intérêt général sont-ils relativement peu prononcés en France, et dans quelles conditions peuvent-ils constituer une sanction crédible, efficace et économiquement pertinente par rapport à l'incarcération ou à d'autres peines ?","geographic_scope":["France","Europe","Pays de la Loire","Loire-Atlantique","Nantes Métropole","Saint-Herblain","CapAtlantique La Baule-Guérande Agglo"],"temporal_scope":"Données 2015-2026 ; comparaison internationale et déclinaisons territoriales selon la compatibilité des définitions.","claim_ids":["CLAIM-TIG-PRONOUNCED-DOWN-2015-2022","CLAIM-TIG-EXECUTION-DELAY-2025","CLAIM-TIG-RECIDIVISM-5Y-2025","CLAIM-TIG-UNIT-COST-2025","CLAIM-TIG-TUTORS-NETWORK-2021","CLAIM-EU-COMMUNITY-SERVICE-PROBATION-SHARE-2022","CLAIM-NETHERLANDS-COMMUNITY-SERVICE-LOWER-RECIDIVISM-IV-2023","CLAIM-UK-UNPAID-WORK-IMPLEMENTATION-FACTORS-2021","CLAIM-TIG-LOCAL-REFERENT-LOIRE-ATLANTIQUE-2026","CLAIM-TIG-SAINT-HERBLAIN-200-HOURS-2022","CLAIM-CAPATLANTIQUE-TIG-PLAN-2026-2027","CLAIM-TIG-NATIONAL-POSTS-2018-2025","CLAIM-TIG-RECIDIVISM-RAW-5Y-2010","CLAIM-TIG-RECIDIVISM-ADJUSTED-5Y","CLAIM-TIG-RECIDIVISM-PRISON-SENTENCE-10Y","CLAIM-TIG-RECIDIVISM-CONVICTION-COUNT-10Y","CLAIM-TIG-HOST-ORGANISATIONS-COSTS-EXCLUDED-2025","CLAIM-TIG-TUTOR-TIME-100H-2025","CLAIM-TIG-COST-PRISON-COMPARISON-UNIT-2022","CLAIM-TIG-TERRITORIAL-COST-DDSE-2022","CLAIM-TIG-SPIP-ASSIGNMENT-DELAY-2023-2024","CLAIM-NE