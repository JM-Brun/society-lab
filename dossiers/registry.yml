dossiers:
  - {"id":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","title":"Parcoursup et l'égalité des chances dans le système éducatif français","summary":"Étude de la chaîne reliant les acquis scolaires, l'orientation, l'accès au supérieur et la réussite étudiante. Parcoursup est le premier terrain d'observation, sans être assimilé à l'ensemble du système éducatif.","status":"researching","domain_ids":["DOMAIN-EDUCATION"],"question":"Dans quelle mesure le système éducatif français permet-il une égalité réelle des chances, de la formation des acquis jusqu'à l'accès à l'enseignement supérieur et à la réussite dans les études ?","geographic_scope":["France"],"temporal_scope":"Priorité aux données 2015-2026, avec comparaisons européennes/internationales lorsque les définitions sont compatibles.","claim_ids":["CLAIM-PARCOURSUP-2026-APPLICANTS","CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","CLAIM-PISA-2022-SOCIOECONOMIC-GAP","CLAIM-INSEE-EARLY-SOCIAL-GAPS","CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","CLAIM-PARCOURSUP-CEV-LOCAL-CRITERIA","CLAIM-PARCOURSUP-CEV-REPORTS-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026","STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","STUDY-OECD-PISA-2022-FRANCE","STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","STUDY-PARCOURSUP-FORMATION-OPEN-DATA-2025"],"hypothesis_ids":["HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
  - {"id":"DOSSIER-TIG-EFFECTIVENESS-AND-UNDERUSE","title":"Travaux d’intérêt général : efficacité pénale, coûts et freins au déploiement en France","summary":"Évalue pourquoi le TIG demeure peu mobilisé malgré son coût direct relativement faible et son potentiel de sanction en milieu ouvert. Distingue récidive, fréquence et gravité des réitérations, dissuasion, réparation, insertion, capacité opérationnelle, délais, coûts complets et effets sur l'incarcération.","status":"researching","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"question":"Pourquoi les travaux d'intérêt général sont-ils relativement peu prononcés en France, et dans quelles conditions peuvent-ils constituer une sanction crédible, efficace et économiquement pertinente par rapport à l'incarcération ou à d'autres peines ?","geographic_scope":["France","Europe","Pays de la Loire","Loire-Atlantique","Nantes Métropole","Saint-Herblain","CapAtlantique La Baule-Guérande Agglo"],"temporal_scope":"Données 2015-2026 ; comparaison internationale et déclinaisons territoriales selon la compatibilité des définitions.","claim_ids":["CLAIM-TIG-PRONOUNCED-DOWN-2015-2022","CLAIM-TIG-EXECUTION-DELAY-2025","CLAIM-TIG-RECIDIVISM-5Y-2025","CLAIM-TIG-UNIT-COST-2025","CLAIM-TIG-TUTORS-NETWORK-2021","CLAIM-EU-COMMUNITY-SERVICE-PROBATION-SHARE-2022","CLAIM-NETHERLANDS-COMMUNITY-SERVICE-LOWER-RECIDIVISM-IV-2023","CLAIM-UK-UNPAID-WORK-IMPLEMENTATION-FACTORS-2021","CLAIM-TIG-LOCAL-REFERENT-LOIRE-ATLANTIQUE-2026","CLAIM-TIG-SAINT-HERBLAIN-200-HOURS-2022","CLAIM-CAPATLANTIQUE-TIG-PLAN-2026-2027","CLAIM-TIG-NATIONAL-POSTS-2018-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025","STUDY-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025","STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023","STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025","STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021","STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026","STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE"],"hypothesis_ids":["HYPOTHESIS-TIG-LOCAL-CAPACITY-BOTTLENECK","HYPOTHESIS-TIG-DELAY-WEAKENS-SANCTION","HYPOTHESIS-TIG-REINSERTION-UNDERDELIVERED","HYPOTHESIS-TIG-COST-ADVANTAGE-CONDITIONAL","HYPOTHESIS-TIG-NATIONAL-STOCK-MASKS-LOCAL-AVAILABILITY","HYPOTHESIS-TIG-LOCAL-PARTNERSHIP-LOW-COST-EXPANSION"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
  - {"id":"DOSSIER-SMIC-FRANCE-TRADEOFFS","title":"Augmenter le SMIC en France : pouvoir d'achat, emploi, salaires et finances publiques","summary":"Examine contradictoirement les effets du salaire minimum sur le pouvoir d'achat, l'emploi, les inégalités, la progression salariale, les prix, la productivité et les finances publiques ; articule indexation, coups de pouce, allègements, prime d'activité et comparaisons territoriales.","status":"researching","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE","DOMAIN-INSTITUTIONS"],"question":"Dans quelles conditions une hausse du SMIC au-delà de l'indexation légale améliore-t-elle durablement le niveau de vie des travailleurs modestes sans dégrader excessivement l'emploi, la progression salariale, la compétitivité, la productivité et les finances publiques ?","geographic_scope":["France hors Mayotte","Europe","Pays de la Loire","Loire-Atlantique","Nantes Métropole","Nantes","Île de Nantes"],"temporal_scope":"Séries longues depuis 1990 ; attention particulière à 2021-2026 ; comparaisons internationales selon compatibilité des définitions.","claim_ids":["CLAIM-SMIC-2026-JUNE-AMOUNT","CLAIM-SMIC-2024-DIRECT-BENEFICIARIES","CLAIM-SMIC-2026-DIRECT-BENEFICIARIES","CLAIM-SMIC-2024-GLOBAL-WAGE-DISTRIBUTION","CLAIM-SMIC-2025-REAL-PURCHASING-POWER","CLAIM-SMIC-HIGH-RELATIVE-LEVEL","CLAIM-SMIC-WAGE-PROPAGATION","CLAIM-SMIC-EXEMPTIONS-EMPLOYMENT-COUNTERFACTUAL","CLAIM-SMIC-EXEMPTIONS-COST-2024"],"study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","STUDY-EXPERTS-SMIC-2025","STUDY-EXPERTS-SMIC-2024-RELIEFS","STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024","STUDY-INSEE-SMIC-MEAN-WAGE-2012","STUDY-INSEE-MINIMUM-WAGE-RIGIDITY-2019","STUDY-ALBERTINI-POIRIER-TERRIAU-2025","STUDY-COTTET-PAYROLL-TAX-2024"],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY","HYPOTHESIS-SMIC-RELIEF-LOW-WAGE-TRAP"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EQUITY","TAG-ISSUE-TRADEOFFS","TAG-ISSUE-EFFICIENCY","TAG-METHOD-COMPARATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-HISTORICAL-EPISODES","title":"Historique des revalorisations du SMIC en France : épisodes, effets et contre-effets","summary":"Étude historique des revalorisations depuis 1970, distinguant gains réels, diffusion salariale, emploi, compression, retards de grilles et limites causales ; comprend une synthèse intermédiaire et un protocole de quantification reproductible.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Dans quels épisodes les revalorisations du SMIC ont-elles amélioré le niveau de vie, pour qui, et quels coûts ou effets secondaires ont été observés ?","geographic_scope":["France"],"temporal_scope":"1970–2026 ; études et données selon leurs périodes propres","claim_ids":[],"study_ids":[],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY"],"concept_ids":[],"last_reviewed":"2026-11-14","tags":["TAG-ISSUE-TRADEOFFS","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
