  - {"id":"DOSSIER-SMIC-FRANCE-TRADEOFFS","title":"Augmenter le SMIC en France : pouvoir d'achat, emploi, salaires et finances publiques","summary":"Examine contradictoirement les effets du salaire minimum sur le pouvoir d'achat, l'emploi, les inégalités, la progression salariale, les prix, la productivité et les finances publiques ; articule indexation, coups de pouce, allègements, prime d'activité et comparaisons territoriales.","status":"researching","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE","DOMAIN-INSTITUTIONS"],"question":"Dans quelles conditions une hausse du SMIC au-delà de l'indexation légale améliore-t-elle durablement le niveau de vie des travailleurs modestes sans dégrader excessivement l'emploi, la progression salariale, la compétitivité, la productivité et les finances publiques ?","geographic_scope":["France hors Mayotte","Europe","Pays de la Loire","Loire-Atlantique","Nantes Métropole","Nantes","Île de Nantes"],"temporal_scope":"Séries longues depuis 1990 ; attention particulière à 2021-2026 ; comparaisons internationales selon compatibilité des définitions.","claim_ids":["CLAIM-SMIC-2026-JUNE-AMOUNT","CLAIM-SMIC-2024-DIRECT-BENEFICIARIES","CLAIM-SMIC-2026-DIRECT-BENEFICIARIES","CLAIM-SMIC-2024-GLOBAL-WAGE-DISTRIBUTION","CLAIM-SMIC-2025-REAL-PURCHASING-POWER","CLAIM-SMIC-HIGH-RELATIVE-LEVEL","CLAIM-SMIC-WAGE-PROPAGATION","CLAIM-SMIC-EXEMPTIONS-EMPLOYMENT-COUNTERFACTUAL","CLAIM-SMIC-EXEMPTIONS-COST-2024","CLAIM-SMIC-EXEMPTIONS-TOTAL-2024-HCREP","CLAIM-SMIC-EXEMPTIONS-EXPERTS-75BN-2024","CLAIM-SMIC-COTTET-MW-JOBS-1995-1999","CLAIM-SMIC-COTTET-FIRM-GROWTH-1995-1997","CLAIM-SMIC-ALBERTINI-5PCT-MW-EMPLOYMENT","CLAIM-SMIC-ALBERTINI-5PCT-MW-FISCAL-SURPLUS"],"study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","STUDY-EXPERTS-SMIC-2025","STUDY-EXPERTS-SMIC-2024-RELIEFS","STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024","STUDY-INSEE-SMIC-MEAN-WAGE-2012","STUDY-INSEE-MINIMUM-WAGE-RIGIDITY-2019","STUDY-ALBERTINI-POIRIER-TERRIAU-2025","STUDY-COTTET-PAYROLL-TA