  - {"id":"DOSSIER-SMIC-HISTORICAL-EPISODES","title":"Historique des revalorisations du SMIC en France : épisodes, effets et contre-effets","summary":"Étude historique des revalorisations depuis 1970, distinguant gains réels, diffusion salariale, emploi, compression, retards de grilles et limites causales ; comprend une synthèse intermédiaire et un protocole de quantification reproductible.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Dans quels épisodes les revalorisations du SMIC ont-elles amélioré le niveau de vie, pour qui, et quels coûts ou effets secondaires ont été observés ?","geographic_scope":["France"],"temporal_scope":"1970–2026 ; études et données selon leurs périodes propres","claim_ids":[],"study_ids":[],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY"],"concept_ids":[],"last_reviewed":"2026-11-14","tags":["TAG-ISSUE-TRADEOFFS","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-INDEXATION-DECOMPOSITION","title":"Décomposer les revalorisations du SMIC : règles, indexation et coups de pouce (1970–2026)","summary":"Reconstitue les règles successives, distingue indexation prix, participation salariale, coups de pouce, GMR et changements de calendrier ; fournit le protocole de calcul reproductible.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Quelle part des hausses du SMIC relève des règles automatiques, des décisions discrétionnaires et des transitions institutionnelles, et comment ces parts varient-elles selon les périodes ?","geographic_scope":["France hors Mayotte"],"temporal_scope":"1970–2026, avec distinction des règles et indices applicables à chaque sous-période.","claim_ids":[],"study_ids":["STUDY-CAHUC-CARCILLO-LE-BARBANCHON-2019-HIRING-CREDITS"],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER"],"concept_ids":[],"last_reviewed":"2026-11-14","tags":["TAG-METHOD-QUANTITATIVE","TAG-METHOD-COMPARATIVE","TAG-LEVEL-NATIONAL"]}

