dossiers:
  - {"id":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","title":"Parcoursup et l'égalité des chances dans le système éducatif français","summary":"Étude de la chaîne reliant les acquis scolaires, l'orientation, l'accès au supérieur et la réussite étudiante. Parcoursup est le premier terrain d'observation, sans être assimilé à l'ensemble du système éducatif.","status":"researching","domain_ids":["DOMAIN-EDUCATION"],"question":"Dans quelle mesure le système éducatif français permet-il une égalité réelle des chances, de la formation des acquis jusqu'à l'accès à l'enseignement supérieur et à la réussite dans les études ?","geographic_scope":["France"],"temporal_scope":"Priorité aux données 2015-2026, avec comparaisons européennes/internationales lorsque les définitions sont compatibles.","claim_ids":["CLAIM-PARCOURSUP-2026-APPLICANTS","CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","CLAIM-PISA-2022-SOCIOECONOMIC-GAP","CLAIM-INSEE-EARLY-SOCIAL-GAPS","CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","CLAIM-PARCOURSUP-CEV-LOCAL-CRITERIA","CLAIM-PARCOURSUP-CEV-REPORTS-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026","STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","STUDY-OECD-PISA-2022-FRANCE","STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","STUDY-PARCOURSUP-FORMATION-OPEN-DATA-2025"],"hypothesis_ids":["HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
  - {"id":"DOSSIER-TIG-EFFECTIVENESS-AND-UNDERUSE","title":"Travaux d’intérêt général : efficacité pénale, coûts et freins au déploiement en France","summary":"Évalue pourquoi le TIG demeure peu mobilisé malgré son coût direct relativement faible et son potentiel de sanction en milieu ouvert. Distingue récidive, fréquence et gravité des réitérations, dissuasion, réparation, insertion, capacité opérationnelle, délais, coûts complets et effets sur l'incarcération.","status":"researching","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"question":"Pourquoi les travaux d'intérêt général sont-ils relativement peu prononcés en France, et dans quelles conditions peuvent-ils constituer une sanction crédible, efficace et économiquement pertinente par rapport à l'incarcération ou à d'autres peines ?","geographic_scope":["France","Europe","Pays de la Loire","Loire-Atlantique","Nantes Métropole","Saint-Herblain","CapAtlantique La Baule-Guérande Agglo"],"temporal_scope":"Données 2015-2026 ; comparaison internationale et déclinaisons territoriales selon la compatibilité des définitions.","claim_ids":["CLAIM-TIG-PRONOUNCED-DOWN-2015-2022","CLAIM-TIG-EXECUTION-DELAY-2025","CLAIM-TIG-RECIDIVISM-5Y-2025","CLAIM-TIG-UNIT-COST-2025","CLAIM-TIG-TUTORS-NETWORK-2021","CLAIM-EU-COMMUNITY-SERVICE-PROBATION-SHARE-2022","CLAIM-NETHERLANDS-COMMUNITY-SERVICE-LOWER-RECIDIVISM-IV-2023","CLAIM-UK-UNPAID-WORK-IMPLEMENTATION-FACTORS-2021","CLAIM-TIG-LOCAL-REFERENT-LOIRE-ATLANTIQUE-2026","CLAIM-TIG-SAINT-HERBLAIN-200-HOURS-2022","CLAIM-CAPATLANTIQUE-TIG-PLAN-2026-2027","CLAIM-TIG-NATIONAL-POSTS-2018-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025","STUDY-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025","STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023","STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025","STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021","STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026","STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE"],"hypothesis_ids":["HYPOTHESIS-TIG-LOCAL-CAPACITY-BOTTLENECK","HYPOTHESIS-TIG-DELAY-WEAKENS-SANCTION","HYPOTHESIS-TIG-REINSERTION-UNDERDELIVERED","HYPOTHESIS-TIG-COST-ADVANTAGE-CONDITIONAL","HYPOTHESIS-TIG-NATIONAL-STOCK-MASKS-LOCAL-AVAILABILITY","HYPOTHESIS-TIG-LOCAL-PARTNERSHIP-LOW-COST-EXPANSION"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
  - {"id":"DOSSIER-SMIC-FRANCE-TRADEOFFS","title":"Augmenter le SMIC en France : pouvoir d'achat, emploi, salaires et finances publiques","summary":"Examine contradictoirement les effets du salaire minimum sur le pouvoir d'achat, l'emploi, les inégalités, la progression salariale, les prix, la productivité et les finances publiques ; articule indexation, coups de pouce, allègements, prime d'activité et comparaisons territoriales.","status":"researching","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE","DOMAIN-INSTITUTIONS"],"question":"Dans quelles conditions une hausse du SMIC au-delà de l'indexation légale améliore-t-elle durablement le niveau de vie des travailleurs modestes sans dégrader excessivement l'emploi, la progression salariale, la compétitivité, la productivité et les finances publiques ?","geographic_scope":["France hors Mayotte","Europe","Pays de la Loire","Loire-Atlantique","Nantes Métropole","Nantes","Île de Nantes"],"temporal_scope":"Séries longues depuis 1990 ; attention particulière à 2021-2026 ; comparaisons internationales selon compatibilité des définitions.","claim_ids":["CLAIM-SMIC-2026-JUNE-AMOUNT","CLAIM-SMIC-2024-DIRECT-BENEFICIARIES","CLAIM-SMIC-2026-DIRECT-BENEFICIARIES","CLAIM-SMIC-2024-GLOBAL-WAGE-DISTRIBUTION","CLAIM-SMIC-2025-REAL-PURCHASING-POWER","CLAIM-SMIC-HIGH-RELATIVE-LEVEL","CLAIM-SMIC-WAGE-PROPAGATION","CLAIM-SMIC-EXEMPTIONS-EMPLOYMENT-COUNTERFACTUAL","CLAIM-SMIC-EXEMPTIONS-COST-2024"],"study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","STUDY-EXPERTS-SMIC-2025","STUDY-EXPERTS-SMIC-2024-RELIEFS","STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024","STUDY-INSEE-SMIC-MEAN-WAGE-2012","STUDY-INSEE-MINIMUM-WAGE-RIGIDITY-2019","STUDY-ALBERTINI-POIRIER-TERRIAU-2025","STUDY-COTTET-PAYROLL-TAX-2024"],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY","HYPOTHESIS-SMIC-RELIEF-LOW-WAGE-TRAP"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EQUITY","TAG-ISSUE-TRADEOFFS","TAG-ISSUE-EFFICIENCY","TAG-METHOD-COMPARATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-HISTORICAL-EPISODES","title":"Historique des revalorisations du SMIC en France : épisodes, effets et contre-effets","summary":"Étude historique des revalorisations depuis 1970, distinguant gains réels, diffusion salariale, emploi, compression, retards de grilles et limites causales ; comprend une synthèse intermédiaire et un protocole de quantification reproductible.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Dans quels épisodes les revalorisations du SMIC ont-elles amélioré le niveau de vie, pour qui, et quels coûts ou effets secondaires ont été observés ?","geographic_scope":["France"],"temporal_scope":"1970–2026 ; études et données selon leurs périodes propres","claim_ids":[],"study_ids":[],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY"],"concept_ids":[],"last_reviewed":"2026-11-14","tags":["TAG-ISSUE-TRADEOFFS","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-INDEXATION-DECOMPOSITION","title":"Décomposer les revalorisations du SMIC : règles, indexation et coups de pouce (1970–2026)","summary":"Reconstitue les règles successives, distingue indexation prix, participation salariale, coups de pouce, GMR et changements de calendrier ; fournit le protocole de calcul reproductible.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Quelle part des hausses du SMIC relève des règles automatiques, des décisions discrétionnaires et des transitions institutionnelles, et comment ces parts varient-elles selon les périodes ?","geographic_scope":["France hors Mayotte"],"temporal_scope":"1970–2026, avec distinction des règles et indices applicables à chaque sous-période.","claim_ids":[],"study_ids":[],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER"],"concept_ids":[],"last_reviewed":"2026-11-14","tags":["TAG-METHOD-QUANTITATIVE","TAG-METHOD-COMPARATIVE","TAG-LEVEL-NATIONAL"]}

  - {"id":"DOSSIER-SMIC-CAUSAL-EVIDENCE-MATRIX","title":"Matrice des preuves — effets historiques et contemporains du SMIC","summary":"Matrice d’audit des études françaises sur l’emploi, les salaires, les trajectoires et la diffusion salariale ; distingue résultats empiriques, simulations, populations et limites d’identification.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Quels effets des hausses du SMIC sont identifiés par les études françaises, pour quelles populations et avec quel degré de confiance ?","geographic_scope":["France"],"temporal_scope":"Études historiques et contemporaines ; périodes propres à chaque étude","claim_ids":[],"study_ids":[],"hypothesis_ids":["HYPOTHESIS-SMIC-EMPLOYMENT-EFFECT-HETEROGENEOUS","HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER"],"concept_ids":[],"last_reviewed":"2026-11-15","tags":["TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-QUANTITATIVE-UPDATE-2026","title":"Actualisation quantitative du SMIC — séries mensuelles et pouvoir d'achat réel (1970–2025)","summary":"Reconstruction mensuelle du SMIC horaire brut et de l'IPC raccordé, calcul des moyennes annuelles et audit des écarts avec les tableaux annuels INSEE/TEF ; distingue pouvoir d'achat horaire brut, indexation légale et effets causaux.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Comment le pouvoir d'achat horaire brut du SMIC a-t-il évolué depuis 1970 lorsque l'on compare les moyennes annuelles reconstruites à partir des séries mensuelles officielles, et quelles ruptures de champ ou de méthode limitent l'interprétation ?","geographic_scope":["France"],"temporal_scope":"1970–2025 ; séries mensuelles SMIC et IPC, raccordement des bases IPC 1980 et 2015.","claim_ids":[],"study_ids":[],"hypothesis_ids":["HYPOTHESIS-SMIC-PURCHASING-POWER-POVERTY"],"concept_ids":[],"last_reviewed":"2026-11-15","tags":["TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-AEBERHARDT-GIVORD-MARBOT-2012","title":"Audit de l'étude Aeberhardt, Givord et Marbot (2012) — diffusion salariale de la convergence des GMR","summary":"Audit du document de travail INSEE G2012/07 : DADS 1/25e, convergence différenciée des six minima GMR 2003–2005, régressions de quantiles inconditionnels, diffusion jusqu'au 7e décile pour les deux sexes, limites sur l'emploi et l'identification.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"La convergence différenciée des minima GMR après les 35 heures a-t-elle diffusé aux rémunérations au-delà du plancher, et que permet-elle de conclure sur l'emploi ?","geographic_scope":["France"],"temporal_scope":"Épisode de convergence des GMR 2003–2005 ; données DADS panel 1/25e.","claim_ids":[],"study_ids":[],"hypothesis_ids":[],"concept_ids":[],"last_reviewed":"2026-11-15","tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-GOARANT-MULLER-2011-DIFFUSION","title":"Audit de Goarant & Muller (2011) — diffusion des hausses du SMIC dans les salaires mensuels","summary":"Audit du dossier INSEE Références fondé sur ACEMO trimestrielle 2006–2009 : effets immédiats et retardés sur les salaires de base selon la distance au SMIC, hétérogénéité par branche et limites d'inférence sur l'emploi.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Dans quelle mesure les hausses du SMIC se diffusent-elles aux salaires de base au-dessus du minimum, à court terme et à un an ?","geographic_scope":["France métropolitaine"],"temporal_scope":"ACEMO trimestrielle T3 1999–T2 2009 ; analyse principale 2006–2009.","claim_ids":[],"study_ids":[],"hypothesis_ids":[],"concept_ids":[],"last_reviewed":"2026-11-15","tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-GAUTIER-ROUX-SUAREZ-CASTILLO-2019","title":"Audit de Gautier, Roux et Suarez Castillo (2019) — rigidité et transmission salariale","summary":"Audit du document INSEE G2019/09 : ACEMO 2005–2015 appariée aux minima de branche et accords d'entreprise, modèle Tobit II de rigidité, simulations de transmission des chocs aux salaires agrégés et limites d'inférence sur l'emploi.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Comment le SMIC national et les minima conventionnels modifient-ils la fréquence, la taille et la diffusion des hausses salariales ?","geographic_scope":["France"],"temporal_scope":"Données microéconomiques trimestrielles 2005T1–2015T4 ; minima de branche 2005–2015.","claim_ids":[],"study_ids":[],"hypothesis_ids":[],"concept_ids":[],"last_reviewed":"2026-11-15","tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-TRESOR-2025-WAGE-TRAJECTORIES","title":"Audit du Trésor-Éco 365 (2025) — trajectoires salariales des salariés proches du SMIC","summary":"Audit du Panel Tous salariés 2013–2021, des transitions salariales 2013–2019, de la classification des trajectoires, des facteurs associés à la proximité durable du SMIC et des limites d'inférence causale.","status":"researching","domain_ids":["DOMAIN-ECONOMY"],"question":"Quelle part des salariés initialement proches du SMIC progresse, reste durablement proche du plancher, connaît le chômage ou sort du champ observé ?","geographic_scope":["France"],"temporal_scope":"Panel Tous salariés 2013–2021 ; trajectoires principales 2013–2019 ; encadré COVID 2019–2021.","claim_ids":[],"study_ids":[],"hypothesis_ids":[],"concept_ids":[],"last_reviewed":"2026-11-15","tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-SMIC-FACTORS-TRANSMISSION-2026","title":"Facteurs déterminants du SMIC : règles, mécanismes et effets","summary":"Cartographie les paramètres légaux, les choix politiques et les canaux de transmission aux salariés, ménages, entreprises et finances publiques ; audite l'annonce de décembre 2026 et les chiffres publics associés.","status":"researching","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE","DOMAIN-INSTITUTIONS"],"question":"Quels facteurs déterminent le taux de revalorisation du SMIC, par quels mécanismes une hausse affecte-t-elle les différents acteurs, et quelles justifications chiffrées de la décision de décembre 2026 sont vérifiables ?","geographic_scope":["France"],"temporal_scope":"Règles et mécanismes structurels ; actualisation ciblée 2025–2026.","claim_ids":[],"study_ids":["STUDY-EXPERTS-SMIC-2025"],"hypothesis_ids":["HYPOTHESIS-SMIC-WAGE-COMPRESSION-CAREER","HYPOTHESIS-SMIC-RELIEF-LOW-WAGE-TRAP"],"concept_ids":[],"last_reviewed":"2026-11-16","tags":["TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"]}
  - {"id":"DOSSIER-DEBATE-BARRAGE-CORDON-SANITAIRE","title":"Boycotter les idées ou accepter le débat ? Cordon sanitaire, non-plateformisation et confrontation publique","summary":"Étude comparative Belgique–Allemagne–France des stratégies de débat, réfutation, démarcation médiatique, non-coalition et barrage électoral. Distingue effets électoraux, médiatiques, idéologiques et institutionnels.","status":"researching","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS","DOMAIN-SECURITY"],"question":"Dans quelles conditions le débat contradictoire, la réfutation, la démarcation médiatique, l'exclusion des coalitions ou l'intervention juridique contribuent-ils à préserver le pluralisme démocratique et à limiter la normalisation d'acteurs ou de discours antidémocratiques, et avec quels effets indésirables ?","geographic_scope":["Belgique","Wallonie","Flandre","Autriche","Allemagne","France","Pays-Bas","Royaume-Uni","Australie","Europe"],"temporal_scope":"Comparaison historique et contemporaine ; priorité aux études et élections 2015–2026.","claim_ids":["CLAIM-BELGIUM-WALLONIA-FLANDERS-CORDON-2021","CLAIM-GERMANY-BRANDMAUER-NO-DETECTED-SHORT-TERM-EFFECT-2025","CLAIM-FRANCE-2024-WITHDRAWALS-RECONFIGURE-RUNOFFS","CLAIM-COALITION-SIGNALS-CORDON-NOT-SYSTEMATIC-CONTEXT-2025","CLAIM-EUROPE-ACCOMMODATION-NOT-ELECTORAL-CURE-2023","CLAIM-WESTERN-EUROPE-IDEOLOGICAL-SHIFT-1980-2014","CLAIM-BELGIUM-CORDON-THREE-DECADES-INSTITUTIONAL-ACCESS","CLAIM-EUROPE-PARTY-BANS-SOCIAL-LEGITIMACY-ESS-2002-2010","CLAIM-AUSTRIA-FPO-INCLUSION-NOT-DURABLE-NEUTRALIZATION-2015","CLAIM-AUSTRIA-FPO-COUNTERPOWERS-CONDITION-2022","CLAIM-EXPOSURE-UNCHECKED-EXTREME-INTERVIEWS-ATTITUDES-NORMS-2025","CLAIM-DUTCH-MEDIA-ACCOMMODATION-NORMALIZATION-2022"],"study_ids":["STUDY-BELGIUM-CORDON-WALLONIA-FLANDERS-2021","STUDY-GERMANY-BRANDMAUER-FAHEY-ALARIAN-2025","STUDY-COALITION-SIGNALS-FOUR-COUNTRIES-2025","STUDY-FRANCE-CANDIDATE-WITHDRAWAL-2024","STUDY-KRAUSE-COHEN-ABOU-CHADI-2023-ACCOMMODATION","STUDY-WAGNER-MEYER-2016-IDEOLOGICAL-LANDSCAPE","STUDY-DE-LEEUW-BOURNE-2020-PARTY-BANS-ESS","STUDY-BIARD-2021-DIACHRONIC-CORDON","STUDY-AUSTRIA-FPO-GOVERNMENT-STRATEGY-2015","STUDY-AUSTRIA-FPO-POLICY-UNCONSTITUTIONALITY-2022","STUDY-AUSTRIA-FPO-WELFARE-POLICY-2016","STUDY-BOLET-FOOS-2025-MEDIA-PLATFORMING","STUDY-DE-JONGE-GAUFMAN-2022-MEDIA-NORMALIZATION","STUDY-VOLKER-2026-MEDIA-CORDON-GERMANY"],"hypothesis_ids":["HYPOTHESIS-CORDON-INSTITUTIONAL-ACCESS","HYPOTHESIS-DISCURSIVE-NORMALIZATION-THROUGH-ACCOMMODATION","HYPOTHESIS-REACTANCE-EXCLUSION-CONDITIONAL","HYPOTHESIS-ELECTORAL-WITHDRAWALS-CHANGE-SEATS","HYPOTHESIS-LONG-TERM-DISCOURSE-NORMALIZATION","HYPOTHESIS-LONG-TERM-CORDON-RESILIENCE-AND-FATIGUE"],"concept_ids":[],"last_reviewed":"2026-11-16","tags":["TAG-METHOD-COMPARATIVE","TAG-METHOD-QUALITATIVE","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-EUROPE","TAG-LEVEL-NATIONAL"]}