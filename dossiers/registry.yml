dossiers:
  - {"id":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","title":"Parcoursup et l'égalité des chances dans le système éducatif français","summary":"Étude de la chaîne reliant les acquis scolaires, l'orientation, l'accès au supérieur et la réussite étudiante. Parcoursup est le premier terrain d'observation, sans être assimilé à l'ensemble du système éducatif.","status":"researching","domain_ids":["DOMAIN-EDUCATION"],"question":"Dans quelle mesure le système éducatif français permet-il une égalité réelle des chances, de la formation des acquis jusqu'à l'accès à l'enseignement supérieur et à la réussite dans les études ?","geographic_scope":["France"],"temporal_scope":"Priorité aux données 2015-2026, avec comparaisons européennes/internationales lorsque les définitions sont compatibles.","claim_ids":["CLAIM-PARCOURSUP-2026-APPLICANTS","CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","CLAIM-PISA-2022-SOCIOECONOMIC-GAP","CLAIM-INSEE-EARLY-SOCIAL-GAPS","CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","CLAIM-PARCOURSUP-CEV-LOCAL-CRITERIA","CLAIM-PARCOURSUP-CEV-REPORTS-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026","STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","STUDY-OECD-PISA-2022-FRANCE","STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","STUDY-PARCOURSUP-FORMATION-OPEN-DATA-2025"],"hypothesis_ids":["HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EQUITY","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
  - {"id":"DOSSIER-TIG-EFFECTIVENESS-AND-UNDERUSE","title":"Travaux d’intérêt général : efficacité pénale, coûts et freins au déploiement en France","summary":"Évalue pourquoi le TIG demeure peu mobilisé malgré son coût direct relativement faible et son potentiel de sanction en milieu ouvert. Distingue récidive, fréquence et gravité des réitérations, dissuasion, réparation, insertion, capacité opérationnelle, délais, coûts complets et effets sur l'incarcération.","status":"researching","domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"question":"Pourquoi les travaux d'intérêt général sont-ils relativement peu prononcés en France, et dans quelles conditions peuvent-ils constituer une sanction crédible, efficace et économiquement pertinente par rapport à l'incarcération ou à d'autres peines ?","geographic_scope":["France"],"temporal_scope":"Priorité aux données 2015-2026 ; comparaisons européennes et internationales selon la compatibilité des définitions, populations et pratiques pénales.","claim_ids":["CLAIM-TIG-PRONOUNCED-DOWN-2015-2022","CLAIM-TIG-EXECUTION-DELAY-2025","CLAIM-TIG-RECIDIVISM-5Y-2025","CLAIM-TIG-UNIT-COST-2025","CLAIM-TIG-TUTORS-NETWORK-2021","CLAIM-EU-COMMUNITY-SERVICE-PROBATION-SHARE-2022","CLAIM-NETHERLANDS-COMMUNITY-SERVICE-LOWER-RECIDIVISM-IV-2023","CLAIM-UK-UNPAID-WORK-IMPLEMENTATION-FACTORS-2021"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025","STUDY-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025","STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023","STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025","STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021"],"hypothesis_ids":["HYPOTHESIS-TIG-LOCAL-CAPACITY-BOTTLENECK","HYPOTHESIS-TIG-DELAY-WEAKENS-SANCTION","HYPOTHESIS-TIG-REINSERTION-UNDERDELIVERED","HYPOTHESIS-TIG-COST-ADVANTAGE-CONDITIONAL"],"concept_ids":[],"last_reviewed":"2026-11-13","tags":["TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL","TAG-METHOD-COMPARATIVE"]}
