studies:
  - {"id":"STUDY-PARCOURSUP-ADMISSIONS-2026","title":"Bilan statistique des propositions d’admission Parcoursup 2026","organization":"SIES","study_type":"descriptive","source_ids":["SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS","SOURCE-PARCOURSUP-BILAN-2026"],"dataset_ids":["DATASET-PARCOURSUP-2026-INDICATORS"],"domains":["DOMAIN-EDUCATION"],"research_question":"Que décrivent les indicateurs administratifs de candidatures, propositions et acceptations de la campagne 2026 ?","methods":["Statistiques administratives descriptives","Comparaison par catégories de candidats"],"population_or_unit":"Candidats Parcoursup et néo-bacheliers inscrits en 2026","geographic_scope":["France"],"temporal_scope":"Campagne 2026","key_findings":["1 046 000 candidats ont postulé en 2026 selon le bilan ministériel.","603 910 lycéens, soit 91,5 % de ceux ayant formulé des vœux, ont reçu au moins une proposition.","La note SIES indique que 93,7 % des néo-bacheliers inscrits ont reçu au moins une proposition et 81,0 % en ont accepté une."],"limitations":["Ne mesure pas directement l'équité des classements ou la réussite après admission.","Les dénominateurs diffèrent selon les catégories de candidats."],"review_status":"screened","review_notes":"Première extraction officielle ; vérifier les tableaux détaillés et dénominateurs avant comparaison temporelle."}
  - {"id":"STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","title":"Inégalités sociales d’acquis et de parcours dans l’enseignement scolaire français","organization":"INSEE / DEPP","study_type":"descriptive","source_ids":["SOURCE-INSEE-INEGALITES-SCOLAIRES-2025","SOURCE-DEPP-ETAT-ECOLE-2025"],"domains":["DOMAIN-EDUCATION"],"research_question":"À quelles étapes du parcours scolaire les écarts liés à l'origine sociale apparaissent-ils et comment évoluent-ils ?","methods":["Analyse statistique descriptive","Comparaison selon origine sociale et étapes du parcours"],"population_or_unit":"Élèves scolarisés en France, selon les dispositifs et cohortes étudiés","geographic_scope":["France"],"temporal_scope":"Indicateurs de l'édition 2025","key_findings":["Des écarts d'acquis liés à l'origine sociale sont observés dès l'entrée en maternelle."],"limitations":["Populations, mesures et périodes spécifiques selon chaque fiche.","Les écarts descriptifs ne suffisent pas à établir les mécanismes causaux."],"review_status":"screened","review_notes":"À approfondir avec extraction des tableaux, cohortes, tailles d'effet et méthodes de contrôle."}
  - {"id":"STUDY-OECD-PISA-2022-FRANCE","title":"PISA 2022 — inégalités socio-économiques de performance en France","organization":"OCDE","study_type":"descriptive","source_ids":["SOURCE-OECD-PISA-2022-FRANCE"],"domains":["DOMAIN-EDUCATION"],"research_question":"Quelle est l'association entre statut socio-économique et performance en mathématiques à 15 ans en France ?","methods":["Évaluation standardisée internationale","Analyse descriptive et modèles statistiques de contexte"],"population_or_unit":"Élèves de 15 ans participant à PISA 2022","geographic_scope":["France","OCDE"],"temporal_scope":"2022","key_findings":["Les élèves du quartile socio-économique supérieur dépassent de 113 points ceux du quartile inférieur en mathématiques en France."],"limitations":["PISA ne décrit pas directement l'accès au supérieur.","Une association statistique ne démontre pas un effet causal isolé."],"review_status":"screened","review_notes":"À confronter à PISA 2018/2025, aux autres domaines évalués et aux indicateurs de résilience."}
  - {"id":"STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","title":"Transmission intergénérationnelle du niveau de diplôme en France","organization":"OCDE","study_type":"descriptive","source_ids":["SOURCE-OECD-EAG-2025-FRANCE"],"domains":["DOMAIN-EDUCATION"],"research_question":"Dans quelle mesure le niveau de diplôme des parents est-il associé à l'obtention d'un diplôme du supérieur par les jeunes adultes en France ?","methods":["Indicateurs comparatifs internationaux harmonisés","Analyse descriptive selon niveau d'études des parents"],"population_or_unit":"Adultes de 25 à 34 ans en France, ventilés selon le niveau de diplôme parental","geographic_scope":["France","OCDE"],"temporal_scope":"Données 2023 publiées dans Regards sur l'éducation 2025","key_findings":["75 % des 25-34 ans ayant au moins un parent diplômé du supérieur ont eux-mêmes un diplôme du supérieur, contre 32 % lorsque les parents n'ont pas achevé le deuxième cycle du secondaire."],"limitations":["Association intergénérationnelle descriptive ; ne mesure pas l'effet causal propre de l'école ou de Parcoursup.","Les catégories de diplôme parental et les populations de référence doivent être vérifiées dans la table source."],"review_status":"screened","review_notes":"À vérifier dans le tableau OCDE correspondant et à comparer aux générations précédentes."}
  - {"id":"STUDY-PARCOURSUP-FORMATION-OPEN-DATA-2025","title":"Structure de l'offre, profils et résultats d'admission par formation — Parcoursup 2025","organization":"SIES","study_type":"descriptive","source_ids":["SOURCE-PARCOURSUP-OPEN-DATA-2025"],"dataset_ids":["DATASET-PARCOURSUP-2025-FORMATION-OPEN-DATA"],"domains":["DOMAIN-EDUCATION"],"research_question":"Comment varient la demande, les propositions, les admissions et les profils des admis selon les formations, les territoires et les catégories de candidats ?","methods":["Analyse descriptive de données administratives agrégées par formation","Comparaisons selon filière, série du bac, sexe, bourse et origine géographique"],"population_or_unit":"14 252 formations hors apprentissage ; agrégats couvrant 1 015 200 candidats, dont 652 800 néo-bacheliers","geographic_scope":["France","Régions","Départements","Académies","Établissements"],"temporal_scope":"Campagne 2025","key_findings":["La notice documente 115 variables et 14 252 enregistrements ; l'export du 20 novembre 2026 contient 118 colonnes et 14 252 enregistrements.","Les données permettent d'observer les vœux, classements, propositions, admissions, capacités et profils agrégés des admis.","Des variables distinguent les boursiers et les séries de baccalauréat."],"limitations":["Données agrégées au niveau formation ; pas de microdonnées individuelles.","Certains indicateurs cartographiques ne sont pas recalculables à partir du fichier.","Les analyses doivent tenir compte des vœux multiples, des groupes d'appel et des différences de sélectivité."],"review_status":"screened","review_notes":"Analyse descriptive exécutée le 20 novembre 2026. Provenance, contrôles et résultats dans research/analysis/parcoursup-2025-results.md."}
  - {"id":"STUDY-COUR-DES-COMPTES-TIG-DDSE-2025","title":"Évaluation du travail d’intérêt général et de la détention à domicile sous surveillance électronique","organization":"Cour des comptes","study_type":"observational","source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","SOURCE-MINISTERE-JUSTICE-TIG-PRONONCE-2024","SOURCE-MINISTERE-JUSTICE-TUTEURS-TIG-2024","SOURCE-SENAT-EXECUTION-PEINES-2025"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"research_question":"Pourquoi le TIG demeure-t-il peu mobilisé en France, et que peut-on conclure de son efficacité, de son coût, de son caractère sanctionnant et de ses effets sur la récidive ?","methods":["Analyse descriptive de données administratives pénales","Comparaisons de cohortes et corrections économétriques des différences observables entre personnes condamnées","Enquêtes auprès de magistrats, tuteurs et responsables de postes de TIG","Analyse institutionnelle des conditions d'exécution et de suivi"],"population_or_unit":"Personnes condamnées à un TIG ou à une DDSE, magistrats, tuteurs et organismes d'accueil ; cohortes et sous-populations variables selon les analyses","geographic_scope":["France"],"temporal_scope":"Données de prononcé 2015-2022 ; récidive TIG : cohortes 2010, 2013 et 2015 avec suivi à cinq ans, et cohorte 2010 à dix ans ; récidive DDSE : cohortes de libération/fin d'écrou 2016-2017 avec suivi à trois ans ; enquête tuteurs 2021 ; exécution 2024 ; rapport publié en 2025","key_findings":["Le prononcé des TIG a diminué de 34 % entre 2015 et 2022 ; 16 560 TIG ont été prononcés en 2022 pour sanctionner des délits.","Le délai moyen d'exécution du TIG dépasse 16 mois, selon le périmètre et la définition du rapport.","Pour la cohorte 2010, le taux de nouvelle condamnation définitive dans les cinq ans est de 58 % après un TIG, 61 % après un sursis-TIG et 64 % après un emprisonnement ferme de deux ans ou moins ; la mesure est après prononcé et non après exécution.","Après ajustement des caractéristiques observables, les écarts de probabilité de nouvelle condamnation à cinq ans entre TIG/sursis-TIG et emprisonnement ferme sont proches de zéro et statistiquement non significatifs ; des facteurs non observés peuvent subsister.","À dix ans pour la cohorte 2010, les estimations corrigées indiquent une probabilité de recondamnation à la prison ferme inférieure de 11,3 points après TIG et environ 0,268 nouvelle condamnation en moins en moyenne ; ces indicateurs sont distincts du taux binaire de récidive.","Le coût estimé par mesure en 2022 est de 1 862 € pour le TIG et de 2 788 € pour la DDSE ; les unités ne sont pas directement comparables au coût journalier de la détention et ne constituent pas une analyse complète de coût-efficacité.","Le suivi et l'accompagnement sont limités : rendez-vous espacés en moyenne d'environ six mois et 33 % des personnes en TIG orientées vers des acteurs de l'insertion.","Le réseau recensait 20 419 tuteurs dans 11 872 organismes en 2021 ; l'encadrement repose notamment sur des tuteurs non rémunérés.","Le coût national de 1 862 € par TIG repose sur le flux de 22 701 mesures nouvelles suivies en 2022, qui inclut aussi les TNR ; l'estimation alloue notamment 12 % de l'activité CPIP au TIG.","Les dépenses des structures d'accueil ne sont pas intégrées au coût national ; la Cour relève des dépenses de temps de travail, d'équipements et de repas, partiellement compensées par le travail fourni.","Les tuteurs déclarent 9,6 heures d'encadrement pour 100 heures de TIG, avec 14,4 heures dans les associations et 9,3 heures dans les structures publiques.","Dans deux territoires étudiés plus finement, la DDSE est estimée à 3 421 € au Territoire de Belfort et 2 150 € dans les Hauts-de-Seine ; ces observations ne sont pas représentatives de l'ensemble des départements."],"limitations":["Le taux brut de récidive ne permet pas de comparer directement les peines en raison de différences initiales de profils et de sélection judiciaire.","La correction économétrique ne neutralise que les facteurs observés et ne prouve pas l'équivalence causale des sanctions.","Le coût unitaire ne suffit pas à établir un rapport coût-efficacité ; il faut intégrer les coûts d'encadrement, de coordination, de suivi, les coûts évités de détention et les effets pour les victimes et la collectivité.","L'étude ne permet pas de conclure que le TIG serait adapté à toutes les infractions ou à tous les profils.","Pour le TIG, les taux de récidive sont mesurés à partir du prononcé et non de l'exécution ; les données du casier ne permettent pas de distinguer les TIG exécutés, non exécutés ou convertis.","Les résultats TIG à cinq ans portent sur les cohortes 2010, 2013 et 2015 ; les résultats enrichis à dix ans portent sur la cohorte 2010. Les résultats DDSE portent sur des cohortes 2016-2017 et ne doivent pas être confondus avec les cohortes TIG.","L'estimation nationale du coût TIG inclut dans son dénominateur les TNR et exclut les dépenses des organismes d'accueil, des juridictions et de nombreux partenaires.","Les temps de tutorat sont déclaratifs ; les différences entre associations et structures publiques peuvent refléter des définitions et missions différentes.","Les coûts territoriaux plus complets ne concernent que deux SPIP et ne permettent pas un classement national."],"review_status":"method_reviewed","review_notes":"Vérification ciblée du rapport intégral effectuée le 13 novembre 2026 : procédure et méthodes p. 5-7 ; définition et taux bruts de récidive p. 101-103 ; modèles ajustés p. 109-114 ; coûts p. 129-130 et annexe 7. La revue ne remplace pas une réplication des modèles ni un accès aux microdonnées. Les limites d'identification, de cohorte et de mesure après prononcé sont conservées. Correction de la période des cohortes : les cohortes 2016-2017 concernent la DDSE ; les analyses TIG à cinq ans portent notamment sur 2010, 2013 et 2015, et l'analyse TIG à dix ans sur 2010. Revue P1 du coût (13 novembre 2026) : annexe 7 p. 157-161 contrôlée ; les coûts d'accueil sont exclus, le dénominateur TIG inclut les TNR, et les comparaisons territoriales ne portent que sur deux services. Aucune analyse coût-efficacité complète ni réplication des clés d'allocation n'a été réalisée."}
  - {"id":"STUDY-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025","title":"Comparative implementation of non-custodial sanctions in 22 EU Member States","organization":"Penal Reform International; University of Coimbra; Hungarian Helsinki Committee","study_type":"descriptive","source_ids":["SOURCE-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"How are non-custodial sanctions, including community service, legally designed and implemented across 22 EU Member States, and what common barriers affect their use?","methods":["Comparative analysis of national expert reports","Cross-country synthesis of legal frameworks and implementation conditions"],"population_or_unit":"National legal frameworks, probation systems and implementation practices in 22 EU Member States","geographic_scope":["European Union","France","Netherlands","Germany","Finland","Spain"],"temporal_scope":"Comparative project reports published 2025; underlying national reference periods vary","key_findings":["Community service appears in different legal roles across countries: autonomous sanction, replacement sanction, additional requirement or component of probation.","Recurring barriers include limited placement capacity, long waiting lists, insufficient probation staffing, low awareness among sentencers and the public, and net-widening risks."],"limitations":["The countries do not share identical definitions, legal roles or denominators.","The comparative synthesis identifies recurring mechanisms but does not estimate their causal contribution to country-level differences.","Country reports may differ in data availability and depth."],"review_status":"screened","review_notes":"Use primarily to compare institutional design and implementation bottlenecks, not to rank national effectiveness."}
  - {"id":"STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023","title":"Community service versus short-term imprisonment: Dutch instrumental-variable evaluation","organization":"Leiden University researchers; Journal of Experimental Criminology","study_type":"observational","source_ids":["SOURCE-WERMINK-COMMUNITY-SERVICE-RETRIBUTION-2023"],"domains":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"research_question":"What is the causal effect of short-term imprisonment relative to community service on subsequent recidivism, and what are the associated sanctioning costs in the Netherlands?","methods":["Administrative-data analysis of all sentences in 2012","Recidivism follow-up through 2018","Instrumental-variable estimation using variation associated with judicial assignment"],"population_or_unit":"People sentenced in the Netherlands in 2012, comparing short-term prison sentences and community service orders","geographic_scope":["Netherlands"],"temporal_scope":"Sentences in 2012; recidivism 2012-2018; publication 2023","key_findings":["Within the study's instrumental-variable framework, short-term imprisonment increases recidivism relative to community service.","The estimated daily costs of imprisonment from verdict onward are at least three times those of community service.","The authors estimate a substantial aggregate societal expenditure associated with short-term imprisonment for retribution."],"limitations":["The estimate is specific to the Dutch institutional context and cases affected by the instrument.","The result cannot be transferred directly to France without comparing eligibility, sentencing, probation and support arrangements.","It does not establish that community service is always preferable, nor does it quantify general deterrence."],"review_status":"screened","review_notes":"High-value quasi-experimental evidence; examine full methods, instrument validity, outcome definitions and cost perimeter before using as a policy benchmark."}
  - {"id":"STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025","title":"European community-service shares among probationers, 2018-2022","organization":"Journal of Law and Economics; comparative sentencing data attributed to Aebi et al. 2023","study_type":"descriptive","source_ids":["SOURCE-COMPARATIVE-SENTENCING-RATES-EUROPE-2025"],"domains":["DOMAIN-SECURITY"],"research_question":"How does the recorded share of probationers serving community service vary across European jurisdictions?","methods":["Comparative descriptive analysis of reported national probation indicators"],"population_or_unit":"Probation populations in European jurisdictions reporting community-service indicators","geographic_scope":["Europe","France","Netherlands","Spain","Finland","Norway","Scotland","England and Wales"],"temporal_scope":"2018-2022, with focus on 2022","key_findings":["The article reports 2022 community-service shares of probationers of 56.2% in the Netherlands, 60.7% in Spain and 15.3% in France, with several other European jurisdictions between these values."],"limitations":["Denominator is probationers, not all convicted persons or all sentences.","Country legal categories, probation caseloads and reporting practices differ.","Underlying data attributed to Aebi et al. 2023 should be checked directly before detailed rankings or policy inference."],"review_status":"screened","review_notes":"Use as a signal of differences in use, not a harmonised measure of national TIG sentencing rates or effectiveness."}
  - {"id":"STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021","title":"Implementation and evidence on unpaid work in UK probation systems","organization":"HM Inspectorate of Probation","study_type":"descriptive","source_ids":["SOURCE-HMI-PROBATION-UNPAID-WORK-EVIDENCE"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Which implementation features are associated with engagement and completion in unpaid-work requirements, and what is known about their relationship with reoffending?","methods":["Evidence synthesis of UK studies and evaluations","Review of probation inspection findings"],"population_or_unit":"People subject to unpaid-work requirements in probation orders in England and Wales, Scotland and Northern Ireland","geographic_scope":["England and Wales","Scotland","Northern Ireland"],"temporal_scope":"Evidence review updated 17 May 2021; cited studies mainly 2014-2019","key_findings":["Prompt commencement, regularity, useful and rewarding work, tailoring, employment-related skills and clear supervision are associated with better engagement.","The inspectorate identifies a lack of robust evidence demonstrating an effect of unpaid work on reoffending."],"limitations":["The evidence base combines different methods and jurisdictions.","Implementation associations and self-reports are not causal recidivism estimates.","The review predates recent changes in probation delivery."],"review_status":"screened","review_notes":"Useful for implementation design and outcome-measure selection; not a causal estimate of TIG effectiveness."}
  - {"id":"STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026","title":"États généraux de l'insertion et de la probation : diagnostic de modernisation du TIG","organization":"Inspection générale de la justice","study_type":"descriptive","source_ids":["SOURCE-IGJ-ETATS-GENERAUX-INSERTION-PROBATION-2026"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Quelles conditions institutionnelles amélioreraient la rapidité, l'effectivité, la lisibilité et l'adaptabilité du TIG ?","methods":["Consultation de professionnels","Analyse institutionnelle","Formulation de propositions"],"population_or_unit":"Organisation nationale du TIG, SPIP, magistrats et structures d'accueil","geographic_scope":["France"],"temporal_scope":"Rapport janvier 2026 ; stock de postes 2018-2025","key_findings":["L'offre recensée est passée de 18 000 à 30 000 postes entre 2018 et 2025.","Répartition territoriale, notamment rurale, et adaptabilité aux profils vulnérables restent à améliorer.","Le rapport propose évaluation préalable plus complète, exécution rapide et pôles TIG dans les SPIP suffisamment grands."],"limitations":["Diagnostic professionnel, non expérimentation contrôlée.","Stock national ne mesure ni disponibilité réelle ni adéquation locale."],"review_status":"screened","review_notes":"Source de référence pour le protocole de diagnostic territorial."}
  - {"id":"STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE","title":"Accueil municipal de personnes condamnées à un TIG : retour d'expérience de Saint-Herblain","organization":"Ville de Saint-Herblain","study_type":"descriptive","source_ids":["SOURCE-ATIGIP-SAINT-HERBLAIN-TIG-PARTNERSHIP"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Comment une commune organise-t-elle l'accueil, le tutorat et les missions TIG ?","methods":["Étude de cas municipale","Description des missions et du volume d'heures"],"population_or_unit":"Services municipaux de Saint-Herblain et personnes accueillies en TIG","geographic_scope":["Saint-Herblain","Loire-Atlantique"],"temporal_scope":"Accueil 2022 ; retour d'expérience publié vers 2023","key_findings":["La Ville rapporte 200 heures de TIG accueillies en 2022.","Missions : restauration, accueil, animation, manutention, solidarité, réparation et entretien.","Le tuteur accueille, explique les tâches, contrôle assiduité et réalise un bilan."],"limitations":["Cas unique et année unique.","Aucune mesure de récidive, coût ou effet sur les agents.","Ne prouve pas que les postes soient encore actifs."],"review_status":"screened","review_notes":"Cas local utile pour une fiche-type de partenariat, pas une capacité actuelle garantie."}
  - {"id":"STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","title":"Low-wage employment in France: minimum wage, wage compression and mobility","organization":"OCDE","study_type":"observational","source_ids":["SOURCE-OECD-LOW-WAGE-FRANCE-2025"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment le niveau du salaire minimum et la structure des emplois à bas salaire influencent-ils la distribution salariale et les trajectoires professionnelles en France, en comparaison internationale ?","methods":["Analyse descriptive comparative","Analyse de la distribution des salaires autour du salaire minimum","Analyse des trajectoires et de la mobilité professionnelle"],"population_or_unit":"Salariés à bas salaire en France et dans les pays comparateurs étudiés","geographic_scope":["France","Comparateurs OCDE"],"temporal_scope":"Publication 2025 ; années de données variables selon indicateur","key_findings":["Le salaire minimum français, élevé relativement au salaire médian, comprime la distribution des salaires dans le bas de l'échelle.","Les bas salaires sont associés davantage aux compétences des travailleurs qu'à la seule qualité des entreprises, tout en reflétant aussi des effets de secteur et d'entreprise.","Les trajectoires individuelles montrent que les travailleurs à bas salaire en France ne rencontrent pas davantage de difficultés que dans les pays comparateurs étudiés pour gravir l'échelle salariale."],"limitations":["Résultats comparatifs et descriptifs, ne permettant pas d'attribuer causalement ces constats à une hausse donnée du SMIC.","Définitions et périodes de référence à contrôler pour chaque comparaison."],"review_status":"screened","review_notes":"Publication officielle consultée ; approfondir les chapitres et annexes avant toute conclusion causale."}
  - {"id":"STUDY-EXPERTS-SMIC-2025","title":"Évaluation annuelle du niveau du SMIC et du système socio-fiscal","organization":"Groupe d'experts sur le SMIC","study_type":"observational","source_ids":["SOURCE-EXPERTS-SMIC-2025","SOURCE-INSEE-SMIC-SERIES-2026"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quel diagnostic les données et travaux disponibles permettent-ils d'établir sur le niveau relatif du SMIC, la compression salariale et les allègements ?","methods":["Analyse de séries statistiques","Revue de littérature économique","Analyse institutionnelle et simulations"],"population_or_unit":"Salariés rémunérés autour du SMIC, entreprises et finances publiques en France","geographic_scope":["France"],"temporal_scope":"Rapport 2025 ; séries historiques et prévisions pour 2026","key_findings":["Le groupe recommande de ne pas dépasser la revalorisation automatique prévue pour janvier 2026. Le rapport situe le ratio SMIC/salaire médian brut à 62,5 % en 2024, le plus élevé parmi les pays européens comparés.","Le rapport relève la compression persistante des salaires et le niveau relativement élevé du SMIC par rapport au salaire médian.","Le rapport considère que le système socio-fiscal de soutien à l'emploi faiblement rémunéré atteint des limites économiques et financières."],"limitations":["La recommandation est normative et ne constitue pas une estimation causale de l'effet d'un coup de pouce.","Les prévisions de revalorisation sont datées et doivent être distinguées des montants effectivement appliqués en juin 2026."],"review_status":"screened","review_notes":"Recommandation et éléments de diagnostic consultés ; lire les chapitres et annexes pour vérifier chaque estimation."}
  - {"id":"STUDY-EXPERTS-SMIC-2024-RELIEFS","title":"Effets des allègements de cotisations patronales sur l'emploi et coût des dispositifs","organization":"Groupe d'experts sur le SMIC","study_type":"modelling","source_ids":["SOURCE-EXPERTS-SMIC-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels sont les effets estimés des allègements de cotisations patronales sur l'emploi, et quelles conséquences aurait leur suppression ?","methods":["Synthèse de la littérature","Estimations et simulations de scénarios contrefactuels"],"population_or_unit":"Emplois et entreprises bénéficiaires des allègements de cotisations patronales en France","geographic_scope":["France"],"temporal_scope":"Rapport 2024 ; coût et scénarios estimés pour 2024","key_findings":["Le groupe estime que les allègements ont un effet avéré sur l'emploi.","Le groupe estime que leur suppression totale pourrait entraîner la disparition de 1,5 à 2 millions d'emplois, essentiellement peu qualifiés.","Le rapport souligne que les exonérations s'étendent au-delà des niveaux salariaux pour lesquels les effets sur l'emploi sont établis."],"limitations":["Estimation de scénario, non observation d'une suppression effectivement réalisée.","Ne mesure pas l'effet d'une hausse du SMIC et ne doit pas être utilisée comme tel.","Résultat dépendant des modèles, hypothèses et paramètres retenus."],"review_status":"screened","review_notes":"À confronter au rapport France Stratégie sur les exonérations et aux études microéconomiques sous-jacentes."}
  - {"id":"STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024","title":"Trente ans d'exonérations de cotisations sociales : bilan et pistes de réforme","organization":"France Stratégie","study_type":"observational","source_ids":["SOURCE-FRANCE-STRATEGIE-EXONERATIONS-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels effets les exonérations de cotisations sociales ont-elles sur l'emploi, les trajectoires salariales, la productivité et les finances publiques ?","methods":["Bilan historique des dispositifs","Revue d'évaluations empiriques","Analyse de la distribution des salaires et simulations de réforme"],"population_or_unit":"Entreprises, salariés et finances publiques en France","geographic_scope":["France"],"temporal_scope":"Environ trente ans de politiques ; données récentes jusqu'en 2023-2024","key_findings":["Les exonérations ont contribué à réduire le coût du travail peu qualifié et à soutenir l'emploi, particulièrement dans les années 1990.","Leur coût budgétaire est devenu très élevé et leur efficacité marginale est discutée dans un marché du travail transformé.","La dégressivité peut créer des taux marginaux élevés et des risques de trappe à bas salaires, mais les preuves empiriques de ces mécanismes restent nuancées."],"limitations":["La synthèse combine des travaux aux méthodes et périodes différentes.","Les risques de trappe à bas salaires ne doivent pas être présentés comme un effet uniforme et définitivement établi."],"review_status":"screened","review_notes":"Fiche de synthèse et rapport associés repérés ; vérifier les évaluations originales et les montants par année."}
  - {"id":"STUDY-INSEE-SMIC-MEAN-WAGE-2012","title":"Effets des revalorisations du SMIC sur le salaire moyen (1970-2009)","organization":"INSEE","authors":["Gilbert Cette","Valérie Chouard","Grégory Verdugo"],"study_type":"observational","source_ids":["SOURCE-INSEE-SMIC-MEAN-WAGE-2012"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment les revalorisations du SMIC se transmettent-elles aux indicateurs de salaire moyen, selon leur origine ?","methods":["Analyse économétrique de séries temporelles longues","Différenciation des revalorisations automatiques et des coups de pouce"],"population_or_unit":"Salaires horaires de base des ouvriers et salaires mensuels par tête en France","geographic_scope":["France"],"temporal_scope":"1970-2009","key_findings":["Les estimations indiquent un effet important des revalorisations du SMIC sur le salaire moyen.","Les revalorisations liées à l'indexation sur la moitié des gains de pouvoir d'achat du salaire ouvrier ont un impact important sur le salaire horaire de base lui-même.","Les auteurs signalent une possible circularité entre le SMIC et le salaire de base."],"limitations":["Période ancienne, arrêtée en 2009 ; structure du marché du travail et politiques d'allègements ont évolué.","Ne mesure pas directement les effets sur l'emploi, les prix ou la pauvreté en emploi."],"review_status":"screened","review_notes":"Résumé et présentation INSEE consultés ; lire le texte intégral et actualiser l'analyse avant extrapolation."}
  - {"id":"STUDY-INSEE-MINIMUM-WAGE-RIGIDITY-2019","title":"Les salaires minima rendent-ils les salaires plus rigides ?","organization":"INSEE","authors":["Erwan Gautier","Sébastien Roux","Milena Suarez Castillo"],"publication_date":"2019-11-14","study_type":"observational","source_ids":["SOURCE-INSEE-MINIMUM-WAGE-RIGIDITY-2019"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment le SMIC et les minima de branche affectent-ils le calendrier et l'ampleur des ajustements salariaux individuels et agrégés ?","methods":["Données individuelles de salaires appariées aux minima de branche","Modèle microéconométrique de rigidité salariale","Simulations macroéconomiques"],"population_or_unit":"Salariés et salaires individuels en France","geographic_scope":["France"],"temporal_scope":"Étude publiée en 2019 ; données individuelles et simulations décrites dans le document","key_findings":["Les minima salariaux influencent le calendrier et l'ampleur des relèvements individuels.","Les auteurs estiment que les minima contribuent à amplifier par un facteur 1,7 la réponse agrégée des salaires à l'inflation passée dans leur cadre d'analyse.","Une hausse du SMIC se diffuse aux salaires plus élevés notamment via les minima de branche."],"limitations":["La simulation agrégée ne mesure pas directement l'effet causal du SMIC sur l'emploi ou les prix.","Les résultats dépendent du modèle et de la période observée ; ne pas en faire une estimation contemporaine sans actualisation."],"review_status":"screened","review_notes":"Page officielle INSEE et résumé consultés ; le document complet et ses annexes restent à examiner."}
  - {"id":"STUDY-ALBERTINI-POIRIER-TERRIAU-2025","title":"Payroll Tax Reductions on Low Wages and Minimum Wage in France","organization":"TEPP — CNRS FR 2042","authors":["Julien Albertini","Arthur Poirier","Anthony Terriau"],"publication_date":"2025-01-24","study_type":"modelling","source_ids":["SOURCE-ALBERTINI-POIRIER-TERRIAU-2025"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels sont les effets des allègements de cotisations et d'une hausse du salaire minimum sur l'emploi, le surplus budgétaire et le bien-être, en tenant compte des interactions socio-fiscales ?","methods":["Modèle structurel de recherche et appariement dirigé sur cycle de vie, simulé au trimestre","Hétérogénéité des travailleurs par âge, éducation, capital humain, statut familial, heures et productivité","Calibration de paramètres et estimation des autres paramètres par méthode des moments simulés","Simulation contrefactuelle d'une hausse de 5 % du SMIC sous trois scénarios d'indexation du barème d'allègements et du reste du système socio-fiscal"],"population_or_unit":"Travailleurs, entreprises, emploi et finances publiques dans un modèle calibré sur la France","geographic_scope":["France"],"temporal_scope":"Document de travail du 24 janvier 2025","key_findings":["Le modèle de recherche et d'appariement sur cycle de vie représente l'hétérogénéité par âge, éducation, capital humain, statut familial, temps de travail et productivité ; il endogénéise recherche, embauche et séparations.","Pour une hausse simulée de 5 % du SMIC, le taux d'emploi diminue de 2,05 à 2,21 points selon trois hypothèses d'indexation des allègements, impôts et transferts.","Dans les mêmes scénarios, le surplus budgétaire passe à 94,88, 94,36 et 89,51 pour une base 100, soit une baisse simulée de 5,12 %, 5,64 % et 10,49 %.","Le modèle indique que les effets dépendent de l'indexation des seuils d'allègements et des transferts et impôts ; le scénario où transferts et impôts suivent le SMIC produit l'effet le plus négatif sur le surplus budgétaire.","Le modèle identifie aussi une réforme alternative des allègements susceptible d'améliorer emploi, surplus et bien-être dans le cadre de ses hypothèses."],"limitations":["Résultats de modèle structurel, non estimation causale d'une hausse effectivement observée ; ils dépendent de la structure et de la calibration retenues.","Le modèle reproduit imparfaitement certaines dimensions : le coefficient de Gini simulé est 0,24 contre 0,29 dans les données ; la part du temps partiel est légèrement sous-estimée à certains âges.","Les transferts des personnes sans emploi sont approchés à partir des données selon âge, statut familial et éducation, faute de suivre l'historique professionnel complet.","Les résultats quantitatifs concernent un scénario précis de hausse de 5 % et trois hypothèses d'indexation ; ils ne constituent pas une élasticité universelle applicable à toute hausse.","Les effets de long terme et les réponses des salaires au-delà du SMIC dépendent notamment du mécanisme de négociation salariale retenu."],"review_status":"screened","review_notes":"Texte intégral WP 2501 consulté : équations du modèle, calibration, estimation par moments simulés, qualité d'ajustement, scénarios de hausse de 5 % et tableau 6 extraits. Les résultats sont enregistrés comme simulations conditionnelles, pas comme observations causales."}
  - {"id":"STUDY-COTTET-PAYROLL-TAX-2024","title":"Payroll Tax Reductions for Minimum Wage Workers: Relative Labor Cost or Cash Windfall Effects?","organization":"CESifo","authors":["Sophie Cottet"],"study_type":"quasi_experimental","source_ids":["SOURCE-COTTET-PAYROLL-TAX-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Comment les entreprises réagissent-elles à une réduction de cotisations patronales ciblant les emplois au salaire minimum, selon qu'elle modifie le coût relatif du poste ou procure un gain de trésorerie à l'entreprise ?","methods":["Données administratives appariées employeurs-salariés DADS Postes et données fiscales des entreprises","Différences-de-différences au niveau des postes, avec comparaison de groupes de salaires et coefficients pré-réforme","Mesure de l'exposition ex ante des entreprises aux variations de coût du travail et estimation en différences-de-différences avec effets fixes entreprise, année et secteur-année"],"population_or_unit":"Entreprises françaises et emplois rémunérés au voisinage du SMIC","geographic_scope":["France"],"temporal_scope":"Working Paper CESifo 11076, 2024","key_findings":["Les réformes Juppé de 1995-1996 ont réduit d'environ 10 % le coût du travail au SMIC ; l'étude utilise les données administratives appariées DADS Postes et des données fiscales d'entreprises.","Une stratégie en différences-de-différences au niveau des postes compare les salaires de 1 à 1,1 SMIC aux salaires de 1,3 à 1,5 SMIC, avec plusieurs années avant et après la réforme ; les coefficients pré-réforme servent à examiner l'hypothèse de tendances parallèles.","L'étude estime une hausse supplémentaire de 13 points de pourcentage du nombre d'emplois au SMIC dans les entreprises qui employaient auparavant peu ou pas de salariés au SMIC ; le résultat passe notamment par la rétention des emplois.","Les entreprises déjà fortement utilisatrices d'emplois au SMIC, bénéficiant d'un effet de trésorerie, enregistrent environ 4 points de croissance d'emploi supplémentaires sur les deux premières années ; l'effet s'estompe ensuite et les trajectoires convergent vers 1998."],"limitations":["L'intervention étudiée est la baisse de cotisations des réformes Juppé de 1995-1996, pas une hausse du SMIC et pas le barème actuel.","La symétrie entre baisse et hausse du coût du travail n'est pas établie ; l'autrice souligne que l'effet de trésorerie peut contrebalancer ou masquer l'effet de coût relatif.","Les effets de croissance des entreprises bénéficiaires d'un effet de trésorerie sont temporaires et convergent vers 1998.","L'analyse des entreprises est sensible à l'attrition des firmes ; l'autrice examine des échantillons équilibrés et non équilibrés et avertit sur la sélection des survivantes.","Working paper ; les résultats doivent être replacés dans le contexte institutionnel des années 1990."],"review_status":"screened","review_notes":"Texte intégral CESifo WP 11076 consulté : contexte des réformes 1995-1996, données DADS/FICUS, stratégie DID et pré-tendances, hétérogénéité selon exposition, convergence 1998 et limites de symétrie explicitement examinés."}
  - {"id":"STUDY-SENAT-EXECUTION-PEINES-2025","title":"L’exécution à la peine — 20 propositions pour mieux exécuter et donner du sens aux sanctions pénales","organization":"Sénat, Commission des lois","publication_date":"2025-10-01","study_type":"descriptive","source_ids":["SOURCE-SENAT-EXECUTION-PEINES-2025"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Quels sont les obstacles à l'exécution des peines alternatives et quelles différences ressortent des systèmes étudiés ?","methods":["Auditions institutionnelles et professionnelles","Analyse de données administratives communiquées à la mission","Comparaison juridique et institutionnelle de plusieurs pays"],"population_or_unit":"Peines alternatives et dispositifs d'exécution en France et dans les pays comparés","geographic_scope":["France","Pays-Bas","Espagne"],"temporal_scope":"Rapport déposé le 1er octobre 2025 ; indicateurs français 2023-2024 et données néerlandaises 2024 citées","key_findings":["En France, le délai moyen saisine SPIP-affectation est passé de 7,9 à 6,9 mois entre 2023 et 2024.","Le rapport reprend de la Cour des comptes un délai moyen d'exécution de 16,7 mois pour les TIG ou sursis-TIG prononcés en 2020 et exécutés dans les trois ans ; le délai est mesuré de la condamnation à la fin d'exécution.","Les issues à trois ans reprises par le Sénat (75 % exécutés, 9 % convertis, 16 % non exécutés ou échec imputable) sont ventilées par la Cour en 75 % exécutés, 9 % convertis, 5 % encore non exécutés et 11 % d'échecs imputables.","Les chiffres 28 500 / 16 % / 10 % sont exposés dans la partie sur le taakstraf néerlandais et ne doivent pas être attribués à la France."],"limitations":["Rapport parlementaire descriptif et de recommandations ; il ne constitue pas une évaluation causale des dispositifs.","Les données administratives citées ont des populations, dénominateurs et périodes différents ; ne pas les agréger sans harmonisation.","Les chiffres étrangers doivent être conservés dans leur contexte institutionnel national."],"review_status":"screened","review_notes":"Passages français et néerlandais contrôlés sur le rapport du Sénat ; la définition précise des 16,7 mois et la ventilation 75/9/5/11 ont été vérifiées dans l'annexe 5 et le texte p. 46-47 du rapport intégral de la Cour des comptes."}
  - {"id":"STUDY-HCREP-EXEMPTIONS-2024","title":"Note d’orientation sur les exonérations de cotisations sociales","organization":"Haut Conseil des rémunérations, de l’emploi et de la productivité","publication_date":"2024-12-16","study_type":"descriptive","source_ids":["SOURCE-HCREP-EXEMPTIONS-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels constats et arbitrages ressortent de l'examen des exonérations de cotisations sociales et des scénarios de réforme ?","methods":["Analyse institutionnelle du rapport Bozio-Wasmer","Synthèse de littérature économique et de simulations","Examen des ordres de grandeur issus du PLFSS"],"population_or_unit":"Dispositifs d'exonération de cotisations sociales et finances publiques en France","geographic_scope":["France"],"temporal_scope":"Note du 16 décembre 2024 ; estimation des exonérations pour 2024","key_findings":["La note indique 78 Md€ pour l'ensemble des exonérations de cotisations sociales en 2024 selon le PLFSS, dont 66 Md€ pour les dispositifs généraux.","Le HCREP souligne que les trappes à bas salaire sont plausibles mais difficiles à démontrer empiriquement en France.","Le HCREP distingue les effets positifs des exonérations sur l'emploi de leurs possibles effets négatifs sur les dynamiques salariales, la formation et la productivité."],"limitations":["Note d'orientation institutionnelle, non étude causale indépendante.","Les montants doivent être réconciliés avec d'autres sources et conventions comptables.","Les trappes à bas salaire sont présentées comme difficiles à établir empiriquement en France."],"review_status":"screened","review_notes":"Document primaire consulté ; les annexes et la réconciliation détaillée des conventions comptables restent à examiner."}
  - {"id":"STUDY-BELGIUM-CORDON-WALLONIA-FLANDERS-2021","title":"Comparaison du cordon sanitaire en Wallonie et de l'accommodation en Flandre","organization":"Government and Opposition","publication_date":"2021-10","study_type":"qualitative","source_ids":["SOURCE-BELGIUM-CORDON-WALLONIA-FLANDERS-2021"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"Comment les réponses des partis et des médias contribuent-elles aux trajectoires différenciées de la droite radicale ?","methods":["Étude de cas comparative","18 entretiens semi-directifs","Analyse historique et documentaire"],"population_or_unit":"Écosystèmes partisans et médiatiques wallon et flamand","geographic_scope":["Belgique","Wallonie","Flandre"],"temporal_scope":"Jusqu'en 2021","key_findings":["Les partis et médias francophones ont contribué à un environnement plus hostile en Wallonie.","Les acteurs flamands ont été plus accommodants.","L'histoire, les réseaux militants et l'offre politique sont complémentaires."],"limitations":["Étude qualitative non expérimentale.","Le cordon n'est pas isolé des facteurs structurels."],"review_status":"screened"}
  - {"id":"STUDY-GERMANY-BRANDMAUER-FAHEY-ALARIAN-2025","title":"Expérience d'enquête sur les signaux de préservation ou de rupture de la Brandmauer","organization":"German Politics and Society","publication_date":"2025","study_type":"experimental","source_ids":["SOURCE-GERMANY-BRANDMAUER-FAHEY-ALARIAN-2025"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"Les signaux de préservation ou de rupture du cordon modifient-ils les attitudes des électeurs ?","methods":["Expérimentation d'enquête pendant la campagne fédérale 2025"],"population_or_unit":"Électeurs allemands interrogés","geographic_scope":["Allemagne"],"temporal_scope":"Campagne fédérale 2025","key_findings":["Aucun effet statistiquement détecté sur l'approbation des partis, la satisfaction démocratique, le choix électoral ou les attitudes envers l'immigration."],"limitations":["Effets immédiats et déclaratifs.","Un résultat nul ne prouve pas l'absence d'effets de long terme."],"review_status":"screened"}
  - {"id":"STUDY-COALITION-SIGNALS-FOUR-COUNTRIES-2025","title":"Effets des signaux de coalition avec la droite radicale dans quatre contextes européens","organization":"Journal of European Public Policy","publication_date":"2025-10-01","study_type":"experimental","source_ids":["SOURCE-COALITION-SIGNALS-FOUR-COUNTRIES-2025"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"Comment les signaux de coalition affectent-ils affect partisan, distance sociale et tolérance ?","methods":["Expériences d'enquête comparatives","Allemagne, Flandre, Espagne, Autriche","N=5 594"],"population_or_unit":"Répondants adultes dans quatre contextes","geographic_scope":["Allemagne","Flandre","Espagne","Autriche"],"temporal_scope":"2025","key_findings":["Le cordon n'apparaît pas comme un facteur contextuel systématiquement déterminant.","Les signaux d'élites peuvent déplacer les perceptions, avec hétérogénéité."],"limitations":["Expérience de signal, non observation d'une coalition réelle."],"review_status":"screened"}
  - {"id":"STUDY-FRANCE-CANDIDATE-WITHDRAWAL-2024","title":"Motivations des désistements de candidats aux législatives françaises de 2024","organization":"Comparative European Politics","publication_date":"2024-11-26","study_type":"qualitative","source_ids":["SOURCE-FRANCE-CANDIDATE-WITHDRAWAL-2024"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"Quels facteurs ont conduit les candidats qualifiés à se retirer avant le second tour ?","methods":["29 entretiens semi-directifs en juillet 2024"],"population_or_unit":"Candidats ayant retiré leur candidature","geographic_scope":["France métropolitaine"],"temporal_scope":"Législatives 2024","key_findings":["Les retraits relèvent de tactiques électorales, pressions partisanes et citoyennes, contenu de campagne et anticipation de bénéfices futurs."],"limitations":["Entretiens rétrospectifs et échantillon qualitatif.","Ne mesure pas l'effet causal des retraits sur les sièges."],"review_status":"screened"}
  - {"id":"STUDY-KRAUSE-COHEN-ABOU-CHADI-2023-ACCOMMODATION","title":"Stratégies d'accommodation des partis établis et succès électoral de la droite radicale","organization":"Political Science Research and Methods","publication_date":"2023","study_type":"observational","source_ids":["SOURCE-KRAUSE-COHEN-ABOU-CHADI-2023-ACCOMMODATION"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"L'adoption de positions centrales de la droite radicale par les partis établis réduit-elle son succès électoral, et le cordon sanitaire modifie-t-il cet effet ?","methods":["Analyse de plus de 350 stratégies de partis dans 108 contextes électoraux","Résultats électoraux 1976–2017","Données individuelles de transferts de voix entre élections"],"population_or_unit":"Partis établis, partis de droite radicale et électeurs dans plusieurs démocraties européennes","geographic_scope":["Europe"],"temporal_scope":"1976–2017","key_findings":["Aucun effet général ou conditionnel convaincant de l'accommodation sur la réduction du soutien à la droite radicale.","Les déplacements accommodants déclenchent des transferts dans les deux sens, mais les gains bruts de la droite radicale tendent à dépasser ses pertes.","La combinaison accommodation + cordon ne protège pas systématiquement les partis établis et peut être défavorable à ceux-ci."],"limitations":["Analyse observationnelle exposée à l'endogénéité des stratégies.","La mesure électorale ne renseigne pas directement sur la résilience démocratique à long terme."],"review_status":"screened"}
  - {"id":"STUDY-WAGNER-MEYER-2016-IDEOLOGICAL-LANDSCAPE","title":"Évolution idéologique des systèmes partisans d'Europe occidentale, 1980–2014","organization":"Political Studies","publication_date":"2016","study_type":"observational","source_ids":["SOURCE-WAGNER-MEYER-2016-IDEOLOGICAL-LANDSCAPE"],"domains":["DOMAIN-POLITICS"],"research_question":"La droite radicale s'est-elle rapprochée du courant dominant ou les partis traditionnels ont-ils convergé vers ses positions ?","methods":["Analyse de contenu de 525 manifestes","68 partis dans 17 pays","Mesure des positions et de la saillance des enjeux libéraux-autoritaires et économiques"],"population_or_unit":"Programmes électoraux des partis d'Europe occidentale","geographic_scope":["Europe occidentale","17 pays"],"temporal_scope":"1980–2014","key_findings":["Les partis traditionnels de gauche et de droite ont accru l'attention accordée aux enjeux libéraux-autoritaires et se sont déplacés vers la droite sur cette dimension.","Les partis de droite radicale sont restés des concurrents de niche, tout en accentuant leur positionnement et la saillance de ces enjeux.","Les systèmes partisans ont connu un déplacement idéologique vers des positions plus autoritaires au cours de la période."],"limitations":["Les manifestes reflètent les positions déclarées des partis, pas directement l'opinion publique ni les effets des politiques.","La contribution causale du cordon sanitaire n'est pas isolée."],"review_status":"screened"}
  - {"id":"STUDY-DE-LEEUW-BOURNE-2020-PARTY-BANS-ESS","title":"Attitudes citoyennes envers les stratégies de défense démocratique et l'interdiction des partis","organization":"International Journal of Public Opinion Research","publication_date":"2020","study_type":"observational","source_ids":["SOURCE-DE-LEEUW-BOURNE-2020-PARTY-BANS-ESS"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS","DOMAIN-SECURITY"],"research_question":"Dans quelle mesure les citoyens européens soutiennent-ils l'interdiction de partis extrémistes et quels facteurs individuels et nationaux expliquent ces attitudes ?","methods":["European Social Survey 2002–2010","N=195 405 dans 27 pays","Modèles multiniveaux et analyse âge-période-cohorte"],"population_or_unit":"Citoyens adultes de 27 pays européens","geographic_scope":["27 pays européens"],"temporal_scope":"2002–2010","key_findings":["Les interdictions de partis bénéficient d'un soutien majoritaire dans les pays étudiés.","Les attitudes individuelles envers l'ordre démocratique et les héritages autoritaires jouent un rôle, mais les différences nationales expliquent peu les variations de soutien."],"limitations":["Le soutien déclaré n'est pas une mesure de l'effet réel d'une interdiction.","Les interdictions ne sont pas équivalentes aux cordons sanitaires ni aux désistements électoraux."],"review_status":"screened"}
  - {"id":"STUDY-BIARD-2021-DIACHRONIC-CORDON","title":"Trajectoire diachronique du cordon sanitaire en Belgique","organization":"Routledge / Belgian Exceptionalism","publication_date":"2021","study_type":"qualitative","source_ids":["SOURCE-BIARD-2021-DIACHRONIC-CORDON"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"Comment le cordon sanitaire belge s'est-il maintenu pendant plus de trente ans et quelles pressions ont fragilisé sa durabilité ?","methods":["36 entretiens avec élus et responsables de partis","Archives médiatiques","Analyse historique des votes, alliances et tentatives de coalition"],"population_or_unit":"Partis établis, Vlaams Belang, élus et responsables politiques belges","geographic_scope":["Belgique","Flandre"],"temporal_scope":"Des années 1990 à 2020 ; entretiens en 2017","key_findings":["Le cordon a empêché la conversion de la force électorale du Vlaams Belang en participation exécutive pendant la période étudiée.","La norme a été mise sous pression par des votes parlementaires, des alliances locales, des tentatives de coalition et des contestations internes.","Le maintien du cordon dépend de justifications de valeurs, d'idéologie et de refus d'association ; sa durabilité n'est pas automatique."],"limitations":["Étude qualitative belge, non expérimentale.","Ne mesure pas directement l'évolution de l'adhésion populaire aux idées du Vlaams Belang."],"review_status":"screened"}

  - {"id":"STUDY-AUSTRIA-FPO-GOVERNMENT-STRATEGY-2015","title":"Inclusion gouvernementale, exclusion et trajectoire du FPÖ autrichien, 2000–2007","organization":"Democratization","publication_date":"2015","study_type":"qualitative","source_ids":["SOURCE-AUSTRIA-FPO-GOVERNMENT-STRATEGY-2015"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"research_question":"L'incorporation du FPÖ au gouvernement a-t-elle modéré le parti ou réduit durablement son succès ?","methods":["Étude des réactions des partis et médias","Analyse des mobilisations de la société civile","Reconstitution historique de la coalition 2000–2007"],"population_or_unit":"FPÖ, ÖVP, médias et société civile autrichienne","geographic_scope":["Autriche"],"temporal_scope":"2000–2007 et retour ultérieur du FPÖ","key_findings":["L'ostracisation n'a pas suffi à modérer le FPÖ ni à enrayer durablement son succès.","L'incorporation a coïncidé avec un quasi-effondrement et une scission, mais l'inexpérience et les conflits internes ont aussi joué.","Le retour ultérieur montre qu'aucune stratégie d'accès institutionnel ne neutralise durablement les causes du soutien."],"limitations":["Étude de cas et attribution causale partielle."],"review_status":"screened"}
  - {"id":"STUDY-AUSTRIA-FPO-POLICY-UNCONSTITUTIONALITY-2022","title":"Constitutionnalité des politiques soutenues par les partis populistes en Autriche, 1980–2021","organization":"European Journal of Political Research","publication_date":"2022","study_type":"observational","source_ids":["SOURCE-AUSTRIA-FPO-POLICY-UNCONSTITUTIONALITY-2022"],"domains":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS","DOMAIN-SECURITY"],"research_question":"Quel rôle jouent les contre-pouvoirs judiciaires dans le contrôle des politiques soutenues par les partis populistes ?","methods":["Analyse longitudinale des décisions de la Cour constitutionnelle","Comparaison des politiques soutenues par élus populistes et non populistes"],"population_or_unit":"Politiques et décisions constitutionnelles en Autriche","geographic_scope":["Autriche"],"temporal_scope":"1980–2021","key_findings":["L'indépendance judiciaire est une condition de la capacité des tribunaux à contrôler les politiques.","Le FPÖ n'a pas disposé d'une majorité suffisante pour imposer une refonte judiciaire générale."],"limitations":["Les décisions de justice ne mesurent pas toutes les dimensions de l'érosion démocratique."],"review_status":"screened"}
  - {"id":"STUDY-AUSTRIA-FPO-WELFARE-POLICY-2016","title":"Profil social et distributif du FPÖ dans ses programmes et au gouvernement, 1983–2013","organization":"Swiss Political Science Review","publication_date":"2016","study_type":"observational","source_ids":["SOURCE-AUSTRIA-FPO-WELFARE-POLICY-2016"],"domains":["DOMAIN-POLITICS","DOMAIN-ECONOMY","DOMAIN-INSTITUTIONS"],"research_question":"Comment le FPÖ définit-il les bénéficiaires légitimes de la protection sociale et comment ses priorités évoluent-elles ?","methods":["Analyse des manifestes FPÖ 1983–2013","Analyse des propositions sociales et réformes de coalition 2000–2005"],"population_or_unit":"Programmes et politiques sociales du FPÖ","geographic_scope":["Autriche"],"temporal_scope":"1983–2013","key_findings":["La politique sociale du FPÖ distingue les groupes jugés méritants et non méritants plutôt que de défendre uniformément un État social plus ou moins généreux.","La coalition 2000–2005 a combiné des mesures populaires et des réformes impopulaires, notamment sur les retraites.","Après 2005, la préférence nationale dans l'accès aux prestations devient plus centrale."],"limitations":["Les programmes et réformes ne suffisent pas à mesurer les effets distributifs individuels."],"review_status":"screened"}

  - {"id":"STUDY-BOLET-FOOS-2025-MEDIA-PLATFORMING","title":"Effets de l'exposition médiatique à des activistes d'extrême droite et de l'interview critique","organization":"British Journal of Political Science","publication_date":"2025","study_type":"experimental","source_ids":["SOURCE-BOLET-FOOS-2025-MEDIA-PLATFORMING"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"L'exposition à des interviews d'activistes d'extrême droite augmente-t-elle l'accord avec leurs affirmations et leur popularité perçue ; la confrontation journalistique modère-t-elle ces effets ?","methods":["Expériences d'enquête en population au Royaume-Uni et en Australie","Comparaison exposition versus contenu neutre","Variation du cadrage de la plateforme","Variation interview contestée/non contestée dans l'expérience britannique"],"population_or_unit":"Participants d'enquêtes en population au Royaume-Uni et en Australie","geographic_scope":["Royaume-Uni","Australie"],"temporal_scope":"Stimuli médiatiques de 2018 ; article publié en 2025","key_findings":["L'exposition à des interviews non contestées augmente l'accord avec des affirmations extrêmes et la perception que davantage de personnes les partagent.","Dans l'expérience britannique, la confrontation journalistique détériore l'image du locuteur et atténue les effets sur les attitudes.","Même en cas de confrontation, l'effet sur la perception de la popularité des idées n'est pas entièrement supprimé."],"limitations":["Effets mesurés à court terme ; pas de suivi longitudinal dans cette expérience.","Stimuli spécifiques à des activistes d'extrême droite ; généralisation limitée."],"review_status":"screened"}
  - {"id":"STUDY-DE-JONGE-GAUFMAN-2022-MEDIA-NORMALIZATION","title":"Normalisation discursive de l'extrême droite dans la presse néerlandaise avant les élections de 2021","organization":"Discourse & Society","publication_date":"2022","study_type":"qualitative","source_ids":["SOURCE-DE-JONGE-GAUFMAN-2022-MEDIA-NORMALIZATION"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Comment les médias généralistes reprennent-ils ou accommodent-ils les thèmes et cadrages de la droite radicale ?","methods":["Analyse discursive et conceptuelle d'articles de presse néerlandais","Étude de cas centrée sur le Forum voor Democratie avant les élections de 2021"],"population_or_unit":"Articles de presse et discours médiatiques néerlandais","geographic_scope":["Pays-Bas"],"temporal_scope":"Période précédant les élections générales de 2021","key_findings":["L'étude identifie des pratiques d'accommodation dans des médias généralistes.","La reprise de thèmes, formulations et cadrages peut contribuer à déplacer les frontières du discours considéré comme normal."],"limitations":["Analyse qualitative illustrative ; pas d'estimation causale de l'effet sur les lecteurs."],"review_status":"screened"}
  - {"id":"STUDY-VOLKER-2026-MEDIA-CORDON-GERMANY","title":"Contraintes professionnelles et effritement du cordon médiatique en Allemagne","organization":"Political Research Exchange","publication_date":"2026","study_type":"qualitative","source_ids":["SOURCE-VOLKER-2026-MEDIA-CORDON-GERMANY"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-INSTITUTIONS"],"research_question":"Quels facteurs conduisent les journalistes à maintenir, adapter ou abandonner la démarcation médiatique face à l'extrême droite ?","methods":["21 entretiens semi-directifs auprès de journalistes","Comparaison des médias selon régions, orientations, financements et formats"],"population_or_unit":"Journalistes et responsables éditoriaux allemands","geographic_scope":["Allemagne"],"temporal_scope":"Recherche publiée en 2026","key_findings":["Les réponses médiatiques sont façonnées par les stratégies des acteurs, les pressions externes, la perception de la demande du public et les contraintes institutionnelles.","Les pratiques peuvent devenir réactives et contribuer involontairement à la visibilité et à la légitimité des acteurs."],"limitations":["Les entretiens documentent les pratiques et perceptions, non les effets directs sur les audiences."],"review_status":"screened"}

  - {"id":"STUDY-PORTER-WOOD-2024-FACTUAL-CORRECTIONS","title":"Efficacité et limites des corrections factuelles","organization":"Current Opinion in Psychology","publication_date":"2024","study_type":"other","source_ids":["SOURCE-PORTER-WOOD-2024-FACTUAL-CORRECTIONS"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Les corrections factuelles améliorent-elles les croyances et à quelle fréquence provoquent-elles un effet de retour de flamme ?","methods":["Revue de la littérature expérimentale sur les corrections et fact-checks"],"population_or_unit":"Études expérimentales sur des publics et sujets variés","geographic_scope":["International"],"temporal_scope":"Littérature synthétisée jusqu'en 2023","key_findings":["Les corrections factuelles améliorent généralement l'exactitude des croyances dans différents pays, orientations politiques et groupes démographiques.","Les effets de retour de flamme sont extrêmement rares et peuvent résulter de choix méthodologiques.","Les effets sur les croyances peuvent s'atténuer ; les effets sur attitudes et comportements sont souvent faibles ou inexistants."],"limitations":["Revue centrée sur les corrections de désinformation, pas sur la légitimité normative des idées.","La visibilité de la correction reste un problème : les personnes exposées à la désinformation ne voient pas nécessairement sa réfutation."],"review_status":"screened"}
  - {"id":"STUDY-WOOD-ETAL-2024-DEBRIEFING-MISINFORMATION","title":"Corriger rapidement et explicitement après exposition à une désinformation","organization":"PNAS Nexus","publication_date":"2024","study_type":"experimental","source_ids":["SOURCE-WOOD-ETAL-2024-DEBRIEFING-MISINFORMATION"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Un débriefing standard suffit-il à annuler les effets d'une exposition expérimentale à la désinformation politique ?","methods":["Expériences comparant débriefing standard et correction précoce, informative et activement reconnue"],"population_or_unit":"Participants d'expériences en sciences sociales","geographic_scope":["États-Unis"],"temporal_scope":"Publication 2024","key_findings":["Un débriefing standard en fin d'expérience ne suffit pas toujours à effacer les effets de l'exposition.","Une correction présentée rapidement, explicitement et avec reconnaissance active de l'exposition réduit mieux les effets sur les croyances et attitudes."],"limitations":["Le cadre expérimental ne reproduit pas intégralement les débats publics réels."],"review_status":"screened"}
  - {"id":"STUDY-HORTA-RIBEIRO-ETAL-2023-PARLER-DEPLATFORMING","title":"Déplateformisation de Parler et déplacement vers d'autres réseaux marginaux — Horta Ribeiro et al.","organization":"PNAS Nexus","publication_date":"2023","study_type":"quasi_experimental","source_ids":["SOURCE-HORTA-RIBEIRO-ETAL-2023-PARLER"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"La fermeture de Parler réduit-elle l'activité des utilisateurs sur l'ensemble des réseaux marginaux ?","methods":["Deux panels longitudinaux d'activité en ligne (N = 112 705)","Différences-de-différences sur les utilisateurs actifs de Parler (N = 996)"],"population_or_unit":"Utilisateurs américains de réseaux sociaux, avec analyse des utilisateurs actifs de Parler","geographic_scope":["États-Unis"],"temporal_scope":"Janvier-février 2021","key_findings":["Après la fermeture de Parler, l'activité sur d'autres plateformes marginales augmente.","Chez les anciens utilisateurs actifs de Parler, la probabilité d'activité quotidienne sur d'autres réseaux marginaux augmente de 10,9 points sur ordinateur et 15,9 points sur mobile.","La fermeture isolée de Parler ne réduit pas l'activité globale des utilisateurs sur les réseaux marginaux."],"limitations":["Mesure le déplacement d'activité, pas les attitudes, l'influence politique ou la production de contenus hors ligne.","Ne permet pas de généraliser à toutes les formes de déplateformisation."],"review_status":"screened"}
  - {"id":"STUDY-KLINENBERG-2024-DEPLATFORMING-CREATORS","title":"Effets du retrait de créateurs extrémistes de YouTube sur audience et revenus","organization":"Journal of Conflict Resolution","publication_date":"2024","study_type":"observational","source_ids":["SOURCE-KLINENBERG-2024-DEPLATFORMING-CREATORS"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Le retrait de créateurs extrémistes d'une grande plateforme réduit-il leur audience et leurs revenus au total ?","methods":["Variation temporelle des retraits de YouTube","Suivi de 79 créateurs et comparaison de l'audience et des revenus sur BitChute"],"population_or_unit":"79 créateurs de contenus d'extrême droite","geographic_scope":["États-Unis"],"temporal_scope":"Étude publiée en 2024","key_findings":["Le retrait de YouTube est suivi d'une hausse de 50 % de la vue hebdomadaire sur BitChute et de 30 % des revenus hebdomadaires en bitcoin sur cette plateforme.","Cette hausse compense une partie seulement des pertes sur YouTube ; l'effet net estimé est une baisse de l'audience et des revenus totaux."],"limitations":["L'écosystème de plateformes observé est spécifique et les mesures ne captent pas toutes les formes d'influence.","Ne mesure pas directement les changements d'attitudes des audiences."],"review_status":"screened"}
  - {"id":"STUDY-REACTANCE-META-2026","title":"Réactance psychologique face aux messages menaçant la liberté","organization":"Human Communication Research","publication_date":"2026","study_type":"meta_analysis","source_ids":["SOURCE-REACTANCE-META-2026"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Dans quelle mesure un langage perçu comme menaçant la liberté suscite-t-il colère, pensées négatives et réactance ?","methods":["Méta-analyse de 28 articles, 33 études et 146 tailles d'effet"],"population_or_unit":"Études de communication persuasive publiées entre 2005 et 2024","geographic_scope":["International"],"temporal_scope":"Littérature 2005–2024","key_findings":["Un langage fortement menaçant pour la liberté augmente en moyenne la colère (r = .21), les cognitions négatives (r = .17) et la réactance psychologique (r = .20).","La réactance constitue un mécanisme plausible de résistance à une injonction ou à une restriction perçue comme coercitive."],"limitations":["Ne démontre pas qu'une interdiction de tribune renforce nécessairement l'adhésion à l'idée interdite.","Les résultats proviennent de contextes de communication persuasive, avec hétérogénéité entre études."],"review_status":"screened"}
  - {"id":"STUDY-DE-JONGE-2021-BELGIUM-CORDON","title":"Comparaison qualitative des environnements politiques et médiatiques en Wallonie et Flandre","organization":"Government and Opposition","publication_date":"2021","study_type":"qualitative","source_ids":["SOURCE-DE-JONGE-2021-BELGIUM-CORDON"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Comment les différences d'environnement politique et médiatique contribuent-elles aux trajectoires divergentes de la droite radicale en Wallonie et Flandre ?","methods":["Étude de cas comparative","18 entretiens semi-directifs","Analyse historique et documentaire"],"population_or_unit":"Professionnels des médias, responsables politiques et trajectoires partisanes belges","geographic_scope":["Belgique francophone","Flandre"],"temporal_scope":"Trajectoires historiques jusqu'en 2019","key_findings":["Le contexte wallon de démarcation politique et médiatique est associé à une difficulté de percée électorale de la droite radicale.","La force organisationnelle, les réseaux militants, la fragmentation partisane et les clivages historiques contribuent aussi aux différences régionales.","Le cordon politique existait dans les deux régions, mais la démarcation médiatique était beaucoup plus rigide en Belgique francophone."],"limitations":["Étude qualitative, pas d'identification causale isolant l'effet du cordon.","N'évalue pas directement les changements d'attitudes individuelles ni la qualité globale de la démocratie."],"review_status":"screened"}
  - {"id":"STUDY-YE-ETAL-2026-ILLUSORY-TRUTH-META","title":"Méta-analyse de l'effet de vérité illusoire","organization":"Nature Communications","publication_date":"2026","study_type":"meta_analysis","source_ids":["SOURCE-YE-ETAL-2026-ILLUSORY-TRUTH-META"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Dans quelle mesure la répétition augmente-t-elle la vérité perçue des affirmations et quels facteurs modèrent cet effet ?","methods":["Méta-analyse de 182 études et 366 tailles d'effet","N total = 31 184 participants","Correction des effets de petites études et analyses de modérateurs"],"population_or_unit":"Participants d'études expérimentales publiées entre 1977 et 2025","geographic_scope":["International"],"temporal_scope":"Littérature 1977–2025","key_findings":["La répétition augmente la vérité perçue avec un effet moyen faible mais robuste (g = 0,37 après correction).","L'effet est hétérogène et dépend notamment du type de contenu, de la tâche à la première exposition et des indices de véracité."],"limitations":["La méta-analyse ne teste pas directement le cordon sanitaire ou le débat politique télévisé.","La familiarité n'explique pas à elle seule la croyance et la diffusion des idées."],"review_status":"screened"}
  - {"id":"STUDY-ECKER-ETAL-2020-FAMILIARITY-BACKFIRE","title":"Trois expériences sur le risque de diffuser une fausse information en la corrigeant","organization":"Cognitive Research: Principles and Implications","publication_date":"2020","study_type":"experimental","source_ids":["SOURCE-ECKER-ETAL-2020-FAMILIARITY-BACKFIRE"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"La correction d'une information nouvelle renforce-t-elle sa familiarité auprès de personnes qui ne l'avaient jamais rencontrée ?","methods":["Trois expériences (N = 1 718)","Mesure après une semaine"],"population_or_unit":"Participants exposés ou non à des affirmations de désinformation nouvelles","geographic_scope":["États-Unis"],"temporal_scope":"Publication 2020","key_findings":["Les expériences n'apportent pas de preuve globale d'un effet de familiarité qui renforcerait les idées fausses chez les personnes découvrant l'affirmation par la correction.","La correction d'une information nouvelle ne produit pas systématiquement un effet de retour de flamme."],"limitations":["Résultats expérimentaux sur des stimuli spécifiques ; variation entre expériences."],"review_status":"screened"}
  - {"id":"STUDY-GRANADOS-ALBARRACIN-2025-BYPASSING","title":"Six expériences préenregistrées comparant correction directe et explication alternative","organization":"Journal of Experimental Psychology: General","publication_date":"2025","study_type":"experimental","source_ids":["SOURCE-GRANADOS-ALBARRACIN-2025-BYPASSING"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Une explication alternative peut-elle mieux réduire les effets de la désinformation qu'une correction par simple négation ?","methods":["Six expériences préenregistrées","Comparaison correction et bypassing","Stimuli fictifs puis informations réelles"],"population_or_unit":"Participants adultes recrutés aux États-Unis","geographic_scope":["États-Unis"],"temporal_scope":"Publication 2025","key_findings":["Le bypassing modifie parfois davantage les attitudes et intentions que la simple négation.","L'avantage dépend du fait que les participants forment une attitude dès la première exposition.","Avec des informations réelles, l'avantage concerne l'évaluation de l'objet mais pas les attitudes de politique publique ou les intentions."],"limitations":["Stimuli expérimentaux et échantillons américains non représentatifs.","Ne teste pas les discours idéologiques complexes ou la stratégie de non-tribune."],"review_status":"screened"}
  - {"id":"STUDY-SIMCHON-ETAL-2026-INOCULATION-META","title":"Méta-analyse de 33 expériences d'inoculation contre la désinformation","organization":"Current Opinion in Psychology","publication_date":"2026","study_type":"meta_analysis","source_ids":["SOURCE-SIMCHON-ETAL-2026-INOCULATION-META"],"domains":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"L'inoculation améliore-t-elle le discernement sans accroître une méfiance générale envers l'information ?","methods":["Méta-analyse hiérarchique bayésienne","Théorie de détection du signal","33 expériences, N = 37 025"],"population_or_unit":"Participants de 13 publications expérimentales","geographic_scope":["International"],"temporal_scope":"Publication 2026","key_findings":["L'inoculation améliore la discrimination entre nouvelles fiables et non fiables.","Pas d'augmentation systématique du biais général de réponse ou de méfiance."],"limitations":["Ne mesure pas directement le vote ou l'adhésion à des idéologies.","Durabilité à long terme à étudier."],"review_status":"screened"}
  - {"id":"STUDY-KOEHLER-2016-FALSE-BALANCE","title":"Expériences sur les effets du faux équilibre journalistique sur la perception du consensus","organization":"Journal of Experimental Psychology: Applied","publication_date":"2016","study_type":"experimental","source_ids":["SOURCE-KOEHLER-2016-FALSE-BALANCE"],"domains":["DOMAIN-MEDIA","DOMAIN-SOCIETY","DOMAIN-SCIENCE"],"research_question":"La présentation bilatérale de deux experts en désaccord brouille-t-elle la perception du consensus réel ?","methods":["Plusieurs expériences contrôlées","Comparaison condition faux équilibre et condition contrôle avec décompte des experts"],"population_or_unit":"Participants adultes évaluant le consensus d'experts","geographic_scope":["États-Unis"],"temporal_scope":"Publication 2016","key_findings":["La présentation de commentaires contradictoires réduit la capacité à distinguer les sujets à consensus fort des sujets sans consensus.","Le faux équilibre peut fausser la perception même lorsque le décompte des experts est fourni."],"limitations":["Cadre expérimental spécifique, pas une évaluation exhaustive du journalisme politique."],"review_status":"screened"}
  - {"id":"STUDY-DIEHL-ETAL-2025-ACADEMIC-FREEDOM","title":"Trois expériences d'enquête sur les motifs de restriction de la liberté académique","organization":"Proceedings of the National Academy of Sciences","publication_date":"2025","study_type":"experimental","source_ids":["SOURCE-DIEHL-ETAL-2025-ACADEMIC-FREEDOM"],"domains":["DOMAIN-EDUCATION","DOMAIN-INSTITUTIONS","DOMAIN-SOCIETY"],"research_question":"Les demandes de restriction de la parole universitaire relèvent-elles de standards académiques, de préoccupations de préjudice ou de discrimination idéologique ?","methods":["Trois expériences préenregistrées","Collaboration contradictoire entre chercheurs","Vignettes expérimentales idéologiquement équilibrées"],"population_or_unit":"Étudiants universitaires allemands","geographic_scope":["Allemagne"],"temporal_scope":"Publication 2025","key_findings":["Une part substantielle des étudiants soutient des restrictions fondées sur le point de vue dans les scénarios testés.","Les préoccupations de préjudice social expliquent une partie de l'écart mais n'épuisent pas l'effet idéologique."],"limitations":["Mesure les préférences déclarées, pas les effets réels des annulations ou conférences sur l'apprentissage, la polarisation ou la sécurité."],"review_status":"screened"}
  - {"id":"STUDY-LASELVA-ETAL-2026-CLIMATE-PREBUNKING","title":"Revue systématique des interventions de pré-bunking contre la désinformation climatique","organization":"Journal of Environmental Psychology","publication_date":"2026","study_type":"systematic_review","source_ids":["SOURCE-LASELVA-ETAL-2026-CLIMATE-PREBUNKING"],"domains":["DOMAIN-ENVIRONMENT","DOMAIN-MEDIA","DOMAIN-SOCIETY"],"research_question":"Quelles interventions de pré-bunking réduisent la susceptibilité à la désinformation climatique et avec quelle durabilité ?","methods":["Revue systématique PRISMA de 13 articles","Évaluation du risque de biais"],"population_or_unit":"Études d'intervention sur la désinformation climatique","geographic_scope":["International"],"temporal_scope":"Articles 2017–2025","key_findings":["Les interventions d'inoculation et les messages de consensus scientifique sont prometteurs.","Les formats actifs et expérientiels montrent un potentiel pédagogique.","Seules deux études sont longitudinales."],"limitations":["Base empirique encore restreinte et données de long terme limitées."],"review_status":"screened"}
  - {"id":"STUDY-KOLLBERG-BANTEL-2026-COMMON-FRONT-RHETORIC","title":"Effets de la rhétorique de front commun sur la polarisation affective envers la droite radicale","organization":"West European Politics","publication_date":"2025-09-03","study_type":"mixed_methods","source_ids":["SOURCE-KOLLBERG-BANTEL-2026-COMMON-FRONT-RHETORIC"],"domains":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"research_question":"Comment la rhétorique de front commun des partis établis envers la droite radicale est-elle associée à la polarisation affective, et quel effet immédiat produit la source du message ?","methods":["Analyse textuelle de quatre années de débats au Bundestag","Mise en relation avec des données d'opinion","Expérience d'enquête randomisée manipulant la source de messages négatifs réels dirigés contre l'AfD"],"population_or_unit":"Débats parlementaires allemands et échantillon représentatif d'environ 3 100 électeurs de partis établis","geographic_scope":["Allemagne"],"temporal_scope":"Quatre années de débats au Bundestag ; publication 2025","key_findings":["L'expérience identifie un effet immédiat de la source des messages sur l'évaluation affective de l'AfD dans le contexte étudié.","L'analyse des débats parlementaires décrit les usages de la rhétorique de front commun, sans établir à elle seule une causalité."],"limitations":["L'expérience porte sur l'évaluation affective de l'AfD, pas sur l'adhésion à ses propositions ni sur l'efficacité institutionnelle du cordon.","Les effets sur la cohésion sociale et la distinction entre dirigeants et électeurs doivent être examinés séparément.","L'analyse observationnelle reste corrélationnelle ; l'expérience identifie un effet immédiat des messages."],"review_status":"screened","review_notes":"Première fiche structurée à partir de la référence et des éléments méthodologiques du registre de sources ; vérifier le texte intégral et les résultats détaillés avant de préciser la direction et l'ampleur des effets."}

  - {"id":"STUDY-VAN-DER-DOES-JACQUET-2023-SPILLOVER","title":"Effets de débordement des mini-publics délibératifs sur les citoyens participants et non participants","organization":"Ramon van der Does et Vincent Jacquet","publication_date":"2023-02-01","study_type":"systematic_review","source_ids":["SOURCE-VAN-DER-DOES-JACQUET-2023-SPILLOVER-REVIEW"],"domains":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"research_question":"Dans quelle mesure les mini-publics délibératifs ont-ils des effets durables sur leurs participants et des effets de débordement sur les citoyens qui n'y participent pas ?","methods":["Revue systématique de la littérature empirique publiée avant 2019","Synthèse de 60 études éligibles publiées entre 1999 et 2018"],"population_or_unit":"Études empiriques portant sur les participants aux mini-publics et les citoyens non participants","geographic_scope":["International"],"temporal_scope":"Études 1999-2018 ; publication en ligne 2021, volume 2023","key_findings":["La revue identifie 60 études empiriques éligibles.","Les preuves relatives à la plupart des effets de débordement restent provisoires, car le corpus empirique demeure limité."],"limitations":["La revue ne couvre pas les études publiées après 2018.","Les effets sur les participants et les effets sur les non-participants doivent rester distingués."],"review_status":"screened","review_notes":"Référence importante pour ne pas confondre apprentissages des 150 participants, diffusion vers le public et transformation du débat politique."}
  - {"id":"STUDY-DEMOCRATIC-INNOVATIONS-META-ANALYSIS-2024","title":"Effets des innovations démocratiques sur les attitudes, comportements et capacités des participants","organization":"European Journal of Political Research","publication_date":"2024","study_type":"meta_analysis","source_ids":["SOURCE-META-ANALYSIS-DEMOCRATIC-INNOVATIONS-2024"],"domains":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"research_question":"Quels effets les innovations démocratiques, en particulier les mini-publics, ont-elles sur les attitudes politiques, les connaissances, l'efficacité politique interne et les capacités de raisonnement des participants ?","methods":["Méta-analyse de 100 études quantitatives empiriques publiées entre 1980 et 2020","Comparaison des types d'innovations démocratiques et des familles d'effets mesurés"],"population_or_unit":"Participants à des mini-publics, processus participatifs, référendums et initiatives citoyennes dans les études incluses","geographic_scope":["International"],"temporal_scope":"Études 1980-2020 ; publication 2024","key_findings":["Les mini-publics sont les dispositifs les plus étudiés parmi les innovations démocratiques considérées.","La méta-analyse trouve des effets positifs des mini-publics sur les attitudes politiques, les connaissances, l'efficacité politique interne et les capacités de raisonnement des participants.","Les mini-publics peuvent modifier les attitudes des participants envers les politiques publiques.","Les preuves concernant l'engagement civique et plusieurs autres dispositifs restent limitées."],"limitations":["Les résultats concernent les participants et ne démontrent pas un effet sur l'ensemble de la population.","Le nombre d'études disponibles est insuffisant pour conclure solidement sur plusieurs dispositifs et plusieurs résultats.","Les résultats moyens ne préjugent pas de la qualité du dispositif particulier Un commun accord."],"review_status":"screened","review_notes":"À exploiter pour formuler des attentes raisonnables sur les apprentissages et capacités des participants, sans en déduire une influence politique générale."}
  - {"id":"STUDY-GERMANN-2025-REPRESENTATIVENESS-LEGITIMACY","title":"Effet des biais de représentativité des mini-publics sur la légitimité perçue","organization":"Micha Germann, British Journal of Political Science","publication_date":"2025","study_type":"experimental","source_ids":["SOURCE-GERMANN-2025-MINIPUBLIC-REPRESENTATIVENESS"],"domains":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"research_question":"Comment des écarts de représentativité d'un mini-public influencent-ils les perceptions de légitimité de son rôle dans la décision démocratique ?","methods":["Expérience d'enquête préenregistrée","Manipulation expérimentale de niveaux de biais de représentativité","Échantillon N=1 308"],"population_or_unit":"Répondants à une expérience d'enquête sur la légitimité des mini-publics","geographic_scope":["À préciser à partir du texte intégral"],"temporal_scope":"Publication 2025","key_findings":["L'implication d'un mini-public peut accroître la légitimité perçue du processus démocratique.","Même des biais de composition modestes peuvent réduire ce gain de légitimité perçue ; des biais plus importants peuvent l'annuler."],"limitations":["Résultats expérimentaux sur des perceptions, non évaluation d'une assemblée réelle.","Vérifier les conditions expérimentales et la population étudiée dans le texte intégral avant de généraliser."],"review_status":"screened","review_notes":"Renforce la nécessité d'auditer les refus et l'attrition : une diversité descriptive affichée ne suffit pas si les participants effectifs s'écartent sensiblement de la population."}
  - {"id":"STUDY-CAHUC-CARCILLO-LE-BARBANCHON-2019-HIRING-CREDITS","title":"The Effectiveness of Hiring Credits — évaluation du dispositif « zéro charges » en France (2009)","authors":["Pierre Cahuc","Stéphane Carcillo","Thomas Le Barbanchon"],"organization":"Review of Economic Studies / IZA","publication_date":"2019-03-01","study_type":"quasi_experimental","source_ids":["SOURCE-CAHUC-CARCILLO-LE-BARBANCHON-2019-ZERO-CHARGES"],"domains":["DOMAIN-ECONOMY"],"research_question":"Quel est l'effet d'un crédit temporaire réservé aux nouveaux embauchés à bas salaire sur l'emploi et les heures des petites entreprises ?","methods":["Différences de différences : entreprises de 6 à moins de 10 ETP contre 10 à moins de 14 ETP.","Variable instrumentale sur cellules bassin d'emploi × secteur à partir de l'exposition pré-réforme aux embauches éligibles.","Placebo temporels, seuils placebo et variations de bande passante."],"population_or_unit":"Entreprises privées et emplois éligibles sous 1,6 SMIC ; pas d'estimation spécifique aux jeunes.","geographic_scope":["France"],"temporal_scope":"Données 2006–2011 ; identification principale sur l'année 2009.","key_findings":["Le crédit augmente d'environ 0,8 point la croissance de l'emploi et de 0,9 point celle des heures dans les entreprises traitées en 2009.","L'élasticité d'environ −4 [−6 ; −2] concerne le coût des seuls nouveaux entrants subventionnés ; l'élasticité recalculée pour le coût de tous les salariés est proche de −1 [−1,5 ; −0,5]."],"limitations":["Le traitement est une aide temporaire aux nouvelles embauches, non une hausse du SMIC brut ni un allègement général permanent.","Contexte de crise 2008–2009 et champ restreint aux petites entreprises ; validité externe limitée.","Aucun effet propre aux moins de 25 ans n'est estimé."],"review_status":"cross_checked","review_notes":"Audit du PDF intégral IZA DP 11248 et recoupement avec le rapport Bozio–Wasmer (2024). Les résultats ne doivent pas être interprétés comme une élasticité d'une hausse générale du SMIC.","tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-CAUSAL-INFERENCE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}

  - {"id":"STUDY-FOUCHER-GENERATIONAL-COMPARISON-2026","title":"Comparer les générations à âge identique : état des preuves et protocole de mise à jour","organization":"Society Lab, synthèse documentaire à partir des sources Insee","publication_date":"2026-11-18","study_type":"descriptive","source_ids":["SOURCE-INSEE-GENERATIONS-DALBIS-BADJI-2017","SOURCE-INSEE-LEVEL-BY-AGE-1996-2024","SOURCE-INSEE-PATRIMOINE-AGE-2024","SOURCE-INSEE-INTERGEN-TRANSMISSIONS-2024","SOURCE-INSEE-PATRIMOINE-NET-ENDETTEMENT-2024","SOURCE-INSEE-HVP-ACCESS-2023-2024","SOURCE-INSEE-HVP-METHODOLOGY-2023-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-SOCIETY","DOMAIN-FINANCE"],"research_question":"Les générations nées après 1970 disposent-elles, au même âge que leurs parents, de ressources économiques et patrimoniales plus faibles ?","methods":["Revue critique d'un pseudo-panel âge-période-cohorte Budget de famille 1979-2011.","Mise en regard de séries transversales récentes de niveaux de vie par âge et de patrimoine.","Protocole de comparaison de cohortes à âge identique, en euros constants et unités de consommation, avec dimensions patrimoniales et transmissions."],"population_or_unit":"Ménages et individus en France ; cohortes de naissance et tranches d'âge comparables.","geographic_scope":["France"],"temporal_scope":"Pseudo-panel 1979-2011 ; niveaux de vie 1996-2024 ; patrimoine et transmissions 2023-2024.","key_findings":["L'étude d'Albis et Badji (2017) conclut qu'aucune cohorte née entre 1901 et 1979 n'a été désavantagée par rapport à ses aînées selon les indicateurs et stratégies d'identification retenus.","Les niveaux de vie par âge et les patrimoines par âge publiés en 2026 sont des coupes transversales et ne suffisent pas à établir un déclassement générationnel.","Les données récentes montrent une forte association entre réception de transmissions et patrimoine brut, mais les ménages ayant hérité sont plus âgés ; cette association ne mesure pas l’effet causal des transmissions. Le patrimoine net médian (148 100 €) est sensiblement inférieur au patrimoine brut médian (205 100 €).","La série Insee de patrimoine brut moyen par âge en 2015, 2021 et 2024 permet une première comparaison à âge identique entre vagues, mais pas une comparaison complète des distributions nettes par cohorte."],"limitations":["La preuve de référence s'arrête en 2011 et ne permet pas de conclure sur les cohortes postérieures à 1979 au même âge.","Les effets âge, période et cohorte ne sont pas simultanément identifiables sans restrictions ; toute décomposition dépend d'hypothèses.","La revue ne constitue pas encore une nouvelle estimation microéconomique sur les microdonnées 2023-2024.","Les comparaisons de patrimoine brut moyen par âge entre vagues restent sensibles aux effectifs et à la composition des ménages ; elles ne remplacent pas des médianes et distributions de patrimoine net par cohorte.","Les associations entre réception de transmission et patrimoine actuel sont confondues notamment par l’âge, l’origine sociale, le patrimoine parental et les trajectoires familiales."],"review_status":"screened","review_notes":"Conclusion provisoire : déclassement générationnel global non établi à ce stade ; poursuivre sur patrimoine net, logement, dette, transmissions et cohortes postérieures à 1979.","tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-COMPARATIVE","TAG-METHOD-HISTORICAL","TAG-LEVEL-NATIONAL"]}

  - {"id":"STUDY-CEREQ-GENERATION-2021-BTS-MATCHING","title":"Appariement Génération 2021 — Base Tous salariés : potentiel et limites pour l'analyse des trajectoires","organization":"Céreq / Insee","publication_date":"2026","study_type":"descriptive","source_ids":["SOURCE-CEREQ-GENERATION-2021-BTS-MATCHING-2026","SOURCE-INSEE-PANEL-TOUS-SALARIES-METADATA-2026"],"dataset_ids":["DATASET-CEREQ-GENERATION-2021-BTS-MATCHED"],"domains":["DOMAIN-EDUCATION","DOMAIN-ECONOMY"],"research_question":"Dans quelle mesure l'appariement de Génération 2021 avec la Base Tous salariés peut-il relier les parcours de formation aux trajectoires d'emploi et de rémunération ?","methods":["Revue documentaire du projet d'appariement","Analyse des champs et unités statistiques des sources appariées"],"population_or_unit":"Sortants de formation initiale de la Génération 2021 ; sous-population appariée aux données administratives selon critères à documenter","geographic_scope":["France"],"temporal_scope":"Génération 2021 ; travaux d'appariement 2025-2026","key_findings":["Le Céreq indique que l'appariement expérimental entre Génération 2021 et la Base Tous salariés a été réalisé.","Le projet est présenté comme un moyen de relier des parcours de formation à des parcours sur le marché du travail."],"limitations":["La page publique ne donne pas les taux de rapprochement, les variables finales, les biais de sélection ni les résultats analytiques.","La disponibilité et les conditions d'accès aux données appariées restent à confirmer.","Le périmètre BTS ne couvre pas à lui seul toutes les situations d'emploi et de non-emploi."],"review_status":"screened","review_notes":"Piste prioritaire pour lever la rupture de preuve formation-emploi-salaire ; ne pas coder de résultat substantiel tant que documentation détaillée et résultats ne sont pas disponibles."}
  - {"id":"STUDY-INSERJEUNES-INSERTION-2023","title":"Insertion à court terme des sortants 2023 de la voie professionnelle — InserJeunes","organization":"DEPP / DARES","publication_date":"2026-06-25","study_type":"descriptive","source_ids":["SOURCE-DEPP-INSERJEUNES-2026"],"dataset_ids":["DATASET-INSERJEUNES-2023"],"domains":["DOMAIN-EDUCATION","DOMAIN-ECONOMY"],"research_question":"Comment l'insertion en emploi salarié et la poursuite d'études varient-elles selon les formations professionnelles et les établissements ?","methods":["Appariement de sources administratives","Indicateurs descriptifs d'insertion par formation et établissement"],"population_or_unit":"Sortants de formations professionnelles scolaires et apprentis du champ InserJeunes","geographic_scope":["France"],"temporal_scope":"Sortants 2023 ; suivi à court terme jusqu'à 18-24 mois selon les données publiées","key_findings":["Le dispositif couvre des formations du CAP au BTS et publie des indicateurs d'insertion par établissement, métier ou formation.","Les données des sortants 2023 ont été mises à jour en juin 2026 avec des observations à 18-24 mois."],"limitations":["Le champ ne représente pas l'ensemble des diplômés du système éducatif.","Les indicateurs agrégés ne permettent pas de reconstituer les trajectoires individuelles complètes.","L'emploi salarié observé ne couvre pas nécessairement l'emploi non salarié ni la qualité de l'emploi."],"review_status":"screened","review_notes":"À exploiter pour comparer les spécialités et établissements, en séparant insertion, poursuite d'études et sélection des publics."}
  - {"id":"STUDY-PIAAC-2023-FRANCE-COMPETENCES","title":"Compétences des adultes en France — PIAAC 2023 : documentation et possibilités d'analyse","organization":"OCDE / DEPP / DARES / Insee","publication_date":"2024-12-10","study_type":"descriptive","source_ids":["SOURCE-OECD-PIAAC-DATA-METHODOLOGY-2023"],"dataset_ids":["DATASET-PIAAC-2023-FRANCE"],"domains":["DOMAIN-EDUCATION","DOMAIN-ECONOMY"],"research_question":"Comment les compétences mesurées des adultes se distribuent-elles selon diplôme, âge et situation sur le marché du travail ?","methods":["Enquête internationale par échantillonnage","Évaluation standardisée des compétences et questionnaires de contexte"],"population_or_unit":"Adultes résidant en France hors DROM selon le champ de l'enquête française 2023","geographic_scope":["France","OCDE"],"temporal_scope":"2023 ; comparaison internationale et première édition française 2012","key_findings":["PIAAC mesure la littératie, la numératie et la résolution adaptative de problèmes et met à disposition fichiers à usage public et documentation technique.","La DEPP rapporte qu'en France hors DROM, plus d'un adulte sur quatre présente une faible maîtrise dans chacun des domaines évalués."],"limitations":["Enquête transversale, non longitudinale.","Les scores ne sont pas des mesures exhaustives des compétences professionnelles spécifiques.","Les analyses exigent le respect des poids et valeurs plausibles documentés par l'OCDE."],"review_status":"screened","review_notes":"À analyser à partir des microdonnées et des fichiers de documentation ; les résultats publiés ne suffisent pas à attribuer causalement les écarts au système éducatif."}
  - {"id":"STUDY-INSEE-PANEL-TOUS-SALARIES-TRAJECTORIES","title":"Panel Tous salariés : possibilités et ruptures de mesure des trajectoires salariales","organization":"Insee","publication_date":"2026-09-12","study_type":"descriptive","source_ids":["SOURCE-INSEE-PANEL-TOUS-SALARIES-METADATA-2026"],"dataset_ids":["DATASET-INSEE-PANEL-TOUS-SALARIES"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment suivre les trajectoires annuelles de salaire, d'emploi et d'employeur des salariés en tenant compte des changements de champ et de source ?","methods":["Données administratives longitudinales","Suivi annuel d'un échantillon de salariés"],"population_or_unit":"Salariés du privé et du public, entreprises publiques, particuliers employeurs et périodes de chômage indemnisé selon les millésimes","geographic_scope":["France"],"temporal_scope":"1976 à aujourd'hui ; champ constant possible depuis 1988 sous filtres","key_findings":["Le panel suit un échantillon de salariés depuis 1976 et couvre un champ étendu du salariat.","Depuis 2002, l'échantillon représente environ un huitième de la population salariée.","Les sources DADS sont remplacées par la DSN à partir de 2017 dans le privé et de 2022 dans le public."],"limitations":["Les transitions vers le non-salariat ne sont pas couvertes directement.","Les ruptures de sources et de champ exigent une analyse de comparabilité.","Sans appariement à des données de formation, le panel ne permet pas d'identifier le rôle du diplôme ou des compétences."],"review_status":"screened","review_notes":"Source longitudinale centrale pour les trajectoires salariales ; exploiter avec le projet d'appariement Céreq et documenter l'accès sécurisé."}
  - {"id":"STUDY-KRAMARZ-PHILIPPON-2001","title":"The Impact of Differential Payroll Tax Subsidies on Minimum Wage Employment","authors":["Francis Kramarz","Thomas Philippon"],"organization":"Journal of Public Economics / IZA","publication_date":"2001-10-01","study_type":"quasi_experimental","source_ids":["SOURCE-KRAMARZ-PHILIPPON-2001"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment les variations du coût minimum employeur, combinant salaire minimum et cotisations patronales, affectent-elles les transitions entre emploi et non-emploi en France ?","methods":["Enquête Emploi de l’Insee, 1990–1998, avec appariements individuels annuels","Logits conditionnels sur les transitions emploi/non-emploi","Différences-de-différences entre groupe directement rattrapé par les variations du coût minimum et groupe marginal proche du seuil","Comparaison distincte des périodes de hausse et de baisse du coût employeur"],"population_or_unit":"Salariés du secteur privé français couverts par l’Enquête Emploi ; exclusions des fonctionnaires, du secteur public et de certains jeunes sous dispositifs dérogatoires","geographic_scope":["France"],"temporal_scope":"Données 1990–1998 ; IZA Discussion Paper 219 (novembre 2000), publication 2001","key_findings":["Dans la spécification asymétrique, l’élasticité différentielle des transitions vers le non-emploi du groupe directement rattrapé lors des hausses de coût est d’environ −1,5 relativement au groupe marginal.","Les résultats sur les entrées dans l’emploi après baisse du coût sont faibles et statistiquement non significatifs dans les estimations regroupées.","Les auteurs relèvent des indices de substitution entre certaines catégories situées dans la zone d’allègement et celles situées au-dessus."],"limitations":["Le traitement combine le SMIC légal et les cotisations patronales : l’effet ne peut pas être attribué au SMIC brut seul.","Les variations de cotisations, revalorisations du SMIC et changements macroéconomiques concomitants compliquent l’identification.","Aucun test de pré-tendances de type étude d’événement moderne n’est présenté.","Le groupe de comparaison est proche du seuil et peut être affecté par des effets de diffusion ou de substitution.","Les résultats sur les entrées dans l’emploi sont faibles et non significatifs ; les transitions annuelles ne renseignent pas sur les trajectoires de long terme.","Les populations exclues et les dispositifs des années 1990 limitent la validité externe pour les politiques actuelles."],"review_status":"screened","review_notes":"Lecture intégrale de l’IZA Discussion Paper 219 documentée dans dossiers/smic-kramarz-philippon-payroll-tax-2001.md : tableaux 1 à 6, annexe descriptive, stratégie économétrique et limites examinés. Le fichier dossiers/smic-kramarz-philippon-2001-cout-travail-emploi.md est une note de synthèse complémentaire du même article et ne constitue pas une preuve indépendante. Ne pas interpréter −1,5 comme une élasticité de l’emploi total ou du SMIC brut." ,"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-CAUSAL-INFERENCE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"STUDY-ABOWD-KRAMARZ-LEMIEUX-MARGOLIS-YOUTH-2000","title":"Minimum Wages and Youth Employment in France and the United States","authors":["John M. Abowd","Francis Kramarz","Thomas Lemieux","David N. Margolis"],"organization":"University of Chicago Press / NBER","publication_date":"2000","study_type":"quasi_experimental","source_ids":["SOURCE-NBER-ABOWD-KRAMARZ-LEMIEUX-MARGOLIS-2000"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment les hausses du SMIC réel en France entre 1982 et 1989 affectent-elles les transitions d’emploi des jeunes, et dans quelle mesure les dispositifs dérogatoires modifient-ils leur exposition ?","methods":["Enquête Emploi de l’Insee, appariements annuels 1982–1989","Logit multinomial des transitions emploi/non-emploi sur la population plus large","Logit conditionnel de maintien en emploi chez les jeunes de 30 ans ou moins","Groupe exposé défini par un salaire réel situé entre deux SMIC réels annuels successifs et groupe de comparaison marginalement au-dessus du nouveau minimum","Comparaison France–États-Unis pour contextualiser les variations réelles du salaire minimum"],"population_or_unit":"Jeunes salariés de 30 ans ou moins en France ; résultats américains utilisés comme comparaison, non comme preuve sur la France","geographic_scope":["France","United States"],"temporal_scope":"Enquête Emploi française 1982–1989 ; CPS américaine 1981–1987 ; chapitre publié en 2000, issu du NBER Working Paper 6111 (1997)","key_findings":["L’élasticité conditionnelle estimée pour les jeunes hommes directement exposés est de −2,489 dans la spécification rapportée ; elle décrit un contraste de maintien en emploi entre groupes proches du minimum.","L’élasticité dite inconditionnelle calculée par les auteurs est beaucoup plus faible (−0,203 pour les hommes et −0,108 pour les femmes) et dépend d’une hypothèse supplémentaire sur les entrées en emploi.","Les dispositifs dérogatoires et contrats de promotion de l’emploi semblent avoir amorti une partie de l’exposition pour les jeunes éligibles."],"limitations":["Le groupe de comparaison proche du seuil n’est pas un groupe non traité et peut subir des chocs ou effets de diffusion similaires.","L’hétérogénéité individuelle non observée n’est pas entièrement contrôlée ; petites cellules et estimations par âge/sexe parfois imprécises.","Pas d’étude d’événement ni de test de pré-tendances parallèles présenté dans les résultats consultés.","L’estimation conditionnelle ne doit pas être confondue avec l’estimation inconditionnelle, qui repose sur une hypothèse supplémentaire.","Les dispositifs d’emploi des jeunes et le contexte institutionnel des années 1980 limitent la validité externe pour la France actuelle.","Le travail est étroitement lié à Abowd, Kramarz et Margolis (1999), mais ce dernier est un article distinct avec trois auteurs et une population/stratégie différente ; ne pas compter les résultats comme réplications indépendantes sans analyse de dépendance."],"review_status":"screened","review_notes":"Chapitre intégral NBER vérifié dans dossiers/smic-youth-abowd-kramarz-lemieux-margolis-2000.md (tableaux 11.1 à 11.5 et 11.9). La fiche dossiers/smic-abowd-kramarz-lemieux-margolis-1997-emploi-jeunes.md est une synthèse complémentaire de la version de travail NBER WP 6111 (1997) et de la publication 2000 ; il s’agit du même travail, pas d’une réplication. Distinguer ce travail de l’article Abowd, Kramarz & Margolis (1999), qui reste une étude liée mais distincte." ,"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-CAUSAL-INFERENCE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"STUDY-BAZEN-SKOURIAS-1997-YOUTH-EMPLOYMENT","title":"Is there a negative effect of minimum wages on youth employment in France?","authors":["Stephen Bazen","Nicolas Skourias"],"organization":"European Economic Review","publication_date":"1997-04","study_type":"quasi_experimental","source_ids":["SOURCE-BAZEN-SKOURIAS-1997"],"domains":["DOMAIN-ECONOMY"],"research_question":"La hausse du SMIC de juin 1981 a-t-elle affecté la part des jeunes dans l’emploi sectoriel en France ?","methods":["Différences-de-différences sectorielles sur 32 secteurs","Exposition mesurée par la proportion de salariés du secteur rémunérés sous le SMIC de juin 1981","Résultat mesuré par la part des 15–24 ans dans l’emploi sectoriel","Reconstitution méthodologique à partir du résumé éditeur et de la revue secondaire Neumark & Wascher (2007), faute d’accès au texte intégral"],"population_or_unit":"Secteurs d’activité en France ; part des 15–24 ans dans l’emploi sectoriel, et non taux d’emploi individuel des jeunes","geographic_scope":["France"],"temporal_scope":"Données sectorielles 1980–1984 ; choc étudié de juin 1981 ; publication avril 1997","key_findings":["Le résumé éditeur rapporte un effet négatif statistiquement significatif de la hausse de 10 % du SMIC de juin 1981 sur l’emploi des jeunes.","La revue secondaire décrit 32 secteurs et une exposition fondée sur la proportion de salariés sous le nouveau SMIC ; aucun coefficient ni intervalle de confiance n’est repris faute d’accès à la source primaire intégrale."],"limitations":["Le texte intégral de l’article et ses tableaux n’ont pas été obtenus ; les détails méthodologiques proviennent en partie de Neumark & Wascher (2007).","La variable dépendante est une part de l’emploi sectoriel, pas un taux d’emploi individuel ni un nombre total d’emplois jeunes.","Neumark & Wascher critiquent l’inadéquation d’échelle entre la variation d’une part et la croissance en pourcentage de l’emploi sectoriel total utilisée comme contrôle.","La mesure d’exposition de juin 1981 est réutilisée sur des fenêtres couvrant 1980–1984 et d’autres hausses du SMIC ; le rapport IMK (2008) relève une faible robustesse des spécifications 1981 et l’absence de contrôle des politiques du marché du travail sur la fenêtre longue.","Les pré-tendances, erreurs-types détaillées, intervalles de confiance et tests de sensibilité ne sont pas vérifiables dans le corpus actuel.","Le résultat historique ne permet pas de calculer un nombre d’emplois détruits ni d’être transposé directement au marché du travail actuel."],"review_status":"screened","review_notes":"Statut de revue limité à un screening documentaire : résumé éditeur consulté, texte intégral non obtenu ; détails du protocole et critiques rapportés par Neumark & Wascher (2007) et IMK (2008). Audit détaillé dans dossiers/smic-bazen-skourias-1997-audit-etudes-recentes.md ; état de preuve et comparaison avec les travaux récents dans dossiers/smic-emploi-jeunes-bazen-etudes-recentes-etat-preuve.md. Ces deux documents sont complémentaires et ne constituent pas deux études indépendantes. Ne pas augmenter le niveau de confiance avant acquisition et lecture du texte primaire." ,"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-CAUSAL-INFERENCE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
