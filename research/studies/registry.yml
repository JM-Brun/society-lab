studies:
  - {"id":"STUDY-PARCOURSUP-ADMISSIONS-2026","title":"Bilan statistique des propositions d’admission Parcoursup 2026","organization":"SIES","study_type":"descriptive","source_ids":["SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS","SOURCE-PARCOURSUP-BILAN-2026"],"dataset_ids":["DATASET-PARCOURSUP-2026-INDICATORS"],"domains":["DOMAIN-EDUCATION"],"research_question":"Que décrivent les indicateurs administratifs de candidatures, propositions et acceptations de la campagne 2026 ?","methods":["Statistiques administratives descriptives","Comparaison par catégories de candidats"],"population_or_unit":"Candidats Parcoursup et néo-bacheliers inscrits en 2026","geographic_scope":["France"],"temporal_scope":"Campagne 2026","key_findings":["1 046 000 candidats ont postulé en 2026 selon le bilan ministériel.","603 910 lycéens, soit 91,5 % de ceux ayant formulé des vœux, ont reçu au moins une proposition.","La note SIES indique que 93,7 % des néo-bacheliers inscrits ont reçu au moins une proposition et 81,0 % en ont accepté une."],"limitations":["Ne mesure pas directement l'équité des classements ou la réussite après admission.","Les dénominateurs diffèrent selon les catégories de candidats."],"review_status":"screened","review_notes":"Première extraction officielle ; vérifier les tableaux détaillés et dénominateurs avant comparaison temporelle."}
  - {"id":"STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","title":"Inégalités sociales d’acquis et de parcours dans l’enseignement scolaire français","organization":"INSEE / DEPP","study_type":"descriptive","source_ids":["SOURCE-INSEE-INEGALITES-SCOLAIRES-2025","SOURCE-DEPP-ETAT-ECOLE-2025"],"domains":["DOMAIN-EDUCATION"],"research_question":"À quelles étapes du parcours scolaire les écarts liés à l'origine sociale apparaissent-ils et comment évoluent-ils ?","methods":["Analyse statistique descriptive","Comparaison selon origine sociale et étapes du parcours"],"population_or_unit":"Élèves scolarisés en France, selon les dispositifs et cohortes étudiés","geographic_scope":["France"],"temporal_scope":"Indicateurs de l'édition 2025","key_findings":["Des écarts d'acquis liés à l'origine sociale sont observés dès l'entrée en maternelle."],"limitations":["Populations, mesures et périodes spécifiques selon chaque fiche.","Les écarts descriptifs ne suffisent pas à établir les mécanismes causaux."],"review_status":"screened","review_notes":"À approfondir avec extraction des tableaux, cohortes, tailles d'effet et méthodes de contrôle."}
  - {"id":"STUDY-OECD-PISA-2022-FRANCE","title":"PISA 2022 — inégalités socio-économiques de performance en France","organization":"OCDE","study_type":"descriptive","source_ids":["SOURCE-OECD-PISA-2022-FRANCE"],"domains":["DOMAIN-EDUCATION"],"research_question":"Quelle est l'association entre statut socio-économique et performance en mathématiques à 15 ans en France ?","methods":["Évaluation standardisée internationale","Analyse descriptive et modèles statistiques de contexte"],"population_or_unit":"Élèves de 15 ans participant à PISA 2022","geographic_scope":["France","OCDE"],"temporal_scope":"2022","key_findings":["Les élèves du quartile socio-économique supérieur dépassent de 113 points ceux du quartile inférieur en mathématiques en France."],"limitations":["PISA ne décrit pas directement l'accès au supérieur.","Une association statistique ne démontre pas un effet causal isolé."],"review_status":"screened","review_notes":"À confronter à PISA 2018/2025, aux autres domaines évalués et aux indicateurs de résilience."}
  - {"id":"STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","title":"Transmission intergénérationnelle du niveau de diplôme en France","organization":"OCDE","study_type":"descriptive","source_ids":["SOURCE-OECD-EAG-2025-FRANCE"],"domains":["DOMAIN-EDUCATION"],"research_question":"Dans quelle mesure le niveau de diplôme des parents est-il associé à l'obtention d'un diplôme du supérieur par les jeunes adultes en France ?","methods":["Indicateurs comparatifs internationaux harmonisés","Analyse descriptive selon niveau d'études des parents"],"population_or_unit":"Adultes de 25 à 34 ans en France, ventilés selon le niveau de diplôme parental","geographic_scope":["France","OCDE"],"temporal_scope":"Données 2023 publiées dans Regards sur l'éducation 2025","key_findings":["75 % des 25-34 ans ayant au moins un parent diplômé du supérieur ont eux-mêmes un diplôme du supérieur, contre 32 % lorsque les parents n'ont pas achevé le deuxième cycle du secondaire."],"limitations":["Association intergénérationnelle descriptive ; ne mesure pas l'effet causal propre de l'école ou de Parcoursup.","Les catégories de diplôme parental et les populations de référence doivent être vérifiées dans la table source."],"review_status":"screened","review_notes":"À vérifier dans le tableau OCDE correspondant et à comparer aux générations précédentes."}
  - {"id":"STUDY-PARCOURSUP-FORMATION-OPEN-DATA-2025","title":"Structure de l'offre, profils et résultats d'admission par formation — Parcoursup 2025","organization":"SIES","study_type":"descriptive","source_ids":["SOURCE-PARCOURSUP-OPEN-DATA-2025"],"dataset_ids":["DATASET-PARCOURSUP-2025-FORMATION-OPEN-DATA"],"domains":["DOMAIN-EDUCATION"],"research_question":"Comment varient la demande, les propositions, les admissions et les profils des admis selon les formations, les territoires et les catégories de candidats ?","methods":["Analyse descriptive de données administratives agrégées par formation","Comparaisons selon filière, série du bac, sexe, bourse et origine géographique"],"population_or_unit":"14 252 formations hors apprentissage ; agrégats couvrant 1 015 200 candidats, dont 652 800 néo-bacheliers","geographic_scope":["France","Régions","Départements","Académies","Établissements"],"temporal_scope":"Campagne 2025","key_findings":["Le jeu de données contient 115 variables et 14 252 enregistrements.","Les données permettent d'observer les vœux, classements, propositions, admissions, capacités et profils agrégés des admis.","Des variables distinguent les boursiers et les séries de baccalauréat."],"limitations":["Données agrégées au niveau formation ; pas de microdonnées individuelles.","Certains indicateurs cartographiques ne sont pas recalculables à partir du fichier.","Les analyses doivent tenir compte des vœux multiples, des groupes d'appel et des différences de sélectivité."],"review_status":"screened","review_notes":"Base prioritaire pour une première analyse descriptive des différences entre formations ; import et exploration des données à réaliser."}
  - {"id":"STUDY-COUR-DES-COMPTES-TIG-DDSE-2025","title":"Évaluation du travail d’intérêt général et de la détention à domicile sous surveillance électronique","organization":"Cour des comptes","study_type":"observational","source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","SOURCE-MINISTERE-JUSTICE-TIG-PRONONCE-2024","SOURCE-MINISTERE-JUSTICE-TUTEURS-TIG-2024","SOURCE-SENAT-EXECUTION-PEINES-2025"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"research_question":"Pourquoi le TIG demeure-t-il peu mobilisé en France, et que peut-on conclure de son efficacité, de son coût, de son caractère sanctionnant et de ses effets sur la récidive ?","methods":["Analyse descriptive de données administratives pénales","Comparaisons de cohortes et corrections économétriques des différences observables entre personnes condamnées","Enquêtes auprès de magistrats, tuteurs et responsables de postes de TIG","Analyse institutionnelle des conditions d'exécution et de suivi"],"population_or_unit":"Personnes condamnées à un TIG ou à une DDSE, magistrats, tuteurs et organismes d'accueil ; cohortes et sous-populations variables selon les analyses","geographic_scope":["France"],"temporal_scope":"Données de prononcé 2015-2022 ; enquête tuteurs 2021 ; cohortes de récidive 2016-2017 ; exécution 2024 ; rapport publié en 2025","key_findings":["Le prononcé des TIG a diminué de 34 % entre 2015 et 2022 ; 16 560 TIG ont été prononcés en 2022 pour sanctionner des délits.","Le délai moyen d'exécution du TIG dépasse 16 mois, selon le périmètre et la définition du rapport.","Pour la cohorte 2010, le taux de nouvelle condamnation définitive dans les cinq ans est de 58 % après un TIG, 61 % après un sursis-TIG et 64 % après un emprisonnement ferme de deux ans ou moins ; la mesure est après prononcé et non après exécution.","Après ajustement des caractéristiques observables, les écarts de probabilité de nouvelle condamnation à cinq ans entre TIG/sursis-TIG et emprisonnement ferme sont proches de zéro et statistiquement non significatifs ; des facteurs non observés peuvent subsister.","À dix ans pour la cohorte 2010, les estimations corrigées indiquent une probabilité de recondamnation à la prison ferme inférieure de 11,3 points après TIG et environ 0,268 nouvelle condamnation en moins en moyenne ; ces indicateurs sont distincts du taux binaire de récidive.","Le coût estimé par mesure en 2022 est de 1 862 € pour le TIG et de 2 788 € pour la DDSE ; les unités ne sont pas directement comparables au coût journalier de la détention et ne constituent pas une analyse complète de coût-efficacité.","Le suivi et l'accompagnement sont limités : rendez-vous espacés en moyenne d'environ six mois et 33 % des personnes en TIG orientées vers des acteurs de l'insertion.","Le réseau recensait 20 419 tuteurs dans 11 872 organismes en 2021 ; l'encadrement repose notamment sur des tuteurs non rémunérés."],"limitations":["Le taux brut de récidive ne permet pas de comparer directement les peines en raison de différences initiales de profils et de sélection judiciaire.","La correction économétrique ne neutralise que les facteurs observés et ne prouve pas l'équivalence causale des sanctions.","Les résultats sur la récidive portent sur des cohortes anciennes et les pratiques ont pu évoluer.","Le coût unitaire ne suffit pas à établir un rapport coût-efficacité ; il faut intégrer les coûts d'encadrement, de coordination, de suivi, les coûts évités de détention et les effets pour les victimes et la collectivité.","L'étude ne permet pas de conclure que le TIG serait adapté à toutes les infractions ou à tous les profils."],"review_status":"reviewed","review_notes":"Vérification ciblée du rapport intégral effectuée le 13 novembre 2026 : procédure et méthodes p. 5-7 ; définition et taux bruts de récidive p. 101-103 ; modèles ajustés p. 109-114 ; coûts p. 129-130 et annexe 7. La revue ne remplace pas une réplication des modèles ni un accès aux microdonnées. Les limites d'identification, de cohorte et de mesure après prononcé sont conservées."}
  - {"id":"STUDY-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025","title":"Comparative implementation of non-custodial sanctions in 22 EU Member States","organization":"Penal Reform International; University of Coimbra; Hungarian Helsinki Committee","study_type":"descriptive","source_ids":["SOURCE-PRI-EU-NONCUSTODIAL-COMPARATIVE-2025"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"How are non-custodial sanctions, including community service, legally designed and implemented across 22 EU Member States, and what common barriers affect their use?","methods":["Comparative analysis of national expert reports","Cross-country synthesis of legal frameworks and implementation conditions"],"population_or_unit":"National legal frameworks, probation systems and implementation practices in 22 EU Member States","geographic_scope":["European Union","France","Netherlands","Germany","Finland","Spain"],"temporal_scope":"Comparative project reports published 2025; underlying national reference periods vary","key_findings":["Community service appears in different legal roles across countries: autonomous sanction, replacement sanction, additional requirement or component of probation.","Recurring barriers include limited placement capacity, long waiting lists, insufficient probation staffing, low awareness among sentencers and the public, and net-widening risks."],"limitations":["The countries do not share identical definitions, legal roles or denominators.","The comparative synthesis identifies recurring mechanisms but does not estimate their causal contribution to country-level differences.","Country reports may differ in data availability and depth."],"review_status":"screened","review_notes":"Use primarily to compare institutional design and implementation bottlenecks, not to rank national effectiveness."}
  - {"id":"STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023","title":"Community service versus short-term imprisonment: Dutch instrumental-variable evaluation","organization":"Leiden University researchers; Journal of Experimental Criminology","study_type":"observational","source_ids":["SOURCE-WERMINK-COMMUNITY-SERVICE-RETRIBUTION-2023"],"domains":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"research_question":"What is the causal effect of short-term imprisonment relative to community service on subsequent recidivism, and what are the associated sanctioning costs in the Netherlands?","methods":["Administrative-data analysis of all sentences in 2012","Recidivism follow-up through 2018","Instrumental-variable estimation using variation associated with judicial assignment"],"population_or_unit":"People sentenced in the Netherlands in 2012, comparing short-term prison sentences and community service orders","geographic_scope":["Netherlands"],"temporal_scope":"Sentences in 2012; recidivism 2012-2018; publication 2023","key_findings":["Within the study's instrumental-variable framework, short-term imprisonment increases recidivism relative to community service.","The estimated daily costs of imprisonment from verdict onward are at least three times those of community service.","The authors estimate a substantial aggregate societal expenditure associated with short-term imprisonment for retribution."],"limitations":["The estimate is specific to the Dutch institutional context and cases affected by the instrument.","The result cannot be transferred directly to France without comparing eligibility, sentencing, probation and support arrangements.","It does not establish that community service is always preferable, nor does it quantify general deterrence."],"review_status":"screened","review_notes":"High-value quasi-experimental evidence; examine full methods, instrument validity, outcome definitions and cost perimeter before using as a policy benchmark."}
  - {"id":"STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025","title":"European community-service shares among probationers, 2018-2022","organization":"Journal of Law and Economics; comparative sentencing data attributed to Aebi et al. 2023","study_type":"descriptive","source_ids":["SOURCE-COMPARATIVE-SENTENCING-RATES-EUROPE-2025"],"domains":["DOMAIN-SECURITY"],"research_question":"How does the recorded share of probationers serving community service vary across European jurisdictions?","methods":["Comparative descriptive analysis of reported national probation indicators"],"population_or_unit":"Probation populations in European jurisdictions reporting community-service indicators","geographic_scope":["Europe","France","Netherlands","Spain","Finland","Norway","Scotland","England and Wales"],"temporal_scope":"2018-2022, with focus on 2022","key_findings":["The article reports 2022 community-service shares of probationers of 56.2% in the Netherlands, 60.7% in Spain and 15.3% in France, with several other European jurisdictions between these values."],"limitations":["Denominator is probationers, not all convicted persons or all sentences.","Country legal categories, probation caseloads and reporting practices differ.","Underlying data attributed to Aebi et al. 2023 should be checked directly before detailed rankings or policy inference."],"review_status":"screened","review_notes":"Use as a signal of differences in use, not a harmonised measure of national TIG sentencing rates or effectiveness."}
  - {"id":"STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021","title":"Implementation and evidence on unpaid work in UK probation systems","organization":"HM Inspectorate of Probation","study_type":"descriptive","source_ids":["SOURCE-HMI-PROBATION-UNPAID-WORK-EVIDENCE"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Which implementation features are associated with engagement and completion in unpaid-work requirements, and what is known about their relationship with reoffending?","methods":["Evidence synthesis of UK studies and evaluations","Review of probation inspection findings"],"population_or_unit":"People subject to unpaid-work requirements in probation orders in England and Wales, Scotland and Northern Ireland","geographic_scope":["England and Wales","Scotland","Northern Ireland"],"temporal_scope":"Evidence review updated 17 May 2021; cited studies mainly 2014-2019","key_findings":["Prompt commencement, regularity, useful and rewarding work, tailoring, employment-related skills and clear supervision are associated with better engagement.","The inspectorate identifies a lack of robust evidence demonstrating an effect of unpaid work on reoffending."],"limitations":["The evidence base combines different methods and jurisdictions.","Implementation associations and self-reports are not causal recidivism estimates.","The review predates recent changes in probation delivery."],"review_status":"screened","review_notes":"Useful for implementation design and outcome-measure selection; not a causal estimate of TIG effectiveness."}
  - {"id":"STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026","title":"États généraux de l'insertion et de la probation : diagnostic de modernisation du TIG","organization":"Inspection générale de la justice","study_type":"descriptive","source_ids":["SOURCE-IGJ-ETATS-GENERAUX-INSERTION-PROBATION-2026"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Quelles conditions institutionnelles amélioreraient la rapidité, l'effectivité, la lisibilité et l'adaptabilité du TIG ?","methods":["Consultation de professionnels","Analyse institutionnelle","Formulation de propositions"],"population_or_unit":"Organisation nationale du TIG, SPIP, magistrats et structures d'accueil","geographic_scope":["France"],"temporal_scope":"Rapport janvier 2026 ; stock de postes 2018-2025","key_findings":["L'offre recensée est passée de 18 000 à 30 000 postes entre 2018 et 2025.","Répartition territoriale, notamment rurale, et adaptabilité aux profils vulnérables restent à améliorer.","Le rapport propose évaluation préalable plus complète, exécution rapide et pôles TIG dans les SPIP suffisamment grands."],"limitations":["Diagnostic professionnel, non expérimentation contrôlée.","Stock national ne mesure ni disponibilité réelle ni adéquation locale."],"review_status":"screened","review_notes":"Source de référence pour le protocole de diagnostic territorial."}
  - {"id":"STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE","title":"Accueil municipal de personnes condamnées à un TIG : retour d'expérience de Saint-Herblain","organization":"Ville de Saint-Herblain","study_type":"descriptive","source_ids":["SOURCE-ATIGIP-SAINT-HERBLAIN-TIG-PARTNERSHIP"],"domains":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"research_question":"Comment une commune organise-t-elle l'accueil, le tutorat et les missions TIG ?","methods":["Étude de cas municipale","Description des missions et du volume d'heures"],"population_or_unit":"Services municipaux de Saint-Herblain et personnes accueillies en TIG","geographic_scope":["Saint-Herblain","Loire-Atlantique"],"temporal_scope":"Accueil 2022 ; retour d'expérience publié vers 2023","key_findings":["La Ville rapporte 200 heures de TIG accueillies en 2022.","Missions : restauration, accueil, animation, manutention, solidarité, réparation et entretien.","Le tuteur accueille, explique les tâches, contrôle assiduité et réalise un bilan."],"limitations":["Cas unique et année unique.","Aucune mesure de récidive, coût ou effet sur les agents.","Ne prouve pas que les postes soient encore actifs."],"review_status":"screened","review_notes":"Cas local utile pour une fiche-type de partenariat, pas une capacité actuelle garantie."}
  - {"id":"STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","title":"Low-wage employment in France: minimum wage, wage compression and mobility","organization":"OCDE","study_type":"observational","source_ids":["SOURCE-OECD-LOW-WAGE-FRANCE-2025"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment le niveau du salaire minimum et la structure des emplois à bas salaire influencent-ils la distribution salariale et les trajectoires professionnelles en France, en comparaison internationale ?","methods":["Analyse descriptive comparative","Analyse de la distribution des salaires autour du salaire minimum","Analyse des trajectoires et de la mobilité professionnelle"],"population_or_unit":"Salariés à bas salaire en France et dans les pays comparateurs étudiés","geographic_scope":["France","Comparateurs OCDE"],"temporal_scope":"Publication 2025 ; années de données variables selon indicateur","key_findings":["Le salaire minimum français, élevé relativement au salaire médian, comprime la distribution des salaires dans le bas de l'échelle.","Les bas salaires sont associés davantage aux compétences des travailleurs qu'à la seule qualité des entreprises, tout en reflétant aussi des effets de secteur et d'entreprise.","Les trajectoires individuelles montrent que les travailleurs à bas salaire en France ne rencontrent pas davantage de difficultés que dans les pays comparateurs étudiés pour gravir l'échelle salariale."],"limitations":["Résultats comparatifs et descriptifs, ne permettant pas d'attribuer causalement ces constats à une hausse donnée du SMIC.","Définitions et périodes de référence à contrôler pour chaque comparaison."],"review_status":"screened","review_notes":"Publication officielle consultée ; approfondir les chapitres et annexes avant toute conclusion causale."}
  - {"id":"STUDY-EXPERTS-SMIC-2025","title":"Évaluation annuelle du niveau du SMIC et du système socio-fiscal","organization":"Groupe d'experts sur le SMIC","study_type":"observational","source_ids":["SOURCE-EXPERTS-SMIC-2025","SOURCE-INSEE-SMIC-SERIES-2026"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quel diagnostic les données et travaux disponibles permettent-ils d'établir sur le niveau relatif du SMIC, la compression salariale et les allègements ?","methods":["Analyse de séries statistiques","Revue de littérature économique","Analyse institutionnelle et simulations"],"population_or_unit":"Salariés rémunérés autour du SMIC, entreprises et finances publiques en France","geographic_scope":["France"],"temporal_scope":"Rapport 2025 ; séries historiques et prévisions pour 2026","key_findings":["Le groupe recommande de ne pas dépasser la revalorisation automatique prévue pour janvier 2026. Le rapport situe le ratio SMIC/salaire médian brut à 62,5 % en 2024, le plus élevé parmi les pays européens comparés.","Le rapport relève la compression persistante des salaires et le niveau relativement élevé du SMIC par rapport au salaire médian.","Le rapport considère que le système socio-fiscal de soutien à l'emploi faiblement rémunéré atteint des limites économiques et financières."],"limitations":["La recommandation est normative et ne constitue pas une estimation causale de l'effet d'un coup de pouce.","Les prévisions de revalorisation sont datées et doivent être distinguées des montants effectivement appliqués en juin 2026."],"review_status":"screened","review_notes":"Recommandation et éléments de diagnostic consultés ; lire les chapitres et annexes pour vérifier chaque estimation."}
  - {"id":"STUDY-EXPERTS-SMIC-2024-RELIEFS","title":"Effets des allègements de cotisations patronales sur l'emploi et coût des dispositifs","organization":"Groupe d'experts sur le SMIC","study_type":"modelling","source_ids":["SOURCE-EXPERTS-SMIC-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels sont les effets estimés des allègements de cotisations patronales sur l'emploi, et quelles conséquences aurait leur suppression ?","methods":["Synthèse de la littérature","Estimations et simulations de scénarios contrefactuels"],"population_or_unit":"Emplois et entreprises bénéficiaires des allègements de cotisations patronales en France","geographic_scope":["France"],"temporal_scope":"Rapport 2024 ; coût et scénarios estimés pour 2024","key_findings":["Le groupe estime que les allègements ont un effet avéré sur l'emploi.","Le groupe estime que leur suppression totale pourrait entraîner la disparition de 1,5 à 2 millions d'emplois, essentiellement peu qualifiés.","Le rapport souligne que les exonérations s'étendent au-delà des niveaux salariaux pour lesquels les effets sur l'emploi sont établis."],"limitations":["Estimation de scénario, non observation d'une suppression effectivement réalisée.","Ne mesure pas l'effet d'une hausse du SMIC et ne doit pas être utilisée comme tel.","Résultat dépendant des modèles, hypothèses et paramètres retenus."],"review_status":"screened","review_notes":"À confronter au rapport France Stratégie sur les exonérations et aux études microéconomiques sous-jacentes."}
  - {"id":"STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024","title":"Trente ans d'exonérations de cotisations sociales : bilan et pistes de réforme","organization":"France Stratégie","study_type":"observational","source_ids":["SOURCE-FRANCE-STRATEGIE-EXONERATIONS-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels effets les exonérations de cotisations sociales ont-elles sur l'emploi, les trajectoires salariales, la productivité et les finances publiques ?","methods":["Bilan historique des dispositifs","Revue d'évaluations empiriques","Analyse de la distribution des salaires et simulations de réforme"],"population_or_unit":"Entreprises, salariés et finances publiques en France","geographic_scope":["France"],"temporal_scope":"Environ trente ans de politiques ; données récentes jusqu'en 2023-2024","key_findings":["Les exonérations ont contribué à réduire le coût du travail peu qualifié et à soutenir l'emploi, particulièrement dans les années 1990.","Leur coût budgétaire est devenu très élevé et leur efficacité marginale est discutée dans un marché du travail transformé.","La dégressivité peut créer des taux marginaux élevés et des risques de trappe à bas salaires, mais les preuves empiriques de ces mécanismes restent nuancées."],"limitations":["La synthèse combine des travaux aux méthodes et périodes différentes.","Les risques de trappe à bas salaires ne doivent pas être présentés comme un effet uniforme et définitivement établi."],"review_status":"screened","review_notes":"Fiche de synthèse et rapport associés repérés ; vérifier les évaluations originales et les montants par année."}
  - {"id":"STUDY-INSEE-SMIC-MEAN-WAGE-2012","title":"Effets des revalorisations du SMIC sur le salaire moyen (1970-2009)","organization":"INSEE","authors":["Gilbert Cette","Valérie Chouard","Grégory Verdugo"],"study_type":"observational","source_ids":["SOURCE-INSEE-SMIC-MEAN-WAGE-2012"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment les revalorisations du SMIC se transmettent-elles aux indicateurs de salaire moyen, selon leur origine ?","methods":["Analyse économétrique de séries temporelles longues","Différenciation des revalorisations automatiques et des coups de pouce"],"population_or_unit":"Salaires horaires de base des ouvriers et salaires mensuels par tête en France","geographic_scope":["France"],"temporal_scope":"1970-2009","key_findings":["Les estimations indiquent un effet important des revalorisations du SMIC sur le salaire moyen.","Les revalorisations liées à l'indexation sur la moitié des gains de pouvoir d'achat du salaire ouvrier ont un impact important sur le salaire horaire de base lui-même.","Les auteurs signalent une possible circularité entre le SMIC et le salaire de base."],"limitations":["Période ancienne, arrêtée en 2009 ; structure du marché du travail et politiques d'allègements ont évolué.","Ne mesure pas directement les effets sur l'emploi, les prix ou la pauvreté en emploi."],"review_status":"screened","review_notes":"Résumé et présentation INSEE consultés ; lire le texte intégral et actualiser l'analyse avant extrapolation."}
  - {"id":"STUDY-INSEE-MINIMUM-WAGE-RIGIDITY-2019","title":"Les salaires minima rendent-ils les salaires plus rigides ?","organization":"INSEE","authors":["Erwan Gautier","Sébastien Roux","Milena Suarez Castillo"],"publication_date":"2019-11-14","study_type":"observational","source_ids":["SOURCE-INSEE-MINIMUM-WAGE-RIGIDITY-2019"],"domains":["DOMAIN-ECONOMY"],"research_question":"Comment le SMIC et les minima de branche affectent-ils le calendrier et l'ampleur des ajustements salariaux individuels et agrégés ?","methods":["Données individuelles de salaires appariées aux minima de branche","Modèle microéconométrique de rigidité salariale","Simulations macroéconomiques"],"population_or_unit":"Salariés et salaires individuels en France","geographic_scope":["France"],"temporal_scope":"Étude publiée en 2019 ; données individuelles et simulations décrites dans le document","key_findings":["Les minima salariaux influencent le calendrier et l'ampleur des relèvements individuels.","Les auteurs estiment que les minima contribuent à amplifier par un facteur 1,7 la réponse agrégée des salaires à l'inflation passée dans leur cadre d'analyse.","Une hausse du SMIC se diffuse aux salaires plus élevés notamment via les minima de branche."],"limitations":["La simulation agrégée ne mesure pas directement l'effet causal du SMIC sur l'emploi ou les prix.","Les résultats dépendent du modèle et de la période observée ; ne pas en faire une estimation contemporaine sans actualisation."],"review_status":"screened","review_notes":"Page officielle INSEE et résumé consultés ; le document complet et ses annexes restent à examiner."}
  - {"id":"STUDY-ALBERTINI-POIRIER-TERRIAU-2025","title":"Payroll Tax Reductions on Low Wages and Minimum Wage in France","organization":"TEPP — CNRS FR 2042","authors":["Julien Albertini","Arthur Poirier","Anthony Terriau"],"publication_date":"2025-01-24","study_type":"modelling","source_ids":["SOURCE-ALBERTINI-POIRIER-TERRIAU-2025"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Quels sont les effets des allègements de cotisations et d'une hausse du salaire minimum sur l'emploi, le surplus budgétaire et le bien-être, en tenant compte des interactions socio-fiscales ?","methods":["Modèle structurel de recherche et appariement sur cycle de vie","Hétérogénéité des travailleurs, des entreprises et des productivités","Simulations contrefactuelles selon l'indexation des dispositifs"],"population_or_unit":"Travailleurs, entreprises, emploi et finances publiques dans un modèle calibré sur la France","geographic_scope":["France"],"temporal_scope":"Document de travail du 24 janvier 2025","key_findings":["Le modèle prévoit qu'une hausse du salaire minimum réduit sensiblement l'emploi et le surplus budgétaire dans les scénarios simulés.","L'ampleur du résultat dépend de l'indexation du barème des allègements et des autres dispositifs socio-fiscaux sur le SMIC.","Les auteurs identifient dans leur modèle une réforme des allègements concentrant davantage le soutien près du SMIC comme susceptible d'améliorer emploi, surplus et bien-être."],"limitations":["Il s'agit de résultats de modèle, non d'une mesure causale issue d'une hausse effectivement observée.","Les conclusions sont sensibles aux hypothèses, paramètres et règles d'indexation retenus ; elles doivent être confrontées aux études empiriques microéconomiques."],"review_status":"screened","review_notes":"Résumé et introduction du document de travail consultés ; analyse des équations, calibration et sensibilités encore nécessaire."}
  - {"id":"STUDY-COTTET-PAYROLL-TAX-2024","title":"Payroll Tax Reductions for Minimum Wage Workers: Relative Labor Cost or Cash Windfall Effects?","organization":"CESifo","authors":["Sophie Cottet"],"study_type":"quasi_experimental","source_ids":["SOURCE-COTTET-PAYROLL-TAX-2024"],"domains":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"research_question":"Comment les entreprises réagissent-elles à une réduction de cotisations patronales ciblant les emplois au salaire minimum, selon qu'elle modifie le coût relatif du poste ou procure un gain de trésorerie à l'entreprise ?","methods":["Données administratives appariées employeurs-salariés","Exploitation de variations de coût du travail au niveau du poste et de l'entreprise"],"population_or_unit":"Entreprises françaises et emplois rémunérés au voisinage du SMIC","geographic_scope":["France"],"temporal_scope":"Working Paper CESifo 11076, 2024","key_findings":["L'étude rapporte une augmentation supplémentaire de 13 points de pourcentage du nombre d'emplois au salaire minimum dans les entreprises auparavant peu ou pas utilisatrices de ces emplois, liée au changement du coût relatif du travail.","Les entreprises déjà fortement utilisatrices d'emplois au SMIC augmentent leur emploi d'environ 4 % supplémentaires sur les deux premières années, indépendamment du niveau de salaire ; l'effet est plus fort pour les entreprises contraintes financièrement."],"limitations":["L'intervention étudiée est une baisse de cotisations, pas une hausse du SMIC.","Les effets identifiés ne sont pas symétriques par construction et ne peuvent être inversés pour prédire l'effet d'une hausse salariale.","Working paper ; vérifier les hypothèses d'identification et la robustesse dans le texte intégral."],"review_status":"screened","review_notes":"Page de présentation CESifo consultée ; résultats résumés et non répliqués indépendamment."}
