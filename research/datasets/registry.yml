  - {"id":"DATASET-PARCOURSUP-2026-INDICATORS","title":"Indicateurs agrégés de la procédure Parcoursup 2026","provider":"SIES / Ministère de l’Enseignement supérieur","source_ids":["SOURCE-PARCOURSUP-BILAN-2026","SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS"],"url":"https://www.enseignementsup-recherche.gouv.fr/fr/parcoursup-2026-les-propositions-d-admission-dans-l-enseignement-superieur-104448","domains":["DOMAIN-EDUCATION"],"geographic_scope":["France"],"temporal_coverage":"Campagne 2026","unit_of_observation":"Candidats, néo-bacheliers, propositions et acceptations agrégés","variables":["Nombre de candidats","Candidats ayant reçu au moins une proposition","Taux d'acceptation","Catégorie de candidat","Type de baccalauréat"],"license":"À vérifier dans les fichiers téléchargeables et leurs conditions de réutilisation","access_status":"open","version_or_vintage":"Campagne 2026 ; note Flash SIES 2026-26","limitations":["Les agrégats publiés ne permettent pas tous les croisements individuels nécessaires à l'étude des inégalités.","Ne pas mélanger les populations de référence et les dénominateurs."]}
  - {"id":"DATASET-PISA-2022-FRANCE","title":"Données PISA 2022 — France","provider":"OCDE","source_ids":["SOURCE-OECD-PISA-2022-FRANCE"],"url":"https://www.oecd.org/en/publications/pisa-2022-results-volume-i-and-ii-country-notes_ed6fbcc5-en/france_8008535b-en.html","domains":["DOMAIN-EDUCATION"],"geographic_scope":["France","OCDE"],"temporal_coverage":"2022","unit_of_observation":"Élèves de 15 ans et établissements échantillonnés","variables":["Scores en mathématiques, lecture et sciences","Indice de statut économique, social et culturel","Variables de contexte scolaire"],"license":"Conditions OCDE à vérifier pour les fichiers microdonnées","access_status":"open","version_or_vintage":"PISA 2022","limitations":["Enquête échantillonnée avec pondérations et erreurs d'échantillonnage ; analyses microdonnées à pondérer."]}
  - {"id":"DATASET-PARCOURSUP-2025-FORMATION-OPEN-DATA","title":"Parcoursup 2025 — vœux, propositions et réponses des établissements par formation","provider":"Ministère de l’Enseignement supérieur — SIES","source_ids":["SOURCE-PARCOURSUP-OPEN-DATA-2025"],"url":"https://data.enseignementsup-recherche.gouv.fr/explore/dataset/fr-esr-parcoursup/?flg=fr","domains":["DOMAIN-EDUCATION"],"geographic_scope":["France","Régions","Départements","Académies","Établissements"],"temporal_coverage":"15 janvier – 10 septembre 2025","unit_of_observation":"Formation / établissement ; variables agrégées sur les candidats, vœux, propositions et admis","variables":["Capacité d'accueil","Nombre de vœux par sexe et série de baccalauréat","Candidats classés par série de baccalauréat","Propositions et admissions par série de baccalauréat","Boursiers parmi les candidats et admis","Mention au baccalauréat","Origine géographique","Taux d'accès","Rang du dernier appelé"],"license":"Licence Ouverte / Open Licence (Etalab)","access_status":"open","version_or_vintage":"Extraction du 7 octobre 2025 ; 115 variables et 14 252 enregistrements","limitations":["Couvre 1 015 200 candidats et un sous-ensemble de 652 800 néo-bacheliers ; hors apprentissage.","Les taux d'accès et la répartition par type de baccalauréat ajoutés à la cartographie ne sont pas recalculables à partir du fichier.","Unité d'observation agrégée par formation ; ne permet pas de reconstituer des parcours individuels.","Les données 2026 par formation n'étaient pas encore publiées sur le portail au 13 novembre 2026 selon la page officielle Parcoursup ; le millésime 2025 est un point de comparaison, pas un substitut aux chiffres 2026."]}
  - {"id":"DATASET-SMIC-REVALUATIONS-1970-1993","title":"Décomposition historique des revalorisations du SMIC, 1970–1993","provider":"Sénat, Délégation pour la planification ; transcription et structuration Society Lab","source_ids":["SOURCE-SENAT-1994-SMIC-DECOMPOSITION"],"domains":["DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"1970–1993, glissements annuels à date d'effet de juillet selon le tableau 3 du rapport du Sénat","unit_of_observation":"Épisode annuel de revalorisation du SMIC","variables":["Date d'effet","SMIC horaire en francs courants","Variation observée en pourcentage","Composante prix","Composante liée à la moitié du TSH réel","Obligation légale","Coup de pouce discrétionnaire","Niveau de confiance et notes de réconciliation"],"license":"Non renseignée ; vérifier les conditions de réutilisation du rapport source et de la transcription","access_status":"open","version_or_vintage":"Transcription interne du tableau 3 du rapport sénatorial 1993–1994 ; fichier data/smic-revaluations-1970-1993.csv","transformation_notes":["Transcription structurée du tableau 3 ; chaque ligne conserve la source et l'URL du rapport.","Les glissements annuels à date donnée ne sont pas des moyennes annuelles ; les francs courants ne mesurent pas le pouvoir d'achat.","Les écarts avec le rapport du groupe d'experts 2020 pour certains épisodes sont signalés et restent à réconcilier."],"limitations":["Série limitée à 1970–1993 et aux conventions du tableau source.","Divergence interne du rapport pour le taux horaire de juillet 1978 : 10,65 F au tableau 2 contre 10,85 F au tableau 3 ; valeur du tableau 3 retenue dans le CSV et écart conservé en note.","Les définitions historiques ne sont pas directement comparables aux règles contemporaines.","Ne pas utiliser les taux nominaux comme mesure de variation du pouvoir d'achat réel."]}

  - {"id":"DATASET-SMIC-REVALUATIONS-1994-2026","title":"Chronologie des revalorisations du SMIC, 1994–2026","provider":"Society Lab, à partir des sources INSEE, DARES, Sénat, Assemblée nationale et Groupe d’experts SMIC","source_ids":["SOURCE-DARES-SMIC-HISTORY-1994-2009","SOURCE-DARES-SMIC-ANNEX-2009","SOURCE-SENATE-GMR-2005","SOURCE-DARES-GMR-CONVERGENCE-2012","SOURCE-EXPERT-GROUP-2009","SOURCE-EXPERT-GROUP-2017","SOURCE-INSEE-SMIC-ANNUAL-TABLE","SOURCE-INSEE-2013-EMPLOYMENT","SOURCE-INSEE-SMIC-HOURLY-SERIES","SOURCE-MINISTRY-SMIC-HISTORY","SOURCE-ASSEMBLY-2021-SMIC-BOOSTS"],"url":"https://github.com/JM-Brun/society-lab/blob/main/data/smic-revaluations-1994-2026.csv","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France hors Mayotte"],"temporal_coverage":"1994–2026 ; une ligne par changement de taux documenté","unit_of_observation":"Épisode de changement du taux horaire brut du SMIC","variables":["Date d'effet","Taux horaire brut en euros","Variation par rapport au taux précédent","Type de période","Classification de l'événement","Mécanisme ou contexte","Source et niveau de confiance"],"license":"Transcription et structuration Society Lab ; vérifier les conditions de réutilisation de chaque source primaire","access_status":"open","version_or_vintage":"Première compilation documentaire, contrôlée le 15 novembre 2026","transformation_notes":["Les taux et dates d'effet sont compilés à partir des sources officielles référencées ligne par ligne.","Les variations entre taux successifs ne constituent pas une décomposition juridique des contributions automatiques et discrétionnaires.","Les périodes de convergence des GMR (2003–2005) sont distinguées des revalorisations ordinaires.","La série commence en 1994 et complète le jeu 1970–1993 ; elle n'est pas une série homogène de pouvoir d'achat."],"limitations":["La décomposition légale exhaustive n'est pas disponible pour toutes les années ; les catégories événementielles doivent être lues avec les notes et sources.","Les montants nominaux ne mesurent pas le pouvoir d'achat ; les taux horaires ne décrivent pas les revenus annuels des salariés.","La revalorisation 2026 est documentée par dates d'effet ; le pouvoir d'achat annuel 2026 n'est pas disponible dans la série INSEE consultée."],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DATASET-SMIC-REVALUATIONS-1996-2008","title":"Décomposition des revalorisations du SMIC, 1996–2008","provider":"DARES / Groupe d’experts SMIC ; transcription Society Lab","source_ids":["SOURCE-DARES-SMIC-ANNEX-2009"],"url":"https://github.com/JM-Brun/society-lab/blob/main/data/smic-revaluations-1996-2008.csv","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"Juillet 1996–juillet 2008 ; épisodes annuels documentés dans l'annexe 1 du rapport de juin 2009","unit_of_observation":"Épisode annuel de revalorisation du taux horaire légal du SMIC","variables":["Date d'effet","Taux horaire brut en francs ou euros courants","Variation observée","Moitié du gain de pouvoir d'achat du SHBO","Contribution des prix","Coup de pouce discrétionnaire","Convergence GMR","Alignement sur GMR","Notes et niveau de confiance"],"license":"Transcription et structuration Society Lab ; vérifier les conditions de réutilisation du rapport source","access_status":"open","version_or_vintage":"Transcription de l'annexe 1 du rapport du Groupe d'experts SMIC, juin 2009, p. 32","transformation_notes":["Les montants en francs sont conservés avant le passage à l'euro en 2002 ; aucune conversion rétrospective n'est appliquée aux taux historiques.","Les contributions sont transcrites telles que publiées ; les arrondis et résidus ne sont pas forcés à zéro. Les variations de la colonne observée sont des glissements annuels à la date de juillet et peuvent inclure des déclenchements automatiques intervenus en mai.","Les hausses de GMR distinctes du taux horaire sont signalées en notes et ne sont pas ajoutées à la décomposition du taux horaire.","La convergence GMR de 2003–2005 est isolée dans sa propre colonne et ne doit pas être qualifiée de coup de pouce discrétionnaire."],"limitations":["L'annexe commence en juillet 1996 et ne couvre pas 1994–1995.","Les données sont des glissements à dates d'effet et non des moyennes annuelles ou des gains de pouvoir d'achat.","La série ne mesure aucun effet causal sur l'emploi, les prix, les marges ou le niveau de vie."],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}

  - {"id":"DATASET-SMIC-REAL-POWER-2014-2025","title":"Pouvoir d'achat annuel du SMIC horaire brut et net, 2014–2025","provider":"INSEE / DARES ; structuration et index Society Lab","source_ids":["SOURCE-INSEE-SMIC-POWER-2014-2025"],"url":"https://github.com/JM-Brun/society-lab/blob/main/data/smic-real-purchasing-power-2014-2025.csv","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France hors Mayotte"],"temporal_coverage":"2014–2025","unit_of_observation":"Année civile ; moyenne annuelle","variables":["SMIC horaire brut moyen annuel en euros courants","Évolution annuelle du pouvoir d'achat du SMIC brut","Évolution annuelle du pouvoir d'achat du SMIC net","Évolution annuelle du pouvoir d'achat du SHBOE","Inflation moyenne annuelle","Indice chaîné du pouvoir d'achat brut, base 2014=100"],"license":"Données INSEE/DARES ; vérifier les conditions de réutilisation ; indice chaîné calculé par Society Lab","access_status":"open","version_or_vintage":"INSEE, page publiée le 9 septembre 2026 ; tableau annuel 2014–2025","transformation_notes":["L'indice 2014=100 est chaîné à partir des variations annuelles officielles du pouvoir d'achat du SMIC horaire brut ; chaque variation de 2015 à 2025 est appliquée multiplicativement à l'indice de l'année précédente.","Les taux publiés sont arrondis au dixième de point ; l'indice chaîné est donc une reconstruction arrondie, pas une série INSEE officielle autonome.","Les variations officielles du pouvoir d'achat sont conservées telles quelles ; elles ne sont pas recalculées à partir des taux horaires annuels arrondis et de l'inflation affichée."],"limitations":["La série commence en 2014 et ne reconstitue pas le pouvoir d'achat historique 1970–2013.","Le pouvoir d'achat horaire ne mesure ni le revenu annuel effectif, ni les heures travaillées, ni le revenu disponible du ménage.","La valeur 2026 n'est pas publiée ; ne pas extrapoler à partir du taux nominal de juin 2026.","Le net est défini selon la note INSEE comme non déduit de CSG et CRDS ; ne pas assimiler cette mesure au net effectivement versé après tous prélèvements."],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}

  - {"id":"DATASET-SMIC-REAL-POWER-2001-2008-TEF2010","title":"Pouvoir d’achat annuel du SMIC, millésime TEF 2010, 2001–2008","provider":"INSEE ; transcription Society Lab","source_ids":["SOURCE-INSEE-TEF-2010-SMIC-POWER"],"url":"https://github.com/JM-Brun/society-lab/blob/main/data/smic-real-purchasing-power-2001-2008-tef2010.csv","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France métropolitaine"],"temporal_coverage":"2001–2008, huit observations annuelles","unit_of_observation":"Année civile ; moyenne annuelle","variables":["SMIC horaire brut moyen annuel","Pouvoir d’achat annuel du SMIC brut et net","Pouvoir d’achat annuel du SHBO","Variation annuelle moyenne de l’indice des prix"],"access_status":"open","version_or_vintage":"INSEE, TEF édition 2010, tableau 5.3, p. 62","transformation_notes":["Valeurs publiées transcrites sans recalcul ; millésime 2010 conservé.","Le fichier est séparé des autres millésimes pour rendre visibles les révisions possibles."],"limitations":["Ne pas fusionner automatiquement avec les valeurs TEF 2014/2015 ni la série 2014–2025 avant audit des révisions et des champs.","Le net ne déduit pas CSG/CRDS ; le SHBO est une définition antérieure au SHBOE."],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}

  - {"id":"DATASET-SMIC-POWER-DECOMPOSITION-1971-2001","title":"Composantes annuelles de la décomposition du pouvoir d’achat du SMIC, 1971–2001","provider":"DARES ; transcription Society Lab","source_ids":["SOURCE-DARES-SMIC-POWER-DECOMPOSITION-1971-2001"],"url":"https://github.com/JM-Brun/society-lab/blob/main/data/smic-real-power-decomposition-1971-2001.csv","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"1971–2001, 31 observations annuelles","unit_of_observation":"Année civile ; contributions exprimées en évolution annuelle moyenne","variables":["Année","Moitié du gain réel du SHBO","Coup de pouce nominal"],"access_status":"open","version_or_vintage":"Tableau V, Économie et Statistique n° 367, 2003","transformation_notes":["Transcription sans interpolation ni calcul de total ; composantes conservées séparément.","Depuis 1999, inclut les revalorisations des GMR."],"limitations":["Ne fournit pas une mesure directe homogène du pouvoir d’achat effectivement observé chaque année.","Ne couvre pas 2002–2008 ; ne pas fusionner avec les séries annuelles INSEE ou juillet-juillet DARES."],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"]}
  - {"id":"DATASET-SMIC-ANNUAL-MEAN-1994-2026","title":"Moyennes annuelles du taux horaire brut du SMIC, 1994–2026","provider":"Society Lab, compilation à partir des séries et tableaux INSEE","source_ids":["SOURCE-INSEE-SMIC-ANNUAL-TABLE","SOURCE-INSEE-SMIC-POWER-2014-2025"],"url":"https://github.com/JM-Brun/society-lab/blob/main/data/smic-annual-averages-1994-2026.csv","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"1994–2026, selon disponibilité des données et limites de série","unit_of_observation":"Année civile ; moyenne annuelle du taux horaire brut du SMIC","variables":["Année","Moyenne annuelle du taux horaire brut","Sources et notes de réconciliation"],"license":"Compilation documentaire Society Lab ; vérifier les conditions de réutilisation des sources primaires","access_status":"open","version_or_vintage":"Compilation contrôlée en novembre 2026","transformation_notes":["Les moyennes annuelles sont distinctes des taux légaux à date d'effet et des glissements annuels.","Les valeurs et les périodes de couverture doivent être interprétées selon les sources et conventions de chaque sous-série."],"limitations":["Ne constitue pas une série homogène de pouvoir d'achat réel.","Les années et définitions doivent être contrôlées avant toute comparaison ou agrégation."]}

  - {"id":"DATASET-CEREQ-GENERATION-2021-BTS-MATCHED","title":"Enquête Génération 2021 appariée à la Base Tous salariés — dispositif expérimental","provider":"Céreq / Insee","source_ids":["SOURCE-CEREQ-GENERATION-2021-BTS-MATCHING-2026","SOURCE-INSEE-PANEL-TOUS-SALARIES-METADATA-2026"],"url":"https://projets.cereq.fr/fiche-1163","domains":["DOMAIN-EDUCATION","DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"Sortants de formation initiale de la Génération 2021 ; appariement réalisé/documenté en 2025-2026","unit_of_observation":"Individu issu de l'enquête Génération 2021 rapproché de données administratives de salariés, sous réserve des règles d'appariement et de diffusion","variables":["Parcours de formation (selon l'enquête Génération et les appariements DEPP/SIES)","Situation d'emploi et trajectoires salariées (selon disponibilité de l'appariement BTS)","Caractéristiques des emplois et rémunérations (selon périmètre effectivement apparié)"],"license":"Accès et conditions de diffusion à vérifier auprès du Céreq et des producteurs ; ne pas présumer d'un accès ouvert","access_status":"restricted_or_to_verify","version_or_vintage":"Projet d'appariement Génération 2021 / BTS documenté sur la période 2025-2026","limitations":["La page de projet confirme la réalisation de l'appariement mais ne donne pas encore le dictionnaire complet, les taux de rapprochement ni les résultats.","Ne pas présenter le dispositif comme un fichier librement téléchargeable.","Les personnes hors emploi salarié et les trajectoires non couvertes par la BTS nécessitent des sources complémentaires."]}
