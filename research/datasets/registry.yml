  - {"id":"DATASET-PIAAC-2023-FRANCE","title":"PIAAC cycle 2 — microdonnées et indicateurs France 2023","provider":"OCDE / DEPP / DARES / Insee","source_ids":["SOURCE-OECD-PIAAC-DATA-METHODOLOGY-2023"],"url":"https://www.oecd.org/fr/about/programmes/piaac/piaac-data.html","domains":["DOMAIN-EDUCATION","DOMAIN-ECONOMY"],"geographic_scope":["France","OCDE"],"temporal_coverage":"Enquête 2023 ; deuxième cycle PIAAC, première vague","unit_of_observation":"Adultes échantillonnés ; microdonnées individuelles à usage public et indicateurs pondérés","variables":["Littératie","Numératie","Résolution adaptative de problèmes","Diplôme et caractéristiques socio-démographiques","Situation sur le marché du travail et variables de contexte disponibles"],"license":"Conditions d'accès et de réutilisation OCDE à vérifier pour les fichiers à usage public","access_status":"open","version_or_vintage":"Deuxième cycle PIAAC, vague 2023","limitations":["Enquête transversale : ne suit pas les trajectoires individuelles dans le temps.","Compétences évaluées limitées aux domaines du cadre PIAAC.","Respecter les poids, valeurs plausibles et procédures d'analyse complexes."]}
  - {"id":"DATASET-INSEE-PANEL-TOUS-SALARIES","title":"Panel Tous salariés — trajectoires annuelles d'emploi salarié et de rémunération","provider":"Insee","source_ids":["SOURCE-INSEE-PANEL-TOUS-SALARIES-METADATA-2026"],"url":"https://www.insee.fr/fr/metadonnees/source/serie/s1047","domains":["DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"1976 à aujourd'hui selon disponibilité ; champ constant depuis 1988 sous filtres ; environ 1/8 de la population salariée depuis 2002","unit_of_observation":"Emploi d'un individu dans une entreprise au cours d'une année, ou période annuelle de chômage indemnisé depuis 2009","variables":["Salaire et caractéristiques du poste","Employeur, secteur et établissement","Temps de travail et périodes d'emploi","Caractéristiques individuelles disponibles dans le panel"],"license":"Accès détaillé soumis aux conditions de diffusion statistique et de confidentialité ; accès chercheur à vérifier auprès de l'Insee/CASD","access_status":"restricted_or_to_verify","version_or_vintage":"Panel annuel ; DADS puis DSN (privé depuis 2017, public depuis 2022)","limitations":["Ne couvre pas directement les non-salariés ; pour les transitions vers le non-salariat, examiner le Panel Tous actifs.","Les ruptures de source et de champ doivent être documentées avant analyse longitudinale.","Les trajectoires observées dans le salariat ne suffisent pas à mesurer les compétences acquises ou les parcours de formation sans appariement."]}
