  - {"id":"DATASET-PARCOURSUP-2025-FORMATION-OPEN-DATA","title":"Parcoursup 2025 — vœux, propositions et réponses des établissements par formation","provider":"Ministère de l’Enseignement supérieur — SIES","source_ids":["SOURCE-PARCOURSUP-OPEN-DATA-2025"],"url":"https://data.enseignementsup-recherche.gouv.fr/explore/dataset/fr-esr-parcoursup/?flg=fr","domains":["DOMAIN-EDUCATION"],"geographic_scope":["France","Régions","Départements","Académies","Établissements"],"temporal_coverage":"15 janvier – 10 septembre 2025","unit_of_observation":"Formation / établissement ; variables agrégées sur les candidats, vœux, propositions et admis","variables":["Capacité d'accueil","Nombre de vœux par sexe et série de baccalauréat","Candidats classés par série de baccalauréat","Propositions et admissions par série de baccalauréat","Boursiers parmi les candidats et admis","Mention au baccalauréat","Origine géographique","Taux d'accès","Rang du dernier appelé"],"license":"Licence Ouverte / Open Licence (Etalab)","access_status":"open","version_or_vintage":"Extraction du 7 octobre 2025 ; 115 variables et 14 252 enregistrements","limitations":["Couvre 1 015 200 candidats et un sous-ensemble de 652 800 néo-bacheliers ; hors apprentissage.","Les taux d'accès et la répartition par type de baccalauréat ajoutés à la cartographie ne sont pas recalculables à partir du fichier.","Unité d'observation agrégée par formation ; ne permet pas de reconstituer des parcours individuels.","Les données 2026 par formation n'étaient pas encore publiées sur le portail au 13 novembre 2026 selon la page officielle Parcoursup ; le millésime 2025 est un point de comparaison, pas un substitut aux chiffres 2026."]}
  - {"id":"DATASET-SMIC-REVALUATIONS-1970-1993","title":"Décomposition historique des revalorisations du SMIC, 1970–1993","provider":"Sénat, Délégation pour la planification ; transcription et structuration Society Lab","source_ids":["SOURCE-SENAT-1994-SMIC-DECOMPOSITION"],"domains":["DOMAIN-ECONOMY"],"geographic_scope":["France"],"temporal_coverage":"1970–1993, glissements annuels à date d'effet de juillet selon le tableau 3 du rapport du Sénat","unit_of_observation":"Épisode annuel de revalorisation du SMIC","variables":["Date d'effet","SMIC horaire en francs courants","Variation observée en pourcentage","Composante prix","Composante liée à la moitié du TSH réel","Obligation légale","Coup de pouce discrétionnaire","Niveau de confiance et notes de réconciliation"],"license":"Non renseignée ; vérifier les conditions de réutilisation du rapport source et de la transcription","access_status":"open","version_or_vintage":"Transcription interne du tableau 3 du rapport sénatorial 1993–1994 ; fichier data/smic-revaluations-1970-1993.csv","transformation_notes":["Transcription structurée du tableau 3 ; chaque ligne conserve la source et l'URL du rapport.","Les glissements annuels à date donnée ne sont pas des moyennes annuelles ; les francs courants ne mesurent pas le pouvoir d'achat.","Les écarts avec le rapport du groupe d'experts 2020 pour certains épisodes sont signalés et restent à réconcilier."],"limitations":["Série limitée à 1970–1993 et aux conventions du tableau source.","Divergence interne du rapport pour le taux horaire de juillet 1978 : 10,65 F au tableau 2 contre 10,85 F au tableau 3 ; valeur du tableau 3 retenue dans le CSV et écart conservé en note.","Les définitions historiques ne sont pas directement comparables aux règles contemporaines.","Ne pas utiliser les taux nominaux comme mesure de variation du pouvoir d'achat réel."]}
