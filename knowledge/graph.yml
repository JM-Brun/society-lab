description: "relations register — Society Lab"
relations:
  - {"id":"REL-EDGE-SOURCE-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-PARCOURSUP-BILAN-2026","to":"DOMAIN-EDUCATION","justification":"Le bilan décrit les volumes et les résultats agrégés de la campagne Parcoursup 2026 ; il documente le fonctionnement de l'accès à l'enseignement supérieur."}
  - {"id":"REL-EDGE-SIES-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS","to":"DOMAIN-EDUCATION","justification":"La note statistique SIES analyse les propositions et acceptations d'admission en 2026 selon les populations de candidats ; elle porte sur l'accès au supérieur."}
  - {"id":"REL-EDGE-DEPP-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-DEPP-ETAT-ECOLE-2025","to":"DOMAIN-EDUCATION","justification":"L'État de l'École rassemble des indicateurs sur les apprentissages, les parcours et les inégalités du système scolaire français."}
  - {"id":"REL-EDGE-INSEE-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-INSEE-INEGALITES-SCOLAIRES-2025","to":"DOMAIN-EDUCATION","justification":"La publication Insee examine les inégalités sociales d'acquis dans l'enseignement scolaire, notamment dès les premières étapes du parcours."}
  - {"id":"REL-EDGE-PISA-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-OECD-PISA-2022-FRANCE","to":"DOMAIN-EDUCATION","justification":"La note PISA France traite des compétences des élèves de 15 ans et de leur association avec le statut socio-économique."}
  - {"id":"REL-EDGE-OECD-EAG-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-OECD-EAG-2025-FRANCE","to":"DOMAIN-EDUCATION","justification":"La note OCDE compare les niveaux de formation et les trajectoires éducatives, dont la transmission intergénérationnelle des diplômes."}
  - {"id":"REL-EDGE-EU-MONITOR-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-EU-EDUCATION-MONITOR-2025-FRANCE","to":"DOMAIN-EDUCATION","justification":"Le rapport européen suit les indicateurs et politiques d'éducation et de formation en France dans une perspective comparative européenne."}
  - {"id":"REL-EDGE-DEFENDER-ABOUT-EDUCATION","type":"REL-ABOUT","from":"SOURCE-DEFENSEUR-DROITS-JEUNESSES-ORIGINE-2026","to":"DOMAIN-EDUCATION","justification":"Le rapport documente les discriminations vécues par les jeunes selon l'origine ; il éclaire les enjeux d'égalité dans les parcours, sans se limiter à l'éducation."}
  - {"id":"REL-EDGE-STUDY-PARCOURSUP-SUPPORTS-APPLICANTS","type":"REL-SUPPORTS","from":"STUDY-PARCOURSUP-ADMISSIONS-2026","to":"CLAIM-PARCOURSUP-2026-APPLICANTS","justification":"Relation documentaire : le bilan ministériel 2026 rapporte 1 046 000 candidats pour la campagne. Le registre de l'étude référence ce bilan parmi ses sources ; vérifier le périmètre exact des catégories incluses avant toute comparaison temporelle."}
  - {"id":"REL-EDGE-STUDY-PARCOURSUP-SUPPORTS-NEW-BACHELORS","type":"REL-SUPPORTS","from":"STUDY-PARCOURSUP-ADMISSIONS-2026","to":"CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","justification":"Relation documentaire : la note Flash SIES 2026-26 rapporte que 93,7 % des néo-bacheliers inscrits ont reçu au moins une proposition. Le claim conserve ce dénominateur propre ; cela ne mesure ni le premier vœu, ni l'inscription effective, ni la réussite."}
  - {"id":"REL-EDGE-STUDY-PARCOURSUP-SUPPORTS-LYCEENS","type":"REL-SUPPORTS","from":"STUDY-PARCOURSUP-ADMISSIONS-2026","to":"CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","justification":"Relation documentaire : le bilan Parcoursup 2026 rapporte que 91,5 % des lycéens ayant formulé des vœux ont reçu au moins une proposition. Ce dénominateur est distinct de celui des néo-bacheliers inscrits ; ne pas fusionner les deux indicateurs."}
  - {"id":"REL-EDGE-STUDY-PISA-SUPPORTS-GAP","type":"REL-SUPPORTS","from":"STUDY-OECD-PISA-2022-FRANCE","to":"CLAIM-PISA-2022-SOCIOECONOMIC-GAP","justification":"Relation documentaire : la note pays OCDE PISA 2022 pour la France rapporte un écart de 113 points en mathématiques entre les quartiles socio-économiques supérieur et inférieur chez les élèves de 15 ans. Il s'agit d'un écart descriptif standardisé, pas d'un effet causal attribuable à une seule variable."}
  - {"id":"REL-EDGE-STUDY-INSEE-SUPPORTS-EARLY","type":"REL-SUPPORTS","from":"STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","to":"CLAIM-INSEE-EARLY-SOCIAL-GAPS","justification":"Relation documentaire : la publication Insee 2025 sur les inégalités scolaires décrit des écarts d'acquis associés à l'origine sociale dès l'entrée en maternelle. L'ampleur et les mesures précises restent à documenter à partir des tableaux ; cette relation ne signifie ni déterminisme ni causalité établie."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-STUDY-1","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"STUDY-PARCOURSUP-ADMISSIONS-2026","justification":"Le dossier mobilise le bilan descriptif Parcoursup 2026 pour cadrer les volumes de candidatures, propositions et acceptations, sans en déduire une mesure globale d'égalité des chances."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-STUDY-2","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025","justification":"Le dossier mobilise cette étude pour replacer l'accès au supérieur dans la chaîne des inégalités d'acquis et de parcours scolaires en amont."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-STUDY-3","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"STUDY-OECD-PISA-2022-FRANCE","justification":"Le dossier mobilise PISA 2022 comme repère comparatif sur les écarts de compétences liés au statut socio-économique avant l'entrée dans le supérieur."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-CLAIM-1","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"CLAIM-PARCOURSUP-2026-APPLICANTS","justification":"Le dossier reprend le volume total de candidats pour décrire le contexte de la campagne 2026 ; ce chiffre ne mesure pas l'équité des admissions."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-CLAIM-2","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"CLAIM-PISA-2022-SOCIOECONOMIC-GAP","justification":"Le dossier mobilise l'écart PISA comme indicateur descriptif des inégalités de compétences en amont, et non comme effet causal de Parcoursup."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-HYPOTHESIS-1","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"HYPOTHESIS-CUMULATIVE-EDUCATIONAL-INEQUALITY","justification":"Le dossier formule cette hypothèse cumulative comme piste à tester sur plusieurs étapes de la chaîne éducative ; elle n'est pas présentée comme un résultat établi."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-HYPOTHESIS-2","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"HYPOTHESIS-PARCOURSUP-ACCESS-VS-EQUITY","justification":"Le dossier examine l'hypothèse selon laquelle la réception d'une proposition ne suffit pas à caractériser l'équité d'accès aux formations ; elle reste à tester."}
  - {"id":"REL-EDGE-DOSSIER-INCLUDES-HYPOTHESIS-3","type":"REL-INCLUDES","from":"DOSSIER-PARCOURSUP-EDUCATION-EQUITY","to":"HYPOTHESIS-ADMISSION-IS-NOT-SUCCESS","justification":"Le dossier distingue explicitement admission et réussite ultérieure ; cette proposition guide les questions de recherche mais n'est pas une conclusion empirique."}
  - {"id":"REL-EDGE-STUDY-OECD-SUPPORTS-INTERGEN","type":"REL-SUPPORTS","from":"STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025","to":"CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","justification":"Relation documentaire : la note pays OCDE Regards sur l'éducation 2025 rapporte 75 % contre 32 % de diplômés du supérieur parmi les 25-34 ans selon le niveau de diplôme parental. Les catégories et le tableau source restent à vérifier ; l'indicateur est descriptif et ne mesure pas l'effet causal de Parcoursup ou d'un établissement."}
