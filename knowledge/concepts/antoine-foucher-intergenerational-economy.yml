version: 1
concepts:
  - id: "CONCEPT-DECLASSEMENT-ECONOMIQUE-RELATIF"
    label: "Déclassement économique relatif"
    definition: "Perte de position d'un pays, d'un groupe ou d'une cohorte par rapport à un ensemble de comparateurs, mesurée par des indicateurs explicités (revenu, productivité, compétences, patrimoine ou capacité productive). Une baisse de rang ne signifie pas nécessairement une baisse absolue du niveau de vie."
    domain_ids: ["DOMAIN-ECONOMY", "DOMAIN-SOCIETY"]
    tags: ["TAG-METHOD-COMPARATIVE"]
    aliases: ["déclassement relatif", "relative economic decline"]
  - id: "CONCEPT-PACTE-INTERGENERATIONNEL"
    label: "Pacte intergénérationnel"
    definition: "Ensemble des règles explicites et implicites organisant la répartition des ressources, des risques, des droits, des obligations et des investissements entre générations présentes et futures."
    domain_ids: ["DOMAIN-ECONOMY", "DOMAIN-FINANCE", "DOMAIN-SOCIETY"]
    tags: ["TAG-ISSUE-TRADEOFFS"]
    aliases: ["contrat intergénérationnel", "intergenerational compact"]
  - id: "CONCEPT-ARBITRAGE-DEPENSES-PUBLIQUES-INVESTISSEMENT"
    label: "Arbitrage entre dépenses publiques courantes et investissement"
    definition: "Choix budgétaires entre transferts, consommation collective et investissements matériels ou immatériels. L'existence d'un arbitrage comptable ne suffit pas à établir un effet d'éviction causal ; les recettes, la dette et les effets macroéconomiques doivent être considérés."
    domain_ids: ["DOMAIN-ECONOMY", "DOMAIN-FINANCE"]
    tags: ["TAG-ISSUE-TRADEOFFS"]
    aliases: ["public spending composition", "investissement public"]
  - id: "CONCEPT-CAPACITE-PRODUCTIVE"
    label: "Capacité productive"
    definition: "Ensemble des ressources, compétences, infrastructures, technologies, organisations et institutions permettant à une économie de produire durablement des biens et services. Elle ne se réduit ni au poids de l'industrie ni à la productivité mesurée à court terme."
    domain_ids: ["DOMAIN-ECONOMY", "DOMAIN-TECHNOLOGY", "DOMAIN-ENERGY"]
    tags: ["TAG-METHOD-COMPARATIVE"]
    aliases: ["productive capacity", "base productive"]
