version: 1
description: "Registre des concepts réutilisables du graphe de connaissances."
concepts:
  - {"id":"CONCEPT-CAUSAL-ALTERNATIVE-EXPLANATION","label":"Explication causale alternative","definition":"Explication qui propose un mécanisme causal de remplacement ou de complément à une explication initiale, notamment pour corriger une information erronée sans se limiter à nier cette information.","domain_ids":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SCIENCE"],"tags":["TAG-METHOD-EXPERIMENTAL","TAG-METHOD-REVIEW"],"aliases":["alternative causal explanation","explication alternative"]}

  - {"id":"CONCEPT-DELIBERATIVE-DEMOCRACY","label":"Démocratie délibérative","definition":"Approche de la décision collective qui accorde un rôle central à l'échange raisonné d'arguments, à l'information, à l'écoute et à la révision possible des préférences.","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["deliberative democracy"]}
  - {"id":"CONCEPT-MINI-PUBLIC","label":"Mini-public","definition":"Groupe restreint de citoyens constitué pour refléter certaines caractéristiques de la population et participer à un processus structuré d'information et de délibération.","domain_ids":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["mini-public","citizens' assembly"]}
  - {"id":"CONCEPT-CITIZEN-SORTITION","label":"Tirage au sort citoyen","definition":"Procédure de sélection aléatoire de citoyens, souvent combinée à une stratification ou à des objectifs de diversité, pour constituer un panel délibératif.","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["sortition","civic lottery"]}
  - {"id":"CONCEPT-DELIBERATIVE-QUALITY","label":"Qualité délibérative","definition":"Caractéristiques observables des échanges délibératifs : égalité de participation, justification des arguments, écoute, pluralisme, réactivité et prise en compte des désaccords.","domain_ids":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["deliberative quality"]}
  - {"id":"CONCEPT-POLITICAL-LEGITIMACY","label":"Légitimité politique","definition":"Justification de l'autorité ou de la portée d'une décision collective ; peut reposer sur la procédure, la participation, la représentativité, les droits et les résultats, dimensions à distinguer.","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"tags":[],"aliases":["political legitimacy"]}
  - {"id":"CONCEPT-DOUBLE-CARBON-CONSTRAINT","label":"Double contrainte carbone","definition":"Cadre d'analyse articulant l'impératif climatique de réduction des émissions de gaz à effet de serre et les vulnérabilités économiques et géopolitiques liées à la dépendance aux combustibles fossiles. Les deux contraintes sont liées mais doivent être distinguées analytiquement.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUALITATIVE"],"aliases":["double contrainte carbone","double carbon constraint"]}
  - {"id":"CONCEPT-PHYSICAL-ECONOMY","label":"Lecture physique de l'économie","definition":"Approche qui analyse l'activité économique à partir de ses flux matériels et énergétiques, de ses infrastructures, de ses stocks de ressources et de ses contraintes biophysiques, en complément des analyses monétaires et institutionnelles.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUALITATIVE"],"aliases":["économie physique","physical economy"]}
  - {"id":"CONCEPT-ROBUSTNESS-OF-TRANSITION","label":"Robustesse d'une trajectoire de transition","definition":"Capacité d'une trajectoire de transformation à maintenir ses fonctions et ses objectifs essentiels malgré des aléas, des retards, des défaillances partielles ou des contraintes externes. Elle s'évalue en explicitant les fonctions à préserver, les chocs considérés, les seuils de performance et les horizons temporels.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUALITATIVE"],"aliases":["robustesse de la transition","transition robustness"]}
  - {"id":"CONCEPT-SCENARIO-SENSITIVITY-ANALYSIS","label":"Analyse de sensibilité des scénarios","definition":"Méthode consistant à faire varier explicitement les hypothèses et paramètres d'un scénario afin d'identifier les résultats robustes, les dépendances critiques et les conditions dans lesquelles les conclusions changent. Une analyse de variantes n'est pas en elle-même une estimation probabiliste.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUANTITATIVE"],"aliases":["scenario sensitivity analysis","tests de sensibilité"]}
  - {"id":"CONCEPT-DECLASSEMENT-ECONOMIQUE-RELATIF","label":"Déclassement économique relatif","definition":"Perte de position d'un pays, groupe ou cohorte par rapport à des comparateurs, mesurée par des indicateurs explicités (revenu, productivité, compétences, patrimoine ou capacité productive). Une baisse de rang ne signifie pas nécessairement une baisse absolue du niveau de vie.","domain_ids":["DOMAIN-ECONOMY","DOMAIN-SOCIETY"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["déclassement relatif","relative economic decline"]}
  - {"id":"CONCEPT-PACTE-INTERGENERATIONNEL","label":"Pacte intergénérationnel","definition":"Ensemble des règles explicites et implicites organisant la répartition des ressources, des risques, des droits, des obligations et des investissements entre générations présentes et futures.","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE","DOMAIN-SOCIETY"],"tags":["TAG-ISSUE-TRADEOFFS"],"aliases":["contrat intergénérationnel","intergenerational compact"]}
  - {"id":"CONCEPT-ARBITRAGE-DEPENSES-PUBLIQUES-INVESTISSEMENT","label":"Arbitrage entre dépenses publiques courantes et investissement","definition":"Choix budgétaires entre transferts, consommation collective et investissements matériels ou immatériels. Un arbitrage comptable ne suffit pas à établir un effet d'éviction causal ; recettes, dette et effets macroéconomiques doivent être considérés.","domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"tags":["TAG-ISSUE-TRADEOFFS"],"aliases":["public spending composition","investissement public"]}
  - {"id":"CONCEPT-CAPACITE-PRODUCTIVE","label":"Capacité productive","definition":"Ensemble des ressources, compétences, infrastructures, technologies, organisations et institutions permettant à une économie de produire durablement des biens et services. Elle ne se réduit ni au poids de l'industrie ni à la productivité mesurée à court terme.","domain_ids":["DOMAIN-ECONOMY","DOMAIN-TECHNOLOGY","DOMAIN-ENERGY"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["productive capacity","base productive"]}
  - {"id":"CONCEPT-ENERGY-ACCOUNTING-PERIMETER","label":"Périmètre comptable énergétique","definition":"Ensemble des conventions qui déterminent quelles consommations, pertes, usages non énergétiques, soutes, territoires et transformations sont inclus dans un bilan énergétique. Deux valeurs en TWh ne sont comparables que si ces conventions sont identiques ou si un retraitement explicite est effectué.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUANTITATIVE","TAG-METHOD-COMPARATIVE"],"aliases":["energy accounting boundary","périmètre de bilan énergétique","conventions énergétiques"]}
