version: 1
description: "Registre des concepts réutilisables du graphe de connaissances."
concepts:
  - {"id":"CONCEPT-CAUSAL-ALTERNATIVE-EXPLANATION","label":"Explication causale alternative","definition":"Explication qui propose un mécanisme causal de remplacement ou de complément à une explication initiale, notamment pour corriger une information erronée sans se limiter à nier cette information.","domain_ids":["DOMAIN-POLITICS","DOMAIN-MEDIA","DOMAIN-SCIENCE"],"tags":["TAG-METHOD-EXPERIMENTAL","TAG-METHOD-REVIEW"],"aliases":["alternative causal explanation","explication alternative"]}

  - {"id":"CONCEPT-DELIBERATIVE-DEMOCRACY","label":"Démocratie délibérative","definition":"Approche de la décision collective qui accorde un rôle central à l'échange raisonné d'arguments, à l'information, à l'écoute et à la révision possible des préférences.","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["deliberative democracy"]}
  - {"id":"CONCEPT-MINI-PUBLIC","label":"Mini-public","definition":"Groupe restreint de citoyens constitué pour refléter certaines caractéristiques de la population et participer à un processus structuré d'information et de délibération.","domain_ids":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["mini-public","citizens' assembly"]}
  - {"id":"CONCEPT-CITIZEN-SORTITION","label":"Tirage au sort citoyen","definition":"Procédure de sélection aléatoire de citoyens, souvent combinée à une stratification ou à des objectifs de diversité, pour constituer un panel délibératif.","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["sortition","civic lottery"]}
  - {"id":"CONCEPT-DELIBERATIVE-QUALITY","label":"Qualité délibérative","definition":"Caractéristiques observables des échanges délibératifs : égalité de participation, justification des arguments, écoute, pluralisme, réactivité et prise en compte des désaccords.","domain_ids":["DOMAIN-POLITICS","DOMAIN-SOCIETY"],"tags":["TAG-METHOD-COMPARATIVE"],"aliases":["deliberative quality"]}
  - {"id":"CONCEPT-POLITICAL-LEGITIMACY","label":"Légitimité politique","definition":"Justification de l'autorité ou de la portée d'une décision collective ; peut reposer sur la procédure, la participation, la représentativité, les droits et les résultats, dimensions à distinguer.","domain_ids":["DOMAIN-POLITICS","DOMAIN-INSTITUTIONS"],"tags":[],"aliases":["political legitimacy"]}
  - {"id":"CONCEPT-DOUBLE-CARBON-CONSTRAINT","label":"Double contrainte carbone","definition":"Cadre d'analyse articulant l'impératif climatique de réduction des émissions de gaz à effet de serre et les vulnérabilités économiques et géopolitiques liées à la dépendance aux combustibles fossiles. Les deux contraintes sont liées mais doivent être distinguées analytiquement.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-SYSTEMS"],"aliases":["double contrainte carbone","double carbon constraint"]}
  - {"id":"CONCEPT-PHYSICAL-ECONOMY","label":"Lecture physique de l'économie","definition":"Approche qui analyse l'activité économique à partir de ses flux matériels et énergétiques, de ses infrastructures, de ses stocks de ressources et de ses contraintes biophysiques, en complément des analyses monétaires et institutionnelles.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-SYSTEMS"],"aliases":["économie physique","physical economy"]}
