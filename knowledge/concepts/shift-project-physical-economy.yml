concepts:
  - {"id":"CONCEPT-DOUBLE-CARBON-CONSTRAINT","label":"Double contrainte carbone","definition":"Cadre d'analyse articulant l'impératif climatique de réduction des émissions de gaz à effet de serre et les vulnérabilités économiques et géopolitiques liées à la dépendance aux combustibles fossiles. Les deux contraintes sont liées mais doivent être distinguées analytiquement.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUALITATIVE"],"aliases":["double contrainte carbone","double carbon constraint"]}
  - {"id":"CONCEPT-PHYSICAL-ECONOMY","label":"Lecture physique de l'économie","definition":"Approche qui analyse l'activité économique à partir de ses flux matériels et énergétiques, de ses infrastructures, de ses stocks de ressources et de ses contraintes biophysiques, en complément des analyses monétaires et institutionnelles.","domain_ids":["DOMAIN-ENERGY","DOMAIN-ENVIRONMENT","DOMAIN-ECONOMY"],"tags":["TAG-METHOD-QUALITATIVE"],"aliases":["économie physique","physical economy"]}
