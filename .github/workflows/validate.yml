name: Validate knowledge base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Audit open issue labels (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/validate/audit_issue_labels.py

      - name: Validate registries and identifiers
        run: python scripts/validate/validate_registry.py

      - name: Report project KPIs (read-only)
        run: python scripts/validate/calculate_project_kpis.py --format markdown

      - name: Validate subject syntheses against dossier registry
        run: python scripts/validate/validate_syntheses.py

      - name: Validate local Markdown link targets
        run: python scripts/validate/validate_markdown_links.py --strict

      - name: Report local Markdown fragment targets (advisory)
        run: python scripts/validate/validate_markdown_anchors.py

      - name: Validate issue-to-dossier mappings
        run: python scripts/validate/validate_issue_domain_map.py

      - name: Report subject synthesis freshness
        run: python scripts/validate/check_synthesis_freshness.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate JSON schemas
        run: for schema in schemas/*.schema.json; do python -m json.tool "$schema" > /dev/null; done
