name: Validate knowledge base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Audit open issue labels (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/validate/audit_issue_labels.py

      - name: Validate registries and identifiers
        run: python scripts/validate/validate_registry.py

      - name: Report project KPIs (read-only)
        run: python scripts/validate/calculate_project_kpis.py --format markdown

      - name: Report registry and graph differences (advisory)
        id: graph-reconciliation
        continue-on-error: true
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--revision "$GITHUB_SHA" --json-output "$RUNNER_TEMP/graph-reconciliation.json")
          if [[ -n "$BASE_REVISION" ]]; then
            args+=(--base "$BASE_REVISION")
          fi
          python scripts/audit/report_graph_reconciliation.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload registry and graph differences
        if: steps.graph-reconciliation.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graph-reconciliation
          path: ${{ runner.temp }}/graph-reconciliation.json
          if-no-files-found: error

      - name: Report knowledge impact of source changes (advisory)
        id: source-impact
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          python scripts/analysis/trace_knowledge_impact.py \
            --base "${GITHUB_SHA}^1" --revision "$GITHUB_SHA" \
            --json-output "$RUNNER_TEMP/source-change-impact.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload source change impact
        if: steps.source-impact.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: source-change-impact
          path: ${{ runner.temp }}/source-change-impact.json
          if-no-files-found: error

      - name: Validate subject syntheses against dossier registry
        run: python scripts/validate/validate_syntheses.py

      - name: Validate local Markdown link targets
        run: python scripts/validate/validate_markdown_links.py --strict

      - name: Report local Markdown fragment targets (advisory)
        run: python scripts/validate/validate_markdown_anchors.py

      - name: Validate issue-to-dossier mappings
        run: python scripts/validate/validate_issue_domain_map.py

      - name: Report subject synthesis freshness
        run: python scripts/validate/check_synthesis_freshness.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate JSON schemas
        run: for schema in schemas/*.schema.json; do python -m json.tool "$schema" > /dev/null; done

      - name: Generate registry coverage inventory
        run: python scripts/audit/audit_registry_coverage.py --output docs/registry-coverage-inventory.md

      - name: Upload registry coverage inventory
        uses: actions/upload-artifact@v4
        with:
          name: registry-coverage-inventory
          path: docs/registry-coverage-inventory.md
          if-no-files-found: error
