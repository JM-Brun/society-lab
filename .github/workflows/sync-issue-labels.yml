name: Synchronize canonical issue labels

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Créer/mettre à jour les labels GitHub (sinon dry-run)"
        required: true
        type: boolean
        default: false

concurrency:
  group: canonical-issue-label-sync
  cancel-in-progress: false

jobs:
  dry-run:
    if: ${{ !inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare canonical labels (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/validate/sync_issue_labels.py

  apply:
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical metadata (explicit opt-in)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOW_LABEL_SYNC: "true"
        run: python scripts/validate/sync_issue_labels.py --apply
