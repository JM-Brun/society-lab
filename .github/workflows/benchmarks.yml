name: Periodic performance benchmarks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmarks.yml
      - scripts/benchmark/benchmark_registry_schema_validation.py
      - scripts/benchmark/benchmark_project_kpis.py
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Benchmark registry schema validation (informational)
        run: python scripts/benchmark/benchmark_registry_schema_validation.py --repeats 3 --scales 1 10 100

      - name: Benchmark project KPI calculation (informational)
        run: python scripts/benchmark/benchmark_project_kpis.py --repeats 3 --scales 1 10 100
