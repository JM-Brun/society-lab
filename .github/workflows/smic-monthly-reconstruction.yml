name: Reconstruct monthly SMIC purchasing power

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/analysis/reconstruct_smic_monthly_purchasing_power.py"
      - "tests/test_smic_monthly_reconstruction.py"
      - ".github/workflows/smic-monthly-reconstruction.yml"

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic reconstruction tests
        run: python -m unittest discover -s tests -p "test_smic_monthly_reconstruction.py"

      - name: Download INSEE monthly series and reconstruct annual values
        run: python scripts/analysis/reconstruct_smic_monthly_purchasing_power.py --output-dir artifacts/smic-monthly

      - name: Upload raw and reconstructed series
        uses: actions/upload-artifact@v4
        with:
          name: smic-monthly-reconstruction-1970-2025
          path: artifacts/smic-monthly/
          if-no-files-found: error
          retention-days: 14
