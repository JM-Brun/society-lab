id: CLAIM-CAUSAL-ALTERNATIVE-IMPROVES-CORRECTION
statement: "Dans certains paradigmes expérimentaux de désinformation, fournir une explication causale alternative cohérente réduit davantage l'influence persistante de l'information erronée qu'un simple démenti."
claim_type: causal
status: partially_supported
scope:
  geography: ["États-Unis", "International"]
  population: "Participants à des expériences de psychologie cognitive et politique"
  period: "Études publiées entre 2015 et 2025"
  conditions: "Récits d'événements et tâches mesurant l'influence persistante d'informations corrigées."
domain_ids: ["DOMAIN-POLITICS", "DOMAIN-MEDIA", "DOMAIN-EDUCATION"]
source_ids: ["SOURCE-NYHAN-REIFLER-2015-CAUSAL-CORRECTIONS", "SOURCE-BUCZEL-2025-ALTERNATIVE-INOCULATION"]
supporting_evidence:
  - "Nyhan et Reifler comparent correction et explication causale alternative dans un paradigme expérimental."
  - "Buczel et al. observent un bénéfice initial d'une alternative explicative dans deux expériences."
counter_evidence:
  - "Buczel et al. observent une remontée possible de l'utilisation inférentielle de l'information erronée après sept jours."
best_counterargument: "L'avantage de l'explication alternative peut être spécifique à certains récits et dépendre de sa plausibilité, de sa qualité et de la possibilité pour le participant de l'intégrer."
limitations:
  - "Ne démontre pas que toute alternative explicative est supérieure à toute correction factuelle."
  - "Ne compare pas les formats de débat ni la présence du promoteur."
  - "La mémoire de la correction et l'utilisation inférentielle sont des résultats distincts."
confidence:
  probability: 0.7
  rationale: "Confiance modérée dans un bénéfice de l'alternative explicative dans certains paradigmes ; généralisation à des débats politiques réels encore incertaine."
provenance:
  - origin: ai_suggested
    note: "Fiche provisoire fondée sur une revue ciblée ; extraction des effets chiffrés et réplication à vérifier."
last_reviewed: "2026-11-17"
