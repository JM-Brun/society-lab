supporting_evidence:
  - "Après la fermeture de Parler, l'activité des utilisateurs actifs se déplace vers d'autres réseaux marginaux."
  - "Après retrait de YouTube, l'audience des créateurs augmente sur BitChute, mais cette hausse ne compense qu'une partie de la perte d'audience totale."
limitations:
