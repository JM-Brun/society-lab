id: CLAIM-DEPLATFORMING-DISPLACEMENT-AND-NET-REACH-2023-2024
statement: "La déplateformisation peut déplacer une partie de l'activité ou de l'audience vers des espaces alternatifs sans nécessairement annuler la réduction de portée nette sur la plateforme dominante."
claim_type: empirical
status: under_review
scope:
  geography: ["États-Unis"]
  period: "Fermeture de Parler en 2021 et retraits de créateurs de YouTube étudiés jusqu'en 2024"
  conditions: "Fermeture d'une plateforme entière et retrait de créateurs individuels ; unités d'analyse distinctes."
domain_ids: ["DOMAIN-POLITICS", "DOMAIN-MEDIA", "DOMAIN-SOCIETY"]
