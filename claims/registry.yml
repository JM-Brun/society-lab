version: 1
description: "claims register — Society Lab"
claims:
  - {"id":"CLAIM-PARCOURSUP-2026-APPLICANTS","statement":"La campagne Parcoursup 2026 a enregistré 1 046 000 candidats.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Campagne 2026","conditions":"Nombre total de candidats selon le bilan ministériel."},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-BILAN-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Bilan ministériel publié le 19 octobre 2026."],"limitations":["Vérifier les catégories incluses dans le total et leur comparabilité historique."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","statement":"En 2026, 93,7 % des néo-bacheliers inscrits sur Parcoursup ont reçu au moins une proposition d'admission.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Campagne 2026","population":"Néo-bacheliers inscrits sur Parcoursup"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Note Flash SIES 2026-26."],"limitations":["Recevoir une proposition n'est pas équivalent à obtenir son premier choix, s'inscrire ou réussir.","Dénominateur différent des lycéens ayant formulé des vœux."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","statement":"En 2026, 91,5 % des lycéens ayant formulé des vœux ont reçu au moins une proposition d'admission.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Campagne 2026","population":"Lycéens ayant formulé des vœux"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-BILAN-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Bilan de la procédure d'admission 2026."],"limitations":["Dénominateur différent de celui des néo-bacheliers inscrits."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PISA-2022-SOCIOECONOMIC-GAP","statement":"Dans PISA 2022, en France, l'écart de score en mathématiques entre les élèves du quartile socio-économique supérieur et ceux du quartile inférieur est de 113 points.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"PISA 2022","population":"Élèves de 15 ans"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-OECD-PISA-2022-FRANCE"],"study_ids":["STUDY-OECD-PISA-2022-FRANCE"],"tags":["TAG-ISSUE-EQUITY","TAG-METHOD-COMPARATIVE"],"supporting_evidence":["Note pays OCDE PISA 2022 — France."],"limitations":["Écart descriptif standardisé, non interprétable comme effet causal de la seule origine sociale."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-INSEE-EARLY-SOCIAL-GAPS","statement":"Des écarts d'acquis associés à l'origine sociale sont déjà observables à l'entrée en maternelle en France.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Publication 2025","population":"Enfants à l'entrée en maternelle"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-INSEE-INEGALITES-SCOLAIRES-2025"],"study_ids":["STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025"],"tags":["TAG-ISSUE-EQUITY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Publication Insee, France, portrait social 2025."],"limitations":["L'ampleur exacte doit être documentée avec les tableaux et mesures précises ; association ne signifie pas déterminisme."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","statement":"En France, 75 % des 25-34 ans ayant au moins un parent diplômé du supérieur ont eux-mêmes un diplôme du supérieur, contre 32 % lorsque leurs parents n'ont pas achevé le deuxième cycle du secondaire.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Données 2023 publiées en 2025","population":"Adultes de 25 à 34 ans selon le niveau de diplôme parental"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-OECD-EAG-2025-FRANCE"],"study_ids":["STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025"],"tags":["TAG-ISSUE-EQUITY","TAG-METHOD-COMPARATIVE"],"supporting_evidence":["Note pays OCDE Regards sur l'éducation 2025."],"limitations":["Indicateur descriptif intergénérationnel ; ne mesure pas l'effet causal propre de Parcoursup ou d'un établissement."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PARCOURSUP-CEV-LOCAL-CRITERIA","statement":"Les formations examinent les candidatures au moyen de commissions d’examen des vœux et de critères définis à l’échelle des formations ; Parcoursup fournit le cadre national de candidature et d’affectation.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Procédure Parcoursup 2026","conditions":"Description institutionnelle du processus d’examen ; pratiques effectives à auditer séparément."},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-ADMISSION-REVIEW-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Page officielle décrivant les commissions d’examen des vœux et les critères propres aux formations."],"limitations":["Description institutionnelle, non audit indépendant des décisions ou des algorithmes locaux.","Les critères déclarés ne renseignent pas à eux seuls leur pondération ni leur application effective."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PARCOURSUP-CEV-REPORTS-2026","statement":"Près de 19 000 rapports d’analyse des candidatures de la session Parcoursup 2026 sont annoncés comme accessibles depuis les fiches des formations.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Session 2026","conditions":"Nombre annoncé par la page officielle Parcoursup."},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-ADMISSION-REVIEW-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Page officielle Parcoursup sur l’examen des candidatures, mise à jour le 20 octobre 2026."],"limitations":["Disponibilité annoncée ; corpus non encore collecté ni audité.","Le nombre de rapports ne renseigne pas sur leur exhaustivité, granularité ou qualité informative."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-PRONOUNCED-DOWN-2015-2022","statement":"Le nombre de travaux d’intérêt général prononcés pour sanctionner des délits a diminué de 34 % entre 2015 et 2022 ; 16 560 TIG ont été prononcés en 2022.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2015-2022","population":"TIG prononcés pour sanctionner des délits"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-MINISTERE-JUSTICE-TIG-PRONONCE-2024"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Publication statistique du ministère de la Justice, Infostat Justice n° 15."],"limitations":["Ne pas confondre TIG prononcés, mesures prises en charge, TIG commencés et TIG achevés.","Cette évolution ne démontre pas à elle seule pourquoi les juridictions recourent moins au TIG."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-EXECUTION-DELAY-2025","statement":"Le délai moyen d’exécution des travaux d’intérêt général dépasse 16 mois selon l’évaluation de la Cour des comptes publiée en 2025.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Évaluation publiée en 2025","population":"Personnes condamnées à un TIG étudiées par la Cour des comptes"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["La Cour des comptes qualifie les délais d'exécution des TIG de trop élevés et indique une moyenne supérieure à 16 mois."],"limitations":["Vérifier la définition exacte du point de départ et de fin du délai dans le rapport intégral.","Une moyenne nationale peut masquer de fortes disparités territoriales."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-RECIDIVISM-5Y-2025","statement":"La récidive dans les cinq ans après une condamnation à un TIG ou à un sursis-TIG atteint près de 60 % ; après correction économétrique des caractéristiques observables, le TIG ne semble pas réduire davantage la probabilité de récidive que l’emprisonnement ferme, mais les résultats sont plus favorables sur la fréquence et la gravité des récidives.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Suivi à cinq ans ; cohortes et méthode décrites dans l'évaluation publiée en 2025","population":"Personnes condamnées à un TIG ou à un sursis-TIG comparées à des personnes condamnées à l'emprisonnement ferme"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Résultats de l'évaluation de politique publique de la Cour des comptes, mars 2025."],"limitations":["Le taux brut de 60 % est fortement influencé par les profils des personnes orientées vers le TIG.","Les corrections économétriques ne corrigent pas les facteurs non observés et ne valent pas expérimentation randomisée.","La probabilité de récidive, sa fréquence et sa gravité sont des indicateurs distincts.","Les cohortes étudiées ne décrivent pas nécessairement les effets des modalités actuelles."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-UNIT-COST-2025","statement":"La Cour des comptes estime le coût du TIG à 1 862 €, contre 2 788 € pour la détention à domicile sous surveillance électronique, selon le périmètre de calcul retenu dans son évaluation de 2025.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Évaluation publiée en 2025","conditions":"Coûts estimés par la Cour des comptes selon son périmètre comptable."},"domain_ids":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS"],"supporting_evidence":["Synthèse du rapport : 1 862 € pour le TIG et 2 788 € pour la DDSE."],"limitations":["Ne pas assimiler ce montant au coût total de la peine pour la société.","Le coût de l'encadrement, des tuteurs, des organismes d'accueil, du suivi et les coûts évités de détention doivent être explicités avant toute conclusion de coût-efficacité.","Vérifier les unités et conventions comptables dans le rapport complet."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-TUTORS-NETWORK-2021","statement":"En 2021, 20 419 tuteurs de personnes majeures condamnées à un TIG étaient recensés dans 11 872 organismes en France ; leur mission d'encadrement est exercée sans compensation financière.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2021","population":"Tuteurs de TIG pour personnes majeures"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-MINISTERE-JUSTICE-TUTEURS-TIG-2024"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-SURVEY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Enquête du ministère de la Justice sur les tuteurs de tigistes, publiée en juillet 2024."],"limitations":["Données de recensement 2021, pas une mesure de capacité disponible en temps réel.","Le nombre de tuteurs ne renseigne pas directement sur le nombre de postes vacants ou la qualité de l'encadrement."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-EU-COMMUNITY-SERVICE-PROBATION-SHARE-2022","statement":"In comparative European data for 2022, community service represented 56.2% of probationers in the Netherlands, 60.7% in Spain and 15.3% in France; these are shares among probationers, not shares of all sentences.","claim_type":"descriptive","status":"under_review","scope":{"geography":["Europe","France","Netherlands","Spain"],"period":"2022","population":"Probationers, according to the comparative table's national reporting categories"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COMPARATIVE-SENTENCING-RATES-EUROPE-2025"],"study_ids":["STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Comparative article table reproducing European community-service shares attributed to Aebi et al. 2023, table 28."],"limitations":["Denominator is probationers; this is not the share of all convictions or sentences.","National legal definitions, probation caseloads and reporting practices may differ.","Do not interpret these percentages as direct rankings of TIG use, effectiveness or public safety."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-NETHERLANDS-COMMUNITY-SERVICE-LOWER-RECIDIVISM-IV-2023","statement":"A Dutch instrumental-variable study using 2012 sentencing data and recidivism follow-up through 2018 finds that short-term imprisonment increases recidivism relative to community service orders in the cases identified by its estimation strategy.","claim_type":"empirical","status":"under_review","scope":{"geography":["Netherlands"],"period":"Sentences in 2012; recidivism follow-up 2012-2018","population":"Cases whose sanction is affected by the instrumental-variable design"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-WERMINK-COMMUNITY-SERVICE-RETRIBUTION-2023"],"study_ids":["STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY"],"supporting_evidence":["The authors use an instrumental-variable approach to address selection into prison versus community service."],"limitations":["Local causal estimate; not automatically generalisable to all offenders or jurisdictions.","The Dutch sanction and probation model differs from the French TIG.","Does not isolate deterrence or public perceptions.","Instrument validity and detailed outcome definitions should be checked in the full paper."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-UK-UNPAID-WORK-IMPLEMENTATION-FACTORS-2021","statement":"The UK probation inspectorate identifies prompt commencement, regular attendance, useful and rewarding work, employment-related skills, tailored placements and clear supervision rules as factors associated with better engagement in unpaid work; it finds robust evidence on effects on reoffending remains lacking.","claim_type":"empirical","status":"under_review","scope":{"geography":["England and Wales","Scotland","Northern Ireland"],"period":"Evidence review updated 17 May 2021","population":"People subject to unpaid-work requirements in probation orders"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-HMI-PROBATION-UNPAID-WORK-EVIDENCE"],"study_ids":["STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-ISSUE-EFFICIENCY"],"supporting_evidence":["HM Inspectorate of Probation evidence base on unpaid work."],"limitations":["Factors associated with engagement are not proof of causal reductions in reoffending.","The evidence review is dated and institutional arrangements differ from France.","Self-reported benefit must be distinguished from administrative outcomes."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-LOCAL-REFERENT-LOIRE-ATLANTIQUE-2026","statement":"En septembre 2026, l'annuaire ATIGIP désigne Jeanne-Marie Jobert comme référente territoriale TIG pour la Loire-Atlantique, rattachée au SPIP à Saint-Herblain.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France","Pays de la Loire","Loire-Atlantique"],"period":"Annuaire mis à jour le 16 septembre 2026","population":"Organisation territoriale ATIGIP"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-ATIGIP-ANNUAIRE-REFERENTS-TIG-2026"],"study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-DEPARTMENTAL"],"supporting_evidence":["Annuaire ATIGIP : référente, rattachement SPIP et coordonnées professionnelles."],"limitations":["Coordonnées à vérifier avant sollicitation.","La désignation ne renseigne pas le nombre de postes disponibles."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-SAINT-HERBLAIN-200-HOURS-2022","statement":"La Ville de Saint-Herblain indique avoir accueilli des personnes en TIG dans ses services municipaux pour 200 heures en 2022, avec tutorat et bilan de fin de mesure.","claim_type":"descriptive","status":"under_review","scope":{"geography":["Saint-Herblain","Loire-Atlantique"],"period":"2022","population":"Personnes accueillies dans les services municipaux dans le cadre d'un TIG"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-ATIGIP-SAINT-HERBLAIN-TIG-PARTNERSHIP"],"study_ids":["STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-MUNICIPAL"],"supporting_evidence":["Retour d'expérience municipal publié par la Ville."],"limitations":["Donnée ponctuelle et ancienne ; ne décrit pas l'offre actuelle.","Pas de taux d'achèvement ni d'effet sur la récidive."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-CAPATLANTIQUE-TIG-PLAN-2026-2027","statement":"La stratégie CISPD de CapAtlantique prévoit pour 2026-2027 d'identifier des postes et tuteurs TIG, consolider les places existantes et en ouvrir de nouvelles.","claim_type":"descriptive","status":"under_review","scope":{"geography":["CapAtlantique La Baule-Guérande Agglo","Loire-Atlantique"],"period":"Plan 2024-2028 ; action 2026-2027","population":"Communes et partenaires du CISPD"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-CAPATLANTIQUE-CISPD-2024-2028"],"study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-LOCAL"],"supporting_evidence":["Action 6 de la stratégie territoriale."],"limitations":["Engagement programmatique ; réalisation non encore documentée.","Territoire partiel."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-NATIONAL-POSTS-2018-2025","statement":"Selon les conclusions des États généraux de l'insertion et de la probation, l'offre nationale recensée est passée de 18 000 postes TIG en 2018 à 30 000 en 2025, mais la répartition territoriale et l'adaptabilité demeurent des enjeux.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2018-2025","population":"Postes TIG recensés"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-IGJ-ETATS-GENERAUX-INSERTION-PROBATION-2026"],"study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Rapport IGJ, section 2.3.2."],"limitations":["Postes recensés non nécessairement vacants, actifs ou immédiatement adaptés.","Stock national masquant les écarts locaux."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2026-JUNE-AMOUNT","statement":"Au 1er juin 2026, le SMIC horaire brut en France hors Mayotte est fixé à 12,31 euros et le SMIC mensuel brut à 1 867,02 euros pour 151,67 heures.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"À compter du 1er juin 2026","population":"Salariés majeurs concernés par le SMIC légal"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-INSEE-SMIC-SERIES-2026","SOURCE-MINTRAVAIL-SMIC-JUNE-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Série INSEE des montants du SMIC et communiqué du ministère du Travail du 13 mai 2026."],"limitations":["Le montant net publié est indicatif ; distinguer le taux horaire, le brut mensuel, le net et le coût employeur."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2024-DIRECT-BENEFICIARIES","statement":"La revalorisation du 1er novembre 2024 a directement concerné 2,2 millions de salariés du secteur privé non agricole, soit 12,4 % du champ étudié par la Dares.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"1er novembre 2024","population":"Salariés du secteur privé non agricole dans le champ Acemo, hors apprentis, stagiaires et intérimaires"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-DARES-SMIC-BENEFICIARIES-2024"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY"],"supporting_evidence":["Dares Résultats n° 52, publié le 29 octobre 2025."],"limitations":["Bénéficiaires directs de cette revalorisation, pas stock total de salariés rémunérés au SMIC.","Le champ ne représente pas tous les actifs ni tous les ménages modestes."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2025-REAL-PURCHASING-POWER","statement":"En moyenne annuelle, le pouvoir d'achat du SMIC horaire net a progressé de 0,7 % en 2025 selon la série INSEE.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"2025 en moyenne annuelle","population":"SMIC horaire net"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-INSEE-SMIC-SERIES-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Tableau INSEE du pouvoir d'achat du SMIC et du salaire horaire de base ouvrier et employé."],"limitations":["Indicateur horaire moyen annuel ; ne mesure ni le revenu disponible des ménages ni les effets individuels des hausses de juin 2026."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-HIGH-RELATIVE-LEVEL","statement":"Le salaire minimum français figure parmi les plus élevés des pays étudiés par l'OCDE relativement au salaire médian, et contribue à comprimer la distribution des salaires dans le bas de l'échelle.","claim_type":"empirical","status":"under_review","scope":{"geography":["France","Pays comparateurs OCDE"],"period":"Analyse publiée en 2025","population":"Salariés à bas salaire et salariés à temps plein selon les indicateurs OCDE"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-OECD-LOW-WAGE-FRANCE-2025"],"study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-ISSUE-EQUITY"],"supporting_evidence":["L'OCDE décrit le SMIC français comme proche de 60 % du salaire médian dans les pays étudiés et observe une compression de la distribution en bas de l'échelle."],"limitations":["Le ratio dépend du champ, du concept de salaire et de l'année ; la compression ne prouve pas un effet causal sur l'emploi ou les carrières."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-WAGE-PROPAGATION","statement":"Les revalorisations du SMIC ont historiquement exercé un effet de transmission important sur certains indicateurs de salaire moyen en France.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"1970-2009","population":"Salaire horaire de base des ouvriers et salaire mensuel par tête"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-INSEE-SMIC-MEAN-WAGE-2012"],"study_ids":["STUDY-INSEE-SMIC-MEAN-WAGE-2012"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Étude INSEE de Cette, Chouard et Verdugo, Économie et Statistique n° 448-449."],"limitations":["Résultat historique à actualiser ; ne pas extrapoler automatiquement aux années récentes ni aux effets sur l'emploi."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-EXEMPTIONS-EMPLOYMENT-COUNTERFACTUAL","statement":"Le groupe d'experts SMIC estime que la suppression totale des allègements de cotisations patronales pourrait entraîner la disparition de 1,5 à 2 millions d'emplois, essentiellement peu qualifiés.","claim_type":"predictive","status":"under_review","scope":{"geography":["France"],"period":"Scénario étudié dans le rapport 2024","population":"Emplois concernés par les allègements de cotisations patronales"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-EXPERTS-SMIC-2024"],"study_ids":["STUDY-EXPERTS-SMIC-2024-RELIEFS"],"tags":["TAG-EVIDENCE-MODELLED","TAG-ISSUE-TRADEOFFS"],"supporting_evidence":["Estimation de scénario publiée par le groupe d'experts SMIC 2024."],"limitations":["Scénario contrefactuel de suppression totale des allègements, non effet d'une hausse du SMIC.","Résultat modélisé, dépendant des hypothèses et paramètres retenus."],"last_reviewed":"2026-11-13"}
