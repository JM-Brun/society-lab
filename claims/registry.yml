description: "claims register — Society Lab"
claims:
  - {"id":"CLAIM-PARCOURSUP-2026-APPLICANTS","statement":"La campagne Parcoursup 2026 a compté 1 046 000 candidats ayant confirmé au moins un vœu d’orientation dans l’enseignement supérieur ; le total couvre plusieurs catégories de candidats et des formations sous statut étudiant ou en apprentissage.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Campagne 2026","population":"Candidats ayant confirmé au moins un vœu d’orientation, incluant lycéens, étudiants en réorientation, candidats non scolarisés en reprise d’études et candidats suivant une scolarité étrangère","conditions":"Le bilan ministériel indique 25 000 formations post-bac, y compris en apprentissage."},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-BILAN-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le ministère indique 1 046 000 candidats ayant postulé auprès de 25 000 formations post-bac, y compris en apprentissage ; le communiqué du 28 mai précise que 1 046 000 candidats avaient confirmé au moins un vœu."],"limitations":["Le total agrège des catégories de candidats différentes ; il ne correspond ni au nombre de lycéens, ni au nombre de néo-bacheliers, ni au nombre de personnes admises.","Distinguer les vœux pour formations sous statut étudiant des vœux en apprentissage et les étapes de candidature/confirmation."],"last_reviewed":"2026-11-13","source_verifications":[{"source_id":"SOURCE-PARCOURSUP-BILAN-2026","locator":"Communiqué du 19 octobre 2026, introduction (1 046 000 candidats, 25 000 formations) ; communiqué du 28 mai 2026, encadré « Qui sont les candidats de la session 2026 ? » (candidats ayant confirmé au moins un vœu et répartition en quatre catégories).","status":"source_checked","checked_at":"2026-11-13","review_note":"Les deux pages officielles concordent sur le total ; le communiqué du 28 mai explicite le critère de confirmation d'au moins un vœu et les catégories."}],"provenance":[{"origin":"source_extracted","note":"Formulation précisée après contrôle des communiqués officiels du ministère du 28 mai et du 19 octobre 2026.","recorded_at":"2026-11-13"}]}
  - {"id":"CLAIM-PARCOURSUP-2026-NEW-BACHELORS-OFFER","statement":"En 2026, 93,7 % des néo-bacheliers inscrits sur Parcoursup ont reçu au moins une proposition d'admission.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Campagne 2026","population":"Néo-bacheliers inscrits sur Parcoursup"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["La note Flash SIES n° 2026-26 indique 93,7 % des néo-bacheliers inscrits ayant reçu au moins une proposition et 81,0 % en ayant accepté une."],"limitations":["Recevoir une proposition n'est pas équivalent à obtenir son premier choix, s'inscrire ou réussir.","Dénominateur différent des lycéens ayant formulé des vœux."],"last_reviewed":"2026-11-13","source_verifications":[{"source_id":"SOURCE-SIES-PARCOURSUP-2026-ADMISSIONS","locator":"Note Flash SIES n° 2026-26, octobre 2026, page de présentation, paragraphe « Présentation » (93,7 % ont reçu au moins une proposition ; 81,0 % en ont accepté une).","status":"source_checked","checked_at":"2026-11-13","review_note":"Le ministère confirme explicitement le taux et le dénominateur « néo-bacheliers inscrits sur Parcoursup »."}],"provenance":[{"origin":"source_extracted","note":"Dénominateur et valeur vérifiés dans la publication officielle SIES.","recorded_at":"2026-11-13"}]}
  - {"id":"CLAIM-PARCOURSUP-2026-LYCEENS-OFFER","statement":"En 2026, 603 910 lycéens ayant formulé des vœux sur Parcoursup ont reçu au moins une proposition d’admission, soit 91,5 % de cette population.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Campagne 2026, bilan de fin de procédure","population":"Lycéens ayant formulé des vœux sur Parcoursup"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-BILAN-2026"],"study_ids":["STUDY-PARCOURSUP-ADMISSIONS-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Le communiqué ministériel du 19 octobre 2026 indique 603 910 lycéens ayant reçu au moins une proposition, soit 91,5 % des lycéens ayant formulé des vœux."],"limitations":["Ce taux ne porte pas sur tous les candidats Parcoursup ni sur les seuls néo-bacheliers ; il ne mesure pas le premier choix, l'acceptation, l'inscription ou la réussite ultérieure."],"last_reviewed":"2026-11-13","source_verifications":[{"source_id":"SOURCE-PARCOURSUP-BILAN-2026","locator":"Communiqué du 19 octobre 2026, section « Un nombre record de candidats… », paragraphe 2 (603 910 et 91,5 %).","status":"source_checked","checked_at":"2026-11-13","review_note":"Le chiffre et son dénominateur sont explicitement indiqués dans le communiqué officiel."}],"provenance":[{"origin":"source_extracted","note":"Valeur, numérateur et dénominateur vérifiés dans le communiqué officiel du ministère.","recorded_at":"2026-11-13"}]}
  - {"id":"CLAIM-PISA-2022-SOCIOECONOMIC-GAP","statement":"Dans PISA 2022, en France, l'écart de score en mathématiques entre les élèves du quartile socio-économique supérieur et ceux du quartile inférieur est de 113 points.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"PISA 2022","population":"Élèves de 15 ans"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-OECD-PISA-2022-FRANCE"],"study_ids":["STUDY-OECD-PISA-2022-FRANCE"],"tags":["TAG-ISSUE-EQUITY","TAG-METHOD-COMPARATIVE"],"supporting_evidence":["Note pays OCDE PISA 2022 — France."],"limitations":["Écart descriptif standardisé, non interprétable comme effet causal de la seule origine sociale."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-INSEE-EARLY-SOCIAL-GAPS","statement":"Des écarts d'acquis associés à l'origine sociale sont déjà observables à l'entrée en maternelle en France.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Publication 2025","population":"Enfants à l'entrée en maternelle"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-INSEE-INEGALITES-SCOLAIRES-2025"],"study_ids":["STUDY-SOCIAL-INEQUALITIES-SCHOOL-2025"],"tags":["TAG-ISSUE-EQUITY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Publication Insee, France, portrait social 2025."],"limitations":["L'ampleur exacte doit être documentée avec les tableaux et mesures précises ; association ne signifie pas déterminisme."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-INTERGEN-EDUCATION-ATTAINMENT-GAP","statement":"En France, 75 % des 25-34 ans ayant au moins un parent diplômé du supérieur ont eux-mêmes un diplôme du supérieur, contre 32 % lorsque leurs parents n'ont pas achevé le deuxième cycle du secondaire.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Données 2023 publiées en 2025","population":"Adultes de 25 à 34 ans selon le niveau de diplôme parental"},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-OECD-EAG-2025-FRANCE"],"study_ids":["STUDY-OECD-INTERGEN-EDUCATION-ATTAINMENT-2025"],"tags":["TAG-ISSUE-EQUITY","TAG-METHOD-COMPARATIVE"],"supporting_evidence":["Note pays OCDE Regards sur l'éducation 2025."],"limitations":["Indicateur descriptif intergénérationnel ; ne mesure pas l'effet causal propre de Parcoursup ou d'un établissement."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PARCOURSUP-CEV-LOCAL-CRITERIA","statement":"Les formations examinent les candidatures au moyen de commissions d’examen des vœux et de critères définis à l’échelle des formations ; Parcoursup fournit le cadre national de candidature et d’affectation.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Procédure Parcoursup 2026","conditions":"Description institutionnelle du processus d’examen ; pratiques effectives à auditer séparément."},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-ADMISSION-REVIEW-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Page officielle décrivant les commissions d’examen des vœux et les critères propres aux formations."],"limitations":["Description institutionnelle, non audit indépendant des décisions ou des algorithmes locaux.","Les critères déclarés ne renseignent pas à eux seuls leur pondération ni leur application effective."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-PARCOURSUP-CEV-REPORTS-2026","statement":"Près de 19 000 rapports d’analyse des candidatures de la session Parcoursup 2026 sont annoncés comme accessibles depuis les fiches des formations.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Session 2026","conditions":"Nombre annoncé par la page officielle Parcoursup."},"domain_ids":["DOMAIN-EDUCATION"],"source_ids":["SOURCE-PARCOURSUP-ADMISSION-REVIEW-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Page officielle Parcoursup sur l’examen des candidatures, mise à jour le 20 octobre 2026."],"limitations":["Disponibilité annoncée ; corpus non encore collecté ni audité.","Le nombre de rapports ne renseigne pas sur leur exhaustivité, granularité ou qualité informative."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-PRONOUNCED-DOWN-2015-2022","statement":"Le nombre de travaux d’intérêt général prononcés pour sanctionner des délits a diminué de 34 % entre 2015 et 2022 ; 16 560 TIG ont été prononcés en 2022.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2015-2022","population":"TIG prononcés pour sanctionner des délits"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-MINISTERE-JUSTICE-TIG-PRONONCE-2024"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Publication statistique du ministère de la Justice, Infostat Justice n° 15."],"limitations":["Ne pas confondre TIG prononcés, mesures prises en charge, TIG commencés et TIG achevés.","Cette évolution ne démontre pas à elle seule pourquoi les juridictions recourent moins au TIG."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-EXECUTION-DELAY-2025","statement":"Pour la cohorte des TIG et sursis-TIG prononcés en 2020 et exécutés dans les trois ans, le délai moyen entre la condamnation et la fin d'exécution est de 16,7 mois selon les données SSER/DACG reprises par la Cour des comptes.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Cohorte de prononcés 2020, suivie jusqu'à 36 mois ; rapport publié en 2025","population":"TIG et sursis-TIG prononcés en 2020 et exécutés dans les trois ans"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","SOURCE-SENAT-EXECUTION-PEINES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["L'annexe 5 de la Cour des comptes donne 16,7 mois de moyenne entre condamnation et fin d'exécution, sur données SSER/DACG, pour les TIG ou sursis-TIG prononcés en 2020 et exécutés dans les trois ans.","La même annexe distingue cette mesure nationale de l'enquête directe de la Cour dans neuf SPIP, où le délai moyen atteint 16 mois pour les TIG autonomes et 20 mois en incluant les sursis-TIG."],"limitations":["Le chiffre de 16,7 mois est conditionnel à l'exécution dans les trois ans : il ne représente pas la moyenne de toutes les mesures prononcées, notamment celles non exécutées ou converties.","L'échantillon de la Cour et la cohorte nationale SSER/DACG diffèrent par leur population et leur méthode ; leurs moyennes ne doivent pas être fusionnées.","Ne pas confondre ce délai entre condamnation et fin d'exécution avec le délai saisine SPIP-affectation ou avec le délai de démarrage effectif."],"last_reviewed":"2026-11-14","source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 5, p. 151 : tableau des délais, champ TIG ou sursis-TIG prononcés en 2020 et exécutés dans les trois ans ; lignes SSER/DACG.","status":"source_checked","checked_at":"2026-11-14","review_note":"Origine, fin, cohorte et condition d'exécution dans les trois ans vérifiées dans le tableau."}]}
  - {"id":"CLAIM-TIG-RECIDIVISM-5Y-2025","statement":"La récidive dans les cinq ans après une condamnation à un TIG ou à un sursis-TIG atteint près de 60 % ; après correction économétrique des caractéristiques observables, le TIG ne semble pas réduire davantage la probabilité de récidive que l’emprisonnement ferme, mais les résultats sont plus favorables sur la fréquence et la gravité des récidives.","claim_type":"empirical","status":"superseded","scope":{"geography":["France"],"period":"Suivi à cinq ans ; cohortes et méthode décrites dans l'évaluation publiée en 2025","population":"Personnes condamnées à un TIG ou à un sursis-TIG comparées à des personnes condamnées à l'emprisonnement ferme"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Résultats de l'évaluation de politique publique de la Cour des comptes, mars 2025."],"limitations":["Le taux brut de 60 % est fortement influencé par les profils des personnes orientées vers le TIG.","Les corrections économétriques ne corrigent pas les facteurs non observés et ne valent pas expérimentation randomisée.","La probabilité de récidive, sa fréquence et sa gravité sont des indicateurs distincts.","Les cohortes étudiées ne décrivent pas nécessairement les effets des modalités actuelles."],"last_reviewed":"2026-11-13","revision_history":[{"date":"2026-11-13","reason":"Scindée après vérification du rapport intégral de la Cour des comptes : taux brut à cinq ans, résultat ajusté à cinq ans et indicateurs complémentaires à dix ans sont des propositions distinctes.","previous_status":"under_review","new_status":"superseded"}]}
  - {"id":"CLAIM-TIG-UNIT-COST-2025","statement":"Pour 2022, la Cour des comptes estime à 1 862 € le coût moyen comptable d’une mesure TIG suivie et à 2 788 € celui d’une DDSE, selon son périmètre national ; le dénominateur TIG de 22 701 mesures inclut aussi les TNR.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Année 2022 ; rapport publié en mars 2025","population":"Flux des mesures nouvelles prises en charge par les SPIP ; le flux TIG inclut les travaux non rémunérés (TNR)","conditions":"Estimation agrégée de dépenses de l’administration pénitentiaire, ventilées selon des clés de temps de travail et divisées par le flux annuel de mesures."},"domain_ids":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-ISSUE-TRADEOFFS"],"supporting_evidence":["L’annexe 7 retient 22 701 mesures TIG dans le flux 2022 et divise les coûts calculés par le nombre de mesures nouvelles suivies pour obtenir 1 862 € par TIG et 2 788 € par DDSE.","Les coûts incluent notamment une allocation estimée du temps CPIP (12 % pour TIG), des DSIP (2 %), les référents territoriaux TIG, le marché TIG 360° et des coûts ATIGIP."],"limitations":["Le flux de 22 701 TIG inclut les TNR, les CPIP les traitant de la même manière ; le montant de 1 862 € ne doit donc pas être présenté comme une mesure parfaitement isolée du seul TIG autonome.","L'approche porte sur une partie des dépenses de l'administration pénitentiaire ; les coûts des juridictions et de nombreux partenaires ne sont pas intégrés.","Les dépenses des structures d'accueil (temps de travail, équipements, repas) ne sont pas incluses dans l'agrégat, même si elles sont partiellement compensées par l'apport de travail.","Ce coût moyen par mesure ne renseigne pas sur la distribution des coûts selon la durée, le profil, le type de poste ou le territoire.","Il ne constitue ni un coût social complet, ni une économie nette, ni une analyse coût-efficacité."],"best_counterargument":"La Cour construit une estimation nationale plus large que le seul coût journalier DAP et inclut plusieurs composantes centrales de l'administration pénitentiaire ; le chiffre reste donc utile comme ordre de grandeur budgétaire, à condition de ne pas le surinterpréter.","assumptions":["Les clés d'allocation du temps de travail estimées par la Cour représentent suffisamment les activités 2022 pour produire un coût moyen indicatif.","Le flux de mesures suivi dans l'année est un dénominateur pertinent pour cette estimation comptable, mais pas nécessairement pour comparer des durées ou intensités de prise en charge."],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Rapport intégral, annexe 7, p. 159-161 : méthode et coûts p. 159-161, flux 22 701 et division p. 160 ; note 65 précisant l’inclusion des TNR.","status":"source_checked","checked_at":"2026-11-13","review_note":"Montants, flux, clés de ventilation et note de bas de page contrôlés dans le PDF. L’estimation n’est pas une comptabilité analytique exhaustive."}],"provenance":[{"origin":"source_extracted","note":"Claim précisé après vérification de l’annexe 7 du rapport de la Cour des comptes.","recorded_at":"2026-11-13"}],"revision_triggers":["Publication d'une comptabilité analytique actualisée distinguant TIG autonome, sursis-TIG et TNR.","Mesure nationale des coûts des juridictions, partenaires et structures d'accueil."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-COST-PRISON-COMPARISON-UNIT-2022","statement":"Le coût moyen comptable d’une mesure TIG (1 862 €) et le coût d’une journée de détention (141,99 €) calculés par la Cour des comptes en 2022 ne sont pas directement comparables : leurs unités et périmètres diffèrent.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Année 2022 ; rapport publié en mars 2025","conditions":"Comparaison des estimations de la Cour des comptes, annexe 7."},"domain_ids":["DOMAIN-SECURITY","DOMAIN-FINANCE"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY"],"supporting_evidence":["La Cour précise que le coût des alternatives est calculé par mesure quelle qu’en soit la durée, tandis que le coût de la détention est calculé par journée.","Le coût de détention de 141,99 € intègre une valorisation du parc pénitentiaire ; l'estimation DAP hors cette valorisation est de 127,14 € par jour."],"limitations":["Ne pas multiplier ou comparer les montants sans définir un scénario de substitution et une durée d'incarcération contrefactuelle.","Même une comparaison sur durée équivalente ne mesure pas automatiquement les coûts marginaux réellement évités : capacité carcérale, coûts fixes et coûts variables doivent être distingués.","La comparaison n'inclut pas tous les coûts sociaux ni les coûts supportés par les tiers."],"best_counterargument":"La Cour estime néanmoins qu'un TIG ou une DDSE coûte nettement moins qu'un temps équivalent passé en détention ; cette indication d'ordre de grandeur est pertinente pour éclairer les arbitrages, sous réserve de construire un scénario comparable.","source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Chapitre IV, p. 129-130 ; annexe 7, p. 157-160 : 127,14 € DAP, 141,99 € avec valorisation du parc et différences d’unités.","status":"source_checked","checked_at":"2026-11-13","review_note":"Les unités, montants et réserves de comparabilité sont explicitement indiqués par la Cour."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique créé à partir des réserves méthodologiques de l'annexe 7.","recorded_at":"2026-11-13"}],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-HOST-ORGANISATIONS-COSTS-EXCLUDED-2025","statement":"L’estimation nationale de 1 862 € par TIG publiée par la Cour des comptes n’intègre pas les coûts supportés par les structures d’accueil, notamment le temps de travail, les équipements et les repas.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Données de coûts 2022, rapport publié en mars 2025","population":"Organismes publics et associations accueillant des personnes condamnées à un TIG"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-FINANCE","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY"],"supporting_evidence":["L’annexe 7 indique que les coûts engagés dans les structures d’accueil ne sont pas compris dans l’agrégat national ; le questionnaire fait état de temps de travail, chaussures de sécurité, gants, autres équipements et repas.","La Cour précise que ces dépenses sont partiellement compensées par l’apport de force de travail du tigiste."],"limitations":["Le rapport ne fournit pas une valorisation monétaire nationale consolidée de ces coûts ni de la valeur du travail produit.","Les coûts et bénéfices peuvent différer selon les tâches, les structures, les besoins d'encadrement et la qualité du travail rendu.","Ne pas additionner les coûts bruts sans tenir compte de la valeur et de l'utilité du travail fourni."],"best_counterargument":"L'accueil n'est pas une charge pure : les structures bénéficient aussi d'un apport de travail, qui peut compenser une partie des dépenses. Le bilan net dépend donc des tâches et de la productivité effective.","source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 7, p. 158, lignes PDF 5208-5214 : coûts non inclus, exemples de dépenses et compensation partielle par le travail.","status":"source_checked","checked_at":"2026-11-13","review_note":"Passage explicite contrôlé dans le rapport intégral."}],"provenance":[{"origin":"source_extracted","note":"Claim créé pour distinguer les coûts budgétaires de l'administration des coûts et apports des organismes d'accueil.","recorded_at":"2026-11-13"}],"revision_triggers":["Enquête nationale permettant de valoriser le temps des tuteurs, les équipements, les repas et la valeur du travail produit."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-TUTOR-TIME-100H-2025","statement":"Pour un TIG classique de 100 heures, les tuteurs interrogés par la Cour des comptes déclarent en moyenne 9,6 heures d’encadrement ; le temps déclaré est de 14,4 heures dans les associations contre 9,3 heures dans les structures publiques.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Enquête de la Cour des comptes publiée en 2025","population":"4 824 tuteurs et responsables de postes de TIG interrogés"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS","DOMAIN-FINANCE"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-SURVEY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["La Cour rapporte 9,6 heures d'encadrement pour un TIG classique de 100 heures ; les tuteurs associatifs déclarent 14,4 heures et les structures publiques 9,3 heures."],"limitations":["Temps déclaré dans une enquête, non mesure administrative ou observation chronométrée.","L'écart peut refléter des différences de définition, de missions et d'objectifs d'accueil ; la Cour évoque une dimension plus sociale dans les associations et parfois plus utilitaire dans les structures publiques.","Ne permet pas de convertir directement le temps en coût monétaire sans salaire chargé, statut et périmètre du travail inclus."],"best_counterargument":"Le temps de tutorat n'est pas nécessairement un coût net : l'accueil peut aussi produire un service utile et certaines tâches demandent peu de supervision.","source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Chapitre I, p. 51, section « L’accueil et l’encadrement des tigistes », enquête auprès de 4 824 tuteurs.","status":"source_checked","checked_at":"2026-11-13","review_note":"Moyenne et ventilation par type de structure contrôlées."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique extrait du rapport de la Cour des comptes.","recorded_at":"2026-11-13"}],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-TERRITORIAL-COST-DDSE-2022","statement":"Dans les deux territoires étudiés plus finement par la Cour des comptes, le coût estimé d’une DDSE est de 3 421 € dans le Territoire de Belfort et de 2 150 € dans les Hauts-de-Seine ; la Cour relie ces écarts notamment à la géographie, à l’urbanisation, aux déplacements et aux frais de fonctionnement.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France","Territoire de Belfort","Hauts-de-Seine"],"period":"Année 2022 ; rapport publié en mars 2025","population":"Services pénitentiaires d'insertion et de probation étudiés"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-FINANCE","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-COMPARATIVE","TAG-LEVEL-DEPARTMENTAL"],"supporting_evidence":["L'annexe 7 rapporte une estimation de 3 421 € par DDSE dans le Territoire de Belfort et 2 150 € dans les Hauts-de-Seine.","La Cour indique que la géographie et le niveau d'urbanisation pèsent sur les coûts, notamment par les déplacements nécessaires à la pose et à la dépose des bracelets."],"limitations":["Deux territoires seulement : ces valeurs ne constituent ni une moyenne nationale territorialisée ni un classement représentatif des départements.","Le rapport donne aussi 1 343 € pour un TIG à Belfort, mais ne fournit pas ici une paire territoriale homogène de coûts TIG comparable pour les deux départements.","Les méthodes locales reposent sur les informations fournies par les services et sur des périmètres de coûts plus complets que l'estimation nationale."],"best_counterargument":"Les écarts reflètent en partie les différences de périmètre, de charge estimée et de fonctionnement des services ; ils ne prouvent pas que la ruralité entraîne systématiquement un coût supérieur dans tous les départements.","source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 7, p. 161-162 : coûts territoriaux et explication des écarts.","status":"source_checked","checked_at":"2026-11-13","review_note":"Montants et précautions de représentativité vérifiés."}],"provenance":[{"origin":"source_extracted","note":"Claim créé à partir des estimations territoriales limitées présentées en annexe 7.","recorded_at":"2026-11-13"}],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-TUTORS-NETWORK-2021","statement":"En 2021, 20 419 tuteurs de personnes majeures condamnées à un TIG étaient recensés dans 11 872 organismes en France ; leur mission d'encadrement est exercée sans compensation financière.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2021","population":"Tuteurs de TIG pour personnes majeures"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-MINISTERE-JUSTICE-TUTEURS-TIG-2024"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-SURVEY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Enquête du ministère de la Justice sur les tuteurs de tigistes, publiée en juillet 2024."],"limitations":["Données de recensement 2021, pas une mesure de capacité disponible en temps réel.","Le nombre de tuteurs ne renseigne pas directement sur le nombre de postes vacants ou la qualité de l'encadrement."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-EU-COMMUNITY-SERVICE-PROBATION-SHARE-2022","statement":"In comparative European data for 2022, community service represented 56.2% of probationers in the Netherlands, 60.7% in Spain and 15.3% in France; these are shares among probationers, not shares of all sentences.","claim_type":"descriptive","status":"under_review","scope":{"geography":["Europe","France","Netherlands","Spain"],"period":"2022","population":"Probationers, according to the comparative table's national reporting categories"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COMPARATIVE-SENTENCING-RATES-EUROPE-2025"],"study_ids":["STUDY-COMPARATIVE-SENTENCING-RATES-EUROPE-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Comparative article table reproducing European community-service shares attributed to Aebi et al. 2023, table 28."],"limitations":["Denominator is probationers; this is not the share of all convictions or sentences.","National legal definitions, probation caseloads and reporting practices may differ.","Do not interpret these percentages as direct rankings of TIG use, effectiveness or public safety."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-NETHERLANDS-COMMUNITY-SERVICE-LOWER-RECIDIVISM-IV-2023","statement":"A Dutch instrumental-variable study using 2012 sentencing data and recidivism follow-up through 2018 finds that short-term imprisonment increases recidivism relative to community service orders in the cases identified by its estimation strategy.","claim_type":"empirical","status":"under_review","scope":{"geography":["Netherlands"],"period":"Sentences in 2012; recidivism follow-up 2012-2018","population":"Cases whose sanction is affected by the instrumental-variable design"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-WERMINK-COMMUNITY-SERVICE-RETRIBUTION-2023"],"study_ids":["STUDY-WERMINK-NETHERLANDS-COMMUNITY-SERVICE-IV-2023"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-METHOD-CAUSAL-INFERENCE","TAG-ISSUE-EFFICIENCY"],"supporting_evidence":["The authors use an instrumental-variable approach to address selection into prison versus community service."],"limitations":["Local causal estimate; not automatically generalisable to all offenders or jurisdictions.","The Dutch sanction and probation model differs from the French TIG.","Does not isolate deterrence or public perceptions.","Instrument validity and detailed outcome definitions should be checked in the full paper."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-UK-UNPAID-WORK-IMPLEMENTATION-FACTORS-2021","statement":"The UK probation inspectorate identifies prompt commencement, regular attendance, useful and rewarding work, employment-related skills, tailored placements and clear supervision rules as factors associated with better engagement in unpaid work; it finds robust evidence on effects on reoffending remains lacking.","claim_type":"empirical","status":"under_review","scope":{"geography":["England and Wales","Scotland","Northern Ireland"],"period":"Evidence review updated 17 May 2021","population":"People subject to unpaid-work requirements in probation orders"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-HMI-PROBATION-UNPAID-WORK-EVIDENCE"],"study_ids":["STUDY-HMI-UK-UNPAID-WORK-EVIDENCE-2021"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-ISSUE-EFFICIENCY"],"supporting_evidence":["HM Inspectorate of Probation evidence base on unpaid work."],"limitations":["Factors associated with engagement are not proof of causal reductions in reoffending.","The evidence review is dated and institutional arrangements differ from France.","Self-reported benefit must be distinguished from administrative outcomes."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-LOCAL-REFERENT-LOIRE-ATLANTIQUE-2026","statement":"En septembre 2026, l'annuaire ATIGIP désigne Jeanne-Marie Jobert comme référente territoriale TIG pour la Loire-Atlantique, rattachée au SPIP à Saint-Herblain.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France","Pays de la Loire","Loire-Atlantique"],"period":"Annuaire mis à jour le 16 septembre 2026","population":"Organisation territoriale ATIGIP"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-ATIGIP-ANNUAIRE-REFERENTS-TIG-2026"],"study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-DEPARTMENTAL"],"supporting_evidence":["Annuaire ATIGIP : référente, rattachement SPIP et coordonnées professionnelles."],"limitations":["Coordonnées à vérifier avant sollicitation.","La désignation ne renseigne pas le nombre de postes disponibles."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-SAINT-HERBLAIN-200-HOURS-2022","statement":"La Ville de Saint-Herblain indique avoir accueilli des personnes en TIG dans ses services municipaux pour 200 heures en 2022, avec tutorat et bilan de fin de mesure.","claim_type":"descriptive","status":"under_review","scope":{"geography":["Saint-Herblain","Loire-Atlantique"],"period":"2022","population":"Personnes accueillies dans les services municipaux dans le cadre d'un TIG"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-ATIGIP-SAINT-HERBLAIN-TIG-PARTNERSHIP"],"study_ids":["STUDY-SAINT-HERBLAIN-TIG-MUNICIPAL-CASE"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-MUNICIPAL"],"supporting_evidence":["Retour d'expérience municipal publié par la Ville."],"limitations":["Donnée ponctuelle et ancienne ; ne décrit pas l'offre actuelle.","Pas de taux d'achèvement ni d'effet sur la récidive."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-CAPATLANTIQUE-TIG-PLAN-2026-2027","statement":"La stratégie CISPD de CapAtlantique prévoit pour 2026-2027 d'identifier des postes et tuteurs TIG, consolider les places existantes et en ouvrir de nouvelles.","claim_type":"descriptive","status":"under_review","scope":{"geography":["CapAtlantique La Baule-Guérande Agglo","Loire-Atlantique"],"period":"Plan 2024-2028 ; action 2026-2027","population":"Communes et partenaires du CISPD"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-CAPATLANTIQUE-CISPD-2024-2028"],"study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-LOCAL"],"supporting_evidence":["Action 6 de la stratégie territoriale."],"limitations":["Engagement programmatique ; réalisation non encore documentée.","Territoire partiel."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-NATIONAL-POSTS-2018-2025","statement":"Selon les conclusions des États généraux de l'insertion et de la probation, l'offre nationale recensée est passée de 18 000 postes TIG en 2018 à 30 000 en 2025, mais la répartition territoriale et l'adaptabilité demeurent des enjeux.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2018-2025","population":"Postes TIG recensés"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-IGJ-ETATS-GENERAUX-INSERTION-PROBATION-2026"],"study_ids":["STUDY-IGJ-EGIP-TIG-IMPLEMENTATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Rapport IGJ, section 2.3.2."],"limitations":["Postes recensés non nécessairement vacants, actifs ou immédiatement adaptés.","Stock national masquant les écarts locaux."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2026-JUNE-AMOUNT","statement":"Au 1er juin 2026, le SMIC horaire brut en France hors Mayotte est fixé à 12,31 euros et le SMIC mensuel brut à 1 867,02 euros pour 151,67 heures.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"À compter du 1er juin 2026","population":"Salariés majeurs concernés par le SMIC légal"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-INSEE-SMIC-SERIES-2026","SOURCE-MINTRAVAIL-SMIC-JUNE-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Série INSEE des montants du SMIC et communiqué du ministère du Travail du 13 mai 2026."],"limitations":["Le montant net publié est indicatif ; distinguer le taux horaire, le brut mensuel, le net et le coût employeur."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2024-DIRECT-BENEFICIARIES","statement":"La revalorisation du 1er novembre 2024 a directement concerné 2,2 millions de salariés du secteur privé non agricole, soit 12,4 % du champ étudié par la Dares.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"1er novembre 2024","population":"Salariés du secteur privé non agricole dans le champ Acemo, hors apprentis, stagiaires et intérimaires"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-DARES-SMIC-BENEFICIARIES-2024"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY"],"supporting_evidence":["Dares Résultats n° 52, publié le 29 octobre 2025."],"limitations":["Bénéficiaires directs de cette revalorisation, pas stock total de salariés rémunérés au SMIC.","Le champ ne représente pas tous les actifs ni tous les ménages modestes."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2025-REAL-PURCHASING-POWER","statement":"En moyenne annuelle, le pouvoir d'achat du SMIC horaire net a progressé de 0,7 % en 2025 selon la série INSEE.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"2025 en moyenne annuelle","population":"SMIC horaire net"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-INSEE-SMIC-SERIES-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Tableau INSEE du pouvoir d'achat du SMIC et du salaire horaire de base ouvrier et employé."],"limitations":["Indicateur horaire moyen annuel ; ne mesure ni le revenu disponible des ménages ni les effets individuels des hausses de juin 2026."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-HIGH-RELATIVE-LEVEL","statement":"En 2024, le SMIC français représentait 62,5 % du salaire médian brut à temps plein selon le rapport du groupe d'experts SMIC, ratio le plus élevé parmi les pays européens comparés dans ce rapport ; l'OCDE décrit également une compression de la distribution salariale dans le bas de l'échelle.","claim_type":"empirical","status":"under_review","scope":{"geography":["France","Pays comparateurs OCDE"],"period":"Analyse publiée en 2025","population":"Salariés à bas salaire et salariés à temps plein selon les indicateurs OCDE"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-OECD-LOW-WAGE-FRANCE-2025","SOURCE-EXPERTS-SMIC-2025"],"study_ids":["STUDY-OECD-LOW-WAGE-EMPLOYMENT-FRANCE-2025","STUDY-EXPERTS-SMIC-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE","TAG-ISSUE-EQUITY"],"supporting_evidence":["Le rapport du groupe d'experts donne un ratio de 62,5 % en 2024 pour le SMIC/salaire médian brut à temps plein ; l'OCDE décrit la compression salariale en bas de distribution."],"limitations":["Le ratio dépend du champ, du concept de salaire et de l'année ; la compression ne prouve pas un effet causal sur l'emploi ou les carrières."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-WAGE-PROPAGATION","statement":"Les revalorisations du SMIC ont historiquement exercé un effet de transmission important sur certains indicateurs de salaire moyen en France.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"1970-2009","population":"Salaire horaire de base des ouvriers et salaire mensuel par tête"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-INSEE-SMIC-MEAN-WAGE-2012"],"study_ids":["STUDY-INSEE-SMIC-MEAN-WAGE-2012"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Étude INSEE de Cette, Chouard et Verdugo, Économie et Statistique n° 448-449."],"limitations":["Résultat historique à actualiser ; ne pas extrapoler automatiquement aux années récentes ni aux effets sur l'emploi."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-EXEMPTIONS-EMPLOYMENT-COUNTERFACTUAL","statement":"Le groupe d'experts SMIC estime que la suppression totale des allègements de cotisations patronales pourrait entraîner la disparition de 1,5 à 2 millions d'emplois, essentiellement peu qualifiés.","claim_type":"predictive","status":"under_review","scope":{"geography":["France"],"period":"Scénario étudié dans le rapport 2024","population":"Emplois concernés par les allègements de cotisations patronales"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-EXPERTS-SMIC-2024"],"study_ids":["STUDY-EXPERTS-SMIC-2024-RELIEFS"],"tags":["TAG-EVIDENCE-MODELLED","TAG-ISSUE-TRADEOFFS"],"supporting_evidence":["Estimation de scénario publiée par le groupe d'experts SMIC 2024."],"limitations":["Scénario contrefactuel de suppression totale des allègements, non effet d'une hausse du SMIC.","Résultat modélisé, dépendant des hypothèses et paramètres retenus."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-EXEMPTIONS-COST-2024","statement":"Les allègements généraux de cotisations patronales ont représenté près de 80 milliards d'euros de dépenses publiques en 2024 selon les estimations citées par le groupe d'experts SMIC.","claim_type":"descriptive","status":"superseded","scope":{"geography":["France"],"period":"2024","population":"Allègements généraux de cotisations patronales"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-EXPERTS-SMIC-2024","SOURCE-FRANCE-STRATEGIE-EXONERATIONS-2024"],"study_ids":["STUDY-EXPERTS-SMIC-2024-RELIEFS","STUDY-FRANCE-STRATEGIE-EXONERATIONS-2024"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS"],"supporting_evidence":["Le rapport du groupe d'experts 2024 chiffre le coût à près de 80 milliards d'euros en 2024."],"limitations":["Vérifier le périmètre comptable exact et distinguer dépenses budgétaires, moindres recettes et coût net consolidé.","Ne pas attribuer ce coût exclusivement au SMIC.","Le chiffre proche de 80 Md€ ne doit plus être décrit comme le seul coût des allègements généraux : la note HCREP distingue 78 Md€ pour l'ensemble des exonérations et 66 Md€ pour les dispositifs généraux ; le rapport 2025 du groupe d'experts présente un autre ordre de grandeur de près de 75 Md€ dont le périmètre comptable doit être réconcilié."],"last_reviewed":"2026-11-14","revision_history":[{"date":"2026-11-14","reason":"Scindée après vérification de la note HCREP de décembre 2024 : l'ancien énoncé confondait un agrégat proche de 80 Md€ avec le seul périmètre des allègements généraux.","previous_status":"under_review","new_status":"superseded"}]}
  - {"id":"CLAIM-SMIC-2026-DIRECT-BENEFICIARIES","statement":"La revalorisation du 1er janvier 2026 a directement concerné 2,1 millions de salariés du secteur privé non agricole, soit 11,8 % du champ Acemo étudié par la Dares.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"1er janvier 2026","population":"Salariés du secteur privé non agricole dans le champ Acemo"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-DARES-SMIC-REVALORISATION-2026"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EQUITY"],"supporting_evidence":["Publication Dares du 15 octobre 2026, section sur les bénéficiaires directs de la revalorisation 2026."],"limitations":["Bénéficiaires directs de la revalorisation, pas nombre de salariés dont la rémunération globale est égale au SMIC.","Le chiffre concerne le champ privé non agricole de l'enquête Acemo."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-2024-GLOBAL-WAGE-DISTRIBUTION","statement":"En 2024, 4,9 % des salariés du secteur privé en équivalent temps plein, soit environ 0,9 million EQTP, percevaient un salaire brut horaire global inférieur à 1,05 fois le SMIC, selon le traitement Dares de la base Tous salariés de l'Insee.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France hors Mayotte"],"period":"2024","population":"Salariés du privé en équivalent temps plein ; champ de la base Tous salariés retenu par la Dares"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-DARES-SMIC-WAGE-DISTRIBUTION-2024"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Publication Dares du 15 octobre 2026, graphique EC A."],"limitations":["Indicateur de salaire brut horaire global en EQTP inférieur à 1,05 SMIC, pas décompte des salariés payés exactement au SMIC légal.","Certains salaires EQTP sous le SMIC résultent de statuts dérogatoires ou d'incohérences déclaratives.","Ne pas comparer directement avec les bénéficiaires de la revalorisation de janvier 2026, qui relèvent d'un autre champ et d'une autre définition."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-RECIDIVISM-RAW-5Y-2010","statement":"Pour la cohorte des personnes condamnées en 2010, 58 % des personnes condamnées à un TIG ont fait l’objet d’au moins une nouvelle condamnation définitive dans les cinq ans suivant la condamnation de référence ; le taux était de 61 % après un sursis-TIG et de 64 % après un emprisonnement ferme de deux ans ou moins.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Cohorte des condamnés en 2010 ; suivi jusqu’à cinq ans, à partir du casier judiciaire disponible fin 2020","population":"Personnes condamnées à un TIG, un sursis-TIG ou à un emprisonnement ferme de deux ans ou moins"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le rapport donne 58 % pour TIG, 61 % pour sursis-TIG et 64 % pour emprisonnement ferme ≤ 2 ans dans le tableau 5."],"limitations":["Il s'agit d'un indicateur après prononcé et non après exécution du TIG ; la base du casier ne renseigne pas l'exécution.","Le résultat inclut réitération et récidive au sens légal, dès lors qu'une nouvelle infraction conduit à une condamnation définitive.","Les taux bruts ne mesurent pas l'effet causal de la peine, les groupes étant sélectionnés selon leurs profils et les décisions judiciaires."],"best_counterargument":"Les comparaisons brutes opposent des populations différentes : les magistrats sélectionnent les sanctions en fonction de facteurs de risque, et les TIG non exécutés ne sont pas isolés dans cette mesure. Le taux brut ne permet donc pas d'attribuer au TIG la survenue des nouvelles condamnations.","assumptions":["Le suivi au casier judiciaire permet d'observer les nouvelles condamnations définitives enregistrées en France, mais pas les infractions non détectées ou non sanctionnées."],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Rapport intégral, chapitre III, § II.A.1, p. 102-103, tableau n° 5 (PDF, lignes 1995-2028).","status":"source_checked","checked_at":"2026-11-13","review_note":"Tableau 5 et explication de la définition du taux ; le rapport précise que l'exécution du TIG n'est pas renseignée."}],"provenance":[{"origin":"source_extracted","note":"Affirmation atomisée à partir du rapport intégral de la Cour des comptes, contrôlé le 13 novembre 2026.","recorded_at":"2026-11-13"}],"revision_triggers":["Publication d'une série actualisée de récidive par cohorte et par type de peine, avec suivi de l'exécution."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-RECIDIVISM-ADJUSTED-5Y","statement":"Dans les modèles de probabilité linéaire de la Cour des comptes, après contrôle des caractéristiques observables des condamnés, l’écart de probabilité de nouvelle condamnation à cinq ans entre les personnes condamnées à un TIG (ou sursis-TIG) et celles condamnées à l’emprisonnement ferme est proche de zéro et statistiquement non significatif.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Cohortes de condamnés 2010, 2013 et 2015 ; suivi à cinq ans ; rapport publié en mars 2025","population":"Personnes condamnées à un TIG ou sursis-TIG comparées à des personnes condamnées à l'emprisonnement ferme"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le rapport décrit des modèles de probabilité linéaire contrôlant âge, genre, nationalité, antécédents, infractions, mode de jugement, département et mois de condamnation ; les écarts corrigés sont proches de zéro et non significatifs."],"limitations":["La correction porte sur des caractéristiques observables et ne neutralise pas avec certitude les facteurs pris en compte par les magistrats mais absents des bases.","Ce résultat concerne le prononcé de la peine, pas l'effet de l'exécution effective d'un TIG.","L'absence de différence statistiquement significative ne démontre pas l'équivalence des peines."],"best_counterargument":"Des facteurs non observés — motivation, situation sociale, qualité du projet de réinsertion, contexte local et appréciation du juge — peuvent encore différencier les groupes. Les modèles peuvent donc laisser subsister un biais de sélection et une incertitude sur l'effet propre du type de peine.","assumptions":["La spécification et les variables incluses dans les modèles sont correctement décrites dans l'annexe méthodologique n° 6.","Les erreurs standards et seuils de significativité sont correctement interprétés par le rapport."],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Rapport intégral, chapitre III, § II.B.1-2, p. 110-112, notamment paragraphes sur les modèles de probabilité linéaire et graphique 13 (PDF, lignes 2336-2364).","status":"source_checked","checked_at":"2026-11-13","review_note":"Contrôle des pages 110-112 ; les auteurs signalent explicitement que toutes les différences liées à la décision du magistrat ne peuvent être corrigées."}],"provenance":[{"origin":"source_extracted","note":"Affirmation atomisée à partir du rapport intégral de la Cour des comptes, contrôlé le 13 novembre 2026.","recorded_at":"2026-11-13"}],"revision_triggers":["Réanalyse avec données d'exécution et variables sociales supplémentaires ; réplication indépendante des modèles."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-RECIDIVISM-PRISON-SENTENCE-10Y","statement":"Pour la cohorte 2010, après correction économétrique, la probabilité d’être recondamné à au moins une peine d’emprisonnement ferme dans les dix ans est estimée inférieure de 11,3 points après un TIG à celle observée après un emprisonnement ferme.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Cohorte des condamnés en 2010 ; suivi à dix ans","population":"Personnes condamnées à un TIG comparées aux personnes condamnées à l'emprisonnement ferme"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le graphique 14 du rapport donne un écart corrigé de -11,3 points pour le taux de recondamnation à de la prison ferme à dix ans après un TIG."],"limitations":["Il s'agit d'une association ajustée issue d'un modèle observationnel et non d'une preuve expérimentale de causalité.","L'indicateur porte sur une nouvelle peine d'emprisonnement ferme, pas sur toute nouvelle condamnation ni sur une mesure directe de gravité intrinsèque des faits."],"best_counterargument":"Même après ajustement, des facteurs non observés peuvent expliquer une partie de l'écart ; les résultats sont propres à la cohorte 2010 et au cadre français de l'époque.","assumptions":["L'indicateur de recondamnation à la prison ferme est comparable entre les groupes étudiés."],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Rapport intégral, chapitre III, § II.B.3, p. 113-114, graphique 14, volet « taux de re-condamnation à de la prison ferme dans les dix ans » (PDF, lignes 2420-2460).","status":"source_checked","checked_at":"2026-11-13","review_note":"Valeur de -11,3 points explicitement indiquée dans le graphique 14 ; interprétation maintenue comme estimation ajustée."}],"provenance":[{"origin":"source_extracted","note":"Affirmation atomisée à partir du rapport intégral de la Cour des comptes, contrôlé le 13 novembre 2026.","recorded_at":"2026-11-13"}],"revision_triggers":["Répliquer l'analyse sur des cohortes plus récentes avec données d'exécution et contrôles supplémentaires."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-RECIDIVISM-CONVICTION-COUNT-10Y","statement":"Pour la cohorte 2010, le nombre cumulé de nouvelles condamnations dans les dix ans suivant le prononcé d’un TIG est estimé inférieur d’environ 0,27 à 0,30 condamnation après correction économétrique, par rapport à l’emprisonnement ferme.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Cohorte des condamnés en 2010 ; suivi à dix ans","population":"Personnes condamnées à un TIG comparées aux personnes condamnées à l'emprisonnement ferme"},"domain_ids":["DOMAIN-SECURITY"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le graphique sur le nombre de re-condamnations à dix ans donne un écart corrigé de -0,268 pour le TIG ; le texte synthétique l'arrondit à environ -0,3."],"limitations":["L'indicateur est un nombre moyen de nouvelles condamnations et non un taux de récidive binaire.","Le résultat reste observationnel et dépend des limites des contrôles économétriques et de la cohorte étudiée."],"best_counterargument":"Un écart moyen modeste peut être sensible aux profils non observés, aux différences d'exposition au risque et à la période historique ; il ne permet pas d'affirmer qu'un TIG réduit à lui seul la fréquence de récidive.","assumptions":["Le comptage des condamnations et l'horizon de dix ans sont appliqués de façon comparable aux groupes."],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Rapport intégral, chapitre III, § II.B.3, p. 114, graphique « Nombre de re-condamnations dans les dix ans », écart corrigé TIG -0,268 (PDF, lignes 2476-2491).","status":"source_checked","checked_at":"2026-11-13","review_note":"Valeur -0,268 dans le graphique 14 ; le texte du rapport la résume à environ -0,3."}],"provenance":[{"origin":"source_extracted","note":"Affirmation atomisée à partir du rapport intégral de la Cour des comptes, contrôlé le 13 novembre 2026.","recorded_at":"2026-11-13"}],"revision_triggers":["Réestimation avec données plus récentes, analyse de sensibilité et mesure de l'exposition au risque."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-MARGINAL-RATES-1P2-2","statement":"Le groupe d'experts SMIC 2025 décrit des taux marginaux effectifs fréquemment proches de 75 % et pouvant dépasser 80 % entre 1,2 et 2 SMIC, liés à la combinaison des cotisations, de la réduction des allègements et de la dégressivité de la prime d'activité.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Rapport publié en 2025 ; législation et données analysées par le groupe d'experts","population":"Salariés dans la zone de rémunération de 1,2 à 2 SMIC"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-EXPERTS-SMIC-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS"],"supporting_evidence":["Synthèse du rapport du groupe d'experts SMIC 2025 ; taux marginaux effectifs fréquemment proches de 75 %, parfois supérieurs à 80 %."],"limitations":["Taux marginal effectif dépendant du ménage, des revenus, des prestations et du paramétrage ; ne pas l'interpréter comme taux moyen de prélèvement.","Le constat ne démontre pas à lui seul que les allègements causent toute la stagnation salariale observée."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-WAGE-PROGRESSION-1P2-2","statement":"Le rapport du groupe d'experts SMIC 2025 observe un ralentissement marqué de la progression salariale entre 1,2 et 2 SMIC, zone correspondant au retrait des allègements généraux et à la dégressivité ou disparition de la prime d'activité.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Analyse publiée en novembre 2025","population":"Travailleurs rémunérés autour de 1,2 à 2 SMIC"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-EXPERTS-SMIC-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-QUANTITATIVE"],"supporting_evidence":["Le rapport mobilise analyses descriptives, micro-économétriques et modèle AKM pour décrire cette non-linéarité."],"limitations":["Association et résultats de modèles ne suffisent pas à identifier isolément l'effet causal des allègements ; la diffusion du SMIC et les trajectoires naturelles sont aussi en jeu."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-SMIC-LOW-WAGE-CAREER-MOBILITY-OECD-2025","statement":"L'OCDE constate que les travailleurs faiblement rémunérés en France ne sont pas moins susceptibles de progresser dans l'échelle salariale que les travailleurs des pays comparés, malgré une concentration plus importante près du SMIC et des mécanismes socio-fiscaux pouvant favoriser des trappes à bas salaires.","claim_type":"empirical","status":"under_review","scope":{"geography":["France","Pays comparateurs OCDE"],"period":"Publication 9 janvier 2025","population":"Travailleurs à bas salaire et trajectoires salariales étudiées par l'OCDE"},"domain_ids":["DOMAIN-ECONOMY"],"source_ids":["SOURCE-OECD-LOW-WAGE-FRANCE-2025"],"tags":["TAG-EVIDENCE-SECONDARY","TAG-METHOD-COMPARATIVE"],"supporting_evidence":["Résumé et conclusions du document de travail OCDE n° 313."],"limitations":["Comparaison dépendant des définitions et pays retenus ; ne mesure pas l'effet d'une hausse donnée du SMIC."],"last_reviewed":"2026-11-13"}
  - {"id":"CLAIM-TIG-SPIP-ASSIGNMENT-DELAY-2023-2024","statement":"En France, le délai moyen entre la saisine du SPIP et l'affectation d'une personne condamnée à un TIG à un poste est passé de 7,9 mois en 2023 à 6,9 mois en 2024.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2023-2024","population":"Personnes condamnées à un TIG et orientées vers les SPIP","conditions":"Délai saisine du SPIP → affectation à un poste ; données communiquées à la mission sénatoriale par la DACG."},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-SENAT-EXECUTION-PEINES-2025"],"study_ids":["STUDY-SENAT-EXECUTION-PEINES-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-EVIDENCE-ADMINISTRATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le rapport du Sénat indique une réduction de 7,9 à 6,9 mois entre 2023 et 2024 (note 156, données communiquées par la DACG)."],"limitations":["Le point de départ est la saisine du SPIP, pas le prononcé de la peine.","Le point d'arrivée est l'affectation à un poste, pas nécessairement le début effectif ni l'achèvement du travail.","La publication ne fournit pas ici de distribution (médiane, quartiles, P90) ni de ventilation territoriale."],"source_verifications":[{"source_id":"SOURCE-SENAT-EXECUTION-PEINES-2025","locator":"Partie sur les délais d'exécution ; note 156.","status":"source_checked","checked_at":"2026-11-14","review_note":"Valeurs 7,9 et 6,9 mois et définition saisine SPIP-affectation vérifiées sur la page du Sénat."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique extrait du rapport sénatorial ; indicateur distinct du délai moyen global d'exécution.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14"}
  - {"id":"CLAIM-TIG-OUTCOME-THREE-YEARS-2025","statement":"Trois ans après leur prononcé, 75 % des TIG étudiés par la Cour des comptes sont exécutés, 9 % sont convertis en une autre peine et 16 % ne sont pas exécutés ou ont débouché sur un échec imputable au condamné.","claim_type":"descriptive","status":"superseded","scope":{"geography":["France"],"period":"Suivi à trois ans ; rapport publié en 2025","population":"TIG de la cohorte étudiée par la Cour des comptes"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","SOURCE-SENAT-EXECUTION-PEINES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025","STUDY-SENAT-EXECUTION-PEINES-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Le Sénat reprend les résultats de la Cour des comptes en note 158 : 75 % exécutés, 9 % convertis, 16 % non exécutés ou échec imputable au condamné."],"limitations":["La catégorie 16 % agrège plusieurs issues et ne doit pas être renommée « interruptions » sans ventilation supplémentaire.","Le dénominateur, la cohorte exacte et le traitement des dossiers censurés doivent être contrôlés dans le rapport intégral.","Ne pas assimiler l'issue de la mesure à une mesure de récidive.","La Cour distingue en réalité 5 % de mesures non encore exécutées et 11 % ayant débouché sur un échec imputable ; le regroupement en 16 % masque deux situations distinctes."],"source_verifications":[{"source_id":"SOURCE-SENAT-EXECUTION-PEINES-2025","locator":"Note 158 renvoyant à la Cour des comptes, rapport 2025.","status":"source_checked","checked_at":"2026-11-14","review_note":"Répartition 75/9/16 vérifiée dans la note 158 ; définition détaillée du champ à contrôler dans le rapport de la Cour."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique isolant les issues d'exécution à trois ans.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","revision_history":[{"date":"2026-11-14","reason":"Scindée à partir du tableau de la Cour des comptes : les 16 % regroupés dans la synthèse sénatoriale se composent de 5 % non exécutés à trois ans et de 11 % d'échecs imputables.","previous_status":"under_review","new_status":"superseded"}]}
  - {"id":"CLAIM-NETHERLANDS-TAAKSTRAF-EXECUTION-OUTCOMES-2024","statement":"Aux Pays-Bas, le rapport sénatorial indique que 28 500 taakstraffen ont été exécutées en tout ou partie en 2024 ; 16 % ont été interrompues prématurément et 10 % n'ont pas pu commencer en raison d'un renvoi devant la justice.","claim_type":"descriptive","status":"under_review","scope":{"geography":["Pays-Bas"],"period":"2024","population":"Taakstraffen rapportées par le service de probation néerlandais"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-SENAT-EXECUTION-PEINES-2025"],"study_ids":["STUDY-SENAT-EXECUTION-PEINES-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-COMPARATIVE","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["Ces chiffres apparaissent dans la sous-partie du rapport sénatorial consacrée au taakstraf aux Pays-Bas, et non dans la partie sur le TIG français."],"limitations":["Les définitions de mesure exécutée en tout ou partie, interrompue et non commencée doivent être vérifiées auprès de la source administrative néerlandaise.","Ne pas comparer directement ces proportions aux issues françaises à trois ans : période, population et catégories ne sont pas harmonisées.","Le nombre de 28 500 est un flux annuel d'exécution, non un nombre de peines prononcées."],"source_verifications":[{"source_id":"SOURCE-SENAT-EXECUTION-PEINES-2025","locator":"Sous-partie « Le taakstraf aux Pays-Bas ».","status":"source_checked","checked_at":"2026-11-14","review_note":"Périmètre géographique néerlandais vérifié dans la structure du rapport."}],"provenance":[{"origin":"source_extracted","note":"Indicateur comparatif conservé hors du registre des statistiques françaises.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14"}
  - {"id":"CLAIM-SMIC-EXEMPTIONS-TOTAL-2024-HCREP","statement":"Selon la note HCREP du 16 décembre 2024 citant le PLFSS, le coût de l'ensemble des dispositifs d'exonération de cotisations sociales atteint 78 milliards d'euros en 2024, dont 66 milliards pour les dispositifs généraux.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2024","population":"Ensemble des dispositifs d'exonération de cotisations sociales, dont dispositifs généraux"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-HCREP-EXEMPTIONS-2024"],"study_ids":["STUDY-HCREP-EXEMPTIONS-2024"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"supporting_evidence":["La note HCREP indique 78 Md€ pour l'ensemble des dispositifs en 2024 selon le PLFSS, dont 66 Md€ pour les dispositifs généraux."],"limitations":["Montants rapportés selon le PLFSS ; distinguer dépenses budgétaires, moindres recettes, compensation et coût consolidé.","Le montant ne doit pas être attribué exclusivement au SMIC.","Ne pas confondre 78 Md€ pour l'ensemble des exonérations et 66 Md€ pour les dispositifs généraux."],"source_verifications":[{"source_id":"SOURCE-HCREP-EXEMPTIONS-2024","locator":"Note du 16 décembre 2024, section sur le coût des exonérations de cotisations sociales, p. 2.","status":"source_checked","checked_at":"2026-11-14","review_note":"Montants 78 Md€ et 66 Md€ vérifiés dans le document PDF."}],"provenance":[{"origin":"source_extracted","note":"Claim scindé par périmètre comptable explicite.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14"}
  - {"id":"CLAIM-SMIC-EXEMPTIONS-EXPERTS-75BN-2024","statement":"Le rapport du groupe d'experts SMIC 2025 estime à près de 75 milliards d'euros en 2024 le coût des allègements de cotisations sociales, selon le périmètre retenu dans ce rapport.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"2024 ; rapport publié en décembre 2025","population":"Allègements de cotisations sociales selon l'agrégat présenté par le groupe d'experts"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-EXPERTS-SMIC-2025"],"study_ids":["STUDY-EXPERTS-SMIC-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"supporting_evidence":["La synthèse du rapport 2025 mentionne près de 75 Md€ en 2024, soit environ 2,5 % du PIB."],"limitations":["Le périmètre précis doit être rapproché des 78 Md€ d'exonérations totales et 66 Md€ de dispositifs généraux cités par le HCREP selon le PLFSS.","Ne pas présenter 75 Md€ et 78 Md€ comme une évolution annuelle ou comme des montants interchangeables.","Ne pas assimiler le coût des allègements au coût d'une hausse du SMIC."],"source_verifications":[{"source_id":"SOURCE-EXPERTS-SMIC-2025","locator":"Synthèse du rapport 2025, passage sur le coût des allègements en 2024.","status":"source_checked","checked_at":"2026-11-14","review_note":"Ordre de grandeur de près de 75 Md€ confirmé ; rapprochement comptable avec le PLFSS reste à faire."}],"provenance":[{"origin":"source_extracted","note":"Claim conservant séparément l'estimation du rapport 2025, sans harmonisation prématurée du périmètre.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14"}
  - {"id":"CLAIM-TIG-EXECUTED-WITHIN-3Y-2020","statement":"Trois ans après leur prononcé, 75 % des TIG de la cohorte 2020 étudiée par la Cour des comptes avaient été exécutés.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Cohorte TIG prononcée en 2020 ; issue observée à 36 mois","population":"TIG prononcés en 2020"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 5, p. 151 ; état des TIG à 36 mois après prononcé.","status":"source_checked","checked_at":"2026-11-14","review_note":"Proportion vérifiée dans le tableau et le texte de la Cour."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique extrait de la ventilation SSER/APPI reprise par la Cour des comptes.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["La Cour rapporte 75 % de TIG exécutés à 36 mois après leur prononcé (SSER/APPI, traitement DACG/PEPP)."],"limitations":["Résultat de cohorte et de suivi à 36 mois ; ne décrit pas les cohortes récentes.","Le taux d'exécution n'est pas un indicateur de récidive ni de qualité de la mesure."]}
  - {"id":"CLAIM-TIG-CONVERTED-WITHIN-3Y-2020","statement":"Trois ans après leur prononcé, 9 % des TIG de la cohorte 2020 étudiée par la Cour des comptes avaient été convertis en une autre peine, notamment DDSE ou jours-amende.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Cohorte TIG prononcée en 2020 ; issue observée à 36 mois","population":"TIG prononcés en 2020"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 5, p. 151 ; état des TIG à 36 mois après prononcé.","status":"source_checked","checked_at":"2026-11-14","review_note":"Proportion vérifiée dans le tableau et le texte de la Cour."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique extrait de la ventilation SSER/APPI reprise par la Cour des comptes.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["La Cour rapporte 9 % de TIG convertis en une autre peine à 36 mois."],"limitations":["La conversion constitue une issue distincte de l'exécution et de l'échec imputable.","La publication ne détaille pas ici le type de conversion pour chaque mesure."]}
  - {"id":"CLAIM-TIG-UNEXECUTED-AT-3Y-2020","statement":"Trois ans après leur prononcé, 5 % des TIG de la cohorte 2020 étudiée par la Cour des comptes restaient non exécutés.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Cohorte TIG prononcée en 2020 ; issue observée à 36 mois","population":"TIG prononcés en 2020"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 5, p. 151 ; état des TIG à 36 mois après prononcé.","status":"source_checked","checked_at":"2026-11-14","review_note":"Proportion vérifiée dans le tableau et le texte de la Cour."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique extrait de la ventilation SSER/APPI reprise par la Cour des comptes.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["La Cour distingue explicitement 5 % de TIG encore non exécutés à 36 mois."],"limitations":["Une mesure encore non exécutée à 36 mois peut avoir une issue ultérieure ; ne pas la qualifier automatiquement d'échec définitif.","La catégorie est distincte des échecs imputables au condamné."]}
  - {"id":"CLAIM-TIG-FAILURE-ATTRIBUTABLE-3Y-2020","statement":"Trois ans après leur prononcé, 11 % des TIG de la cohorte 2020 étudiée par la Cour des comptes avaient débouché sur un échec imputable au condamné.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France"],"period":"Cohorte TIG prononcée en 2020 ; issue observée à 36 mois","population":"TIG prononcés en 2020"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-EFFICIENCY","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"Annexe 5, p. 151 ; état des TIG à 36 mois après prononcé.","status":"source_checked","checked_at":"2026-11-14","review_note":"Proportion vérifiée dans le tableau et le texte de la Cour."}],"provenance":[{"origin":"source_extracted","note":"Claim atomique extrait de la ventilation SSER/APPI reprise par la Cour des comptes.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["La Cour rapporte 11 % d'échecs imputables au condamné à 36 mois."],"limitations":["La qualification d'échec imputable ne renseigne pas à elle seule sur les causes individuelles ni sur les circonstances sociales.","Ne pas assimiler cet indicateur à une interruption administrative quelconque."]}
  - {"id":"CLAIM-TIG-COUR-SAMPLE-DELAY-2023-2024","statement":"Dans son enquête sur neuf territoires, la Cour des comptes mesure un délai moyen d'environ 20 mois entre la condamnation et la fin de la mesure en incluant les sursis-TIG, contre 16 mois pour les TIG autonomes.","claim_type":"descriptive","status":"under_review","scope":{"geography":["France","Digne","Grenoble","Guadeloupe","Marseille","Martinique","Nanterre","Nantes","Saint-Brieuc","Territoire de Belfort"],"period":"TIG terminés entre le quatrième trimestre 2023 et le premier trimestre 2024","population":"940 mesures individuelles analysées par la Cour dans neuf territoires"},"domain_ids":["DOMAIN-SECURITY","DOMAIN-INSTITUTIONS"],"source_ids":["SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025"],"study_ids":["STUDY-COUR-DES-COMPTES-TIG-DDSE-2025"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-LEVEL-NATIONAL"],"supporting_evidence":["La Cour indique, à partir des informations APPI de son échantillon, près de 20 mois entre condamnation et fin de mesure, dont 16 mois pour les TIG autonomes et 20 mois avec les sursis-TIG.","L'annexe 5 indique que l'enquête porte sur les TIG terminés entre le T4 2023 et le T1 2024 dans neuf SPIP."],"limitations":["Échantillon de neuf territoires et de mesures terminées ; ne constitue pas une moyenne nationale représentative de toutes les mesures prononcées.","La durée dépend du périmètre TIG autonome ou sursis-TIG ; conserver cette distinction.","Ne pas comparer directement à la cohorte nationale SSER/DACG de 16,7 mois sans préciser les différences de champ."],"source_verifications":[{"source_id":"SOURCE-COUR-DES-COMPTES-PEINES-ALTERNATIVES-2025","locator":"p. 47 et annexe 5, p. 151 ; enquête de la Cour sur neuf SPIP.","status":"source_checked","checked_at":"2026-11-14","review_note":"Moyennes de 16/20 mois, champ des neuf SPIP et période des mesures terminées vérifiés."}],"provenance":[{"origin":"source_extracted","note":"Claim séparé de la moyenne nationale SSER/DACG de 16,7 mois.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14"}
  - {"id":"CLAIM-SMIC-COTTET-MW-JOBS-1995-1999","statement":"Les réductions de cotisations patronales des réformes Juppé de 1995-1996 ont entraîné, selon l'estimation en différences-de-différences de Cottet, une hausse supplémentaire de 13 points de pourcentage du nombre d'emplois au SMIC dans les entreprises qui employaient auparavant peu ou pas de salariés à ce niveau.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Réformes de cotisations patronales 1995-1996 ; résultats observés jusqu'en 1999","population":"Emplois et entreprises du secteur privé étudiés dans les données administratives"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-COTTET-PAYROLL-TAX-2024"],"study_ids":["STUDY-COTTET-PAYROLL-TAX-2024"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-COTTET-PAYROLL-TAX-2024","locator":"CESifo Working Paper 11076, abstract, sections 3-5.","status":"source_checked","checked_at":"2026-11-14","review_note":"Données, groupes comparés, stratégie de différences-de-différences et résultats vérifiés dans le PDF."}],"provenance":[{"origin":"source_extracted","note":"Claim extrait du working paper intégral ; objet distinct d'une hausse du SMIC.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["L'étude utilise des données administratives appariées et compare les postes rémunérés entre 1 et 1,1 SMIC aux postes entre 1,3 et 1,5 SMIC ; les coefficients pré-réforme servent à tester les tendances parallèles.","L'augmentation de l'emploi au SMIC provient des entreprises peu ou pas exposées ex ante et semble notamment passer par une hausse de la rétention des emplois."],"limitations":["Résultat d'une baisse de cotisations en 1995-1996, pas d'une hausse du salaire minimum.","Le résultat est lié à un contexte institutionnel et à un barème historique ; il ne prédit pas directement les effets du barème actuel.","La stratégie identifie des effets différentiels sous hypothèses, notamment tendances parallèles ; elle ne supprime pas toute limite d'extrapolation."]}
  - {"id":"CLAIM-SMIC-COTTET-FIRM-GROWTH-1995-1997","statement":"Les entreprises fortement utilisatrices d'emplois au SMIC avant les réformes Juppé, bénéficiant d'un effet de trésorerie lié à la baisse de cotisations, ont connu environ 4 points de croissance d'emploi supplémentaires sur les deux premières années, avant une convergence des trajectoires vers 1998.","claim_type":"empirical","status":"under_review","scope":{"geography":["France"],"period":"Réformes de cotisations patronales 1995-1996 ; résultats observés jusqu'en 1999","population":"Emplois et entreprises du secteur privé étudiés dans les données administratives"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-COTTET-PAYROLL-TAX-2024"],"study_ids":["STUDY-COTTET-PAYROLL-TAX-2024"],"tags":["TAG-EVIDENCE-PRIMARY","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-COTTET-PAYROLL-TAX-2024","locator":"CESifo Working Paper 11076, abstract, sections 3-5.","status":"source_checked","checked_at":"2026-11-14","review_note":"Données, groupes comparés, stratégie de différences-de-différences et résultats vérifiés dans le PDF."}],"provenance":[{"origin":"source_extracted","note":"Claim extrait du working paper intégral ; objet distinct d'une hausse du SMIC.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["L'estimation au niveau des entreprises exploite leur exposition ex ante aux changements de coût du travail, avec effets fixes entreprise, année et secteur-année.","L'autrice observe une croissance plus forte en 1995-1997 puis une convergence approximative des taux de croissance cumulés en 1998."],"limitations":["Effet de trésorerie d'une baisse de cotisations, non effet direct d'une hausse du SMIC.","Le résultat est temporaire et sensible à l'échantillon et à l'attrition des entreprises.","Les effets observés ne peuvent pas être inversés mécaniquement."]}
  - {"id":"CLAIM-SMIC-ALBERTINI-5PCT-MW-EMPLOYMENT","statement":"Dans le modèle d'Albertini, Poirier et Terriau, une hausse simulée de 5 % du SMIC réduit le taux d'emploi de 2,05 à 2,21 points selon trois scénarios d'indexation des allègements, impôts et transferts.","claim_type":"predictive","status":"under_review","scope":{"geography":["France"],"period":"Simulation publiée en janvier 2025 ; hausse contrefactuelle de 5 % du SMIC","population":"Travailleurs, entreprises et finances publiques représentés dans le modèle"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-ALBERTINI-POIRIER-TERRIAU-2025"],"study_ids":["STUDY-ALBERTINI-POIRIER-TERRIAU-2025"],"tags":["TAG-EVIDENCE-MODELLED","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-ALBERTINI-POIRIER-TERRIAU-2025","locator":"WP 2501, section 4.2, tableau 6, p. 27.","status":"source_checked","checked_at":"2026-11-14","review_note":"Scénario de hausse de 5 %, trois hypothèses d'indexation et écarts au benchmark vérifiés dans le tableau 6."}],"provenance":[{"origin":"source_extracted","note":"Résultat de simulation conditionnelle, explicitement non présenté comme effet observé.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["Tableau 6 du WP 2501 : taux d'emploi de référence 71,65 ; écarts de -2,07, -2,05 et -2,21 points dans les scénarios (1), (2) et (3)."],"limitations":["Simulation structurelle, pas effet causal observé.","Les trois scénarios diffèrent par l'indexation des seuils d'allègements et des transferts et impôts ; le résultat est conditionnel à ces hypothèses.","Ne pas interpréter les points de taux d'emploi comme un nombre absolu d'emplois détruits."]}
  - {"id":"CLAIM-SMIC-ALBERTINI-5PCT-MW-FISCAL-SURPLUS","statement":"Dans le modèle d'Albertini, Poirier et Terriau, une hausse simulée de 5 % du SMIC ramène le surplus budgétaire à 94,88, 94,36 ou 89,51 pour une base 100, soit une baisse simulée de 5,12 à 10,49 % selon le scénario d'indexation.","claim_type":"predictive","status":"under_review","scope":{"geography":["France"],"period":"Simulation publiée en janvier 2025 ; hausse contrefactuelle de 5 % du SMIC","population":"Travailleurs, entreprises et finances publiques représentés dans le modèle"},"domain_ids":["DOMAIN-ECONOMY","DOMAIN-FINANCE"],"source_ids":["SOURCE-ALBERTINI-POIRIER-TERRIAU-2025"],"study_ids":["STUDY-ALBERTINI-POIRIER-TERRIAU-2025"],"tags":["TAG-EVIDENCE-MODELLED","TAG-METHOD-QUANTITATIVE","TAG-ISSUE-TRADEOFFS","TAG-LEVEL-NATIONAL"],"source_verifications":[{"source_id":"SOURCE-ALBERTINI-POIRIER-TERRIAU-2025","locator":"WP 2501, section 4.2, tableau 6, p. 27.","status":"source_checked","checked_at":"2026-11-14","review_note":"Scénario de hausse de 5 %, trois hypothèses d'indexation et écarts au benchmark vérifiés dans le tableau 6."}],"provenance":[{"origin":"source_extracted","note":"Résultat de simulation conditionnelle, explicitement non présenté comme effet observé.","recorded_at":"2026-11-14"}],"last_reviewed":"2026-11-14","supporting_evidence":["Tableau 6 du WP 2501 : surplus budgétaire de référence 100 et valeurs 94,88, 94,36 et 89,51 dans les trois scénarios."],"limitations":["Simulation de modèle, non effet observé sur le solde budgétaire français.","Le surplus inclut les recettes et transferts tels que représentés dans le modèle ; il ne constitue pas une prévision de finances publiques.","Les résultats dépendent des hypothèses d'indexation et de la calibration."]}
