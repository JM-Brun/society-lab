  period: "Expériences publiées en 2025 à partir d'interviews diffusées en 2018"
  conditions: "Extraits audio d'entretiens réels ; comparaison avec contrôle et, au Royaume-Uni, entretien contradictoire."
domain_ids: ["DOMAIN-POLITICS", "DOMAIN-MEDIA", "DOMAIN-SOCIETY"]
source_ids: ["SOURCE-BOLET-FOOS-2025-MEDIA-PLATFORMING"]
supporting_evidence:
