id: CLAIM-EXPOSURE-UNCHECKED-EXTREME-INTERVIEWS-ATTITUDES-NORMS-2025
statement: "Dans les expériences de Bolet & Foos, l'exposition à des interviews non contestées d'activistes d'extrême droite augmente à court terme l'accord avec certaines positions et leur popularité sociale perçue."
claim_type: causal
status: under_review
scope:
